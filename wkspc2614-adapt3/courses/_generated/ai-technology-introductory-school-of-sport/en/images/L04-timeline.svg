<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 240">
  <title id="title">Using AI honestly, step by step</title>
  <desc id="desc">A six-step process: think first, design your prompt, develop the dialogue, critically evaluate, log your use, and check for red flags before you submit.</desc>
  <defs>
    <marker id="tl-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="flow-head"/></marker>
  </defs>
  <path class="flow" d="M 112 70 L 234 70" fill="none" marker-end="url(#tl-arrow)"/>
  <path class="flow" d="M 322 70 L 444 70" fill="none" marker-end="url(#tl-arrow)"/>
  <path class="flow" d="M 532 70 L 654 70" fill="none" marker-end="url(#tl-arrow)"/>
  <path class="flow" d="M 742 70 L 864 70" fill="none" marker-end="url(#tl-arrow)"/>
  <path class="flow" d="M 952 70 L 1074 70" fill="none" marker-end="url(#tl-arrow)"/>
  <g data-ab-hotspot="step-1">
    <circle class="wedge" cx="70" cy="70" r="34"/>
    <circle class="rule" cx="70" cy="70" r="34" fill="none"/>
    <g text-anchor="middle" font-family="Montserrat, 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text class="label" x="70" y="78" font-size="24" font-weight="700">1</text>
      <text class="label" x="70" y="134" font-size="16" font-weight="700">Think first</text>
      <text class="label-sub" x="70" y="154" font-size="13">your own view</text>
    </g>
  </g>
  <g data-ab-hotspot="step-2">
    <circle class="wedge" cx="280" cy="70" r="34"/>
    <circle class="rule" cx="280" cy="70" r="34" fill="none"/>
    <g text-anchor="middle" font-family="Montserrat, 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text class="label" x="280" y="78" font-size="24" font-weight="700">2</text>
      <text class="label" x="280" y="134" font-size="16" font-weight="700">Design the</text>
      <text class="label" x="280" y="154" font-size="16" font-weight="700">prompt</text>
      <text class="label-sub" x="280" y="174" font-size="13">role, task, context</text>
    </g>
  </g>
  <g data-ab-hotspot="step-3">
    <circle class="wedge" cx="490" cy="70" r="34"/>
    <circle class="rule" cx="490" cy="70" r="34" fill="none"/>
    <g text-anchor="middle" font-family="Montserrat, 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text class="label" x="490" y="78" font-size="24" font-weight="700">3</text>
      <text class="label" x="490" y="134" font-size="16" font-weight="700">Develop it</text>
      <text class="label-sub" x="490" y="154" font-size="13">go deeper</text>
    </g>
  </g>
  <g data-ab-hotspot="step-4">
    <circle class="wedge" cx="700" cy="70" r="34"/>
    <circle class="rule" cx="700" cy="70" r="34" fill="none"/>
    <g text-anchor="middle" font-family="Montserrat, 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text class="label" x="700" y="78" font-size="24" font-weight="700">4</text>
      <text class="label" x="700" y="134" font-size="16" font-weight="700">Evaluate</text>
      <text class="label-sub" x="700" y="154" font-size="13">check everything</text>
    </g>
  </g>
  <g data-ab-hotspot="step-5">
    <circle class="wedge" cx="910" cy="70" r="34"/>
    <circle class="rule" cx="910" cy="70" r="34" fill="none"/>
    <g text-anchor="middle" font-family="Montserrat, 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text class="label" x="910" y="78" font-size="24" font-weight="700">5</text>
      <text class="label" x="910" y="134" font-size="16" font-weight="700">Log your use</text>
      <text class="label-sub" x="910" y="154" font-size="13">keep a record</text>
    </g>
  </g>
  <g data-ab-hotspot="step-6">
    <circle class="wedge" cx="1120" cy="70" r="34"/>
    <circle class="rule" cx="1120" cy="70" r="34" fill="none"/>
    <g text-anchor="middle" font-family="Montserrat, 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text class="label" x="1120" y="78" font-size="24" font-weight="700">6</text>
      <text class="label" x="1120" y="134" font-size="16" font-weight="700">Red-flag check</text>
      <text class="label-sub" x="1120" y="154" font-size="13">stop and rethink</text>
    </g>
  </g>
</svg>
