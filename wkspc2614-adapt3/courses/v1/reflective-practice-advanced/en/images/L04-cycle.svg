<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="55 55 530 530">
  <title id="title">Reflective practice as a continuing discipline</title>
  <desc id="desc">A cycle of four parts - take ownership of an experience, reflect on it critically, write it up as an evaluation, then carry the change forward - that keeps turning across your professional practice.</desc>
  <defs>
    <marker id="arrowhead-step-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="flow-head"/></marker>
    <marker id="arrowhead-step-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="flow-head"/></marker>
    <marker id="arrowhead-step-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="flow-head"/></marker>
    <marker id="arrowhead-step-4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="flow-head"/></marker>
  </defs>
  <g data-ab-hotspot="step-1">
    <path class="wedge" d="M 320 320 L 143.22 143.22 A 250 250 0 0 1 496.78 143.22 Z"/>
    <path class="rule" d="M 143.22 143.22 A 250 250 0 0 1 496.78 143.22" fill="none"/>
    <line class="rule" x1="320" y1="320" x2="143.22" y2="143.22"/>
    <path class="flow" d="M 209.27 135.71 A 215 215 0 0 1 430.73 135.71" fill="none" marker-end="url(#arrowhead-step-1)"/>
    <g text-anchor="middle" font-family="Montserrat, 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text class="label" x="320" y="170" font-size="22" font-weight="700">Take ownership</text>
      <text class="label-sub" x="320" y="196" font-size="15">an experience</text>
    </g>
  </g>
  <g data-ab-hotspot="step-2">
    <path class="wedge" d="M 320 320 L 496.78 143.22 A 250 250 0 0 1 496.78 496.78 Z"/>
    <path class="rule" d="M 496.78 143.22 A 250 250 0 0 1 496.78 496.78" fill="none"/>
    <line class="rule" x1="320" y1="320" x2="496.78" y2="143.22"/>
    <path class="flow" d="M 504.29 209.27 A 215 215 0 0 1 504.29 430.73" fill="none" marker-end="url(#arrowhead-step-2)"/>
    <g text-anchor="middle" font-family="Montserrat, 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text class="label" x="470" y="320" font-size="22" font-weight="700">Reflect critically</text>
      <text class="label-sub" x="470" y="346" font-size="15">through the cycle</text>
    </g>
  </g>
  <g data-ab-hotspot="step-3">
    <path class="wedge" d="M 320 320 L 496.78 496.78 A 250 250 0 0 1 143.22 496.78 Z"/>
    <path class="rule" d="M 496.78 496.78 A 250 250 0 0 1 143.22 496.78" fill="none"/>
    <line class="rule" x1="320" y1="320" x2="496.78" y2="496.78"/>
    <path class="flow" d="M 430.73 504.29 A 215 215 0 0 1 209.27 504.29" fill="none" marker-end="url(#arrowhead-step-3)"/>
    <g text-anchor="middle" font-family="Montserrat, 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text class="label" x="320" y="470" font-size="22" font-weight="700">Write it up</text>
      <text class="label-sub" x="320" y="496" font-size="15">as an evaluation</text>
    </g>
  </g>
  <g data-ab-hotspot="step-4">
    <path class="wedge" d="M 320 320 L 143.22 496.78 A 250 250 0 0 1 143.22 143.22 Z"/>
    <path class="rule" d="M 143.22 496.78 A 250 250 0 0 1 143.22 143.22" fill="none"/>
    <line class="rule" x1="320" y1="320" x2="143.22" y2="496.78"/>
    <path class="flow" d="M 135.71 430.73 A 215 215 0 0 1 135.71 209.27" fill="none" marker-end="url(#arrowhead-step-4)"/>
    <g text-anchor="middle" font-family="Montserrat, 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text class="label" x="170" y="320" font-size="22" font-weight="700">Carry forward</text>
      <text class="label-sub" x="170" y="346" font-size="15">to next practice</text>
    </g>
  </g>
</svg>
