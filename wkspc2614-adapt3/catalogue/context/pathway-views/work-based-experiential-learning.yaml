      learning critically throughout, and applies knowledge to current and complex problems with some
      originality.
    knowledge: Critiques the experiential learning cycle of work-based and experiential learning, its
      work-based learning and their bearing on current thinking, and sees where understanding runs out.
    identity: A reflexive practitioner who critiques how their own position, assumptions and values shape
      their experiential learning cycle, weighs what this means for wider debate and for audiences acting
      on it, and treats their work-based learning as still evolving through that scrutiny.
