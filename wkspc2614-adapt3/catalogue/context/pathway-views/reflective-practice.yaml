    genericOutcomes:
    - kind: conceptual
      title: Applying a chosen reflective model to a real problem
      learningOutcome: The student can justify the choice of one established reflective model over its
        alternatives for a given situation, then construct a reflection that works through every stage
        of that model.
    - kind: applied
      title: Applying a required reflective structure in practice
      learningOutcome: The student can apply a required reflective structure fully to a genuine event,
