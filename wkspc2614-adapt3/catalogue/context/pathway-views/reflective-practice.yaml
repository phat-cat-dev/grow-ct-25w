    - source: universal-reference
      statementId: qaa-universal/threshold/reflection-and-personal-development
      strength: direct
      label: Reflection and personal development
      strand: autonomy
      graduateStatement: Graduates reflect on their learning and practice and plan their development.
      studentStatement: You can reflect on how you learn and work, and plan how to improve.
    - source: universal-reference
      statementId: qaa-universal/threshold/critical-evaluation-of-evidence-and-arguments
      strength: indirect
      label: Critical evaluation of evidence and arguments
      strand: thinking
      graduateStatement: Graduates evaluate evidence and arguments critically and reach reasoned judgements.
      studentStatement: You weigh up evidence and arguments critically and come to reasoned conclusions.
    genericOutcomes:
    - kind: conceptual
      title: Moving from description to critical judgement
      learningOutcome: The student can analyse a descriptive account of their own practice to identify
        the assumptions and reasoning underlying what happened, producing a critical judgement rather
        than a narrative.
    - kind: applied
      title: Critical account of a real decision
      learningOutcome: The student can evaluate a real decision by examining the alternatives considered
        and the reasoning behind it, justifying what they would do differently.
  - ref: reflective-practice/c2
    rowId: d2
    fheqLevel: 5
    statement: Turn reflection into a dated action plan
    knowledgeKind: procedural
    benchmarks:
    - source: universal-reference
      statementId: qaa-universal/threshold/reflection-and-personal-development
      strength: direct
      label: Reflection and personal development
      strand: autonomy
      graduateStatement: Graduates reflect on their learning and practice and plan their development.
      studentStatement: You can reflect on how you learn and work, and plan how to improve.
    genericOutcomes:
    - kind: conceptual
      title: Turning a reflection into a dated plan
      learningOutcome: The student can explain how a reflection on learning or practice should be converted
        into one or more dated, checkable actions that follow logically from what was noticed.
    - kind: applied
      title: Dated plan built from a real reflection
      learningOutcome: The student can construct a dated action plan from a real reflection, then record
        on the stated date whether the action was completed and what changed.
  - ref: reflective-practice/04
    rowId: d3
    fheqLevel: 6
    statement: Reflect on motivation and amend strategies that aren't working
    knowledgeKind: metacognitive, strategic
    benchmarks:
    - source: universal-reference
      statementId: qaa-universal/threshold/reflection-and-personal-development
      strength: direct
      label: Reflection and personal development
      strand: autonomy
      graduateStatement: Graduates reflect on their learning and practice and plan their development.
      studentStatement: You can reflect on how you learn and work, and plan how to improve.
    - source: universal-reference
      statementId: qaa-universal/threshold/subject-knowledge-and-understanding
      strength: indirect
      label: Subject knowledge and understanding
      strand: knowledge
      graduateStatement: Graduates show broad and well-founded knowledge of the subject's core content.
      studentStatement: You know the core content of your subject well and can show it.
    genericOutcomes:
    - kind: conceptual
      title: Adjusting a learning strategy using reflection
      learningOutcome: The student can analyse why a learning strategy is not working, distinguishing
        a drop in motivation from a flaw in the approach itself, to justify a specific change.
    - kind: applied
      title: Reflecting on motivation to change an approach
      learningOutcome: The student can evaluate a real approach that is not delivering results, make one
        specific change, and judge from the outcome whether to keep it.
  tierReading:
    practice: Applies the reflection of reflective practice to the action plan, carries out supervised
      research and enquiry, works with data and sources, and communicates findings to different audiences.
    knowledge: Analyses the critical reflection of reflective practice, and how the field developed and
      where it currently stands.
    identity: Works ethically and increasingly independently, treating practitioner identity as still
      forming rather than fixed, shaped by the motivation on their own learning and by how learning strategies
      bear on reflective practice.
- tier: advanced
