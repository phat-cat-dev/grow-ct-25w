  tierReading:
    practice: Designs and critiques the reflective model across methods, evaluates the assessed reflection
      critically throughout, and applies knowledge to current and complex problems with some originality.
    knowledge: Critiques the reflective model of reflective practice, its assessed reflection and their
      bearing on current thinking, and sees where understanding runs out.
    identity: A reflexive practitioner who critiques how their own values shape their reflective writing,
      weighs what this means for wider debate and for audiences acting on it, and treats their professional
      identity as still evolving through that scrutiny.
