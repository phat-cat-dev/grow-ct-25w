      studentStatement: You recognise the ethical questions in your subject and act responsibly.
    genericOutcomes:
    - kind: conceptual
      title: Examining personal responsibility in reflective judgement
      learningOutcome: The student can critique a judgement they reached about a real situation by examining
        how their own identity, assumptions or social position may have shaped it, using a named approach
        to reflexivity.
    - kind: applied
      title: Testing how personal values affect a decision
      learningOutcome: The student can justify a real decision by checking whether a personal value, rather
        than the available evidence, is driving the judgement, and set out how they will keep checking
