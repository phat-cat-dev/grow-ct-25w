pathway: reflective-practice
status: generated
note: 'Pathway view: the benchmark chain for this pathway, joined read-only from four already-built stores.
  No new data is invented, filled or inflected here; this is a view, not a new store. Built deterministically
  by tools/build-pathway-views.py. Chain: benchmark statement (full text, pulled back from catalogue/context/subject/benchmarks/<source>.json)
  -> the 9 capabilities (catalogue/context/pathway/<pathway>.json) -> the 18 generic learning outcomes
  (catalogue/context/pathway-evidence/<pathway>.json) -> the 9 tier readings, practice/knowledge/identity
  per tier (catalogue/context/pathway-tier-readings/<pathway>.json).'
tiers:
- tier: introductory
  fheqLevel: 4
  verbBand: Beginner
  capabilities:
  - ref: reflective-practice/01
    rowId: i1
    fheqLevel: 3
    statement: Apply the describe, reflect, take action cycle
    knowledgeKind: procedural, one set method
    benchmarks:
    - source: universal-reference
      statementId: qaa-universal/threshold/applying-knowledge-to-practice-or-problems
      strength: direct
      label: Applying knowledge to practice or problems
      strand: application
      graduateStatement: Graduates apply subject knowledge to practical situations and problems.
      studentStatement: You can use what you know on real problems and in practical settings.
    - source: universal-reference
      statementId: qaa-universal/threshold/reflection-and-personal-development
      strength: direct
      label: Reflection and personal development
      strand: autonomy
      graduateStatement: Graduates reflect on their learning and practice and plan their development.
      studentStatement: You can reflect on how you learn and work, and plan how to improve.
    - source: universal-reference
      statementId: qaa-universal/threshold/subject-knowledge-and-understanding
      strength: indirect
      label: Subject knowledge and understanding
      strand: knowledge
      graduateStatement: Graduates show broad and well-founded knowledge of the subject's core content.
      studentStatement: You know the core content of your subject well and can show it.
    genericOutcomes:
    - kind: conceptual
      title: Reflection linked to a development step
      learningOutcome: The student can explain the describe-reflect-act cycle as a structured sequence
        that converts an account of an experience into a planned development step.
    - kind: applied
      title: Practical action plan from a real reflection
      learningOutcome: The student can apply the describe-reflect-act cycle to a genuine learning experience,
        producing a written account that ends in one specific planned action.
  - ref: reflective-practice/02
    rowId: i2
    fheqLevel: 4
    statement: Balance positives and negatives
    knowledgeKind: procedural
    benchmarks:
    - source: universal-reference
      statementId: qaa-universal/threshold/reflection-and-personal-development
      strength: direct
      label: Reflection and personal development
      strand: autonomy
      graduateStatement: Graduates reflect on their learning and practice and plan their development.
      studentStatement: You can reflect on how you learn and work, and plan how to improve.
    genericOutcomes:
    - kind: conceptual
      title: Weighing strengths and weaknesses to plan development
      learningOutcome: The student can explain why a review of personal learning or practice should weigh
        strengths and weaknesses evenly before identifying a priority for development.
    - kind: applied
      title: Even-handed review feeding a development plan
      learningOutcome: The student can produce a balanced written review of their own performance, giving
        equal weight to strengths and weaknesses and ending with one development priority.
  - ref: reflective-practice#i3
    rowId: i3
    fheqLevel: 5
    statement: Notice what went well and what didn't in your own work
    knowledgeKind: metacognitive, beginning
    benchmarks: []
    genericOutcomes:
    - kind: conceptual
      title: Spotting what worked in your own work
      learningOutcome: The student can explain why reviewing their own work means identifying specific
        strengths and weaknesses separately rather than forming one overall impression.
    - kind: applied
      title: Noticing strengths and gaps after a task
      learningOutcome: The student can identify, in a piece of their own completed work, one specific
        strength and one specific weakness before receiving feedback from others.
  tierReading:
    practice: Begins to apply the reflective cycle of reflective practice to familiar, well-defined tasks
      with guidance, works with sources and data they are given, and describes the learning experience
      clearly.
    knowledge: Describes the observations that introduce reflective practice, and can place them in the
      wider field.
    identity: Begins to describe the reflective cycle for the first time, following guidance on the learning
      experience as an early sense of the kind of practitioner they are becoming.
