  tierReading:
    practice: Designs and critiques sources across methods, evaluates the support critically throughout,
      and applies knowledge to current and complex problems with some originality.
    knowledge: Critiques the writing conventions of academic writing, its discipline and their bearing
      on current thinking, and sees where understanding runs out.
    identity: A reflexive practitioner who critiques how their own writing conventions shape their discipline,
      weighs what this means for wider debate and for audiences acting on it, and treats their professional
      identity as still evolving through that scrutiny.
