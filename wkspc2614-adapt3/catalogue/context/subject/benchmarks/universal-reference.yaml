mapAgentInstructions:
- 'Universal baseline reference: pathwayMapping here is generic and subject-neutral (authored from design-kb.pathways.json),
  not a real per-subject map. Build a baseline pack from the pathway''s mapped shared-core expectations
  plus tierReadings, honouring each expectation''s agentInstruction.'
- 'Select, do not cram: pick the expectations whose strand fits the pathway being built (e.g. criticality
  -> strand:thinking; finding-using-sources -> information and sources; presenting -> communication).
  Core expectations (sharedBy at least half of the set) carry the framing; low-count ones support.'
- Pitch by tier using tierReadings (intermediate vs advanced practice/knowledge/identity) and the pathway's
  own tier voiceBand / teachingProsePointer in catalogue/pathways/<pathway>.json. Benchmarks speak at
  the honours-graduate end, so lean on these for intermediate/advanced and pitch down for introductory.
- 'Invent no subject-specific content at baseline: keep examples neutral (use "your subject" and the Student
  A / Student B cast). A real subject benchmark, where one exists for the subject, overrides this baseline.'
- 'The rungs climb by qualifiers, not new verbs: realise typical/excellent (statements qaa-universal/typical|excellent/climb)
  as more critical, more independent and some originality, not as different tasks.'
