- id: qaa-universal/threshold/reflection-and-personal-development
  statementType: threshold
  rung: threshold
  level: fheq:6
  force: will
  appliesTo: graduates at the threshold level
  about: reflection and personal development
  strand: strand:autonomy
  domain: generic-skill
