    forPractitioner:
      text: Graduates use the digital tools and technologies the subject relies on.
      status: drafted
      forEducator:
        text: Keep this tool-agnostic at baseline and focus on judgement over button-clicking, since specific
          software dates quickly. Build from guided use to independent choice of tools, and tie digital
          practice to the subject's real outputs rather than teaching it as a separate skill.
        status: drafted
