  rows:
  - rowId: u-int
    tier: intermediate
    fheqLevel: 6
    practice: Applies the subject's methods to questions and problems, carries out supervised research
      and enquiry, works with data and sources, and communicates findings to different audiences.
    knowledge: Knows the core content, main theories and debates of the subject, and how the field developed
      and where it currently stands.
    identity: Works ethically and increasingly independently, reflects on their own learning, and recognises
      how diversity, sustainability and professional practice bear on the subject.
    groundingIds: []
  - rowId: u-adv
    tier: advanced
    fheqLevel: 6
    practice: Designs and critiques enquiry across methods, evaluates evidence and arguments critically
      throughout, and applies knowledge to current and complex problems with some originality.
    knowledge: Commands the breadth and depth of the subject, its theoretical foundations and their bearing
      on current thinking, and sees where understanding runs out.
    identity: A reflective, ethical and independent practitioner who weighs what findings mean for wider
      debate and helps varied audiences act on them.
