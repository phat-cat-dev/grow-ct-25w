graduate_competency:
  note: 'Flat, subject-neutral projection of the threshold shared-core statements as graduate competencies,
    for reuse as baseline context. Onboarding/CXP may offer these (if the user wishes) as an opt-in subset
    of the qualifier list (design-kb cxp-02_qualifiers), default none. House term: graduate competency
    / graduate skill / graduate attribute / academic practice - never "academic skills".'
