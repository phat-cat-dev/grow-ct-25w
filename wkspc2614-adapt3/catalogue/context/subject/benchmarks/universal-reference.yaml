    threshold: 32
    typical: 12
    excellent: 13
    any: 53
    of: 54
  core: true
  basis: inferred
  status: drafted
  agentInstruction: 'Natural anchor for the six-part flow''s reflective prompt: reflecting on how one
    learns and works and planning to improve. Keep questions genuine, with no single right answer.'
  audienceVersions:
    forPractitioner:
      text: Graduates reflect on their learning and practice and plan their development.
      status: drafted
      forEducator:
        text: Reflection easily becomes description or box-ticking, so students report events instead
          of learning from them. Prompt with genuine, open questions and value honesty about difficulty;
          this is the natural anchor for the six-part flow's reflective prompt and should keep questions
          that have no single right answer.
        status: drafted
    forBeneficiary:
      text: You can reflect on how you learn and work, and plan how to improve.
      status: drafted
      forLearnerGuidance:
        text: Reflection means looking honestly at how you learn and work so you can plan what to improve.
          It is working when your reflection names something specific you will do differently, rather
          than just saying how a task went.
        status: drafted
