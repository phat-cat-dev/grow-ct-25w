    - pathway: adapt-academic-writing
      strength: indirect
      tiers:
      - advanced
      tierBasis: capability-match
    - pathway: adapt-presenting
      strength: indirect
      tiers:
      - advanced
      tierBasis: capability-match
    - pathway: adapt-revising-exams
      strength: direct
      tiers:
      - intermediate
      - advanced
      tierBasis: capability-match
    - pathway: adapt-researching-research-methods
      strength: indirect
      tiers:
      - introductory
      - intermediate
      - advanced
      tierBasis: floor
    - pathway: adapt-reflective-practice
      strength: indirect
      tiers:
