- id: qaa-universal/typical/climb
  statementType: typical
  rung: typical
  level: fheq:6
  about: the typical standard (most graduates)
  strand: strand:all
  basis: inferred
  status: drafted
  agentInstruction: Realise the typical standard as more of the work being critical and independent and
    the knowledge wider and more current. It is the same tasks done better, not new tasks; pitch to the
    intermediate tier reading.
  paraphrase: Typically, more of the graduate's work is critical and independent, and their knowledge
    is wider and more current.
  audienceVersions:
    forPractitioner:
      text: Typically, more of the graduate's work is critical and independent, and their knowledge is
        wider and more current.
      status: drafted
      forEducator:
        text: Frame the step up to typical as more of the same qualities, not new content, so students
          are not chasing extra coverage. Point feedback at where criticality and independence appear
          and where they lapse; pitch this to the intermediate tier reading.
        status: drafted
    forBeneficiary:
      text: At the typical standard, more of what you do is critical and independent, and you know more
        of what is current.
      status: drafted
      forLearnerGuidance:
        text: 'Reaching the typical standard is not about doing extra tasks: it is the same work with
          more of it critical and independent, and your knowledge wider and more current. Aim to show
          judgement and initiative across a whole piece, not only in one strong paragraph.'
        status: drafted
- id: qaa-universal/excellent/climb
  statementType: excellent
  rung: excellent
  level: fheq:6
  about: the excellent standard (the successful student)
  strand: strand:all
  basis: inferred
  status: drafted
  agentInstruction: Realise excellence as sustained criticality and independence with some originality;
    reserve "exceptional" framing for the top. Still the same tasks, carried higher; pitch to the advanced
    tier reading.
  paraphrase: At excellent, work is critical and independent throughout, shows some originality, and is
    described as exceptional.
  audienceVersions:
    forPractitioner:
      text: At excellent, work is critical and independent throughout, shows some originality, and is
        described as exceptional.
      status: drafted
      forEducator:
        text: Reserve 'exceptional' framing for sustained criticality and independence with genuine originality,
          carried across the whole piece rather than in flashes. Help strong students take defensible
          risks and own their judgements; pitch to the advanced tier reading.
        status: drafted
    forBeneficiary:
      text: At the excellent standard, you are critical and independent throughout, show some original
        thinking, and your work stands out.
      status: drafted
      forLearnerGuidance:
        text: At the excellent standard your work is critical and independent throughout and shows some
          original thinking, so it stands out. Look for the places where you can push a judgement further
          or bring an idea of your own, rather than playing safe.
        status: drafted
