      text: You can use the digital tools your subject depends on.
      status: drafted
      forLearnerGuidance:
        text: Your subject relies on particular digital tools, and you are expected to use the ones it
          depends on competently. You are doing well when you pick the right tool for a task and use it
          to produce something that meets the subject's standards, not just operate it.
        status: drafted
