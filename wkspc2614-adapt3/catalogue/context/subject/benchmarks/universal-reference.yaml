mapAgentInstructions:
- 'Universal baseline reference: pathwayMapping here is generic and subject-neutral (authored from design-kb.pathways.json),
  not a real per-subject map. Build a baseline pack from the pathway''s mapped shared-core expectations
  plus tierReadings, honouring each expectation''s agentInstruction.'
- 'Select, do not cram: pick the expectations whose strand fits the pathway being built (e.g. criticality
  -> strand:thinking; finding-using-sources -> information and sources; presenting -> communication).
  Core expectations (sharedBy at least half of the set) carry the framing; low-count ones support.'
- Pitch by tier using tierReadings (intermediate vs advanced practice/knowledge/identity) and the pathway's
  own tier voiceBand / teachingProsePointer in catalogue/context/pathways/<pathway>.json. Benchmarks speak at
  the honours-graduate end, so lean on these for intermediate/advanced and pitch down for introductory.
- 'Invent no subject-specific content at baseline: keep examples neutral (use "your subject" and the Student
  A / Student B cast). A real subject benchmark, where one exists for the subject, overrides this baseline.'
- 'The rungs climb by qualifiers, not new verbs: realise typical/excellent (statements qaa-universal/typical|excellent/climb)
  as more critical, more independent and some originality, not as different tasks.'
statementFormulas:
  definition: A statement formula templates one generic statement so that filling its sourceFill reproduces
    the live statement byte-for-byte; an outcome formula templates one rule-AL-2-compliant atomic learning
    outcome (one verb, one object, one condition) generated from inside that statement.
  markerConvention: Single braces {slot} mark an authoring-time fillable slot, machine-filled by template.format(**fill).
    {{double braces}} are reserved for the runtime merge-context layer and never appear inside a formula
    template. [square brackets] mark a human-visible unfilled placeholder in rendered prose, not a machine
    slot.
  roles:
  - role: verb
    required: true
    meaning: the measurable operation; options drawn live from the section 16 band
  - role: object
    required: true
    meaning: 'the one thing acted on (rule AL-2: one verb, one object)'
  - role: condition
    required: true
    meaning: support, autonomy or context; tier-defining
  - role: field_content
    required: false
    subjectSupplied: true
    floor: your subject
    meaning: the subject's own matter; the only genuinely subject-specific slot
  - role: scope
    required: false
    meaning: breadth or range of the task
  - role: qualifier
    required: false
    meaning: the rung climb (critical, independent, original)
  - role: audience
    required: false
    meaning: who the output is for
  - role: stance
    required: false
    meaning: 'identity statements only: the value, ethical or reflexive quality'
  verbBandAnchor:
    source:
      doc: reference/excelling-voice-specification.md
      ref: section 16
    rule: Verb options are read live from section 16 at build time, never a second hand-typed list (docs/curriculum/tier-specification.md
      section 6 forbids holding one here).
    defaultAnchor:
      introductory: Beginner
      intermediate: Intermediate
      advanced: Advanced
  al2: 'Rule AL-2: each outcome formula states one verb, one object and one condition; no ''and'' joins
    two tasks in an outcome template''s own fixed text.'
  bannedVagueVerbs:
  - appreciate
  - be aware of
  - know
  - understand
  instructions:
  - Fill subjectSupplied slots (field_content) with the subject itself; every other slot fills from its
    own options list, never free text.
  - A statement formula must reproduce its live statement exactly when sourceFill is applied; an outcome
    formula has no sourceFill and is generated fresh by choosing one option per slot.
  - Verb slot options are a subset of the section 16 band the formula names; never substitute a verb outside
    that band, and never use a section 15.8 banned-vague verb (understand, know, appreciate, be aware
    of) when generating new content.
  - Reproduce every outcome formula under a statement together when illustrating that statement; dropping
    one usually understates the tier the statement establishes.
