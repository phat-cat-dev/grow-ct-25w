digest:
  definition: 'The shared core of the QAA Subject Benchmark Statements: what an honours graduate is expected
    to know, do and be on graduating, whatever the subject.'
  distinctiveFeatures:
  - 'Subjects differ in the matter their graduates act on, not in the shape of the expectation: the same
    verbs and rungs recur across the statements.'
  - 'At threshold, most subjects ask for the same core: subject knowledge, theories, critical evaluation,
    analysis, research methods, application, communication, teamwork, independence and ethics.'
  - 'The rungs climb by qualifiers, not new verbs: ''critical'', ''independent'' and ''original'' mark
    the typical and excellent standards above threshold.'
  - 'Ethical, professional and digital expectations sit at the threshold: they are baseline, not marks
    of excellence.'
  standards:
    rungs:
    - rung: threshold
      award: bachelor's with honours
      note: the minimum every honours graduate shows; spine:6
    - rung: typical
      note: what most graduates show
    - rung: excellent
      note: the best performance
    rungBases: Typical and excellent go beyond threshold by depth and breadth of knowledge, engagement
      in research and independent study, critical insight, and advanced application of theory and method.
statements:
- id: qaa-universal/threshold/subject-knowledge-and-understanding
  statementType: threshold
  rung: threshold
  level: fheq:6
  force: will
  appliesTo: graduates at the threshold level
  about: subject knowledge and understanding
  strand: strand:knowledge
  domain: knowledge
  paraphrase: Graduates show broad and well-founded knowledge of the subject's core content.
  sharedBy:
    threshold: 54
    typical: 24
    excellent: 26
    any: 54
    of: 54
  core: true
  basis: inferred
  status: drafted
  agentInstruction: Realise as the learner showing well-founded knowledge of their own field's core content.
    Keep subject-neutral (use 'your subject'); a worked example may use the Student A / Student B cast.
  audienceVersions:
    forPractitioner:
      text: Graduates show broad and well-founded knowledge of the subject's core content.
      status: drafted
      forEducator:
        text: Early on, learners equate knowledge with coverage and recall, so they revise lists rather
          than connections. Build understanding by asking them to link new content to what they already
          know and to restate ideas in their own words; across the levels the expectation moves from knowing
          the core to seeing how the parts relate and where the field is unsettled.
        status: drafted
    forBeneficiary:
      text: You know the core content of your subject well and can show it.
      status: drafted
      forLearnerGuidance:
        text: 'Knowing your subject is more than recalling facts: you can explain the main ideas in your
          own words and show how they fit together. A good check is whether you could teach a topic to
          someone on a different course without reading from your notes.'
        status: drafted
  groundingSample:
  - accounting-2025:4.5.b1
  - accounting-2025:4.5.b9
  - accounting-2025:4.5.b10
  - accounting-2025:4.5.b18
- id: qaa-universal/threshold/analysis-and-problem-solving
  statementType: threshold
  rung: threshold
  level: fheq:6
  force: will
  appliesTo: graduates at the threshold level
  about: analysis and problem-solving
  strand: strand:thinking
  domain: generic-skill
  paraphrase: Graduates analyse problems and work towards solutions using the subject's approaches.
  sharedBy:
    threshold: 50
    typical: 22
    excellent: 24
    any: 54
    of: 54
  core: true
  basis: inferred
  status: drafted
  agentInstruction: Realise as breaking a problem down and working to a solution with the field's methods.
    Pair with a worked example that shows the steps.
  audienceVersions:
    forPractitioner:
      text: Graduates analyse problems and work towards solutions using the subject's approaches.
      status: drafted
      forEducator:
        text: Novices jump to an answer and skip the breakdown, so their errors are hard to locate. Teach
          a repeatable decomposition (what is given, what is asked, what method fits) and insist on visible
          working; the expectation grows from applying a given method to selecting and defending one.
        status: drafted
    forBeneficiary:
      text: You break problems down and work out solutions using your subject's methods.
      status: drafted
      forLearnerGuidance:
        text: Analysis means breaking a problem into parts you can actually work on, then choosing a method
          and following it through. You can see it working when you show your steps and reasoning, not
          only the final answer.
        status: drafted
  groundingSample:
  - accounting-2025:4.5.b17
  - accounting-2025:4.5.b25
  - accounting-2025:4.7.b14
  - accounting-2025:4.7.b16
- id: qaa-universal/threshold/applying-knowledge-to-practice-or-problems
  statementType: threshold
  rung: threshold
  level: fheq:6
  force: will
  appliesTo: graduates at the threshold level
  about: applying knowledge to practice or problems
  strand: strand:application
  domain: generic-skill
  paraphrase: Graduates apply subject knowledge to practical situations and problems.
  sharedBy:
    threshold: 50
    typical: 24
    excellent: 25
    any: 54
    of: 54
  core: true
  basis: inferred
  status: drafted
  agentInstruction: Frame as using knowledge on real problems and in practical settings. A good anchor
    for authentic tasks and reflective prompts.
  audienceVersions:
    forPractitioner:
      text: Graduates apply subject knowledge to practical situations and problems.
      status: drafted
      forEducator:
        text: 'Transfer is the hard part: students who perform well on set exercises often stall on an
          unfamiliar real case. Use authentic, slightly messy tasks and ask learners to justify why a
          given idea applies; the expectation moves from applying knowledge in familiar settings to doing
          so in current and complex ones.'
        status: drafted
    forBeneficiary:
      text: You can use what you know on real problems and in practical settings.
      status: drafted
      forLearnerGuidance:
        text: What you learn is meant to be used, so expect to take ideas from class onto real problems
          and settings. You can tell it is working when you choose which part of your knowledge a new
          situation needs, rather than reciting everything you know.
        status: drafted
  groundingSample:
  - accounting-2025:4.5.b17
  - accounting-2025:4.5.b25
  - accounting-2025:4.7.b5
  - accounting-2025:4.7.b6
- id: qaa-universal/threshold/critical-evaluation-of-evidence-and-arguments
  statementType: threshold
  rung: threshold
  level: fheq:6
  force: will
  appliesTo: graduates at the threshold level
  about: critical evaluation of evidence and arguments
  strand: strand:thinking
  domain: generic-skill
  paraphrase: Graduates evaluate evidence and arguments critically and reach reasoned judgements.
  sharedBy:
    threshold: 50
    typical: 25
    excellent: 27
    any: 54
    of: 54
  core: true
  basis: inferred
  status: drafted
  agentInstruction: 'Frame as weighing evidence and arguments to a reasoned judgement. This strand climbs
    most across tiers: at advanced, push to sustained criticality throughout.'
  audienceVersions:
    forPractitioner:
      text: Graduates evaluate evidence and arguments critically and reach reasoned judgements.
      status: drafted
      forEducator:
        text: Students often hear 'critical' as 'negative', or meet it by summarising more sources. The
          shift to teach is from description to judgement, so scaffold a visible claim, evidence, so-what
          move and model your own reasoning aloud before asking for theirs; this strand climbs the most
          across levels, from tentative judgement to sustained, independent critique.
        status: drafted
    forBeneficiary:
      text: You weigh up evidence and arguments critically and come to reasoned conclusions.
      status: drafted
      forLearnerGuidance:
        text: 'Do not just report what a source says: ask how it knows it, what it leaves out, and whether
          the conclusion really follows. You are doing this well when your writing weighs one piece of
          evidence against another and says which you find stronger and why, instead of listing them all
          as equally true.'
        status: drafted
  groundingSample:
  - accounting-2025:4.5.b1
  - accounting-2025:4.5.b18
  - accounting-2025:4.7.b1
  - accounting-2025:4.7.b2
- id: qaa-universal/threshold/oral-or-other-communication-to-audiences
  statementType: threshold
  rung: threshold
  level: fheq:6
  force: will
  appliesTo: graduates at the threshold level
  about: oral or other communication to audiences
  strand: strand:communication
  domain: generic-skill
  paraphrase: Graduates communicate the subject clearly to different audiences and in different forms.
  sharedBy:
    threshold: 50
    typical: 19
    excellent: 21
    any: 54
    of: 54
  core: true
  basis: inferred
  status: drafted
  agentInstruction: Frame as explaining the subject clearly to different audiences and in more than one
    form. Core to presenting; supports most pathways.
  audienceVersions:
    forPractitioner:
      text: Graduates communicate the subject clearly to different audiences and in different forms.
      status: drafted
      forEducator:
        text: Learners tend to present for the marker rather than the audience, and read slides aloud.
          Give them real audiences and formats and coach adaptation and clarity; the expectation climbs
          from communicating clearly to tailoring the message and the medium to who is listening.
        status: drafted
    forBeneficiary:
      text: You can explain your subject clearly to different audiences, in more than one form.
      status: drafted
      forLearnerGuidance:
        text: You are expected to explain your subject clearly to different people and in more than one
          way, not only in writing. You are on track when you adjust how you present something for the
          audience in front of you and still keep it accurate.
        status: drafted
  groundingSample:
