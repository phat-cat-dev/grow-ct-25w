  - anthropology-2024:ku.15.t
  - anthropology-2024:ss.10.t
  - archaeology-2022:4.3.b17
- id: qaa-universal/threshold/independent-and-self-directed-learning
  statementType: threshold
  rung: threshold
  level: fheq:6
  force: will
  appliesTo: graduates at the threshold level
  about: independent and self-directed learning
  strand: strand:autonomy
  domain: generic-skill
  paraphrase: Graduates manage their own learning and work independently.
  sharedBy:
    threshold: 43
    typical: 19
    excellent: 21
    any: 53
    of: 54
  core: true
  basis: inferred
  status: drafted
  agentInstruction: 'Frame as managing one''s own learning and working independently. A tier-climb marker:
    more independence at higher tiers.'
  audienceVersions:
    forPractitioner:
      text: Graduates manage their own learning and work independently.
      status: drafted
      forEducator:
        text: Independence has to be taught, not assumed; dropping support too fast leaves weaker students
          stranded. Release responsibility gradually and make planning and self-monitoring visible; this
          is a clear tier marker, with more autonomy expected at each level.
        status: drafted
    forBeneficiary:
      text: You can manage your own learning and work on your own.
      status: drafted
      forLearnerGuidance:
        text: 'You are expected to manage your own learning: plan your time, find what you need, and keep
          going without being told each step. A good sign is that you set your own next task and follow
          it through before a deadline forces you to.'
        status: drafted
  groundingSample:
  - accounting-2025:4.7.b24
  - accounting-2025:4.7.b25
  - accounting-2025:4.7.b26
  - accounting-2025:4.7.b27
- id: qaa-universal/threshold/information-and-sources
  statementType: threshold
  rung: threshold
  level: fheq:6
  force: will
  appliesTo: graduates at the threshold level
  about: information and sources
  strand: strand:application
  domain: generic-skill
  paraphrase: Graduates find, select and use information and sources appropriate to the subject.
  sharedBy:
    threshold: 42
    typical: 17
    excellent: 18
    any: 54
    of: 54
  core: true
  basis: inferred
  status: drafted
  agentInstruction: Realise as finding, choosing and using the right sources and information. Natural
    fit for the finding-using-sources and referencing pathways.
  audienceVersions:
    forPractitioner:
      text: Graduates find, select and use information and sources appropriate to the subject.
      status: drafted
      forEducator:
        text: Students equate searching with a quick web lookup and rarely question authority or relevance.
          Teach selection and evaluation, not just retrieval, and connect it to referencing and integrity;
          the expectation deepens from finding suitable sources to using them discerningly within the
          field's conventions.
        status: drafted
    forBeneficiary:
      text: You can find, choose and use the right sources and information for your subject.
      status: drafted
      forLearnerGuidance:
        text: You are expected to find the right sources, judge how good they are, and use them properly.
          A good sign is that you choose a few strong, relevant sources and show why they are trustworthy,
          instead of grabbing whatever comes up first.
        status: drafted
  groundingSample:
