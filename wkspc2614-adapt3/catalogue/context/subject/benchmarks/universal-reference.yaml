      tiers:
      - advanced
      tierBasis: capability-match
    - pathway: adapt-creativity
      strength: indirect
      tiers:
      - intermediate
      - advanced
      tierBasis: capability-match
    statementId: qaa-universal/threshold/subject-knowledge-and-understanding
    formula:
      registers:
        forPractitioner:
          template: Graduates {verb} {qualifier} knowledge of the subject's {object}.
          sourceFill:
            verb: show
            qualifier: broad and well-founded
            object: core content
          slots:
          - key: verb
            role: verb
            fill: an Advanced-band verb for demonstrating command of core subject content
            options:
            - critique
            - evaluate
            - synthesise
            - construct
            - justify
            - interrogate
            subjectSupplied: false
            verbBand: Advanced
            verbBandPointer:
              doc: reference/excelling-voice-specification.md
              ref: section 16 Advanced band
          - key: qualifier
            role: qualifier
            fill: how broad and solid the knowledge is
            options:
            - broad and well-founded
            - wide-ranging and robust
            - extensive and well grounded
            subjectSupplied: false
          - key: object
            role: object
            fill: the part of the subject the knowledge covers
            options:
            - core content
            - core subject matter
            - core content and key topics
            subjectSupplied: false
          agentInstruction: Reuse by keeping the "knowledge of the subject's X" frame intact; vary qualifier
            for breadth/soundness and verb for how the knowledge is demonstrated, while object names the
            content area being claimed.
          outcomes:
          - id: subject-knowledge-and-understanding/o1
            template: '{verb} {object} of {field_content}, {condition}.'
            slots:
            - key: verb
              role: verb
              fill: an Advanced-band verb for demonstrating depth of command over core content, not merely
                knowing it
              options:
              - critique
              - evaluate
              - synthesise
              - construct
              - justify
              - interrogate
              subjectSupplied: false
              verbBand: Advanced
              verbBandPointer:
                doc: reference/excelling-voice-specification.md
                ref: section 16 Advanced band
            - key: object
              role: object
              fill: the content area being demonstrated
              options:
              - core content
              - core subject matter
              - key content areas
              subjectSupplied: false
            - key: field_content
              role: field_content
              fill: the subject's own domain
              options:
              - your subject
              subjectSupplied: true
              floor: your subject
            - key: condition
              role: condition
              fill: how the command of content is evidenced
              options:
              - with reference to primary sources
              - without relying on lecture notes alone
              - linking it to current scholarship
              subjectSupplied: false
            agentInstruction: Fill field_content with the subject itself. Choose a verb that shows active
              command of content rather than passive familiarity, and let condition specify the evidence
              that demonstrates breadth and soundness.
        forBeneficiary:
          template: You {verb_1} the core content of your subject well and can {verb_2} it.
          sourceFill:
            verb_1: know
            verb_2: show
          slots:
          - key: verb_1
            role: verb
            fill: an Advanced-band verb standing in for the live, banned "know" (sourceFill keeps the
              live wording; options stay clean)
            options:
            - critique
            - evaluate
            - synthesise
            - construct
            - justify
            - interrogate
            subjectSupplied: false
            verbBand: Advanced
            verbBandPointer:
              doc: reference/excelling-voice-specification.md
              ref: section 16 Advanced band
          - key: verb_2
            role: verb
            fill: an Advanced-band verb for demonstrating the knowledge once held
            options:
            - critique
            - evaluate
            - synthesise
            - construct
            - justify
            - interrogate
            subjectSupplied: false
            verbBand: Advanced
            verbBandPointer:
              doc: reference/excelling-voice-specification.md
              ref: section 16 Advanced band
          agentInstruction: 'sourceFill preserves the live statement''s banned verb "know" exactly, but
            both verb slots offer clean Advanced-band options for anything newly generated: pair a command-of-content
            verb with a demonstration verb.'
          outcomes: []
