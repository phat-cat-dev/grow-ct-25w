- id: qaa-universal/threshold/written-communication
  statementType: threshold
  rung: threshold
  level: fheq:6
  force: will
  appliesTo: graduates at the threshold level
  about: written communication
  strand: strand:communication
  domain: generic-skill
  paraphrase: Graduates write in the forms the subject requires.
  sharedBy:
    threshold: 33
    typical: 11
    excellent: 13
    any: 49
    of: 54
  core: true
  basis: inferred
  status: drafted
  agentInstruction: Have the learner write in the forms their work needs. Shared by fewer subjects (threshold
    33/54), so treat as supporting unless the pathway is writing-led.
  audienceVersions:
    forPractitioner:
      text: Graduates write in the forms the subject requires.
      status: drafted
      forEducator:
        text: Students often transfer one default essay shape to every task, so name the forms your subject
          actually requires and model each. Give feedback on structure and audience, not only content;
          this matters most where the pathway is writing-led, and the expectation grows from meeting the
          form to using it fluently.
        status: drafted
    forBeneficiary:
      text: You can write in the forms your subject needs.
      status: drafted
      forLearnerGuidance:
        text: You are expected to write in the forms your subject uses, whether that is an essay, a report
          or something else. You can see it working when your structure and style fit the form and a reader
          can follow your point without effort.
        status: drafted
