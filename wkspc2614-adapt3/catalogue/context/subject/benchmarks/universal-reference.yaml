- id: qaa-universal/threshold/data
  statementType: threshold
  rung: threshold
  level: fheq:6
  force: will
  appliesTo: graduates at the threshold level
  about: data, numbers and quantitative reasoning
  strand: strand:application
  domain: generic-skill
  paraphrase: Graduates handle data and numbers appropriately for the subject.
  sharedBy:
    threshold: 42
    typical: 14
    excellent: 16
    any: 49
    of: 54
  core: true
  basis: inferred
  status: drafted
  agentInstruction: Have the learner work with data and numbers in the way the subject needs; pitch the
    amount to the pathway, as some carry little quantitative content.
  audienceVersions:
    forPractitioner:
      text: Graduates handle data and numbers appropriately for the subject.
      status: drafted
      forEducator:
        text: Confidence varies widely and anxiety blocks many capable students, so pitch to the quantitative
          load your subject actually carries and make the purpose of each technique clear. Scaffold interpretation
          before calculation; the expectation ranges from reading and using data appropriately to reasoning
          with it under uncertainty.
        status: drafted
    forBeneficiary:
      text: You can work with data and numbers in the way your subject needs.
      status: drafted
      forLearnerGuidance:
        text: Most subjects ask you to handle some numbers or data, even where yours is not a maths-heavy
          one. You are on track when you can read a figure or dataset, say what it does and does not show,
          and use it to support a point rather than decorate one.
        status: drafted
