          verbBand: Advanced
          verbBandPointer:
            doc: reference/excelling-voice-specification.md
            ref: section 16 Advanced band
        - key: audience_1
          role: audience
          fill: the first outward audience
          options:
          - wider debate
          - wider debate in the field
          - the field as a whole
          subjectSupplied: false
        - key: audience_2
          role: audience
          fill: the second outward audience
          options:
          - audiences
          - other practitioners
          - those who act on the conclusions
          subjectSupplied: false
        - key: verb_3
          role: verb
          fill: the operation of holding identity open to revision
          options:
          - critique
          - evaluate
          - synthesise
          - construct
          - justify
          - interrogate
          subjectSupplied: false
          verbBand: Advanced
          verbBandPointer:
            doc: reference/excelling-voice-specification.md
            ref: section 16 Advanced band
        - key: object_3
          role: object
          fill: the identity held open
          options:
          - professional identity
          - sense of practice
          - standpoint as a practitioner
          subjectSupplied: false
        - key: qualifier
          role: qualifier
          fill: the open, unsettled state of that identity
          options:
          - evolving
          - still open
          - unsettled
          subjectSupplied: false
        agentInstruction: 'The advanced identity triad: examine your own position, weigh what it means
          outward, then hold identity open. Fill stance and qualifier from the options to keep the reflexive
          register; only field_content-bearing outcomes take subject context. Reproduce all three outcomes
          or none, since dropping the third collapses identity back into reflection.'
        outcomes:
        - id: u-adv/identity/o1
          template: '{verb} how your own {object} shape the judgements you make in {field_content}, {condition}.'
          slots:
          - key: verb
            role: verb
            fill: an Advanced-band verb denoting active self-examination, not passive awareness
            options:
            - critique
            - evaluate
            - synthesise
            - construct
            - justify
            - interrogate
            subjectSupplied: false
            verbBand: Advanced
            verbBandPointer:
              doc: reference/excelling-voice-specification.md
              ref: section 16 Advanced band
          - key: object
            role: object
            fill: what is being examined in oneself
            options:
            - position, assumptions and values
            - standpoint and commitments
            - frame of reference
            - prior beliefs
            subjectSupplied: false
          - key: field_content
            role: field_content
            fill: the subject's own domain of judgement
            options:
            - your subject
            subjectSupplied: true
            floor: your subject
          - key: condition
            role: condition
            fill: the autonomy expected at advanced tier
            options:
            - without prompting
            - across a sustained piece of work
            - independently
            subjectSupplied: false
          agentInstruction: 'Fill field_content with the subject''s own domain of judgement and keep the
            verb in the Advanced band. Do not weaken the reflexive claim: the verb must denote active
            self-examination, not noticing or being aware. The condition slot carries the tier, so do
            not soften it when the subject is vocational.'
        - id: u-adv/identity/o2
          template: '{verb} what your {object} mean for {audience}, {condition}.'
          slots:
          - key: verb
            role: verb
            fill: an Advanced-band verb for judging the outward implications of your own position
            options:
            - critique
            - evaluate
            - synthesise
            - construct
            - justify
            - interrogate
            subjectSupplied: false
            verbBand: Advanced
            verbBandPointer:
              doc: reference/excelling-voice-specification.md
              ref: section 16 Advanced band
          - key: object
            role: object
            fill: the plural output of one's own judgement
            options:
            - judgements
            - conclusions
            - interpretations
            subjectSupplied: false
          - key: audience
            role: audience
            fill: who the implications reach
            options:
            - wider debate in your subject
            - other practitioners
            - those who act on your conclusions
            subjectSupplied: false
          - key: condition
            role: condition
            fill: the autonomy expected
            options:
            - without prompting
            - across a sustained piece of work
            - independently
            subjectSupplied: false
          agentInstruction: 'Keep object plural to agree with "mean". This outcome is distinct from o1:
            o1 looks inward at what shapes judgement, o2 looks outward at what that judgement means for
            others acting on it. Keep both if reproducing the triad.'
        - id: u-adv/identity/o3
          template: '{verb} your {object} as still open to revision through that scrutiny, {condition}.'
          slots:
          - key: verb
            role: verb
            fill: an Advanced-band verb for holding your own identity open rather than fixed
            options:
            - critique
            - evaluate
            - synthesise
            - construct
            - justify
            - interrogate
            subjectSupplied: false
            verbBand: Advanced
            verbBandPointer:
              doc: reference/excelling-voice-specification.md
              ref: section 16 Advanced band
          - key: object
            role: object
            fill: the identity held open
            options:
            - professional identity
            - sense of practice
            - standpoint as a practitioner
            subjectSupplied: false
          - key: condition
            role: condition
            fill: the autonomy expected
            options:
            - without prompting
            - across a sustained piece of work
            - independently
            subjectSupplied: false
          agentInstruction: No field_content or audience slot here; the point is purely reflexive. Keep
            the verb denoting holding identity open to revision, not closing it down into a settled professional
            label, which would contradict the whole triad.
  note: Benchmarks set standards for the honours graduate (FHEQ level 6); the intermediate and advanced
    rows synthesise that shared core across the statements. The introductory (FHEQ level 4) row is a pedagogical
    down-pitch toward the same core, marked with its own pitchNote - the benchmarks do not themselves
    speak at level 4. Our words, no issuer text.
  source:
    script: tools/build-universal-benchmark.py
    note: Universal synthesis, not a per-subject card.
themes:
- id: theme:accessibility
  role: carries
  note: an accessibility sub-section appears in section 1 of all statements
- id: theme:esd
  alias: sustainability
  role: carries
  sharedBy: 50
  note: a sustainability sub-section in all statements; the shared-core sustainability expectation is
    carried this widely
- id: theme:edi
  role: carries
  sharedBy: 52
  note: an EDI sub-section in most statements
- id: theme:enterprise
  role: carries
  sharedBy: 53
  note: an enterprise sub-heading in a minority of statements; treated without the heading in the rest
digest:
  definition: 'The shared core of the QAA Subject Benchmark Statements: what an honours graduate is expected
    to know, do and be on graduating, whatever the subject.'
  distinctiveFeatures:
  - 'Subjects differ in the matter their graduates act on, not in the shape of the expectation: the same
    verbs and rungs recur across the statements.'
  - 'At threshold, most subjects ask for the same core: subject knowledge, theories, critical evaluation,
    analysis, research methods, application, communication, teamwork, independence and ethics.'
  - 'The rungs climb by qualifiers, not new verbs: ''critical'', ''independent'' and ''original'' mark
    the typical and excellent standards above threshold.'
  - 'Ethical, professional and digital expectations sit at the threshold: they are baseline, not marks
    of excellence.'
  standards:
    rungs:
    - rung: threshold
      award: bachelor's with honours
      note: the minimum every honours graduate shows; spine:6
    - rung: typical
      note: what most graduates show
    - rung: excellent
      note: the best performance
    rungBases: Typical and excellent go beyond threshold by depth and breadth of knowledge, engagement
      in research and independent study, critical insight, and advanced application of theory and method.
statements:
- id: qaa-universal/threshold/subject-knowledge-and-understanding
  statementType: threshold
  rung: threshold
  level: fheq:6
  force: will
  appliesTo: graduates at the threshold level
  about: subject knowledge and understanding
  strand: strand:knowledge
  domain: knowledge
  paraphrase: Graduates show broad and well-founded knowledge of the subject's core content.
  sharedBy:
    threshold: 54
    typical: 24
    excellent: 26
    any: 54
    of: 54
  core: true
  basis: inferred
  status: drafted
  agentInstruction: Realise as the learner showing well-founded knowledge of their own field's core content.
    Keep subject-neutral (use 'your subject'); a worked example may use the Student A / Student B cast.
  audienceVersions:
    forPractitioner:
      text: Graduates show broad and well-founded knowledge of the subject's core content.
      status: drafted
      forEducator:
        text: Early on, learners equate knowledge with coverage and recall, so they revise lists rather
          than connections. Build understanding by asking them to link new content to what they already
          know and to restate ideas in their own words; across the levels the expectation moves from knowing
          the core to seeing how the parts relate and where the field is unsettled.
        status: drafted
    forBeneficiary:
      text: You know the core content of your subject well and can show it.
      status: drafted
      forLearnerGuidance:
        text: 'Knowing your subject is more than recalling facts: you can explain the main ideas in your
          own words and show how they fit together. A good check is whether you could teach a topic to
          someone on a different course without reading from your notes.'
        status: drafted
  groundingSample:
  - accounting-2025:4.5.b1
  - accounting-2025:4.5.b9
  - accounting-2025:4.5.b10
  - accounting-2025:4.5.b18
- id: qaa-universal/threshold/analysis-and-problem-solving
  statementType: threshold
  rung: threshold
  level: fheq:6
  force: will
  appliesTo: graduates at the threshold level
  about: analysis and problem-solving
  strand: strand:thinking
  domain: generic-skill
  paraphrase: Graduates analyse problems and work towards solutions using the subject's approaches.
  sharedBy:
    threshold: 50
    typical: 22
    excellent: 24
    any: 54
    of: 54
  core: true
  basis: inferred
  status: drafted
  agentInstruction: Realise as breaking a problem down and working to a solution with the field's methods.
    Pair with a worked example that shows the steps.
  audienceVersions:
    forPractitioner:
      text: Graduates analyse problems and work towards solutions using the subject's approaches.
      status: drafted
      forEducator:
        text: Novices jump to an answer and skip the breakdown, so their errors are hard to locate. Teach
          a repeatable decomposition (what is given, what is asked, what method fits) and insist on visible
          working; the expectation grows from applying a given method to selecting and defending one.
        status: drafted
    forBeneficiary:
      text: You break problems down and work out solutions using your subject's methods.
      status: drafted
      forLearnerGuidance:
        text: Analysis means breaking a problem into parts you can actually work on, then choosing a method
          and following it through. You can see it working when you show your steps and reasoning, not
          only the final answer.
        status: drafted
  groundingSample:
  - accounting-2025:4.5.b17
  - accounting-2025:4.5.b25
  - accounting-2025:4.7.b14
  - accounting-2025:4.7.b16
- id: qaa-universal/threshold/applying-knowledge-to-practice-or-problems
  statementType: threshold
  rung: threshold
  level: fheq:6
  force: will
  appliesTo: graduates at the threshold level
  about: applying knowledge to practice or problems
  strand: strand:application
  domain: generic-skill
  paraphrase: Graduates apply subject knowledge to practical situations and problems.
  sharedBy:
    threshold: 50
    typical: 24
    excellent: 25
    any: 54
    of: 54
  core: true
  basis: inferred
  status: drafted
  agentInstruction: Frame as using knowledge on real problems and in practical settings. A good anchor
    for authentic tasks and reflective prompts.
  audienceVersions:
    forPractitioner:
      text: Graduates apply subject knowledge to practical situations and problems.
      status: drafted
      forEducator:
        text: 'Transfer is the hard part: students who perform well on set exercises often stall on an
          unfamiliar real case. Use authentic, slightly messy tasks and ask learners to justify why a
          given idea applies; the expectation moves from applying knowledge in familiar settings to doing
          so in current and complex ones.'
        status: drafted
    forBeneficiary:
      text: You can use what you know on real problems and in practical settings.
      status: drafted
      forLearnerGuidance:
        text: What you learn is meant to be used, so expect to take ideas from class onto real problems
          and settings. You can tell it is working when you choose which part of your knowledge a new
          situation needs, rather than reciting everything you know.
        status: drafted
  groundingSample:
  - accounting-2025:4.5.b17
  - accounting-2025:4.5.b25
  - accounting-2025:4.7.b5
  - accounting-2025:4.7.b6
- id: qaa-universal/threshold/critical-evaluation-of-evidence-and-arguments
  statementType: threshold
  rung: threshold
  level: fheq:6
  force: will
  appliesTo: graduates at the threshold level
  about: critical evaluation of evidence and arguments
  strand: strand:thinking
  domain: generic-skill
  paraphrase: Graduates evaluate evidence and arguments critically and reach reasoned judgements.
  sharedBy:
    threshold: 50
    typical: 25
    excellent: 27
    any: 54
    of: 54
  core: true
  basis: inferred
  status: drafted
  agentInstruction: 'Frame as weighing evidence and arguments to a reasoned judgement. This strand climbs
    most across tiers: at advanced, push to sustained criticality throughout.'
  audienceVersions:
    forPractitioner:
      text: Graduates evaluate evidence and arguments critically and reach reasoned judgements.
      status: drafted
      forEducator:
        text: Students often hear 'critical' as 'negative', or meet it by summarising more sources. The
          shift to teach is from description to judgement, so scaffold a visible claim, evidence, so-what
          move and model your own reasoning aloud before asking for theirs; this strand climbs the most
          across levels, from tentative judgement to sustained, independent critique.
        status: drafted
    forBeneficiary:
      text: You weigh up evidence and arguments critically and come to reasoned conclusions.
      status: drafted
      forLearnerGuidance:
        text: 'Do not just report what a source says: ask how it knows it, what it leaves out, and whether
          the conclusion really follows. You are doing this well when your writing weighs one piece of
          evidence against another and says which you find stronger and why, instead of listing them all
          as equally true.'
        status: drafted
  groundingSample:
  - accounting-2025:4.5.b1
  - accounting-2025:4.5.b18
  - accounting-2025:4.7.b1
  - accounting-2025:4.7.b2
- id: qaa-universal/threshold/oral-or-other-communication-to-audiences
  statementType: threshold
  rung: threshold
  level: fheq:6
  force: will
  appliesTo: graduates at the threshold level
  about: oral or other communication to audiences
  strand: strand:communication
  domain: generic-skill
  paraphrase: Graduates communicate the subject clearly to different audiences and in different forms.
  sharedBy:
    threshold: 50
    typical: 19
    excellent: 21
    any: 54
    of: 54
  core: true
  basis: inferred
  status: drafted
  agentInstruction: Frame as explaining the subject clearly to different audiences and in more than one
    form. Core to presenting; supports most pathways.
  audienceVersions:
    forPractitioner:
      text: Graduates communicate the subject clearly to different audiences and in different forms.
      status: drafted
      forEducator:
        text: Learners tend to present for the marker rather than the audience, and read slides aloud.
          Give them real audiences and formats and coach adaptation and clarity; the expectation climbs
          from communicating clearly to tailoring the message and the medium to who is listening.
        status: drafted
    forBeneficiary:
      text: You can explain your subject clearly to different audiences, in more than one form.
      status: drafted
      forLearnerGuidance:
        text: You are expected to explain your subject clearly to different people and in more than one
          way, not only in writing. You are on track when you adjust how you present something for the
          audience in front of you and still keep it accurate.
        status: drafted
  groundingSample:
  - agriculture-rural-environmental-sciences-animal-studies-consumer-science-forestry-food-horticulture-and-human-nutrition-2024:4.2.b11
  - agriculture-rural-environmental-sciences-animal-studies-consumer-science-forestry-food-horticulture-and-human-nutrition-2024:4.2.b36
  - agriculture-rural-environmental-sciences-animal-studies-consumer-science-forestry-food-horticulture-and-human-nutrition-2024:4.2.b51
  - agriculture-rural-environmental-sciences-animal-studies-consumer-science-forestry-food-horticulture-and-human-nutrition-2024:4.2.b63
- id: qaa-universal/threshold/research-and-enquiry-methods
  statementType: threshold
  rung: threshold
  level: fheq:6
  force: will
  appliesTo: graduates at the threshold level
  about: research and enquiry methods
  strand: strand:application
  domain: generic-skill
  paraphrase: Graduates understand and use the subject's methods of research and enquiry.
  sharedBy:
    threshold: 50
    typical: 21
    excellent: 23
    any: 54
    of: 54
  core: true
  basis: inferred
  status: drafted
  agentInstruction: 'Frame as knowing how enquiry is done in the field and being able to carry one out:
    supervised at intermediate, designed and critiqued by the learner at advanced.'
  audienceVersions:
    forPractitioner:
      text: Graduates understand and use the subject's methods of research and enquiry.
      status: drafted
      forEducator:
        text: Students often see method as a hoop rather than the thing that makes a claim trustworthy.
          Teach method alongside the questions it answers, start with supervised enquiry and release responsibility
          gradually; by the top of the range learners design and critique enquiry, not just carry it out.
        status: drafted
    forBeneficiary:
      text: You know how research is done in your subject and can carry out an enquiry yourself.
      status: drafted
      forLearnerGuidance:
        text: Every subject has its own ways of finding things out, and you are expected to know how yours
          works and to run a small enquiry yourself. You are doing well when you can say why you chose
          a method and what its limits are, not just what you found.
        status: drafted
  groundingSample:
  - accounting-2025:4.7.b24
  - accounting-2025:4.7.b25
  - agriculture-rural-environmental-sciences-animal-studies-consumer-science-forestry-food-horticulture-and-human-nutrition-2024:4.2.b9
  - agriculture-rural-environmental-sciences-animal-studies-consumer-science-forestry-food-horticulture-and-human-nutrition-2024:4.2.b11
- id: qaa-universal/threshold/theories
  statementType: threshold
  rung: threshold
  level: fheq:6
  force: will
  appliesTo: graduates at the threshold level
  about: theories, concepts and debates
  strand: strand:knowledge
  domain: knowledge
  paraphrase: Graduates understand the subject's main theories and concepts and the debates between them.
  sharedBy:
    threshold: 48
    typical: 22
    excellent: 23
    any: 54
    of: 54
  core: true
  basis: inferred
  status: drafted
  agentInstruction: Have the learner handle the main ideas, theories and the debates between them, and
    show that disagreement is normal in a field. Do not import a specific discipline's theories at baseline.
  audienceVersions:
    forPractitioner:
      text: Graduates understand the subject's main theories and concepts and the debates between them.
      status: drafted
      forEducator:
        text: 'Students tend to want the ''correct'' theory and find open disagreement unsettling, so
          normalise it: present a live debate and show that reasoned people hold different views. Scaffold
          with paired contrasts before asking for a judgement, and expect the move from naming theories
          to weighing them as learners progress.'
        status: drafted
    forBeneficiary:
      text: You understand the main ideas and theories in your subject and where people disagree about
        them.
      status: drafted
      forLearnerGuidance:
        text: Theories are the tools your subject uses to explain things, and experts often disagree about
          which tool fits. You are handling this well when you can set out more than one position on a
          question and say what each gets right, rather than treating the first explanation you meet as
          the only one.
        status: drafted
  groundingSample:
  - accounting-2025:4.5.b2
  - accounting-2025:4.7.b2
  - accounting-2025:4.7.b4
  - accounting-2025:4.7.b6
- id: qaa-universal/threshold/ethics
  statementType: threshold
  rung: threshold
  level: fheq:6
  force: will
  appliesTo: graduates at the threshold level
  about: ethics, integrity and values
  strand: strand:autonomy
  domain: generic-skill
  paraphrase: Graduates recognise and act on the ethical issues and responsibilities of the subject.
  sharedBy:
    threshold: 47
    typical: 18
    excellent: 21
    any: 53
    of: 54
  core: true
  basis: inferred
  status: drafted
  agentInstruction: Frame as recognising the ethical questions in the field and acting responsibly. This
    sits at the threshold (baseline), not as a mark of excellence.
  audienceVersions:
    forPractitioner:
      text: Graduates recognise and act on the ethical issues and responsibilities of the subject.
      status: drafted
      forEducator:
        text: 'Treat this as threshold, not a mark of excellence: it is the floor every graduate stands
          on, not a distinction. Use real dilemmas from the field rather than abstract rules, and connect
          academic integrity to professional conduct so it reads as practice, not policing.'
        status: drafted
    forBeneficiary:
      text: You recognise the ethical questions in your subject and act responsibly.
      status: drafted
      forLearnerGuidance:
        text: Every subject carries ethical questions and expects you to act with integrity. You are meeting
          this when you can spot the ethical issue in a situation and act responsibly, including being
          honest about your own work and sources.
        status: drafted
  groundingSample:
  - accounting-2025:4.5.b1
  - accounting-2025:4.7.b1
  - accounting-2025:4.7.b3
  - accounting-2025:4.7.b5
- id: qaa-universal/threshold/history
  statementType: threshold
  rung: threshold
  level: fheq:6
  force: will
  appliesTo: graduates at the threshold level
  about: history, context and currency of the field
  strand: strand:knowledge
  domain: knowledge
  paraphrase: Graduates place the subject in its history and context and know where it currently stands.
  sharedBy:
    threshold: 46
    typical: 19
    excellent: 19
    any: 53
    of: 54
  core: true
  basis: inferred
  status: drafted
  agentInstruction: Frame as placing the subject in its history and knowing what is current in it. Keep
    examples generic; do not date-stamp a particular discipline.
  audienceVersions:
    forPractitioner:
      text: Graduates place the subject in its history and context and know where it currently stands.
      status: drafted
      forEducator:
        text: Learners often treat the textbook as timeless and miss that knowledge is dated and contested.
          Anchor topics to their origins and to a current development or controversy; the expectation
          deepens from placing ideas in context to tracking where the field currently stands and why.
        status: drafted
    forBeneficiary:
      text: You know how your subject developed, the settings it works in and what is current in it.
      status: drafted
      forLearnerGuidance:
        text: Ideas in your subject came from somewhere and are still changing, so it helps to know how
          a topic developed and what is current now. You are on track when you can say why a method became
          standard and point to something recent that is shifting it.
        status: drafted
  groundingSample:
  - accounting-2025:4.5.b1
  - accounting-2025:4.7.b1
  - accounting-2025:4.7.b3
  - accounting-2025:4.7.b5
- id: qaa-universal/threshold/teamwork-and-collaboration
  statementType: threshold
  rung: threshold
  level: fheq:6
  force: will
  appliesTo: graduates at the threshold level
  about: teamwork and collaboration
  strand: strand:communication
  domain: generic-skill
  paraphrase: Graduates work effectively with others.
  sharedBy:
    threshold: 44
    typical: 12
    excellent: 15
    any: 54
    of: 54
  core: true
  basis: inferred
  status: drafted
  agentInstruction: Realise as working well with others. Use lightly unless the pathway is collaboration-led;
    do not force group work into solo-study topics.
  audienceVersions:
    forPractitioner:
      text: Graduates work effectively with others.
      status: drafted
      forEducator:
        text: Group work often rewards the willing few and hides free-riding, which sours students on
          collaboration. Design interdependent roles and assess process as well as product; use this lightly
          unless the pathway is collaboration-led, and avoid forcing group work onto genuinely solo tasks.
        status: drafted
    forBeneficiary:
      text: You can work well with other people.
      status: drafted
      forLearnerGuidance:
        text: Much of what you will do depends on working well with other people. You can tell it is going
          well when the group shares the work fairly, handles disagreement openly, and produces something
          better than any of you would alone.
        status: drafted
  groundingSample:
  - anthropology-2024:gs.6.t
  - anthropology-2024:ku.15.t
  - anthropology-2024:ss.10.t
  - archaeology-2022:4.3.b17
- id: qaa-universal/threshold/independent-and-self-directed-learning
  statementType: threshold
  rung: threshold
  level: fheq:6
  force: will
  appliesTo: graduates at the threshold level
  about: independent and self-directed learning
  strand: strand:autonomy
  domain: generic-skill
  paraphrase: Graduates manage their own learning and work independently.
  sharedBy:
    threshold: 43
    typical: 19
    excellent: 21
    any: 53
    of: 54
  core: true
  basis: inferred
  status: drafted
  agentInstruction: 'Frame as managing one''s own learning and working independently. A tier-climb marker:
    more independence at higher tiers.'
  audienceVersions:
    forPractitioner:
      text: Graduates manage their own learning and work independently.
      status: drafted
      forEducator:
        text: Independence has to be taught, not assumed; dropping support too fast leaves weaker students
          stranded. Release responsibility gradually and make planning and self-monitoring visible; this
          is a clear tier marker, with more autonomy expected at each level.
        status: drafted
    forBeneficiary:
      text: You can manage your own learning and work on your own.
      status: drafted
      forLearnerGuidance:
        text: 'You are expected to manage your own learning: plan your time, find what you need, and keep
          going without being told each step. A good sign is that you set your own next task and follow
          it through before a deadline forces you to.'
        status: drafted
  groundingSample:
  - accounting-2025:4.7.b24
  - accounting-2025:4.7.b25
  - accounting-2025:4.7.b26
  - accounting-2025:4.7.b27
- id: qaa-universal/threshold/information-and-sources
  statementType: threshold
  rung: threshold
  level: fheq:6
  force: will
  appliesTo: graduates at the threshold level
  about: information and sources
  strand: strand:application
  domain: generic-skill
  paraphrase: Graduates find, select and use information and sources appropriate to the subject.
  sharedBy:
    threshold: 42
    typical: 17
