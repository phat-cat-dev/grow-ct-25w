course: "Understanding Learning, Assessment & Feedback: Introductory"
shortSlug: "undlaf-intro"
pages:
  - id: "understanding-learning-assessment-feedback-introductory-W-OPEN-co-01"
    title: "Course introduction"
    articles:
      - id: "understanding-learning-assessment-feedback-introductory-W-OPEN-a-01"
        title: ""
        classes: ""
        components:
          - id: "understanding-learning-assessment-feedback-introductory-W-OPEN-c-05"
            component: "text"
            classes: ""
            content:
              - { kind: body, label: "", text: "Three things shape how you get on at university: how you learn, how you are assessed, and the feedback you get along the way. Some students meet these one at a time and treat them as separate hurdles. This course proposes a different view. It shows how learning, assessment and feedback work together as one cycle, one you will meet again and again throughout your studies. Understanding how these parts of academic studies connect is worth your attention right at the start, because it lets you study with purpose from the outset rather than spend your first terms working it out the hard way.Over five short lessons you will look at what learning at university actually asks of you, and at how university spells out what you are meant to learn. You will then look at what assessment is really for, at how to make feedback worth having, and finally at how the three connect into a single cycle you can run deliberately. None of it is abstract: it all applies to the work you are already doing, this term, in whatever you are studying. By the end you will have a clearer picture of how your own studies work, and a few practical habits for making each piece of work feed the next." }
          - id: "understanding-learning-assessment-feedback-introductory-W-OPEN-c-10"
            component: "text"
            classes: ""
            displayTitle: "Course learning outcomes"
            content:
              - { kind: body, label: "", text: "By the end of this course you will be able to:apply an understanding of how university learning works to your own study;interpret your own assessment tasks and marking criteria;act on feedback to improve your own work;align your own academic practice with the learning, assessment and feedback cycle.These matter because none of them belongs to a single module: every subject you take will set work, mark it against criteria, and give you feedback. The sooner you understand how that cycle works, the more each piece of work you do can build on the last." }
          - id: "understanding-learning-assessment-feedback-introductory-W-OPEN-c-15"
            component: "text"
            classes: "slot__wrapper-open__practice-connection"
            displayTitle: "Academic and professional practice"
            content:
              - { kind: body, label: "", text: "Everything in this course applies to the psychology you are already studying. Every module you take sets assessments, marks them against criteria, and gives you feedback; the students who understand that cycle, and run it on purpose, are the ones whose lab reports, essays and exam answers improve from one assignment to the next rather than repeating the same mistakes. In psychology you often have more say than you might expect, since courses commonly invite you to help shape assessment, so understanding how it works lets you use that voice well. Treat what follows as being about your own reports, essays and practical work, not about study in the abstract.The same brief, standard, feedback and next-task cycle runs through professional psychology too. Whether you go into research, clinical training or any applied field, your work is judged against a standard, you receive feedback, and you carry it into what you do next. Learning from that feedback and iterating your practice on the back of it is a habit you keep long after you graduate." }
          - id: "understanding-learning-assessment-feedback-introductory-W-OPEN-c-20"
            component: "hotgraphic"
            classes: ""
            displayTitle: "What's ahead"
            content:
              - { kind: body, label: "", text: "Learning, assessment and feedback are not three separate things. They form a cycle: what you learn is tested by assessment, assessment produces feedback, and feedback, once you act on it, feeds your next round of learning. Select each part of the cycle to see what the course covers. In the final lesson you will see how the three connect into one cycle you can run on purpose." }
              - { kind: item-title, label: "Item 1", text: "1. Learning" }
              - { kind: item-body, label: "", text: "Learning at university is not the same as at school: more of it is in your hands, and the point is to understand and use ideas, not just collect them. The first two lessons look at what that shift asks of you, and at how each module spells out what you are meant to learn." }
              - { kind: item-title, label: "Item 2", text: "2. Assessment" }
              - { kind: item-body, label: "", text: "Assessment is how your learning is tested, through essays, exams, presentations and more. It is not there to catch you out: it shows you, and your tutors, how your learning is going. The third lesson looks at what assessment is really for, and at how to read what a task is asking of you." }
              - { kind: item-title, label: "Item 3", text: "3. Feedback" }
              - { kind: item-body, label: "", text: "Feedback is what you get back on your work, and it is the part students most often waste. Used well, it is your tutors telling you what to do differently next time. The fourth lesson looks at the forms feedback arrives in, and at how to work out the action a comment is really asking for." }
          - id: "understanding-learning-assessment-feedback-introductory-W-OPEN-c-25"
            component: "text"
            classes: ""
            content:
              - { kind: body, label: "", text: "Start and finish with a confidence check. Before the lessons, you'll rate how confident you feel about each part of this topic. You'll rate the same statements again at the end, so you can see what has changed. Your ratings are yours: they aren't marked and no one else sees them.The activities in the lessons are for practice. Questions, examples and reflective prompts are there to help you think, and they don't count towards passing. Reflective prompts are private and optional.The test at the end is the one that counts. To complete the course you need to take the final test and score at least 70%. You can retake it." }
          - id: "understanding-learning-assessment-feedback-introductory-W-OPEN-c-30"
            component: "text"
            classes: ""
            content:
              - { kind: body, label: "", text: "The examples and activities in this course use invented people, authors and sources to show how things work. Unless we say otherwise, any name, citation or reference you meet in an example is fictional.Where a lesson draws on real work, you'll find it listed under Lesson Sources at the bottom of that page. Every real source used in the course is gathered under Course Sources at the end." }
  - id: "understanding-learning-assessment-feedback-introductory-C-PRE-co-01"
    title: "Pre-course confidence survey"
    articles:
      - id: "understanding-learning-assessment-feedback-introductory-C-PRE-a-01"
        title: ""
        classes: ""
        components:
          - id: "understanding-learning-assessment-feedback-introductory-C-PRE-c-05"
            component: "confidence"
            classes: ""
            content:
              - { kind: item, label: "Item 1", text: "I can apply what I know about how university learning works to my own study." }
              - { kind: item, label: "Item 2", text: "I can interpret my own assessment tasks and marking criteria." }
              - { kind: item, label: "Item 3", text: "I can act on feedback to improve my own work." }
              - { kind: item, label: "Item 4", text: "I can align my own academic practice with the learning, assessment and feedback cycle." }
  - id: "L01-co-01"
    title: "Learning at university"
    articles:
      - id: "L01-a-01"
        title: "Lesson overview"
        classes: "article--lesson-open"
        components:
          - id: "L01-c-05"
            component: "text"
            classes: ""
            content:
              - { kind: body, label: "", text: "University asks you to learn in a way that may feel new. At school, learning often meant taking in what you were told and giving it back accurately. Here, you are joining a community of people who make, test and argue about knowledge, and learning means taking part in that work. This lesson looks at what that shift involves, and why it shapes everything else you will do at university." }
          - id: "L01-c-07"
            component: "text"
            classes: ""
            content:
              - { kind: body, label: "", text: "You are at the start of your time at university, and the way learning works here may be new to you. At this stage you are not expected to know it all already; you are expected to begin finding your feet. This lesson looks at what learning at university asks of you, so that the habits you build now set you up well for the years ahead." }
          - id: "L01-c-10"
            component: "text"
            classes: ""
            content:
              - { kind: body, label: "", text: "By the end of this lesson, you will be able to:identify what makes learning at university different from learning at school;recognise the discourse community of your own subject;distinguish surface learning from deep learning in psychology." }
      - id: "L01-a-02"
        title: "Understanding learning at university"
        classes: "article--lesson-concept"
        components:
          - id: "L01-c-15"
            component: "text"
            classes: ""
            content:
              - { kind: body, label: "", text: "A discourse community is a group of people who share a way of making and testing knowledge: how they ask questions, what counts as good evidence, and how they reach agreement. Every subject at university is its own discourse community, with its own habits of argument.Learning here is less about collecting facts and more about joining that community. You learn how your subject thinks, not only what it has concluded. This matters because it changes what getting better means: progress is not storing more information, but taking a fuller part in how your subject builds knowledge." }
          - id: "L01-c-20"
            component: "text"
            classes: "slot__L01__concept-context"
            content:
              - { kind: body, label: "", text: "In psychology this shows up in the habits the discipline lives by: which questions count as empirical, how evidence from an experiment or a case study is weighed, and how ethical limits shape what you may even ask. Early on much of this is unspoken, picked up from how your lecturers reason about studies and what your reading treats as sound method rather than from anything set out plainly. Noticing those habits, and trying them in your own practical reports and seminar arguments, is how you start to take part in psychology rather than just revise it." }
          - id: "L01-c-25"
            component: "flipcard"
            classes: ""
            displayTitle: "The discourse community"
            content:
              - { kind: body, label: "", text: "Four steps in how you join your subject’s community. Turn each card, in order, to see how you move from the edge towards the centre." }
              - { kind: card-front, label: "Card 1 front", text: "Disciplinary community" }
              - { kind: card-back, label: "Card 1 back", text: "The people who make, teach and debate knowledge in your subject: researchers, tutors and students. Each subject is its own discourse community, and learning here means finding your place within it. Because knowledge is built between people rather than alone, taking part in that shared work is itself how you learn." }
              - { kind: card-front, label: "Card 2 front", text: "Discourse" }
              - { kind: card-back, label: "Card 2 back", text: "Knowledge is not static, it develops and accepted understanding evolves. Academic communities propose, test and make new knowledge. A discourse community does this by the questions it asks, what it accepts as good evidence, and how it argues towards agreement. To learn your subject is to learn not only its current understanding of the field but also its debate, discussion and discourse." }
              - { kind: card-front, label: "Card 3 front", text: "Knowledge" }
              - { kind: card-back, label: "Card 3 back", text: "Knowledge is not a fixed set of facts to memorise it is not static. Rather it is the interpretations the community itself debates and refines through the process of discourse. Currently accepted understanding is the knowledge that emerges from ongoing debate, and so it can be added to, it can and does change." }
              - { kind: card-front, label: "Card 4 front", text: "You" }
              - { kind: card-back, label: "Card 4 back", text: "At first you work with ideas your community has already agreed or is still debating. As you progress, you begin to apply, support and contest those ideas and practices yourself, moving from the edge of your subject towards its centre, and with practice, becoming a contributor to its discourse through your own interpretations and the knowledge you generate." }
          - id: "L01-c-30"
            component: "text"
            classes: "slot__L01__worked-example"
            displayTitle: "Worked example"
            content:
              - { kind: body, label: "", text: "Consider two psychology students preparing for the same seminar on the same journal article.Tom reads the article once and highlights the findings, ready to repeat them if asked. The study has been covered and the results are in his notes. This is surface learning: the information has been taken in, but it sits on its own, and he treats the paper as a set of facts to recall.Amara reads the same article and keeps asking why. Why did the authors choose this design? How does the sample limit what the findings can claim? Where would a different theory predict something else? By the seminar, Amara can connect the study to a wider debate about method and evidence, and take a reasoned position within it. This is deep learning: the ideas are linked into understanding she can use and defend.Both students have read the article. Only Amara has taken the step psychology's discourse community values, turning reported findings into a judgement about how good the evidence is." }
          - id: "L01-c-35"
            component: "checklist"
            classes: ""
            displayTitle: "How to do it"
            content:
              - { kind: body, label: "", text: "These habits move you from surface learning toward taking a fuller part in your subject. Use them as you study this week." }
              - { kind: item, label: "Item 1", text: "Have I asked why an idea matters, not only what it says?" }
              - { kind: item, label: "Item 2", text: "Have I looked for how this week's ideas connect to last week's?" }
              - { kind: item, label: "Item 3", text: "Have I put the main idea into my own words?" }
              - { kind: item, label: "Item 4", text: "Have I noticed where experts in my subject disagree, and tried to see why?" }
              - { kind: item, label: "Item 5", text: "Have I asked a question in a seminar, or written one down to raise?" }
              - { kind: item, label: "Item 6", text: "Have I read one thing beyond the set reading this week?" }
      - id: "L01-a-03"
        title: "Check your understanding"
        classes: "article--lesson-formative"
        components:
          - id: "L01-c-40"
            component: "mcq"
            classes: "knowledge-check-question"
            displayTitle: "Which of these best describes how learning at university differs from learning at school?"
            content:
              - { kind: option, label: "Option 1", text: "You mainly take in and give back what you are told." }
              - { kind: option, label: "Option 2 (correct)", text: "You take part in making and testing knowledge, not just receiving it." }
              - { kind: option, label: "Option 3", text: "You rely on your tutor's notes as the only source you need." }
              - { kind: option, label: "Option 4", text: "University is the same as school, only with harder material." }
              - { kind: feedback, label: "Feedback — correct", text: "That's right. University learning means taking part in how your subject makes and tests knowledge, rather than simply receiving it." }
              - { kind: feedback, label: "Feedback — incorrect (not final)", text: "Not quite. Think about what you are asked to do with knowledge at university, not just how much of it there is." }
              - { kind: feedback, label: "Feedback — incorrect (final)", text: "The key difference is that university learning means taking part in making and testing knowledge, not just receiving it. Taking in more, relying only on the tutor's notes, or treating it as simply harder each miss that shift." }
          - id: "L01-c-42"
            component: "mcq"
            classes: "slot__L01__check knowledge-check-question"
            displayTitle: "Which of these would best help you recognise the discourse community of psychology?"
            content:
              - { kind: option, label: "Option 1 (correct)", text: "Noticing who produces and debates the key studies, and how they argue from evidence and method." }
              - { kind: option, label: "Option 2", text: "Counting how many studies your textbook cites, and tallying which topics come up the most often." }
              - { kind: option, label: "Option 3", text: "Learning the timetable for your lab sessions, and working out which rooms across campus they run in." }
              - { kind: option, label: "Option 4", text: "Memorising the names of the researchers, and the years their best-known studies were published." }
              - { kind: feedback, label: "Feedback — correct", text: "That's right. You recognise psychology's discourse community by seeing who makes its knowledge and how they reason from evidence and method, not by counting studies or learning logistics." }
              - { kind: feedback, label: "Feedback — incorrect (not final)", text: "Not quite. Look for the option about how knowledge is made and argued from evidence, rather than counts or logistics." }
              - { kind: feedback, label: "Feedback — incorrect (final)", text: "You recognise psychology's discourse community by noticing who produces and debates its key studies, and how they argue from evidence and method. The other options are about quantity or logistics, not how the community makes knowledge." }
          - id: "L01-c-44"
            component: "mcq"
            classes: "knowledge-check-question"
            displayTitle: "You are preparing for a seminar in psychology. Which approach shows deep learning rather than surface learning?"
            content:
              - { kind: option, label: "Option 1 (correct)", text: "Asking why the ideas matter and linking them to what you already know." }
              - { kind: option, label: "Option 2", text: "Reading the chapter once and highlighting the key terms to recall later." }
              - { kind: option, label: "Option 3", text: "Making a clean copy of the lecture slides to revise from." }
              - { kind: option, label: "Option 4", text: "Memorising the definitions so you can repeat them accurately." }
              - { kind: feedback, label: "Feedback — correct", text: "That's right. Deep learning links ideas and asks why they matter; the other options stop at taking in or reproducing information." }
              - { kind: feedback, label: "Feedback — incorrect (not final)", text: "Not quite. Look for the option that connects ideas and asks why, rather than storing or reproducing them." }
              - { kind: feedback, label: "Feedback — incorrect (final)", text: "Deep learning means connecting ideas and asking why, not storing or reproducing them. In psychology, that is what taking part in the subject calls for." }
      - id: "L01-a-04"
        title: "Your thoughts"
        classes: "article--lesson-reflection"
        components:
          - id: "L01-c-45"
            component: "opentext"
            classes: ""
            displayTitle: "Your thoughts"
            content:
              - { kind: body, label: "", text: "Where do you sit in your subject's discourse community right now, and what would moving toward its centre look like for you?" }
      - id: "L01-a-05"
        title: "Lesson summary"
        classes: "article--lesson-close"
        components:
          - id: "L01-c-50"
            component: "text"
            classes: "slot__L01__summary"
            displayTitle: "Summary"
            content:
              - { kind: body, label: "", text: "Learning in psychology means joining a discourse community that makes, tests and argues about evidence together, ethically and by shared methods. You can now identify what makes that different from recalling findings, and begin to recognise the community your own modules draw on. The move from surface to deep learning, and the habits that support it, will matter in every lesson that follows and in your first practical report." }
          - id: "L01-c-55"
            component: "references"
            classes: ""
            displayTitle: "Lesson Sources"
            content:
              - { kind: reference, label: "Reference 1", text: "See pages 28 to 34 of Chapter 3, 'Defining learning at university', of Excelling at University by Dennis and Abbott (2026). — #" }
  - id: "L02-co-01"
    title: "How university learning is structured"
    articles:
      - id: "L02-a-01"
        title: "Lesson overview"
        classes: "article--lesson-open"
        components:
          - id: "L02-c-05"
            component: "text"
            classes: ""
            content:
              - { kind: body, label: "", text: "Every module you take is built around a short list of learning outcomes: statements of what you should be able to do by the end of it. They are easy to skim past, but they are the clearest signal your tutors give of what your learning is for. This lesson looks at where to find them and how to read one closely, because once you can, you can see exactly what your assessment will ask of you." }
          - id: "L02-c-07"
            component: "text"
            classes: ""
            content:
              - { kind: body, label: "", text: "Early in your degree, the way a university organises its teaching can feel unfamiliar: modules, learning outcomes, and timetables that leave much of the work in your hands. This is normal, and it is something you grow used to. This lesson shows you how that structure fits together, so you can see what is expected of you and plan your own time with more confidence." }
          - id: "L02-c-10"
            component: "text"
            classes: ""
            content:
              - { kind: body, label: "", text: "By the end of this lesson, you will be able to:identify the learning outcomes in one of your own modules;break a learning outcome into its active verb and what it asks you to demonstrate;describe how teaching in your subject is organised to build your learning." }
      - id: "L02-a-02"
        title: "Understanding learning outcomes"
        classes: "article--lesson-concept"
        components:
          - id: "L02-c-15"
            component: "text"
            classes: ""
            content:
              - { kind: body, label: "", text: "A learning outcome is a statement of what you should be able to do by the end of a module. It describes what you will be able to demonstrate, not just what will be covered in class. Every module is built around a set of these, usually printed in the module handbook or on its page in your virtual learning environment.They matter because your assessment is, in effect, asking you to evidence and demonstrate them. The outcome tells you what you are aiming at; the assessment is where you show you have reached it. Learning to read an outcome closely is one of the most useful habits you can build early, because it tells you what success actually looks like." }
          - id: "L02-c-20"
            component: "text"
            classes: "slot__L02__concept-context"
            content:
              - { kind: body, label: "", text: "Familiarise yourself with your psychology module's outcomes before you do anything else. Make notes on them. Each one uses a verb that signals the kind of performance expected, whether that is to describe a theory, to apply a method, to analyse data or to evaluate the strength of a study. That verb is a strong clue to how the assessment will be marked. Checking your work against the outcomes as you go is a quick way to see whether you are doing what the module actually asks, because psychology assessment is intentionally aligned to those outcomes." }
          - id: "L02-c-25"
            component: "accordion"
            classes: ""
            displayTitle: "Inside a learning outcome"
            content:
              - { kind: body, label: "", text: "A learning outcome is short, but it has parts. Open each one to see what it is doing." }
              - { kind: item-title, label: "Item 1", text: "The active verb" }
              - { kind: item-body, label: "", text: "Every outcome turns on a verb: analyse, evaluate, describe, apply. The verb tells you the kind of thinking you must show, and it is usually the first thing to find." }
              - { kind: item-title, label: "Item 2", text: "What it is about" }
              - { kind: item-body, label: "", text: "After the verb comes the subject of the outcome: the material, skill or situation the verb acts on. This tells you where to point your effort." }
              - { kind: item-title, label: "Item 3", text: "How you demonstrate it" }
              - { kind: item-body, label: "", text: "An outcome is only met when you show it. Ask what would count as evidence: a judgement reached, a method applied, a case explained. This is what your assessment will look for." }
              - { kind: item-title, label: "Item 4", text: "Why it matters" }
              - { kind: item-body, label: "", text: "Read this way, an outcome stops being a vague aim and becomes a target you can work toward. If you know the verb, the subject and what counts as evidence, you know what your work has to do." }
          - id: "L02-c-30"
            component: "text"
            classes: "slot__L02__worked-example"
            displayTitle: "Worked example"
            content:
              - { kind: body, label: "", text: "Two psychology students read the same learning outcome from their module handbook: Evaluate the usefulness of a self-report questionnaire for studying anxiety.Tom reads it quickly and starts describing the method: what a questionnaire is, how it is administered, where it is used. The writing is accurate, but it only describes. The outcome asked for something the writing never does.Amara reads the same outcome and breaks it down first. The verb is evaluate, which means weighing strengths against weaknesses to reach a judgement. What it is about is the method's usefulness for anxiety specifically, not simply how it works. Demonstrating it means coming to a reasoned view, backed by evidence, about when a questionnaire helps and when it misleads, for example through social desirability bias. Amara then writes to exactly that.Both students know the method. Only Amara answered the outcome, because only Amara worked out what it was asking." }
          - id: "L02-c-35"
            component: "checklist"
            classes: ""
            displayTitle: "How to do it"
            content:
              - { kind: body, label: "", text: "Use these on any learning outcome, before you start the work it leads to." }
              - { kind: item, label: "Item 1", text: "Have I found the active verb in the outcome?" }
              - { kind: item, label: "Item 2", text: "Do I know what that verb is actually asking me to do?" }
              - { kind: item, label: "Item 3", text: "Have I identified what the outcome is about, the subject the verb acts on?" }
              - { kind: item, label: "Item 4", text: "Have I worked out what would count as evidence that I have met it?" }
              - { kind: item, label: "Item 5", text: "Have I checked which assessment task this outcome is tied to?" }
      - id: "L02-a-03"
        title: "Check your understanding"
        classes: "article--lesson-formative"
        components:
          - id: "L02-c-40"
            component: "mcq"
            classes: "knowledge-check-question"
            displayTitle: "Which of these is a learning outcome, rather than another part of a module handbook?"
            content:
              - { kind: option, label: "Option 1 (correct)", text: "By the end of this module, you will be able to evaluate competing explanations of a problem." }
              - { kind: option, label: "Option 2", text: "This module runs for twelve weeks, with a two-hour lecture each Monday." }
              - { kind: option, label: "Option 3", text: "The module is worth twenty credits at Level 4." }
              - { kind: option, label: "Option 4", text: "Reading: three set chapters and one journal article each week." }
              - { kind: feedback, label: "Feedback — correct", text: "That's right. A learning outcome states what you will be able to do, built around a verb you can aim at. The others are schedule, credits and reading: useful, but not outcomes." }
              - { kind: feedback, label: "Feedback — incorrect (not final)", text: "Not quite. Look for the option that says what you will be able to DO by the end, not how the module is run." }
              - { kind: feedback, label: "Feedback — incorrect (final)", text: "A learning outcome states what you will be able to do by the end, built around a verb (here, 'evaluate'). The schedule, the credit value and the reading list are all parts of a handbook, but none of them is an outcome you demonstrate." }
          - id: "L02-c-42"
            component: "mcq"
            classes: "slot__L02__check knowledge-check-question"
            displayTitle: "You are breaking down a psychology learning outcome that begins with the verb 'analyse'. Which of these shows you have understood what that verb asks for?"
            content:
              - { kind: option, label: "Option 1 (correct)", text: "Separating the findings or data into their parts, examining how they relate, and saying what that shows." }
              - { kind: option, label: "Option 2", text: "Listing everything you can remember about the topic." }
              - { kind: option, label: "Option 3", text: "Giving your personal opinion of the study." }
              - { kind: option, label: "Option 4", text: "Describing the study clearly from start to finish." }
              - { kind: feedback, label: "Feedback — correct", text: "That's right. To analyse is to break something into its parts, examine how they relate, and say what that shows, which is more than listing, opinion or description." }
              - { kind: feedback, label: "Feedback — incorrect (not final)", text: "Not quite. Think about what 'analyse' asks for that listing, opinion or description do not." }
              - { kind: feedback, label: "Feedback — incorrect (final)", text: "To analyse is to separate the findings or data into their parts, examine how they relate, and say what that shows. Listing, giving an opinion and describing are each doing something the verb does not ask for." }
          - id: "L02-c-44"
            component: "mcq"
            classes: "knowledge-check-question"
            displayTitle: "Thinking about how a module in your subject is put together, which statement best describes how its teaching is organised to build your learning?"
            content:
              - { kind: option, label: "Option 1 (correct)", text: "Each session is designed to build towards the module's intended learning, not just to cover topics in turn." }
              - { kind: option, label: "Option 2", text: "The sessions are a list of separate topics with no particular order." }
              - { kind: option, label: "Option 3", text: "Lectures exist to deliver facts; the rest of the module is optional." }
              - { kind: option, label: "Option 4", text: "The timetable is arranged mainly around room availability." }
              - { kind: feedback, label: "Feedback — correct", text: "That's right. A module's sessions are designed to build towards its intended learning, which is why the parts connect rather than stand alone." }
              - { kind: feedback, label: "Feedback — incorrect (not final)", text: "Not quite. Look for the option about sessions building towards intended learning." }
              - { kind: feedback, label: "Feedback — incorrect (final)", text: "Teaching is organised around the module's intended learning: each part is designed to build towards what you should be able to do, so the sessions connect." }
      - id: "L02-a-04"
        title: "Your thoughts"
        classes: "article--lesson-reflection"
        components:
          - id: "L02-c-45"
            component: "opentext"
            classes: ""
            displayTitle: "Your thoughts"
            content:
              - { kind: body, label: "", text: "Find the learning outcomes for one of your own modules. Pick one that you are not sure how to show you have met. What do you think it is actually asking you to do?" }
      - id: "L02-a-05"
        title: "Lesson summary"
        classes: "article--lesson-close"
        components:
          - id: "L02-c-50"
            component: "text"
            classes: "slot__L02__summary"
            displayTitle: "Summary"
            content:
              - { kind: body, label: "", text: "Learning outcomes state what each psychology module expects you to be able to do, and they are where your assessment points, by design. You can now find the outcomes in your own module's documentation, and break one down into its active verb and what it asks you to demonstrate. Reading outcomes this way turns a vague aim into a clear target, which matters in a discipline where describing a study and evaluating it earn very different marks." }
          - id: "L02-c-55"
            component: "references"
            classes: ""
            displayTitle: "Lesson Sources"
            content:
              - { kind: reference, label: "Reference 1", text: "See pages 35 to 41 of Chapter 3, 'Defining learning at university', of Excelling at University by Dennis and Abbott (2026). — #" }
  - id: "L03-co-01"
    title: "Assessment at university"
    articles:
      - id: "L03-a-01"
        title: "Lesson overview"
        classes: "article--lesson-open"
        components:
          - id: "L03-c-05"
            component: "text"
            classes: ""
            content:
              - { kind: body, label: "", text: "Assessment is one of the words students worry about most, and often one of the least explained. At university it takes many forms, and it is almost always tied to what your learning outcomes asked you to do. This lesson looks at the range of ways you are assessed, and at one distinction that changes how you should treat a task: whether it is formative or summative." }
          - id: "L03-c-07"
            component: "text"
            classes: ""
            content:
              - { kind: body, label: "", text: "In your first year, assessment at university can look very different from what you met at school or college. It comes in more forms, and more of it is left in your hands. You are not meant to have mastered all of it yet. This lesson sets out the forms assessment takes and what each is for, so you can approach every task knowing why it has been set." }
          - id: "L03-c-10"
            component: "text"
            classes: ""
            content:
              - { kind: body, label: "", text: "By the end of this lesson, you will be able to:recognise the range of ways you are assessed at university;tell formative and summative assessment apart in your own modules;explain the purpose an assessment in psychology serves." }
      - id: "L03-a-02"
        title: "Understanding assessment at university"
        classes: "article--lesson-concept"
        components:
          - id: "L03-c-15"
            component: "text"
            classes: ""
            content:
              - { kind: body, label: "", text: "Assessment is how your work is judged against the standards of your subject. At university it can be broad in approach and takes many forms. In one way or another it is almost always present, because it is how your tutors see whether you have met a module's learning outcomes.Reading an assessment well, knowing what kind of task it is and what it is for, lets you give it the right kind of effort rather than guessing. That starts with seeing how varied assessment is, and with one distinction that changes how much a task counts." }
          - id: "L03-c-20"
            component: "text"
            classes: "slot__L03__concept-context"
            content:
              - { kind: body, label: "", text: "In practice, psychology spreads assessment across a module for a reason: some tasks are there to help you improve before the stakes rise, and some set your mark. A formative lab write-up your tutor comments on, a practice statistics quiz, a draft of your research report: these let you act on feedback while it still changes the outcome. Knowing which is which tells you where to take risks and where to consolidate, which is why the distinction is worth getting straight early." }
          - id: "L03-c-25"
            component: "flipcard"
            classes: ""
            displayTitle: "The forms assessment takes"
            content:
              - { kind: body, label: "", text: "Assessment comes in many forms. Turn each card to see what it is, what it asks of you, and the skills that help you do it well." }
              - { kind: card-front, label: "Card 1 front", text: "Essay" }
              - { kind: card-back, label: "Card 1 back", text: "A written argument in response to a question or title. You take a position and support it with evidence and reasoning, in your subject’s style. To do well you need to build a clear line of argument, select and weigh evidence, and structure your writing so a reader can follow the reasoning. The essay is common because it makes your thinking visible: a marker follows how you reach a conclusion, not only the conclusion itself. That is why a strong essay reads as one connected argument rather than a set of separate points." }
              - { kind: card-front, label: "Card 2 front", text: "Presentation" }
              - { kind: card-back, label: "Card 2 back", text: "You explain or argue something aloud, often with slides, to tutors or peers. It assesses how clearly you can communicate ideas, not only hold them. Succeeding draws on organising material for a listener, speaking clearly to time, and using visuals that support rather than crowd what you say. It is set because so much academic and professional work depends on being understood by others, not only on being right. The clearer you make a complex idea for your audience, the more you show you have understood it yourself." }
              - { kind: card-front, label: "Card 3 front", text: "Portfolio" }
              - { kind: card-back, label: "Card 3 back", text: "A collection of work gathered over time, sometimes with a reflective commentary. It shows how you have developed, not just a single finished piece. It rewards steady organisation, honest self-review, and the ability to show progress by selecting and explaining the right pieces. A portfolio is used when how you got there matters as much as the final result, so it rewards work built steadily rather than assembled at the last minute. Choosing what to include, and saying why, is itself part of what is assessed." }
              - { kind: card-front, label: "Card 4 front", text: "Reflective piece" }
              - { kind: card-back, label: "Card 4 back", text: "Writing in which you examine your own learning: what you did, what you noticed, and what you would change. The thinking is the point. Doing it well means looking honestly at your own practice, connecting experience to ideas from your subject, and drawing out what you will do differently. It is assessed because learning from experience is a skill in its own right, one you will use throughout your studies and your working life. What earns credit is honest, specific insight into your own practice, not a tidy account that avoids any difficulty." }
              - { kind: card-front, label: "Card 5 front", text: "Exam" }
              - { kind: card-back, label: "Card 5 back", text: "A timed assessment under set conditions. It tests what you can recall and do without your notes to hand. Success rests on secure recall, planning an answer quickly under time pressure, and applying what you know to the question actually asked. Exams test what you can do independently, with no support to hand, which is why they reward secure understanding over last-minute memorising. Practising under timed conditions beforehand is what turns what you know into what you can show on the day." }
              - { kind: card-front, label: "Card 6 front", text: "Practice-based assessment" }
              - { kind: card-back, label: "Card 6 back", text: "An assessment of what you can do in practice: a laboratory or studio task, a clinical or professional placement, a performance, or fieldwork. It judges applied skill and professional judgement in a real or realistic setting, not only what you can write about it. To do well you need to apply knowledge to the task in front of you, work safely and to your field’s standards, and show sound judgement as conditions change." }
          - id: "L03-c-30"
            component: "text"
            classes: "slot__L03__worked-example"
            displayTitle: "Worked example"
            content:
              - { kind: body, label: "", text: "Two psychology students hand in the same formative draft of a lab report, which the tutor comments on but does not mark.Tom sees that it does not count and barely reads the comments, saving his effort for the graded version. When the summative report comes back, the same problems the tutor had already flagged, a weak analysis section and an over-claimed conclusion, cost him marks.Amara treats the formative draft as the cheap chance it is. She works through the tutor's comments, strengthens the analysis and tempers the conclusion, and carries those changes into the summative report. Her graded report is stronger precisely because she used the formative task for what it was for.Both had the same draft and the same comments. Only Amara used the formative stage to improve the summative one, which is the whole point of splitting them." }
          - id: "L03-c-35"
            component: "checklist"
            classes: ""
            displayTitle: "How to do it"
            content:
              - { kind: body, label: "", text: "Use these when a new assessment appears on a module, before you start it." }
              - { kind: item, label: "Item 1", text: "Have I found out what form this assessment takes?" }
              - { kind: item, label: "Item 2", text: "Do I know whether it is formative or summative?" }
              - { kind: item, label: "Item 3", text: "If it is summative, do I know how much it is worth?" }
              - { kind: item, label: "Item 4", text: "If it is formative, have I planned to act on the feedback before the task it prepares me for?" }
              - { kind: item, label: "Item 5", text: "Have I checked which learning outcomes this assessment is testing?" }
      - id: "L03-a-03"
        title: "Check your understanding"
        classes: "article--lesson-formative"
        components:
          - id: "L03-c-40"
            component: "mcq"
            classes: "knowledge-check-question"
            displayTitle: "Which of these is a form of assessment, rather than another part of a module handbook?"
            content:
              - { kind: option, label: "Option 1 (correct)", text: "A presentation to the group, followed by a written report." }
              - { kind: option, label: "Option 2", text: "A reading list of three chapters each week." }
              - { kind: option, label: "Option 3", text: "A timetable of weekly two-hour lectures." }
              - { kind: option, label: "Option 4", text: "A note that the module is worth twenty credits." }
              - { kind: feedback, label: "Feedback — correct", text: "That's right. A presentation and a report are work you produce and are marked on, so they are forms of assessment. The reading list, the timetable and the credit value are all parts of a handbook, but none of them is an assessment." }
              - { kind: feedback, label: "Feedback — incorrect (not final)", text: "Not quite. Look for the option that describes something you produce and are judged on, not how the module is run." }
              - { kind: feedback, label: "Feedback — incorrect (final)", text: "The presentation and report are forms of assessment: work you produce and are marked on. The reading list, the timetable and the credit value are all parts of a module handbook, but none is an assessment in itself." }
          - id: "L03-c-42"
            component: "matching"
            classes: "slot__L03__check knowledge-check-question"
            displayTitle: "Sort each of these psychology assessments by whether it is formative or summative."
            content:
              - { kind: match-stem, label: "Row 1", text: "A practice statistics quiz during term that does not count toward your grade" }
              - { kind: match-option, label: "  option (correct)", text: "Formative" }
              - { kind: match-option, label: "  option", text: "Summative" }
              - { kind: match-stem, label: "Row 2", text: "A draft lab report your tutor comments on but does not mark" }
              - { kind: match-option, label: "  option (correct)", text: "Formative" }
              - { kind: match-option, label: "  option", text: "Summative" }
              - { kind: match-stem, label: "Row 3", text: "An assessed presentation at the end of the module" }
              - { kind: match-option, label: "  option", text: "Formative" }
              - { kind: match-option, label: "  option (correct)", text: "Summative" }
              - { kind: match-stem, label: "Row 4", text: "The final research report that sets your module grade" }
              - { kind: match-option, label: "  option", text: "Formative" }
              - { kind: match-option, label: "  option (correct)", text: "Summative" }
              - { kind: placeholder, label: "Placeholder", text: "Select formative or summative" }
              - { kind: feedback, label: "Feedback — correct", text: "That's right. Formative assessment is there to help you improve and does not count toward your grade; summative assessment is the task that sets it." }
              - { kind: feedback, label: "Feedback — incorrect (not final)", text: "Not quite. For each one, ask: does this count toward my final grade, or is it there to help me improve first?" }
              - { kind: feedback, label: "Feedback — incorrect (final)", text: "The practice quiz and the commented draft are formative: they help you improve and do not count. The presentation and the final report are summative: they set your grade. The test is simple, does it count toward the mark, or help you reach it?" }
              - { kind: feedback, label: "Feedback — partly correct (not final)", text: "Some of those are right, but not all. Check each one against the question: does it count, or help you improve first?" }
              - { kind: feedback, label: "Feedback — partly correct (final)", text: "Formative tasks (the practice quiz, the commented draft) help you improve and do not count; summative tasks (the presentation, the final report) set your grade." }
          - id: "L03-c-44"
            component: "mcq"
            classes: "knowledge-check-question"
            displayTitle: "A tutor in psychology sets a piece of coursework early in the module and returns detailed comments but no mark that counts. What purpose does this assessment mainly serve?"
            content:
              - { kind: option, label: "Option 1 (correct)", text: "To help you see how you are doing and improve before the work that counts." }
              - { kind: option, label: "Option 2", text: "To produce the final grade for the module." }
              - { kind: option, label: "Option 3", text: "To rank you against other students on the course." }
              - { kind: option, label: "Option 4", text: "To check that you attended the session." }
              - { kind: feedback, label: "Feedback — correct", text: "That's right. An assessment like this serves a formative purpose: it shows you where you are and helps you improve before the work that counts." }
              - { kind: feedback, label: "Feedback — incorrect (not final)", text: "Not quite. Look for the option about helping you improve before the work that counts." }
              - { kind: feedback, label: "Feedback — incorrect (final)", text: "This assessment serves a formative purpose: detailed comments with no counting mark are there to help you improve, not to grade or rank you." }
      - id: "L03-a-04"
        title: "Your thoughts"
        classes: "article--lesson-reflection"
        components:
          - id: "L03-c-45"
            component: "opentext"
            classes: ""
            displayTitle: "Your thoughts"
            content:
              - { kind: body, label: "", text: "Look at the assessments for one of your own modules this term. Which are formative and which are summative, and does knowing the difference change how you would approach them?" }
      - id: "L03-a-05"
        title: "Lesson summary"
        classes: "article--lesson-close"
        components:
          - id: "L03-c-50"
            component: "text"
            classes: "slot__L03__summary"
            displayTitle: "Summary"
            content:
              - { kind: body, label: "", text: "Formative assessment is there to help you improve and does not count toward your grade; summative assessment is the task that sets it. In your psychology modules the two work together: a practice quiz or a commented draft of a lab report is where you find out what is not yet working and put it right. By the time the final report or presentation counts, you are already performing at your best. This is what strategic learning means: recognising why each task has been set and what it is preparing you to do, because every formative and summative task is a step towards the same thing, being able to demonstrate your module’s learning outcomes. Once you can see that link, you can tell what any task is really asking of you and spend your effort where it pays." }
          - id: "L03-c-55"
            component: "references"
            classes: ""
            displayTitle: "Lesson Sources"
            content:
              - { kind: reference, label: "Reference 1", text: "See pages 41 to 42 of Chapter 3, 'Defining learning at university', of Excelling at University by Dennis and Abbott (2026). — #" }
              - { kind: reference, label: "Reference 2", text: "See pages 60 to 66 of Chapter 5, 'Understanding Assessment', of Excelling at University by Dennis and Abbott (2026). — #" }
  - id: "L04-co-01"
    title: "Feedback at university"
    articles:
      - id: "L04-a-01"
        title: "Lesson overview"
        classes: "article--lesson-open"
        components:
          - id: "L04-c-05"
            component: "text"
            classes: ""
            content:
              - { kind: body, label: "", text: "Feedback is one of the most useful things university gives you, and one of the easiest to waste. It is almost never just a mark: it is your tutors telling you what to do differently next time. This lesson looks at the forms feedback arrives in, and at the skill that makes it worth having - working out the action a comment is actually asking you to take." }
          - id: "L04-c-07"
            component: "text"
            classes: ""
            content:
              - { kind: body, label: "", text: "Early on, feedback at university can be easy to misread: brief, unfamiliar in its wording, and not always the praise you might hope for. That does not mean you are doing badly. This lesson helps you see what feedback is for and how to act on it, so that from the start you treat it as something that moves your work forward rather than something to set aside." }
          - id: "L04-c-10"
            component: "text"
            classes: ""
            content:
              - { kind: body, label: "", text: "By the end of this lesson, you will be able to:recognise feedback in the different forms it arrives in;identify what a piece of your own feedback is telling you;turn one piece of feedback in your subject into a specific next action." }
      - id: "L04-a-02"
        title: "Understanding feedback at university"
        classes: "article--lesson-concept"
        components:
          - id: "L04-c-15"
            component: "text"
            classes: ""
            content:
              - { kind: body, label: "", text: "Feedback is comments on and insights into your work, given to help you improve. It is much more than a grade: it arrives in many forms - a mark, written comments on your script, annotations in the margin, spoken feedback in a tutorial, a completed marking rubric, even comments from peers.Whatever form it takes, feedback is only useful once you work out what it is asking you to do next. That last step, reading the action behind the words, is the skill this lesson builds." }
          - id: "L04-c-20"
            component: "text"
            classes: "slot__L04__concept-context"
            content:
              - { kind: body, label: "", text: "In practice, feedback in psychology arrives in more forms than a single grade: a mark, comments on your analysis, a completed rubric against the module criteria, a few spoken words after a seminar, even a comparison with a marked exemplar. Whatever form it takes, the useful step is the same: work out what it is asking you to do differently in the next report or essay, and treat that as the point of it rather than the verdict. Psychology deliberately pairs feedback with feedforward, so the comment is meant to carry into what you do next." }
          - id: "L04-c-25"
            component: "matching"
            classes: ""
            displayTitle: "What is each comment asking for?"
            content:
              - { kind: body, label: "", text: "Feedback comments point to an action. Sort each comment by what it is asking you to do." }
              - { kind: match-stem, label: "Row 1", text: "Your claims need more backing." }
              - { kind: match-option, label: "  option (correct)", text: "Use citations to support your own argument" }
              - { kind: match-option, label: "  option", text: "Plan a logical flow to your argument" }
              - { kind: match-option, label: "  option", text: "Analyse and evaluate, do not just describe" }
              - { kind: match-stem, label: "Row 2", text: "Where is your evidence for this?" }
              - { kind: match-option, label: "  option (correct)", text: "Use citations to support your own argument" }
              - { kind: match-option, label: "  option", text: "Plan a logical flow to your argument" }
              - { kind: match-option, label: "  option", text: "Analyse and evaluate, do not just describe" }
              - { kind: match-stem, label: "Row 3", text: "This paragraph is hard to follow." }
              - { kind: match-option, label: "  option", text: "Use citations to support your own argument" }
              - { kind: match-option, label: "  option (correct)", text: "Plan a logical flow to your argument" }
              - { kind: match-option, label: "  option", text: "Analyse and evaluate, do not just describe" }
              - { kind: match-stem, label: "Row 4", text: "Your structure jumps around." }
              - { kind: match-option, label: "  option", text: "Use citations to support your own argument" }
              - { kind: match-option, label: "  option (correct)", text: "Plan a logical flow to your argument" }
              - { kind: match-option, label: "  option", text: "Analyse and evaluate, do not just describe" }
              - { kind: match-stem, label: "Row 5", text: "You describe the theory but do not evaluate it." }
              - { kind: match-option, label: "  option", text: "Use citations to support your own argument" }
              - { kind: match-option, label: "  option", text: "Plan a logical flow to your argument" }
              - { kind: match-option, label: "  option (correct)", text: "Analyse and evaluate, do not just describe" }
              - { kind: match-stem, label: "Row 6", text: "Push beyond summary to analysis." }
              - { kind: match-option, label: "  option", text: "Use citations to support your own argument" }
              - { kind: match-option, label: "  option", text: "Plan a logical flow to your argument" }
              - { kind: match-option, label: "  option (correct)", text: "Analyse and evaluate, do not just describe" }
              - { kind: placeholder, label: "Placeholder", text: "Select an action" }
              - { kind: feedback, label: "Feedback — correct", text: "That's the idea. A feedback comment is rarely just a verdict; it points to an action. 'More backing' and 'where is your evidence' both ask you to use citations to support your argument; comments about following and structure ask you to plan a clearer, more logical flow; and 'describe but do not evaluate' asks you to analyse and evaluate, not just describe. Reading the action behind the words is how you act on feedback." }
              - { kind: feedback, label: "Feedback — incorrect (not final)", text: "Not quite. For each comment, ask what it wants you to do next, not just what it says. Try again." }
              - { kind: feedback, label: "Feedback — partly correct (not final)", text: "Some of those are right. For the rest, ask what action the comment is pointing to, and try again." }
          - id: "L04-c-30"
            component: "text"
            classes: "slot__L04__worked-example"
            displayTitle: "Worked example"
            content:
              - { kind: body, label: "", text: "Two psychology students get the same comment on a draft: You describe the study well, but you do not evaluate its methodology.Tom reads the comment at face value, as a small complaint rather than an instruction, and misses the action it is asking for. Nothing changes in how he writes, so in the next assignment the same problem appears and the same comment comes back: the mistake has simply been repeated.Amara works out the action behind the comment: it is asking for a judgement about the method, not more description. She plans the next piece around weighing the design, the sample and the measures against the claims, and writes to that. The next assignment evaluates the methodology, and the comment does not return.Both read the same words. Only Amara read the action behind them and acted on it. That is what feedback is for in psychology: it tells you what to do differently, and acting on it is how your work improves from one report to the next." }
          - id: "L04-c-35"
            component: "checklist"
            classes: ""
            displayTitle: "How to do it"
            content:
              - { kind: body, label: "", text: "Use these on any piece of feedback you receive, before you start your next piece of work." }
              - { kind: item, label: "Item 1", text: "Have I read all of the feedback, not just the mark?" }
              - { kind: item, label: "Item 2", text: "For each comment, have I worked out the action it is asking me to take?" }
              - { kind: item, label: "Item 3", text: "Have I noticed any comment that appears more than once across my work?" }
              - { kind: item, label: "Item 4", text: "Have I written down one or two things to do differently next time?" }
              - { kind: item, label: "Item 5", text: "If a comment is unclear, have I planned to ask the tutor what they meant?" }
      - id: "L04-a-03"
        title: "Check your understanding"
        classes: "article--lesson-formative"
        components:
          - id: "L04-c-40"
            component: "mcq"
            classes: "knowledge-check-question"
            displayTitle: "Which of these is a form of feedback?"
            content:
              - { kind: option, label: "Option 1 (correct)", text: "Annotations your tutor has written in the margin of your essay." }
              - { kind: option, label: "Option 2", text: "The submission deadline for the essay." }
              - { kind: option, label: "Option 3", text: "The word count stated in the brief." }
              - { kind: option, label: "Option 4", text: "The reading list for the module." }
              - { kind: feedback, label: "Feedback — correct", text: "That's right. Margin annotations are one of the many forms feedback takes - comments on your work meant to help you improve. A deadline, a word count and a reading list are all parts of a brief, but none of them is feedback." }
              - { kind: feedback, label: "Feedback — incorrect (not final)", text: "Not quite. Look for the option that comments on your work to help you improve, not a rule of the task." }
              - { kind: feedback, label: "Feedback — incorrect (final)", text: "Feedback is comments on your work to help you improve - here, the margin annotations. The deadline, word count and reading list are all parts of the task brief, not feedback on what you produced." }
          - id: "L04-c-42"
            component: "mcq"
            classes: "slot__L04__check knowledge-check-question"
            displayTitle: "A tutor writes on your psychology report: 'This is mostly description of the study; I would like to see more of your own evaluation of the method.' What is this comment asking you to do?"
            content:
              - { kind: option, label: "Option 1 (correct)", text: "Weigh the study's method and evidence and show how convincing it is, rather than just reporting it." }
              - { kind: option, label: "Option 2", text: "Write more words overall." }
              - { kind: option, label: "Option 3", text: "Add more description to be thorough." }
              - { kind: option, label: "Option 4", text: "Change the study to an easier one." }
              - { kind: feedback, label: "Feedback — correct", text: "That's right. The comment asks for evaluation: weighing the method and evidence and judging how convincing it is, not more description or more words." }
              - { kind: feedback, label: "Feedback — incorrect (not final)", text: "Not quite. The comment contrasts description with evaluation, so look for the option that asks you to judge, not to report." }
              - { kind: feedback, label: "Feedback — incorrect (final)", text: "The comment asks you to evaluate: to weigh the study's method and evidence and show how convincing it is. More words, more description or an easier study would each miss the action it is pointing to." }
          - id: "L04-c-44"
            component: "mcq"
            classes: "knowledge-check-question"
            displayTitle: "You receive this comment on a piece of your subject work: ‘Your argument needs more support from evidence.’ Which response best turns it into a specific next action?"
            content:
              - { kind: option, label: "Option 1 (correct)", text: "For my next draft, add specific evidence to each main claim and show how it supports the claim." }
              - { kind: option, label: "Option 2", text: "Try harder to make my arguments better next time." }
              - { kind: option, label: "Option 3", text: "Feel disappointed that the work was not strong enough." }
              - { kind: option, label: "Option 4", text: "Wait to see whether the same comment comes up again." }
              - { kind: feedback, label: "Feedback — correct", text: "That's right. A specific next action names what you will do and to what, so you can carry it out and check it." }
              - { kind: feedback, label: "Feedback — incorrect (not final)", text: "Not quite. Look for the option that names a concrete, checkable step." }
              - { kind: feedback, label: "Feedback — incorrect (final)", text: "To act on feedback, turn the comment into a specific, checkable step, such as adding evidence to each claim and showing how it supports the claim, rather than a vague intention or a feeling." }
      - id: "L04-a-04"
        title: "Your thoughts"
        classes: "article--lesson-reflection"
        components:
          - id: "L04-c-45"
            component: "opentext"
            classes: ""
            displayTitle: "Your thoughts"
            content:
              - { kind: body, label: "", text: "Think of a piece of feedback you have had, at school or university. What was it actually asking you to do differently, and did you do it?" }
      - id: "L04-a-05"
        title: "Lesson summary"
        classes: "article--lesson-close"
        components:
          - id: "L04-c-50"
            component: "text"
            classes: "slot__L04__summary"
            displayTitle: "Summary"
            content:
              - { kind: body, label: "", text: "Feedback is the comments and insights that tell you how to improve, and in psychology it arrives in many forms, not just a mark. You can now recognise those forms, and, the skill that makes feedback worth having, work out the action a comment is really asking you to take. Reading the action behind the words, and feeding it forward into the next piece, is what turns feedback into better work." }
          - id: "L04-c-55"
            component: "references"
            classes: ""
            displayTitle: "Lesson Sources"
            content:
              - { kind: reference, label: "Reference 1", text: "See pages 76 to 80 of Chapter 6 of Excelling at University by Dennis and Abbott (2026). — #" }
  - id: "L05-co-01"
    title: "The learning, assessment and feedback cycle"
    articles:
      - id: "L05-a-01"
        title: "Lesson overview"
        classes: "article--lesson-open"
        components:
          - id: "L05-c-05"
            component: "text"
            classes: ""
            content:
              - { kind: body, label: "", text: "This lesson pulls the earlier ones together. You have looked at what learning at university asks of you, at what assessment is for, and at how to use feedback. Here you will see how those three connect: not as three separate things to deal with one at a time, but as one cycle, where each part feeds the next. Seeing the cycle is what lets you work with it rather than against it." }
          - id: "L05-c-07"
            component: "text"
            classes: ""
            content:
              - { kind: body, label: "", text: "As you settle into your first year, it helps to see how the parts of studying connect rather than meeting each one alone. Learning, assessment and feedback are not separate events; they are one cycle you move through again and again. This lesson draws them together, so you can see the pattern early and make it work for you across every module." }
          - id: "L05-c-10"
            component: "text"
            classes: ""
            content:
              - { kind: body, label: "", text: "By the end of this lesson, you will be able to:show how learning, assessment and feedback connect rather than stand alone;recognise the learning, assessment and feedback cycle in your own experience;plan one change to how you study your subject using the learning, assessment and feedback cycle." }
      - id: "L05-a-02"
        title: "Understanding the learning, assessment and feedback cycle"
        classes: "article--lesson-concept"
        components:
          - id: "L05-c-15"
            component: "text"
            classes: ""
            content:
              - { kind: body, label: "", text: "It is easy to treat learning, assessment and feedback as three separate things: you learn in lectures and reading, you are assessed in essays and exams, and feedback turns up afterwards. Dealt with one at a time, each can feel like a hurdle to clear and then forget.They work far better understood as one connected cycle, where each part feeds the next and the whole thing comes round again. Understanding that connection is what this lesson builds, because it is the difference between repeating the same cycle and improving with each turn of it. In a moment you will map out how the parts follow on from one another; first, it is worth seeing why thinking of them as a loop changes how you study." }
          - id: "L05-c-20"
            component: "text"
            classes: "slot__L05__concept-context"
            content:
              - { kind: body, label: "", text: "In practice, the cycle runs across a whole psychology module and beyond it. What you learn about theory and method shapes how you approach the lab report, the report produces feedback, and the feedback, once you use it, changes how you read and design the next study. Seeing a single practical as one turn of that cycle, rather than a one-off, is what lets each report build on the last instead of starting from scratch, which matters most when you reach your independent project." }
          - id: "L05-c-25"
            component: "sortable"
            classes: ""
            displayTitle: "Put the cycle in order"
            content:
              - { kind: body, label: "", text: "These four stages make up the learning, assessment and feedback cycle, but they only work in one order, each depending on the one before. Can you put them in sequence, from first to last?" }
              - { kind: option, label: "Option 1", text: "You learn something new, in lectures, reading and seminars." }
              - { kind: option, label: "Option 2", text: "You are assessed on it, through an essay, exam, presentation or another task." }
              - { kind: option, label: "Option 3", text: "You receive feedback on how you did." }
              - { kind: option, label: "Option 4", text: "You act on that feedback, which feeds your next round of learning." }
              - { kind: feedback, label: "Feedback — correct", text: "That's the cycle. Learning leads into assessment, assessment produces feedback, and feedback, once you act on it, feeds your next round of learning. They form one connected loop rather than four separate steps, which is why feedback is worth having and assessment is worth preparing for." }
              - { kind: feedback, label: "Feedback — incorrect (not final)", text: "Not in order yet. Think about what has to happen before each stage can: you cannot be assessed on what you have not learned, and feedback comes after the assessment, not before it. Try again." }
              - { kind: feedback, label: "Feedback — partly correct (not final)", text: "Some of those are in the right place, but not all. Each stage depends on the one before it, so work out what has to come first and try again." }
          - id: "L05-c-30"
            component: "text"
            classes: "slot__L05__worked-example"
            displayTitle: "Worked example"
            content:
              - { kind: body, label: "", text: "Two psychology students finish a module with the same comment on their final report: a solid summary of the literature, but you needed to take more of an analytical position of your own.Tom treats learning, assessment and feedback as three things that happen and then end. The module is over and the mark is in, so he reads the comment once and files it away. Nothing about it changes how he approaches the next module, and when the next report comes back the same comment is there again: the cycle has simply repeated.Amara treats the same comment as the start of the next round rather than the end of this one. It becomes something to act on: she plans the next report around taking a clear analytical position, and carries that into how she reads the new literature and designs the study from the outset. The next piece takes a position, and it is stronger, because the feedback fed back into the learning.Both got the same comment. Only Amara treated the three as one cycle, letting feedback feed the next round of learning. That is what connects them, and it is what turns each report into the start of the next improvement rather than a repeat of the last." }
          - id: "L05-c-35"
            component: "checklist"
            classes: ""
            displayTitle: "How to do it"
            content:
              - { kind: body, label: "", text: "Use these to keep the cycle turning in your own studies, rather than treating each module as a fresh start." }
              - { kind: item, label: "Item 1", text: "When a module begins, have I looked back at feedback from a related one?" }
              - { kind: item, label: "Item 2", text: "Am I clear what each assessment is actually asking me to show?" }
              - { kind: item, label: "Item 3", text: "When feedback arrives, have I read all of it, not just the mark?" }
              - { kind: item, label: "Item 4", text: "Have I turned that feedback into one or two things to carry into my next piece of work?" }
              - { kind: item, label: "Item 5", text: "Do I treat each piece of work as the start of the next round, rather than the end of this one?" }
      - id: "L05-a-03"
        title: "Check your understanding"
        classes: "article--lesson-formative"
        components:
          - id: "L05-c-40"
            component: "mcq"
            classes: "knowledge-check-question"
            displayTitle: "Why is it more useful to think of learning, assessment and feedback as one cycle rather than three separate stages?"
            content:
              - { kind: option, label: "Option 1 (correct)", text: "Because each one feeds the next: learning is what assessment draws on, assessment produces feedback, and feedback changes how you learn next time." }
              - { kind: option, label: "Option 2", text: "Because it means you only have to do one of the three, not all of them." }
              - { kind: option, label: "Option 3", text: "Because assessment matters and the other two do not." }
              - { kind: option, label: "Option 4", text: "Because it lets you skip feedback once your marks are good enough." }
              - { kind: feedback, label: "Feedback — correct", text: "That's right. Seen as a cycle, learning, assessment and feedback each feed the next, so effort in one place carries through to the others. That is why none of them is worth treating as a one-off." }
              - { kind: feedback, label: "Feedback — incorrect (not final)", text: "Not quite. Think about what the three have to do with each other, rather than whether you can do fewer of them." }
              - { kind: feedback, label: "Feedback — incorrect (final)", text: "The three form a cycle because each feeds the next: learning is what assessment draws on, assessment produces feedback, and feedback changes how you learn next time. It is about how they connect, not about leaving any out." }
          - id: "L05-c-42"
            component: "mcq"
            classes: "slot__L05__check knowledge-check-question"
            displayTitle: "A psychology student does well in one lab report, reads the feedback, and uses it to plan the next report, which comes back stronger. Which part of the learning, assessment and feedback cycle did using that feedback feed back into?"
            content:
              - { kind: option, label: "Option 1 (correct)", text: "Their next round of learning and preparation, which is why the following report improved." }
              - { kind: option, label: "Option 2", text: "Nothing; feedback comes at the end, so it cannot affect anything that follows." }
              - { kind: option, label: "Option 3", text: "Only the mark on the first report, which cannot now change." }
              - { kind: option, label: "Option 4", text: "The deadline for the next report." }
              - { kind: feedback, label: "Feedback — correct", text: "That's right. Using the feedback fed back into the next round of learning and preparation, which is why the following report improved: that is the cycle working." }
              - { kind: feedback, label: "Feedback — incorrect (not final)", text: "Not quite. Think about what the student changed before the next report, not the old mark or the deadline." }
              - { kind: feedback, label: "Feedback — incorrect (final)", text: "Using the feedback fed back into the student's next round of learning and preparation, which is why the next report improved. The old mark cannot change and the deadline is not part of the cycle; feedback is not the end, it feeds the next turn." }
          - id: "L05-c-44"
            component: "mcq"
            classes: "knowledge-check-question"
            displayTitle: "You want to use the learning, assessment and feedback cycle to study your subject better. Which plan best uses the whole cycle rather than one part of it?"
            content:
              - { kind: option, label: "Option 1 (correct)", text: "Set myself a practice task, check it against the criteria, then use the feedback to change how I prepare next time." }
              - { kind: option, label: "Option 2", text: "Re-read my notes more times before the deadline." }
              - { kind: option, label: "Option 3", text: "Wait for my marks and read the comments at the end of the module." }
              - { kind: option, label: "Option 4", text: "Focus on getting the highest mark and ignore the comments." }
              - { kind: feedback, label: "Feedback — correct", text: "That's right. Using the whole cycle means learning, checking your work against the criteria, then letting the feedback change how you study next." }
              - { kind: feedback, label: "Feedback — incorrect (not final)", text: "Not quite. Look for the option that moves through learning, assessment and feedback." }
              - { kind: feedback, label: "Feedback — incorrect (final)", text: "A plan that uses the cycle moves through all three parts: you learn, you check your work against the criteria, and you let the feedback change how you study next time." }
      - id: "L05-a-04"
        title: "Your thoughts"
        classes: "article--lesson-reflection"
        components:
          - id: "L05-c-45"
            component: "opentext"
            classes: ""
            displayTitle: "Your thoughts"
            content:
              - { kind: body, label: "", text: "Think back over one module you have taken. Can you see the cycle in it, where your learning led to assessment, assessment to feedback, and feedback (if you used it) back to learning? Where did the cycle break for you, and why?" }
      - id: "L05-a-05"
        title: "Lesson summary"
        classes: "article--lesson-close"
        components:
          - id: "L05-c-50"
            component: "text"
            classes: "slot__L05__summary"
            displayTitle: "Summary"
            content:
              - { kind: body, label: "", text: "Learning, assessment and feedback are easiest to deal with one at a time, but in psychology they work as one connected cycle, where each part feeds the next and the whole comes round again. You can now show how they connect rather than stand alone, and recognise that cycle in your own experience of a module. Seeing the loop is what lets you carry effort from one part into the others, so that each report becomes the start of the next improvement, right through to your independent project." }
          - id: "L05-c-55"
            component: "references"
            classes: ""
            displayTitle: "Lesson Sources"
            content:
              - { kind: reference, label: "Reference 1", text: "See pages 42 to 43 of Chapter 3 of Excelling at University by Dennis and Abbott (2026). — #" }
              - { kind: reference, label: "Reference 2", text: "See pages 73 to 74 of Chapter 5 of Excelling at University by Dennis and Abbott (2026). — #" }
              - { kind: reference, label: "Reference 3", text: "See pages 93 to 94 of Chapter 6 of Excelling at University by Dennis and Abbott (2026). — #" }
  - id: "understanding-learning-assessment-feedback-introductory-SUMM-co-01"
    title: "Test your learning"
    articles:
      - id: "understanding-learning-assessment-feedback-introductory-SUMM-a-01"
        title: ""
        classes: ""
        components:
          - id: "understanding-learning-assessment-feedback-introductory-SUMM-c-05"
            component: "text"
            classes: ""
            content:
              - { kind: body, label: "", text: "This is the test for the whole course. It covers everything you've studied in the lessons, with a set of questions to work through.To pass, you need to score at least 70%. You can retake the test if you don't pass first time." }
          - id: "understanding-learning-assessment-feedback-introductory-SUMM-c-20"
            component: "mcq"
            classes: ""
            content:
              - { kind: body, label: "", text: "A student says: \"I just need to memorise everything the lecturer says and repeat it back in the assessment.\" Why is this a weak approach to university learning?" }
              - { kind: option, label: "Option 1 (correct)", text: "Because university learning is about understanding and using ideas, not just reproducing them; most assessments reward what you can do with the material." }
              - { kind: option, label: "Option 2", text: "Because lecturers do not say anything worth memorising." }
              - { kind: option, label: "Option 3", text: "Because memorising anything is impossible at university." }
              - { kind: option, label: "Option 4", text: "Because assessment never draws on what is covered in lectures." }
              - { kind: feedback, label: "Feedback — correct", text: "That's right. University learning is about understanding and using ideas, which is what most assessment rewards." }
              - { kind: feedback, label: "Feedback — incorrect (not final)", text: "Not quite. Think about what university assessment actually asks you to do with what you learn. Try again." }
          - id: "understanding-learning-assessment-feedback-introductory-SUMM-c-25"
            component: "mcq"
            classes: ""
            content:
              - { kind: body, label: "", text: "You are starting a new module and want to know what you will actually be expected to be able to do by the end. Where should you look first?" }
              - { kind: option, label: "Option 1 (correct)", text: "The module's learning outcomes." }
              - { kind: option, label: "Option 2", text: "The total length of the reading list." }
              - { kind: option, label: "Option 3", text: "The number of lectures each week." }
              - { kind: option, label: "Option 4", text: "The name of the lecturer." }
              - { kind: feedback, label: "Feedback — correct", text: "That's right. A module's learning outcomes tell you what you should be able to do by the end." }
              - { kind: feedback, label: "Feedback — incorrect (not final)", text: "Not quite. Think about which part of a module states what you must be able to do. Try again." }
          - id: "understanding-learning-assessment-feedback-introductory-SUMM-c-30"
            component: "mcq"
            classes: ""
            content:
              - { kind: body, label: "", text: "An essay brief says: \"Critically evaluate the two main approaches.\" What is it mainly asking you to do?" }
              - { kind: option, label: "Option 1 (correct)", text: "Weigh the two approaches against each other and judge their strengths and weaknesses, rather than just describing them." }
              - { kind: option, label: "Option 2", text: "List everything you know about both approaches." }
              - { kind: option, label: "Option 3", text: "Choose whichever approach is easier to write about." }
              - { kind: option, label: "Option 4", text: "Summarise the lecture that introduced the topic." }
              - { kind: feedback, label: "Feedback — correct", text: "That's right. \"Critically evaluate\" asks you to weigh and judge the approaches, not just describe them." }
              - { kind: feedback, label: "Feedback — incorrect (not final)", text: "Not quite. Look at the instruction word and ask what kind of thinking it calls for. Try again." }
          - id: "understanding-learning-assessment-feedback-introductory-SUMM-c-35"
            component: "mcq"
            classes: ""
            content:
              - { kind: body, label: "", text: "Why is it worth reading a task's marking criteria before you start writing?" }
              - { kind: option, label: "Option 1 (correct)", text: "Because the criteria tell you what the marker is actually looking for, so you can aim your work at it." }
              - { kind: option, label: "Option 2", text: "Because the criteria replace the need to do any reading." }
              - { kind: option, label: "Option 3", text: "Because the criteria tell you the submission deadline." }
              - { kind: option, label: "Option 4", text: "Because the criteria are identical for every task, so reading them once is enough." }
              - { kind: feedback, label: "Feedback — correct", text: "That's right. The marking criteria tell you what the marker is looking for, so you can aim your work at it." }
              - { kind: feedback, label: "Feedback — incorrect (not final)", text: "Not quite. Think about what the criteria are for when your work is marked. Try again." }
          - id: "understanding-learning-assessment-feedback-introductory-SUMM-c-40"
            component: "mcq"
            classes: ""
            content:
              - { kind: body, label: "", text: "A tutor writes on your essay: \"You describe the theory but do not evaluate it.\" What action is this feedback asking you to take next time?" }
              - { kind: option, label: "Option 1 (correct)", text: "Go beyond describing the theory to weighing it up and judging how convincing it is." }
              - { kind: option, label: "Option 2", text: "Add more description so the account is thorough." }
              - { kind: option, label: "Option 3", text: "Remove the theory from the essay altogether." }
              - { kind: option, label: "Option 4", text: "Simply make the essay longer." }
              - { kind: feedback, label: "Feedback — correct", text: "That's right. The comment asks you to evaluate the theory, not just describe it." }
              - { kind: feedback, label: "Feedback — incorrect (not final)", text: "Not quite. Work out what the comment wants you to do differently, not just what it says. Try again." }
          - id: "understanding-learning-assessment-feedback-introductory-SUMM-c-45"
            component: "mcq"
            classes: ""
            content:
              - { kind: body, label: "", text: "You get the same comment, \"your structure jumps around\", on two essays in a row. What does this most likely mean you should do?" }
              - { kind: option, label: "Option 1 (correct)", text: "Treat it as a recurring issue, and research how to structure your argument so you can address it before you write the next one." }
              - { kind: option, label: "Option 2", text: "Ignore it, since a comment only matters once it appears three times." }
              - { kind: option, label: "Option 3", text: "Change your subject so the comment stops coming back." }
              - { kind: option, label: "Option 4", text: "Wait for the tutor to fix the structure for you." }
              - { kind: feedback, label: "Feedback — correct", text: "That's right. A comment that comes back is a recurring issue: research how to structure your argument, and address it in your next piece." }
              - { kind: feedback, label: "Feedback — incorrect (not final)", text: "Not quite. Think about what a repeated comment is telling you to change. Try again." }
          - id: "understanding-learning-assessment-feedback-introductory-SUMM-c-50"
            component: "sortable"
            classes: ""
            content:
              - { kind: body, label: "", text: "Put the four stages of the learning, assessment and feedback cycle in order, from first to last." }
              - { kind: option, label: "Option 1", text: "You learn new material." }
              - { kind: option, label: "Option 2", text: "You are assessed on it." }
              - { kind: option, label: "Option 3", text: "You receive feedback on how you did." }
              - { kind: option, label: "Option 4", text: "You act on the feedback, which feeds your next round of learning." }
              - { kind: feedback, label: "Feedback — correct", text: "That's the cycle. Learning leads into assessment, assessment produces feedback, and acting on feedback feeds your next round of learning." }
              - { kind: feedback, label: "Feedback — incorrect (not final)", text: "Not in order yet. You cannot be assessed on what you have not learned, and feedback comes after the assessment. Try again." }
              - { kind: feedback, label: "Feedback — partly correct (not final)", text: "Some are in the right place, but not all. Each stage depends on the one before it, so work out what has to come first. Try again." }
          - id: "understanding-learning-assessment-feedback-introductory-SUMM-c-55"
            component: "mcq"
            classes: ""
            content:
              - { kind: body, label: "", text: "Why is feedback worth paying attention to even after you already have the mark for a piece of work?" }
              - { kind: option, label: "Option 1 (correct)", text: "Because acting on it feeds your next round of learning, so it improves the work that comes after, not the mark you already have." }
              - { kind: option, label: "Option 2", text: "Because acting on it can change the mark you have already been given." }
              - { kind: option, label: "Option 3", text: "Because feedback only ever applies to the single piece of work it is written on." }
              - { kind: option, label: "Option 4", text: "Because ignoring feedback breaks the university's rules." }
              - { kind: feedback, label: "Feedback — correct", text: "That's right. Acting on feedback feeds your next round of learning, which is the point of the cycle." }
              - { kind: feedback, label: "Feedback — incorrect (not final)", text: "Not quite. Think about what feedback can change, given the mark is already set. Try again." }
          - id: "understanding-learning-assessment-feedback-introductory-SUMM-c-15"
            component: "assessmentResults"
            classes: ""
  - id: "understanding-learning-assessment-feedback-introductory-C-POST-co-01"
    title: "Post-course confidence survey"
    articles:
      - id: "understanding-learning-assessment-feedback-introductory-C-POST-a-01"
        title: ""
        classes: ""
        components:
          - id: "understanding-learning-assessment-feedback-introductory-C-POST-c-05"
            component: "confidence"
            classes: ""
  - id: "understanding-learning-assessment-feedback-introductory-W-CLOSE-co-01"
    title: "Course conclusion"
    articles:
      - id: "understanding-learning-assessment-feedback-introductory-W-CLOSE-a-01"
        title: ""
        classes: ""
        components:
          - id: "understanding-learning-assessment-feedback-introductory-W-CLOSE-c-05"
            component: "text"
            classes: ""
            displayTitle: "Summary"
            content:
              - { kind: body, label: "", text: "You have reached the end of the course. You now have more than a set of facts about university study: you have a way of working strategically. You can take a deliberate, strategic approach to developing your own learning and academic practice throughout your studies, rather than meeting each module, assessment and piece of feedback as it comes. In particular, you can:apply an understanding of how university learning works to your own study: you have seen what learning at university asks of you, and how modules set out what you are meant to learn;interpret your own assessment tasks and marking criteria: you can read what a task is really asking of you;act on feedback to improve your own work: you can work out the action behind a comment and carry it into your next piece;align your own academic practice with the learning, assessment and feedback cycle: you have seen how the three connect, and how to run them as one cycle rather than three separate steps.You have just rated your confidence again on the previous page. Comparing it with the check you took at the start is your own measure of how far you have come." }
          - id: "understanding-learning-assessment-feedback-introductory-W-CLOSE-c-10"
            component: "text"
            classes: "slot__wrapper-close__practice-connection"
            displayTitle: "Academic and professional practice"
            content:
              - { kind: body, label: "", text: "You now have a way of seeing your own psychology studies that will serve you in every module from here on. Each assessment you meet is a chance to show what you have learned, each piece of feedback a pointer to what to do next, and the two together are how your work improves across the degree, right up to your independent project. The habit to keep is simple: read what each task is asking, use the feedback you get, and let it shape the next report or essay.That same habit carries into professional psychology. Wherever you are given work, judged against a standard, and told how to improve, as a researcher, a trainee or a practitioner, the people who get better are the ones who treat each round as feeding the next. The cycle you have just learned to see is one you will use long after you graduate." }
          - id: "understanding-learning-assessment-feedback-introductory-W-CLOSE-c-15"
            component: "text"
            classes: ""
            displayTitle: "Where this goes next"
            content:
              - { kind: body, label: "", text: "This is an introductory course: it gives you the shape of how learning, assessment and feedback work together. You can take it further from here.Go deeper on this topic. The Intermediate and Advanced tiers of Understanding Learning, Assessment and Feedback take the same cycle further, into harder cases and more of your own judgement.Put it into practice. Other pathways in this programme apply what you have just learned. Academic Writing is where most of your assessed work is produced and most feedback lands. Criticality develops the kind of thinking that higher-level assessment rewards. Reflective Practice turns on a similar iterative cycle, where you act, reflect on how it went, and carry what you learn into your next attempt, so the habit you have built here transfers straight across." }
          - id: "understanding-learning-assessment-feedback-introductory-W-CLOSE-c-20"
            component: "references"
            classes: ""
            displayTitle: "Course Sources"
            content:
              - { kind: reference, label: "Reference 1", text: "See pages 28 to 43 of Chapter 3 of Excelling at University by Dennis and Abbott (2026). — #" }
              - { kind: reference, label: "Reference 2", text: "See pages 60 to 74 of Chapter 5 of Excelling at University by Dennis and Abbott (2026). — #" }
              - { kind: reference, label: "Reference 3", text: "See pages 76 to 94 of Chapter 6 of Excelling at University by Dennis and Abbott (2026). — #" }
