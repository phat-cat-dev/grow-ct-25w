slug: landscape-architecture-2024
name: "Landscape Architecture (2024)"
run: "std:doc:qaa-landscape-architecture-2024-benchmarks"
subject: "Landscape architecture studies how landscapes are researched, designed, planned and managed across scales, so that places support communities, biodiversity and resilience to a changing climate."
subjectIds: ["qaa/landscape-architecture-2024/1.26.b2", "qaa/landscape-architecture-2024/1.26.b3", "qaa/landscape-architecture-2024/1.26.b5", "qaa/landscape-architecture-2024/3.3"]
rows:
  d3:
    practice: "specifies hard materials and planting for landscape proposals and presents them through models, hand drawing and digital tools such as GIS and CAD to expert and lay audiences"
    knowledge: "the structural and environmental performance of materials and their broad cost, plus the ecosystem around a project that proposals must conserve and balance"
    identity: "an emerging landscape professional who forms an informed stance, keeps to professional codes of conduct and respects the moral, social and ecological questions the work raises"
    ids: ["qaa/landscape-architecture-2024/4.4.b17", "qaa/landscape-architecture-2024/4.4.b29", "qaa/landscape-architecture-2024/4.4.b43", "qaa/landscape-architecture-2024/4.4.b18", "qaa/landscape-architecture-2024/4.4.b10", "qaa/landscape-architecture-2024/4.4.b3", "qaa/landscape-architecture-2024/4.4.b37", "qaa/landscape-architecture-2024/4.4.b38"]
  e2:
    practice: "applies landscape survey, design and planning skills fluently with original approaches, exceptional initiative and strong problem-solving, taking personal responsibility for projects and leading others"
    knowledge: "strong and consistently shown knowledge of landscape theory, materials, ecology and practice that meets every course outcome and feeds insightful, creative proposals"
    identity: "a landscape professional with clear ethical and professional awareness who reflects critically and independently on own work and takes the lead with growing autonomy"
    ids: ["qaa/landscape-architecture-2024/4.5.b1", "qaa/landscape-architecture-2024/4.5.b2", "qaa/landscape-architecture-2024/4.5.b3", "qaa/landscape-architecture-2024/4.6.b1", "qaa/landscape-architecture-2024/4.6.b2", "qaa/landscape-architecture-2024/4.6.b3"]
  e3:
    practice: "draws concepts and ideas together and connects them to landscape practice, using alternative methods to find information and to collect and analyse data with rigour"
    knowledge: "a sound grasp of the roles, duties and working methods of landscape professionals and the values and ethics that govern practice, set beside alternative research methods"
    identity: "a questioning and independent landscape architect on the accredited route to chartership who reflects critically, acts on own judgement and brings originality and insight to practice"
    ids: ["qaa/landscape-architecture-2024/4.7.b1", "qaa/landscape-architecture-2024/4.7.b2", "qaa/landscape-architecture-2024/4.7.b3", "qaa/landscape-architecture-2024/4.7.b4", "qaa/landscape-architecture-2024/4.7.b5", "qaa/landscape-architecture-2024/4.7.b6", "qaa/landscape-architecture-2024/4.7.b8", "qaa/landscape-architecture-2024/2.15"]
note: "The typical and excellent standards restate the threshold in general terms (more originality, autonomy, leadership), so e2 carries the threshold's landscape specifics forward at that higher pitch."
