slug: architectural-technology-2022
name: "Architectural Technology (2022)"
run: "std:doc:qaa-architectural-technology-2022-benchmarks"
subject: "Architectural technology studies how buildings are designed, built, managed and maintained, so that new and existing buildings are produced and perform safely, inclusively and sustainably."
subjectIds: ["qaa/architectural-technology-2022/4.4", "qaa/architectural-technology-2022/3.5"]
rows:
  d3:
    practice: "designs and details buildings from first principles, producing accurate design information that meets regulation and integrates structure, fabric and services while managing hazards over the building life cycle"
    knowledge: "building technologies and materials and how they fit together, how building physics and pathology explain performance and the procurement routes and contracts that frame practice"
    identity: "an architectural technologist in training who conducts themselves ethically and professionally, guards health and safety and keeps current through reflection and development planning"
    ids: ["qaa/architectural-technology-2022/4.6.b5", "qaa/architectural-technology-2022/3.6.b6", "qaa/architectural-technology-2022/4.6.b7", "qaa/architectural-technology-2022/4.6.b3", "qaa/architectural-technology-2022/4.6.b4", "qaa/architectural-technology-2022/4.6.b2", "qaa/architectural-technology-2022/3.6.b14", "qaa/architectural-technology-2022/4.6.b10"]
  e2:
    practice: "leads innovative low-carbon design and retrofit through digital modelling and information management, diagnosing existing structures and steering collaborative decisions from concept to completion"
    knowledge: "how climate change and social, economic and political forces bear on building production and performance at every scale and how emerging technologies alter long-term upkeep"
    identity: "a responsible design professional who champions inclusive design and fair treatment, guards against unconscious bias and treats social justice as part of building well"
    ids: ["qaa/architectural-technology-2022/3.6.b2", "qaa/architectural-technology-2022/3.6.b4", "qaa/architectural-technology-2022/3.6.b9", "qaa/architectural-technology-2022/3.6.b5", "qaa/architectural-technology-2022/3.6.b8", "qaa/architectural-technology-2022/3.6.b12", "qaa/architectural-technology-2022/3.6.b13"]
  e3:
    practice: "frames a research problem, chooses and critically applies research methods and completes a major design or research project presented to academic and professional audiences"
    knowledge: "a critical, systematic grasp of sustainable design principles, emerging trends such as digital construction and how fabric, envelope and materials relate to climate, health and resources"
    identity: "an independent and original thinker in the built environment who weighs the professional and ethical stakes of design choices for sustainability and inclusion"
    ids: ["qaa/architectural-technology-2022/3.7.b8", "qaa/architectural-technology-2022/3.17", "qaa/architectural-technology-2022/4.7.b5", "qaa/architectural-technology-2022/3.7.b6", "qaa/architectural-technology-2022/4.7.b2", "qaa/architectural-technology-2022/3.7.b5", "qaa/architectural-technology-2022/3.15", "qaa/architectural-technology-2022/4.7.b4"]
note: "No level 5 statements. No typical or excellent standard (the statement points to Annex D), so e2 draws on the more demanding level 6 course aims in 3.6."
