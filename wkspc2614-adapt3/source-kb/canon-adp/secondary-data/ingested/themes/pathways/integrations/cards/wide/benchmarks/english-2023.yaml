slug: english-2023
name: "English (2023)"
run: "std:doc:qaa-english-2023-benchmarks"
subject: "English studies literature and language in English, reading texts closely in their historical and cultural settings and analysing how language persuades, moves and makes meaning."
subjectIds: [qaa/english-2023/1.6.b1, qaa/english-2023/1.6.b3, qaa/english-2023/2.2.b5]
rows:
  d3:
    practice: "reads literary and other texts closely, analyses spoken and written discourse with linguistic and stylistic terms and builds interpretations through revised drafts"
    knowledge: "periods and genres of prose, poetry and drama, the history and global varieties of English and how culture and technology shape the making and reception of texts"
    identity: "a reader and writer who accepts that texts carry many meanings without reducing them to opinion and who acts with integrity in using others' work"
    ids: [qaa/english-2023/4.2.b47, qaa/english-2023/1.6.b3, qaa/english-2023/4.2.b25, qaa/english-2023/2.2.b2, qaa/english-2023/2.2.b5, qaa/english-2023/2.2.b6, qaa/english-2023/4.2.b50, qaa/english-2023/4.2.b78]
  e2:
    practice: "weaves sharp close readings of form and figure into incisive arguments, frames research questions and offers original interpretations of literary, linguistic or creative material"
    knowledge: "how rich and ambiguous language is, how readers and texts shape each other and where literary forms and cultural artefacts sit in wider intellectual history"
    identity: "an independent critic who places own views precisely among many perspectives and ideologies, handles sensitive material deftly and uses feedback to question own assumptions"
    ids: [qaa/english-2023/4.2.b49, qaa/english-2023/4.2.b45, qaa/english-2023/4.2.b27, qaa/english-2023/4.2.b52, qaa/english-2023/4.2.b41, qaa/english-2023/4.2.b65, qaa/english-2023/4.2.b14, qaa/english-2023/4.2.b75]
note: "Threshold, typical and excellent standards sit together under the Introduction heading and are told apart by wording. No level 7 statements."
