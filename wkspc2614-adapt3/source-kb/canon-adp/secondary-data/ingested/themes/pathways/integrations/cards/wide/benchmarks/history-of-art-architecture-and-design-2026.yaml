slug: history-of-art-architecture-and-design-2026
name: "History of Art, Architecture and Design (2026)"
run: "std:doc:qaa-history-of-art-architecture-and-design-2026-benchmarks"
subject: "History of art, architecture and design studies visual and material culture across regions and periods, explaining how artefacts are made, displayed and shape cultures and identities."
subjectIds: ["qaa/history-of-art-architecture-and-design-2026/2.3", "qaa/history-of-art-architecture-and-design-2026/2.6"]
rows:
  d3:
    practice: "looks closely at paintings, buildings and designed objects, describes their visual and material qualities and places them in historical, cultural and environmental context"
    knowledge: "the art and artefacts of two or more regions or periods, how and from what they were made and how museums, galleries and heritage bodies work"
    identity: "an art history student who meets unfamiliar artefacts and values with an open mind, names the ethics beneath culture and takes responsibility for honest work"
    ids: ["qaa/history-of-art-architecture-and-design-2026/4.4.b1", "qaa/history-of-art-architecture-and-design-2026/4.4.b2", "qaa/history-of-art-architecture-and-design-2026/4.4.b4", "qaa/history-of-art-architecture-and-design-2026/4.4.b6", "qaa/history-of-art-architecture-and-design-2026/4.4.b7", "qaa/history-of-art-architecture-and-design-2026/4.4.b14", "qaa/history-of-art-architecture-and-design-2026/4.4.b15", "qaa/history-of-art-architecture-and-design-2026/4.5.b7"]
  e2:
    practice: "turns close looking into interpretation, directs own research across images, texts and technical data and weighs rival readings to build a sustained argument about artefacts"
    knowledge: "the discipline's current debates and interpretive methods and how theory explains the part art, design and architecture play in forming identities"
    identity: "an interpreter who reads visual cultures inclusively on their own terms and examines the values and ethics underlying culture and own life"
    ids: ["qaa/history-of-art-architecture-and-design-2026/4.4.b6.typical", "qaa/history-of-art-architecture-and-design-2026/4.4.b8.typical", "qaa/history-of-art-architecture-and-design-2026/4.4.b11.typical", "qaa/history-of-art-architecture-and-design-2026/4.4.b13.typical", "qaa/history-of-art-architecture-and-design-2026/4.4.b3.typical", "qaa/history-of-art-architecture-and-design-2026/4.4.b5.typical", "qaa/history-of-art-architecture-and-design-2026/4.4.b14.typical", "qaa/history-of-art-architecture-and-design-2026/4.5.b9"]
  e3:
    practice: "directs an original research project, sets unfamiliar artefacts against established readings and builds a systematic critique of how museums, galleries and heritage display art"
    knowledge: "how the discipline's methods have unsettled received readings of art and design and where the field sits within wider social and political life"
    identity: "a self-aware scholar of visual culture who judges own academic strengths and weaknesses and chooses between intellectual approaches with care"
