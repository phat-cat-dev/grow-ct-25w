slug: librarianship-information-knowledge-records-and-archives-management-2025
name: "Librarianship, Information, Knowledge, Records and Archives Management (2025)"
run: "std:doc:qaa-librarianship-information-knowledge-records-and-archives-management-2025-benchmarks"
subject: "Librarianship and information, records and archives management studies how information is organised, kept, made findable and used, so that people gain fair and lasting access to it."
subjectIds: ["qaa/librarianship-information-knowledge-records-and-archives-management-2025/2.3.s1", "qaa/librarianship-information-knowledge-records-and-archives-management-2025/2.3.s2"]
rows:
  d3:
    practice: "catalogues and classifies resources with controlled vocabularies, arranges archives by provenance and original order and drafts retention schedules and long-term preservation plans for print and digital holdings"
    knowledge: "a systematic grasp of the core concepts and tools of information work, from metadata standards to storage conditions for fragile or sensitive items"
    identity: "an information professional in training who defends intellectual freedom, user privacy and open access and examines the values behind own conduct"
    ids: ["qaa/librarianship-information-knowledge-records-and-archives-management-2025/4.5.s1", "qaa/librarianship-information-knowledge-records-and-archives-management-2025/4.5.s2", "qaa/librarianship-information-knowledge-records-and-archives-management-2025/4.7.b7", "qaa/librarianship-information-knowledge-records-and-archives-management-2025/4.7.b8", "qaa/librarianship-information-knowledge-records-and-archives-management-2025/4.7.b9", "qaa/librarianship-information-knowledge-records-and-archives-management-2025/4.7.b10", "qaa/librarianship-information-knowledge-records-and-archives-management-2025/4.7.b19", "qaa/librarianship-information-knowledge-records-and-archives-management-2025/4.8.b14"]
  e2:
    practice: "exposes and reduces bias in collections and catalogues, builds information literacy programmes with teachers and community partners and uses user data to improve services"
    knowledge: "how providing information affects human rights and equality, where structural bias sits in knowledge systems and the ethical consequences of new information technologies"
    identity: "an independent-minded advocate for fair access who helps shape organisational information ethics and campaigns for laws protecting users"
    ids: ["qaa/librarianship-information-knowledge-records-and-archives-management-2025/4.7.b1", "qaa/librarianship-information-knowledge-records-and-archives-management-2025/4.7.b14", "qaa/librarianship-information-knowledge-records-and-archives-management-2025/4.7.b17", "qaa/librarianship-information-knowledge-records-and-archives-management-2025/4.7.b5", "qaa/librarianship-information-knowledge-records-and-archives-management-2025/4.7.b13", "qaa/librarianship-information-knowledge-records-and-archives-management-2025/4.7.b20", "qaa/librarianship-information-knowledge-records-and-archives-management-2025/4.7.b21", "qaa/librarianship-information-knowledge-records-and-archives-management-2025/4.8.b11"]
  e3:
    practice: "leads information services through loosely defined problems, plans disaster recovery for collections and carries out an independent project that tests and justifies changes to current practice"
    knowledge: "the distinct information needs of disciplines from STEM to law, debates on decolonising information practice and the research methods that produce evidence for the profession"
    identity: "a strategic leader of library and archive services who advocates for ethical practice and judges each initiative by its effect on communities and users"
    ids: ["qaa/librarianship-information-knowledge-records-and-archives-management-2025/4.9.b2", "qaa/librarianship-information-knowledge-records-and-archives-management-2025/4.11.b8", "qaa/librarianship-information-knowledge-records-and-archives-management-2025/4.12.b4", "qaa/librarianship-information-knowledge-records-and-archives-management-2025/4.12.b12", "qaa/librarianship-information-knowledge-records-and-archives-management-2025/4.11.b1", "qaa/librarianship-information-knowledge-records-and-archives-management-2025/4.11.b5", "qaa/librarianship-information-knowledge-records-and-archives-management-2025/4.9.b4", "qaa/librarianship-information-knowledge-records-and-archives-management-2025/4.11.b24"]
note: "Level 6 has threshold standards only: e2 is drawn from the more demanding level 6 statements on bias, human rights, advocacy and information ethics."
