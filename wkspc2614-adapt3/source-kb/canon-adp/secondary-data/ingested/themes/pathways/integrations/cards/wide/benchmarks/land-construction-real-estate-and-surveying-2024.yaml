slug: land-construction-real-estate-and-surveying-2024
name: "Land, Construction, Real Estate and Surveying (2024)"
run: "std:doc:qaa-land-construction-real-estate-and-surveying-2024-benchmarks"
subject: "Land, construction, real estate and surveying studies how land and buildings are measured, valued, developed, built, regulated and managed across their whole life, preparing graduates for the built environment professions."
subjectIds: ["qaa/land-construction-real-estate-and-surveying-2024/1.21", "qaa/land-construction-real-estate-and-surveying-2024/1.26", "qaa/land-construction-real-estate-and-surveying-2024/3.9"]
rows:
  d3:
    practice: "surveys and measures land and buildings, appraises materials and their decay, quantifies costs and applies planning, procurement and project management techniques to a scheme"
    knowledge: "construction technology, building regulations and the Building Safety Regulator, valuation and market evidence, geospatial science and the legal frameworks of tenure and agency"
    identity: "a surveyor or construction professional in training who applies professional codes and a personal moral compass, protecting clients, communities and the environment"
    ids: ["qaa/land-construction-real-estate-and-surveying-2024/4.3.b57", "qaa/land-construction-real-estate-and-surveying-2024/4.3.b58", "qaa/land-construction-real-estate-and-surveying-2024/4.3.b73", "qaa/land-construction-real-estate-and-surveying-2024/4.3.b85", "qaa/land-construction-real-estate-and-surveying-2024/4.3.b92", "qaa/land-construction-real-estate-and-surveying-2024/4.3.b133", "qaa/land-construction-real-estate-and-surveying-2024/4.3.b77", "qaa/land-construction-real-estate-and-surveying-2024/4.3.b52"]
  e2:
    practice: "makes well-judged development and investment decisions on incomplete data, running sensitivity analyses on site value and evaluating how buildings perform after occupation"
    knowledge: "how climate change, demographic shift and PropTech reshape property markets and how planning obligations, whole-life carbon and the golden thread of safety information bear on value"
    identity: "a built environment professional who weighs the ethics of cutting fire safety costs through value engineering, owes duties to clients and the public and promotes inclusion across the property cycle"
    ids: ["qaa/land-construction-real-estate-and-surveying-2024/4.3.b16", "qaa/land-construction-real-estate-and-surveying-2024/4.3.b25", "qaa/land-construction-real-estate-and-surveying-2024/4.3.b149", "qaa/land-construction-real-estate-and-surveying-2024/4.3.b154", "qaa/land-construction-real-estate-and-surveying-2024/4.3.b118", "qaa/land-construction-real-estate-and-surveying-2024/4.3.b150", "qaa/land-construction-real-estate-and-surveying-2024/4.3.b100", "qaa/land-construction-real-estate-and-surveying-2024/4.3.b119"]
  e3:
    practice: "critically evaluates current built environment research and advanced scholarship and produces new insight into land, construction or property practice"
    knowledge: "how research moves knowledge of the built environment forward and where the limits of current theory on land, buildings and markets lie"
    identity: "a self-directed surveying or construction scholar-practitioner who pushes the field's knowledge forward through own professional and academic development (ing's reading)"
