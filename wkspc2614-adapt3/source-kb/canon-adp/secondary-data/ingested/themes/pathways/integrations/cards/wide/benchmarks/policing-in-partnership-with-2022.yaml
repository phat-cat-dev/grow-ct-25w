slug: policing-in-partnership-with-2022
name: "Policing (2022)"
run: "std:doc:qaa-policing-in-partnership-with-2022-benchmarks"
subject: "Policing studies the law, practice and evidence base of police work within criminal justice, and prepares professionals to serve society impartially, openly and with integrity."
subjectIds: ["qaa/policing-in-partnership-with-2022/3.2.b1", "qaa/policing-in-partnership-with-2022/3.2.b3", "qaa/policing-in-partnership-with-2022/3.13"]
rows:
  d3:
    practice: "applies criminal law and current strategies to prevent and detect crime, deals with suspects and offenders, supports victims and vulnerable people and manages conflict"
    knowledge: "the links between policing, criminology and the criminal justice system and specialisms such as response, roads, intelligence and investigation"
    identity: "a policing professional in training who holds to the service's highest ethical standards and owns the duty to advance equality, diversity and human rights"
    ids: ["qaa/policing-in-partnership-with-2022/4.3.b2", "qaa/policing-in-partnership-with-2022/4.3.b10", "qaa/policing-in-partnership-with-2022/4.3.b9", "qaa/policing-in-partnership-with-2022/4.3.b15", "qaa/policing-in-partnership-with-2022/4.3.b1", "qaa/policing-in-partnership-with-2022/4.3.b4", "qaa/policing-in-partnership-with-2022/4.3.b7", "qaa/policing-in-partnership-with-2022/4.3.b8"]
  e2:
    practice: "critically judges evidence-based research, designs and completes an independent problem-based project and makes evidence-led decisions with professional discretion in complex, unpredictable incidents"
    knowledge: "evidence-based policing and the political, legal, technological and ethical debates now shaping the discipline and its practice"
    identity: "a reflective policing professional who uses discretion responsibly, leads and works in partnership and reflects continually to improve own practice"
    ids: ["qaa/policing-in-partnership-with-2022/2.14", "qaa/policing-in-partnership-with-2022/4.3.b11", "qaa/policing-in-partnership-with-2022/4.3.b13", "qaa/policing-in-partnership-with-2022/4.3.b14", "qaa/policing-in-partnership-with-2022/2.2.b3", "qaa/policing-in-partnership-with-2022/4.4.b5", "qaa/policing-in-partnership-with-2022/4.3.b16", "qaa/policing-in-partnership-with-2022/4.3.b18"]
note: "Level 6 only, with a threshold standard and no typical or excellent split: e2 is drawn from the more demanding level 6 statements (final-year project, critical use of research, decisions in complex situations, discretion, leadership). No e3 because there are no level 7 statements."
