slug: psychology-2023
name: "Psychology (2023)"
run: "std:doc:qaa-psychology-2023-benchmarks"
subject: "Psychology studies behaviour, mental functioning and experience through scientific and other methods of enquiry and applies that knowledge ethically to real problems."
subjectIds: ["qaa/psychology-2023/2.5", "qaa/psychology-2023/3.16.b4", "qaa/psychology-2023/4.9.b1"]
rows:
  d3:
    practice: "forms and tests hypotheses through supervised studies using experiments, interviews, questionnaires and psychometric tests, then analyses quantitative and qualitative data within ethical and legal guidance"
    knowledge: "the core areas of psychology and where each applies, how they relate and the conceptual and historical foundations on which the discipline rests"
    identity: "a psychology graduate who applies ethics to their own conduct and research, deals with others professionally and inclusively and reflects on their own strengths and development"
    ids: ["qaa/psychology-2023/4.8.b6", "qaa/psychology-2023/3.16.b7", "qaa/psychology-2023/4.8.b5", "qaa/psychology-2023/4.8.b1", "qaa/psychology-2023/4.8.b3", "qaa/psychology-2023/3.16.b1", "qaa/psychology-2023/3.16.b3", "qaa/psychology-2023/3.17.b2"]
  e2:
    practice: "designs research creatively around current issues, sets and critiques questions across many methods and draws conclusions that weigh individual diversity and point to further research"
    knowledge: "the breadth of psychology and its reach into real problems, its historical theories and their bearing on current thinking and where psychological understanding runs out"
    identity: "a reflective psychologist in training who considers what findings mean for social, political and ethical debate and helps varied audiences see how psychology informs decisions"
    ids: ["qaa/psychology-2023/4.10.b6", "qaa/psychology-2023/4.9.b5", "qaa/psychology-2023/4.9.b7", "qaa/psychology-2023/4.9.b1", "qaa/psychology-2023/4.9.b2", "qaa/psychology-2023/4.10.b2", "qaa/psychology-2023/4.10.b7", "qaa/psychology-2023/4.10.b9"]
note: "No level 5 statements. e2 draws on the typical and excellent standards. No e3: the only level 7 statement (4.5) concerns conversion courses aligning with the honours standards and sets no level 7 outcomes."
