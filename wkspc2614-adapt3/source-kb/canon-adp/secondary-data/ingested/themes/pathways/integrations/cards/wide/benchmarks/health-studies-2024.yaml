slug: health-studies-2024
name: "Health Studies (2024)"
run: "std:doc:qaa-health-studies-2024-benchmarks"
subject: "Health studies examines health as a physical, mental and social condition across populations, drawing on many disciplines to understand it, improve it and narrow health inequalities."
subjectIds: ["qaa/health-studies-2024/2.1", "qaa/health-studies-2024/4.4.b7", "qaa/health-studies-2024/4.4.b16"]
rows:
  d3:
    practice: "judges health issues from several viewpoints, joining research evidence with national policy and guidance to analyse health inequalities, epidemiology and surveillance data across diverse populations"
    knowledge: "health as physical, mental and social and shifting over time, with theories of what causes ill health, the reasons given for interventions and how healthcare systems compare"
    identity: "a health studies graduate who brings ethical judgement and professional codes to their work, respects the varied values people hold about health and reflects on feedback"
    ids: ["qaa/health-studies-2024/4.4.b3", "qaa/health-studies-2024/4.4.b5", "qaa/health-studies-2024/4.4.b16", "qaa/health-studies-2024/4.4.b22", "qaa/health-studies-2024/4.4.b7", "qaa/health-studies-2024/4.4.b8", "qaa/health-studies-2024/4.5.b20", "qaa/health-studies-2024/4.4.b12"]
  e2:
    practice: "combines specialist knowledge from the many disciplines of health to devise new, fair and inclusive answers to complex health problems, using systems and anticipatory thinking under uncertainty"
    knowledge: "how individuals and institutions shape health status, how the global movement of populations changes health and why social and psychological factors make or break public health messages"
    identity: "a reflective health practitioner who questions accepted norms, examines their own values and takes a stance on sustainability and on their place in local and global society"
    ids: ["qaa/health-studies-2024/4.4.b4", "qaa/health-studies-2024/1.31.b8", "qaa/health-studies-2024/1.31.b1", "qaa/health-studies-2024/1.31.b2", "qaa/health-studies-2024/4.4.b11", "qaa/health-studies-2024/4.4.b20", "qaa/health-studies-2024/1.31.b6", "qaa/health-studies-2024/1.31.b7"]
  e3:
    practice: "handles complex health issues systematically and creatively, critiques current research and methods, proposes new hypotheses and reaches sound judgements from incomplete health data"
    knowledge: "a systematic and critical grasp of current health problems and new insights at the leading edge of the field, with full command of the research techniques that suit them"
    identity: "a self-directed health professional who takes initiative and personal responsibility in unpredictable situations and keeps advancing their knowledge through continuing professional development"
    ids: ["qaa/health-studies-2024/4.8.b1", "qaa/health-studies-2024/4.7.b4", "qaa/health-studies-2024/4.8.b2", "qaa/health-studies-2024/4.7.b1", "qaa/health-studies-2024/4.7.b2", "qaa/health-studies-2024/4.8.b5", "qaa/health-studies-2024/4.8.b3", "qaa/health-studies-2024/4.8.b6"]
note: "No level 5 statements. Level 6 gives a threshold standard only (above threshold is left to Annex D), so e2 draws on the more demanding threshold items and the sustainability competencies in 1.31."
