slug: history-2022
name: "History (2022)"
run: "std:doc:qaa-history-2022-benchmarks"
subject: "History studies the lives, actions and ideas of people in past societies, building evidence-based arguments about the past that bear on the present and future."
subjectIds: ["qaa/history-2022/2.1.b2", "qaa/history-2022/3.10.b2", "qaa/history-2022/3.10.b6"]
rows:
  d3:
    practice: "frames focused questions about the past, then plans an enquiry that gathers, sorts and analyses primary and secondary sources by genre, viewpoint and purpose"
    knowledge: "where reliable knowledge of the past is held, the gaps and contradictions of the historical record and how unfamiliar past cultures and beliefs worked"
    identity: "a history student who acts with integrity, credits the work of other historians properly and meets the ethical duties of research (ing's reading)"
    ids: ["qaa/history-2022/4.5.b1", "qaa/history-2022/4.5.b3", "qaa/history-2022/4.5.b7", "qaa/history-2022/4.5.b2", "qaa/history-2022/4.5.b8", "qaa/history-2022/4.5.b10", "qaa/history-2022/4.6.b10", "qaa/history-2022/4.6.b14"]
  e2:
    practice: "holds a reasoned historical argument under challenge in debate, revises it when the evidence demands and condenses it for varied public and academic audiences"
    knowledge: "historiography and historical method as contested practices, including how rules of evidence can themselves be critiqued and how public claims about the past are tested"
    identity: "a historian in training who meets the strangeness of the past with empathy and respect for difference and resists over-simple explanation"
    ids: ["qaa/history-2022/1.7.b11", "qaa/history-2022/1.20", "qaa/history-2022/2.1.b4", "qaa/history-2022/1.7.b6", "qaa/history-2022/1.7.b8", "qaa/history-2022/1.7.b10", "qaa/history-2022/1.7.b9"]
note: "Level 6 only, with threshold standards and no typical or excellent split: e2 is drawn from the fuller purpose statements on critique of evidence, historiography and public argument."
