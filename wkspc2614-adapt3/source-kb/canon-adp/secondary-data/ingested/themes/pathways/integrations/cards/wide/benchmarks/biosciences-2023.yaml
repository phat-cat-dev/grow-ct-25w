slug: biosciences-2023
name: "Biosciences (2023)"
run: "std:doc:qaa-biosciences-2023-benchmarks"
subject: "Biosciences study living systems across all kingdoms of life from molecules to ecosystems and apply that knowledge to real problems for society and the environment."
subjectIds: ["qaa/biosciences-2023/1.1", "qaa/biosciences-2023/3.4.b1", "qaa/biosciences-2023/1.3"]
rows:
  d3:
    practice: "designs experiments and runs laboratory, field or computational work under risk assessment, collecting and analysing data to test hypotheses about living systems"
    knowledge: "the processes of life across all kingdoms, from molecular biology and cells to organisms, systems biology and ecosystems, with depth in a few sub-disciplines"
    identity: "a bioscientist in training who acts professionally and inclusively, respects legal and ethical duties to living resources and owns their personal and professional development"
    ids: ["qaa/biosciences-2023/4.5.b3", "qaa/biosciences-2023/4.5.b4", "qaa/biosciences-2023/4.5.b12", "qaa/biosciences-2023/1.9", "qaa/biosciences-2023/1.4", "qaa/biosciences-2023/1.5", "qaa/biosciences-2023/4.5.b17.outcome", "qaa/biosciences-2023/1.23"]
  e2:
    practice: "designs and optimises techniques largely alone, chooses and judges statistical and computational methods and devises solutions to unfamiliar biological problems with attention to controls and bias"
    knowledge: "a thorough and wide view of biology brought to bear on phenomena and problems, with an understanding that knowledge is fluid and new findings reshape it"
    identity: "a bioscientist who critically judges the ethics and social effects of biological advances and proposes how the field can meet present and future challenges such as sustainability"
    ids: ["qaa/biosciences-2023/4.5.b5.excellent", "qaa/biosciences-2023/4.5.b11.excellent", "qaa/biosciences-2023/4.5.b3.excellent", "qaa/biosciences-2023/4.5.b1.excellent", "qaa/biosciences-2023/4.5.b2.excellent", "qaa/biosciences-2023/4.5.b16.excellent", "qaa/biosciences-2023/4.5.b15.excellent", "qaa/biosciences-2023/4.5.b9.excellent"]
  e3:
    practice: "questions and combines wide literature to design new methods of investigation, then plans and discusses a significant research project with its ethics, hazards and sustainability"
    knowledge: "a systematic and broad command of current biological concepts, synthesised to solve complex and unfamiliar problems at the forefront of the field"
    identity: "an increasingly independent bioscience researcher who thinks critically and weighs the environmental effects and costs of their own investigations (ing's reading)"
    ids: ["qaa/biosciences-2023/4.5.b19.outcome", "qaa/biosciences-2023/4.5.b20.outcome", "qaa/biosciences-2023/4.5.b18.outcome", "qaa/biosciences-2023/4.5.b18.excellent", "qaa/biosciences-2023/3.13", "qaa/biosciences-2023/2.14"]
note: "No level 5 statements. e2 draws on the excellent standards. The unsuffixed and outcome rows stand for the expected honours outcome."
