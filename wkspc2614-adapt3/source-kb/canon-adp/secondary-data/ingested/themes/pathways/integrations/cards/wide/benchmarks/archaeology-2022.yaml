slug: archaeology-2022
name: "Archaeology (2022)"
run: "std:doc:qaa-archaeology-2022-benchmarks"
subject: "Studies the human past through material remains, landscapes and environmental evidence to interpret human behaviour and to care for a finite resource on behalf of communities today."
subjectIds: ["qaa/archaeology-2022/1.10", "qaa/archaeology-2022/1.8", "qaa/archaeology-2022/2.19"]
rows:
  d3:
    practice: "observes, records and interprets primary evidence in the field, classifies material and analyses the data with fitting qualitative and quantitative methods while knowing what each can show"
    knowledge: "broad knowledge of the archaeology of several regions and periods, the methods for gaining and analysing data and what fragmentary evidence can and cannot reveal"
    identity: "an archaeologist in training who follows ethical and safety duties, respects the legal setting of fieldwork and treats the finite archaeological record as something to conserve sustainably"
    ids: ["qaa/archaeology-2022/3.2.b2", "qaa/archaeology-2022/3.2.b9", "qaa/archaeology-2022/4.3.b2", "qaa/archaeology-2022/4.3.b4", "qaa/archaeology-2022/4.3.b8", "qaa/archaeology-2022/4.3.b11", "qaa/archaeology-2022/4.3.b18", "qaa/archaeology-2022/3.3.b17"]
  e2:
    practice: "designs and carries out an extended programme of primary research, weighing and combining textual, material, spatial and scientific evidence into structured arguments that question colonial assumptions"
    knowledge: "an understanding of how society, culture and environment drive change together in linked socio-ecological systems across deep time, set within the social and political context of archaeological interpretation"
    identity: "a reflective archaeologist who takes responsibility for fair engagement with marginalised communities, values inclusion and respects diverse cultures inside and outside the discipline"
    ids: ["qaa/archaeology-2022/3.3.b3", "qaa/archaeology-2022/4.3.b12", "qaa/archaeology-2022/3.2.b15", "qaa/archaeology-2022/3.2.b12", "qaa/archaeology-2022/3.2.b10", "qaa/archaeology-2022/4.3.b15", "qaa/archaeology-2022/4.3.b16", "qaa/archaeology-2022/3.3.b18"]
note: "No typical or excellent split: e2 is drawn from the more demanding level 6 statements on research design, synthesis of evidence, socio-ecological change and community engagement."
