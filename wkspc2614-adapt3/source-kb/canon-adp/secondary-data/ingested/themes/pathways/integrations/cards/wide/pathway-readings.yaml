# Wide table: practice, knowledge and practitioner self-identity for a pathway's own rows (ing N-0155)
# version 0.4.1, 4 October 2026, 16:39 (N-0179: two level 8 knowledge readings refined at Abbott's word); 0.4.0, 4 October 2026, 16:36 (N-0178: every level 8 knowledge reading as how the practice defines knowledge); 0.3.0, 4 October 2026, 14:51 (N-0158: e3 and L8 rewritten for every practice; 0.2.1, 14:47, N-0157: innovation at the top of Creativity; 0.2.0, 14:41, N-0156: the other thirteen practices added; 0.1.0, 14:33, Self-Development)
# ing's readings of the cards (plans/<pathway>.yaml) and the cores' levels 3 and 8, practice to the fore (N-0147, N-0156); unruled.
# Self-Development's were written by ing; the other thirteen were drafted by four agents to one brief modelled on them, checked by
# script (rows, length, house style, no seven words copied from the card) and fourteen readings rewritten by ing. The cards are unchanged.
# Each row: [practice (what one does), knowledge (what one knows), practitioner self-identity (who one is)]

self-development:
  F:  ["describes self as a learner when asked and keeps to the tasks set", "what they are good at and want from study, in their own words", "a learner who sees identity as given rather than made"]
  i1: ["talks about study as a practice with its own ways of working and names what an academic practitioner does", "what academic practice, an academic practitioner and graduate identity are", "a newcomer who sees that being a student is a practice one can take up"]
  i2: ["keeps a learning record each week, logging what was done, strengths shown and goals set", "how a learning record works and what goes in it", "a student who keeps account of their own learning"]
  i3: ["notices and notes when a task, a source or feedback touches what matters to them", "own values and what matters in study, named in own words", "a student beginning to recognise their values at work in study"]
  d1: ["takes part in seminars and groups by the community's conventions and watches how experienced members work", "how academic communities shape identity and values, from the edge towards the centre, with integrity as shared values", "a participant learning the community's ways and values"]
  d2: ["plans own development against values and goals, acts on feedback and checks progress against the plan", "how feedback, reflection and goals connect in a development plan", "a student taking responsibility for their own development"]
  d3: ["changes how they study, take part or take feedback when they see their beliefs or background shaping it", "how own values, beliefs and background affect learning and taking part", "a self-aware practitioner whose values begin to steer choices"]
  e1: ["writes and speaks about own academic identity and values with evidence, for a tutor, a panel or an employer", "what counts as evidence of identity and values and which evidence suits each reader", "a practitioner with a voice of their own, able to say who they are"]
  e2: ["chooses a course of action when values conflict, acts on it and reviews own conduct afterwards", "own values as an ordered set and how they bear on conduct", "a practitioner whose conduct expresses an organised set of values"]
  e3: ["keeps a reflexive journal through a dissertation and writes a positionality statement on how own background, values and assumptions shaped the questions, reading and conclusions", "how class, culture, discipline and personal history shape what a person notices, values and claims as knowledge, and where one stands among them", "a practitioner who can say where they stand and why, and how that position colours what they see"]
  L8: ["argues own standpoint in a thesis and its viva, mentors students and early-career colleagues through questions of identity and values and models a scholarly self in teaching and public work", "the scholarly self as a source of knowledge: how one's standpoint, argued in a thesis and a viva, shapes and defines the new knowledge one proposes", "a scholar who has authored a professional self, holds it open to question and helps others author theirs"]

starting-progressing-succeeding:
  F:  ["completes set work when encouraged and sets goals because a tutor asks for them", "what the task asks and what marks mean, with success read as the grade", "a learner who sees ability as fixed and success as marks"]
  i1: ["talks about what excelling at university means and compares how study there differs from school or college", "what excelling at university involves and how independent university learning differs from taught learning at school or college", "a newcomer who sees that university asks for a different kind of learner"]
  i2: ["attends teaching prepared, submits on time and sets out work in the expected academic format", "the conventions of academic practice and what each one is for", "a student trying out the ways an academic practitioner works"]
  i3: ["treats a hard task or a low mark as a sign of what to practise next and keeps working at it", "how ability grows with effort and strategy and own beliefs about what one can do", "a student beginning to see their ability as something they build"]
  d1: ["sets goals about mastering skills rather than beating marks, breaks them into steps and keeps them going across a term", "how mastery goals differ from performance goals and what keeps motivation going", "a participant learning to value mastery as the community does"]
  d2: ["builds confidence through small successes and rehearsal before pressured tasks and uses planned coping strategies when stress or anxiety rises", "how self-efficacy is built and how stress and anxiety affect performance", "a student taking responsibility for their own confidence and wellbeing under pressure"]
  d3: ["states and defends own view in writing and discussion and makes choices about own work without waiting to be told", "what an academic voice is and own strengths and habits as a practitioner", "a self-aware practitioner who owns their practice and whose values begin to steer choices"]
  e1: ["names and evidences own graduate capital, such as skills, networks and experience, in a CV, an application or an interview", "what graduate capital is, its forms and how to show each to an employer or panel", "a practitioner with a voice of their own, ready to move from student to graduate"]
  e2: ["sets own learning aims beyond the course, finds the resources and people to meet them and reviews progress over time", "how self-directed learning works across a life and own patterns as a learner", "a lifelong learner whose own values drive what they learn next"]
  e3: ["sets a direction after graduation, choosing further study or work that fits own values and strengths and reshaping habits and networks to match", "how a graduate identity forms through practice, values and belonging, and the transition from student to graduate, master's student or professional", "a graduate whose sense of self steers choices about study, work and the communities to join"]
  L8: ["sustains a doctorate through setbacks over several years, plans own development against the Researcher Development Framework and mentors newer researchers", "knowing oneself as a maker of knowledge: what it takes to propose, sustain and defend new knowledge at a field's boundaries through years of independent work", "an independent researcher who keeps going under uncertainty and helps others find their footing"]

understanding-learning-assessment-feedback:
  F:  ["does set tasks to the criteria given and reads the mark and comments because they must", "what the criteria for a task ask, with feedback read as the mark", "a learner who sees assessment as tests to pass"]
  i1: ["describes how people in a discipline learn by reading, talking and writing in its discourse community", "how learning in a discipline works through taking part in its discourse community", "a newcomer who sees learning as joining a community's conversation"]
  i2: ["sorts tasks into formative and summative and takes part in each form set, from quizzes to essays and presentations", "the difference between formative and summative assessment and what each form is for", "a student trying out assessment as a way to learn as well as be judged"]
  i3: ["chooses active study strategies such as summarising, questioning and self-testing over rereading and copying notes", "how active, constructivist learning differs from passive reception and which own strategies fall where", "a student beginning to see themself as the one who builds their learning"]
  d1: ["reads a module's learning outcomes and maps each lecture, seminar and task to the outcome it serves", "how learning outcomes, activities and assessment align and why a discipline designs them so", "a participant learning how the community sets out what is to be learned"]
  d2: ["reflects on feedback, picks out recurring points and writes an action plan with steps for the next assignment", "how reflection turns feedback into actions and how an action plan is built", "a student taking responsibility for acting on feedback"]
  d3: ["plans independent study, monitors how it goes and adjusts strategies in repeated self-regulated learning cycles", "self-regulated learning cycles of planning, monitoring and reflecting and own habits as a learner", "a self-regulating learner whose values begin to steer how they study"]
  e1: ["works out what an unfamiliar assessment demands and adapts preparation, format and approach to suit it", "the demands of different assessment types and criteria for choosing an approach to each", "a learner with a voice of their own who meets new assessment on their own terms"]
  e2: ["marks own and peers' drafts against the marking criteria and gives and acts on judgements about quality", "what marking criteria mean in practice and how evaluative judgement of quality is formed", "a practitioner whose judgement of quality expresses own standards"]
  e3: ["arranges feedback meetings with a dissertation supervisor, brings drafts and questions to each and records how every discussion changes the next chapter", "feedback as a dialogue rather than a verdict and how a supervisor's comments build across a sustained project", "a learner who leads the conversation about their own work"]
  L8: ["answers examiners' and peer reviewers' reports, revises for publication, reviews manuscripts for journals and marks and gives feedback to students", "original knowledge as the defining marker of the doctorate: knowing how a contribution is judged original, and taking part as a researcher in the disciplinary discourse that reviews, debates and refines it", "a researcher who is judged by peers, judges in turn and teaches others to judge well"]

finding-using-sources:
  F:  ["looks in the books and sites a tutor lists and uses whatever first seems to fit", "the facts a task needs and where the named sources keep them", "a learner who searches only when a task demands sources"]
  i1: ["compares academic searching with everyday searching and describes it as exploring, repeating and taking effort", "why academic searching is exploratory, iterative and effortful where everyday searching is quick and single-shot", "a newcomer who sees that academic searching is a practice of its own"]
  i2: ["searches the library discovery service, filters to scholarly sources and opens or requests the full text", "how the discovery service works and what makes a source scholarly", "a student trying out searching as a scholar does"]
  i3: ["starts a search from the reading list and own notes, then follows up the leads found there in stages", "what one already knows about a topic and how a reading list leads into a staged search", "a searcher beginning to build on what they already know"]
  d1: ["pulls the key terms from an assessment task and lists synonyms and related terms for each", "how a task's wording maps to the terms a discipline uses in its literature", "a participant learning the community's vocabulary for searching"]
  d2: ["plans a search strategy that combines keywords and synonyms with the Boolean operators AND, OR and NOT", "several ways of combining terms with Boolean operators and when each fits the task", "a searcher taking responsibility for planning their own searches"]
  d3: ["runs a search, reviews each set of results and amends keywords, operators and limiters before running it again", "how iterative searching works and own habits in judging and changing results", "a self-regulating searcher who learns from each round of results"]
  e1: ["extends a search by following citations backward and forward and by searching subject databases and Google Scholar", "which search routes suit an unfamiliar topic and criteria for choosing between them", "a searcher with a voice of their own who chooses where to look"]
  e2: ["weighs each source's date, author standing and fit with what they already know, then keeps or drops it with reasons", "criteria for evaluating sources and how a source fits with what one already knows", "a critical searcher whose judgement of sources expresses own standards"]
  e3: ["runs a systematic or scoping search for a dissertation, logs search strings and databases and justifies when the literature is covered", "how systematic searching works, where grey literature and preprints sit and what counts as enough coverage for a question", "a searcher who knows the limits of what they found and says so"]
  L8: ["keeps alerts running across databases, preprint servers and conference proceedings, maps the frontier in a thesis literature review and advises colleagues and students on searching", "searching as how a field's frontier is defined: mapping what is known and not yet known so that a new claim can be placed at the boundary it extends, and working across disciplines in collaborations where new ways of defining knowledge emerge", "a researcher others turn to for the state of knowledge in their area"]

referencing:
  F:  ["acknowledges sources in a set referencing format with guidance because the rules require it", "the set format and the rule that sources must be named", "a learner who sees referencing as a way to avoid trouble"]
  i1: ["explains why academic work names its sources and points to examples of acknowledgement in published work", "why acknowledgement matters for credit, trust and tracing ideas in academic work", "a newcomer who sees citing as part of how scholars work"]
  i2: ["builds each in-text citation and reference-list entry in one style, checking punctuation, order and detail against the guide", "the elements and order of one referencing style for common sources", "a student trying out referencing in one style"]
  i3: ["records the details of each source as it is found, in notes or a reference manager, so every citation can be traced", "how to manage own working so sources stay traceable and where own records fall short", "a student beginning to keep account of their sources as a practitioner"]
  d1: ["quotes and paraphrases sources with correct citations and checks own drafts for anything that could count as plagiarism", "how quotation, paraphrase and plagiarism differ and why the community draws the lines where it does", "a participant learning the community's conventions for using others' words and ideas"]
  d2: ["references less common sources such as a chapter in an edited book or an organisation's web page, checking the style's rules", "several source types and the style requirements for each", "a referencer taking responsibility for accuracy across any source"]
  d3: ["chooses and places citations so a reader can see the range of research read and how the work joins the discourse", "what one's references tell a reader about scope and engagement and own citing habits", "a self-aware writer whose citing begins to reflect own choices"]
  e1: ["acts honestly in own work, declaring all sources and help and explaining those choices to tutors so others can trust it", "honesty and trust as values of academic integrity and how they show in practice", "a practitioner with a voice of their own who stands behind the honesty of their work"]
  e2: ["treats others' work and ideas fairly and respectfully in group work and peer review and speaks up when integrity is at risk", "fairness, respect, responsibility and courage as values and how own conduct towards others expresses them", "a practitioner whose conduct towards others expresses own values"]
  e3: ["manages a large reference library for a dissertation, applies a discipline's style without lapses and handles data, images and permissions with integrity in workplace reports", "integrity at work: copyright, data protection, confidentiality and crediting colleagues' contributions", "a graduate for whom honest acknowledgement is a matter of professional reputation"]
  L8: ["credits accurately across a thesis and papers, agrees co-authorship, shares data openly, declares conflicts of interest and answers to ethics and integrity processes", "citation as how new knowledge is defined against the record: placing a claim among what others have established so that it can be traced, tested and built on", "a researcher whose record others can trust and who holds colleagues to the same standard"]

criticality:
  F:  ["questions a source when a tutor asks and looks for what is wrong with it", "what a source says and the questions a task asks of it", "a learner who sees being critical as finding fault"]
  i1: ["maps who has written on a topic and where they agree or differ, then asks what each voice adds to the debate", "what scholarly discourse is and how authors position their work in a conversation about a topic", "a newcomer who sees scholarship as a conversation one can question"]
  i2: ["asks why each search term, source and essay plan was chosen and notes the reasons while searching, reading and planning", "the critical questions to ask at each step of searching, reading and planning", "a student trying out critical questioning on own study choices"]
  i3: ["notices the critical choices already made in daily study, such as which source to trust, and questions them outside assessment too", "own critical habits and gaps and where critical choices already happen in study", "a student beginning to see themself as a critical thinker all the time, not only for marks"]
  d1: ["picks out in model texts where a writer breaks an argument down and where they judge its worth, comparing the two", "what analysis and evaluation are, how they differ and why the discipline values each", "a participant learning how the community reads and judges"]
  d2: ["breaks a scholarly interpretation into claim, evidence and reasoning, then judges its strengths and limits in own words", "how to test an interpretation's claims, evidence and assumptions and which questions suit which kind of text", "a critical reader taking responsibility for own judgements"]
  d3: ["chooses how to read a journal article by its structure, going to abstract, method and discussion first and weighing the method before the findings", "how an article's structure and method show where to read and what to trust", "a strategic reader who plans and adjusts how they read"]
  e1: ["weighs the factors in a problem, ranks them by importance and defends the ranking with evidence for a tutor or reader", "criteria for judging relative importance and how to justify a ranking with evidence", "a critical thinker with a voice of their own, ready to stand by a judgement"]
  e2: ["writes critically, weaving several sources into one argument in the discipline's terms rather than summarising them one by one", "how synthesis differs from summary and how the discipline's vocabulary carries critical judgement", "a critical writer whose arguments express own values and judgement"]
  e3: ["writes a master's-level critical review that takes a position in a live debate, tests it against the strongest counter-arguments and states its limits", "the positions in a debate, the assumptions beneath them and how own stance shapes which evidence one finds persuasive", "a critical practitioner with an argued position and the honesty to show its limits"]
  L8: ["builds a thesis argument that challenges a field's assumptions, defends it in a viva and carries the critique into policy, practice or public debate", "critique as the making of knowledge: questioning a field's assumptions and categories so that new knowledge can be proposed, debated and refined at the edge of understanding", "a critical being whose questioning changes how others in the field and beyond understand a problem"]

academic-writing:
  F:  ["writes a short assignment to the structure given, following guidance step by step", "the structure set for a task and the facts and ideas it needs", "a learner who writes because the assignment requires it"]
  i1: ["reads an assessment question for its steer and keywords, marking the task words and limits before writing anything", "what instruction words such as discuss, evaluate and compare ask for and how a question sets its limits", "a newcomer who sees academic writing as answering a question a discipline sets"]
  i2: ["follows the writing cycle from analysing the task and planning through to a completed first draft, with support", "the stages of the writing cycle and what each stage produces", "a student trying out writing as a process rather than a single sitting"]
  i3: ["proofreads and edits own draft, finding and fixing errors of spelling, grammar and expression before submitting", "own common errors and the difference between editing and proofreading", "a student beginning to see themself as a writer who checks own work"]
  d1: ["compares essays, reports and other argued genres and structures own writing with an introduction, argued body and conclusion", "how argued genres are built and why each structure serves its purpose in the discipline", "a participant learning the writing conventions of the academic community"]
  d2: ["writes and rewrites sentences so the actor leads and the verb is active, cutting padding without being told", "how sentence structure and the active voice make meaning clear and when a passive still fits", "a writer taking responsibility for the clarity of own sentences"]
  d3: ["reviews own paragraphs and essays against the four pillars, then restructures and redrafts where a pillar is weak", "the four pillars of effective writing and own writing habits seen through them", "a self-regulating writer whose standards begin to steer revision"]
  e1: ["compares writing in own and neighbouring disciplines and justifies the conventions chosen for an unfamiliar task", "how style, structure and evidence vary across disciplines and why each discipline writes as it does", "a writer with a voice of their own, choosing conventions with reasons"]
  e2: ["makes own point first in each paragraph, then brings in sources to support, extend or challenge it", "criteria for using sources and how integrating them differs from listing what others say", "a writer whose own argument leads the sources and expresses their values"]
  e3: ["drafts and redrafts a dissertation, then rewrites the same work as an abstract and a report for a professional reader", "how own discipline's conventions of style, evidence and vocabulary work and when to depart from them knowingly", "a writer aware of their place in the discipline's conversation"]
  L8: ["writes a thesis, journal articles, a grant proposal and a plain-language summary from the same research, revising each in answer to reviewers and editors", "writing understood as the medium in which knowledge is defined: through language one proposes new knowledge at a discipline's boundaries, debates and refines it and adds to a living discourse", "a scholarly author whose writing is published, reviewed and used by others"]

presenting:
  F:  ["presents set material clearly with guidance, aiming to get through the assessed talk", "the content set and the basic steps of giving a talk", "a learner who presents because it is assessed"]
  i1: ["reads a presentation brief for its time, format and audience and explains what the task tests", "what a presentation assesses and which of its skills carry into work", "a newcomer who sees presenting as a practice worth learning"]
  i2: ["builds a presentation to a brief by working through the five steps in order, with tutor support", "the five steps of building a presentation and what each step produces", "a student trying out presenting by a set method"]
  i3: ["rehearses aloud to time, notes where the talk overruns or stumbles and fixes those parts before the day", "own strengths and weak points as a presenter and how rehearsal shows them", "a student beginning to see themself as a presenter who checks own performance"]
  d1: ["designs slides and visual aids with little text, clear contrast and readable type, checking each one for accessibility", "why less is more on a slide and what makes a visual aid accessible to every audience member", "a participant learning the community's ways of showing ideas"]
  d2: ["adapts delivery to the format, whether a seminar talk, an online presentation or a group slot, without needing direction", "several presentation formats and how voice, pace and visuals change with each", "a presenter taking responsibility for fitting delivery to the setting"]
  d3: ["plans an engaging opening, notices signs of own nerves and uses breathing and rehearsal to steady them", "own nerves, what triggers them and which strategies calm them", "a self-regulating presenter whose self-knowledge begins to steer delivery"]
  e1: ["pitches an idea, presents a conference poster and answers viva-style questions, choosing and justifying the approach for each", "the conventions of professional presentation forms and criteria for choosing among them", "a presenter with a voice of their own in professional settings"]
  e2: ["leads a group presentation, shares out roles, resolves conflict and reviews own part in the team afterwards", "how groups work, how conflict arises and own part in a team's success", "a presenting collaborator whose leadership in a team expresses own values"]
  e3: ["presents a dissertation or project to a panel, answers questions on method and findings and adjusts the argument where a challenge holds", "what gives an academic voice authority under questioning and how to concede a point without losing the argument", "a presenter confident enough to defend own work and open enough to be persuaded"]
  L8: ["defends a thesis in a viva, gives conference papers and invited talks, chairs sessions, teaches and explains research to policymakers and the public", "speaking as a medium of knowledge-making: the conference, the viva and the public talk as where new claims are proposed, tested under questioning and refined", "a researcher whose spoken voice carries the work into the field and beyond"]

revising-exams:
  F:  ["reads and rereads the set notes before an exam and sits the paper as the tutor directs", "the facts and topics the exam is likely to cover, as given in class", "a learner who revises because the exam is coming and aims to get through"]
  i1: ["names the exam forms a module sets, such as essay, multiple-choice, open-book and short-answer, and says what each asks for", "what each form of exam tests and how an exam can serve learning as well as grading", "a newcomer who sees exams as a practice with forms to learn, not only a hurdle"]
  i2: ["counts the days to the exam and shares the topics across them in a simple dated revision timetable", "how a revision plan matches topics to the time available and what goes in it", "a student trying out revision as something planned rather than left to the last week"]
  i3: ["sorts notes and materials well ahead and uses breathing, rest and a steady routine to keep exam nerves in check", "how anxiety affects recall and which preparations keep it manageable for them", "a student beginning to see their own state as part of how they revise"]
  d1: ["replaces rereading with self-tests, flashcards, past questions and answers written out from memory", "why recalling and testing knowledge fixes it better than rereading and how active techniques work", "a participant learning the active ways of revising that experienced students use"]
  d2: ["maps own knowledge topic by topic, marks the weak areas and gives them more time in the revision plan", "how to find gaps in own knowledge and understanding and weigh time against them", "a reviser taking responsibility for where their own knowledge falls short"]
  d3: ["self-tests regularly to see whether revision is sticking and switches technique or time when results fall, keeping going after setbacks", "own revision habits, what they produce and how to recover when one fails", "a self-regulating reviser whose judgement of what works begins to steer choices"]
  e1: ["acts out processes, talks arguments through aloud and role-plays examiner and candidate to work material into memory", "how movement, voice and role-play deepen engagement with material and when they suit it", "a reviser with an approach of their own, confident to revise beyond the page"]
  e2: ["reads the paper's instructions, allots minutes to each question by its marks and writes to time across essay, short-answer and multiple-choice formats", "how strategy differs by question format and how to manage time and pressure on the day", "an examinee whose conduct on the day expresses a strategy they own"]
  e3: ["prepares for finals or professional examinations by testing own recall across the syllabus, dropping techniques that fail and planning around the gaps", "the evidence on retrieval practice, spacing and interleaving and what own recall shows about which suits each subject", "a learner who trusts results over habit and manages own preparation"]
  L8: ["prepares for a viva by rehearsing the whole thesis and its field under questioning, then examines others' theses and sets and moderates assessment", "a field held in command well enough to define what is new in own work and defend it under examination at the boundary of current understanding", "an examiner and examinee who holds a field well enough to judge others' command of it"]

researching-research-methods:
  F:  ["follows a tutor's set steps to carry out a small investigation and reports the answer found", "the steps of a set investigation and the facts it needs", "a learner who treats research as steps towards an answer someone else already holds"]
  i1: ["compares a research project with an essay and points out the parts of a proposal: question, aims, methods and timeline", "what a research project is, how it differs from an essay and how a proposal plans it", "a newcomer who sees research as a practice distinct from essay writing"]
  i2: ["drafts a research question, writes a short rationale for it and sets out aims, with a tutor's guidance", "how a research question, rationale and aims fit together and what makes each clear", "a student trying out the work of a researcher for the first time"]
  i3: ["cuts a broad topic down to one specific question and checks it against the time, sources and skills to hand", "what makes a question researchable and the limits of own time, access and skill", "a student beginning to see themself as a researcher who knows what they can take on"]
  d1: ["writes a literature review grouped by theme and a research report under the standard headings of method, results and discussion", "how the literature review and research report are built and why disciplines structure them that way", "a participant learning how the research community writes up its work"]
  d2: ["writes a full research proposal that answers what, why, how, when and with what resources, and fits it to the brief", "the questions a proposal must answer and how to adapt it to different briefs and readers", "a researcher taking responsibility for planning their own project"]
  d3: ["analyses, evaluates and synthesises studies in a review to show the gap own research fills and why it matters", "how own work relates to the literature and how critique, not summary, positions it", "a self-regulating researcher whose sense of what matters begins to steer the work"]
  e1: ["seeks ethical approval, gains informed consent, anonymises data and stores it securely throughout the project", "the principles of research ethics and how they bear on consent, privacy and harm in a given study", "a researcher with an ethical stance of their own, able to defend it to a panel"]
  e2: ["selects a methodology and methods to fit the research question and justifies the choice against alternatives in writing", "criteria for choosing methodology and methods and how each shapes the knowledge a project can produce", "a researcher whose design choices express own judgement and values"]
  e3: ["carries a dissertation from proposal and ethical approval through data collection and analysis to write-up, rescoping when time or access falls short", "research design, ethics, project management and how own working patterns affect a sustained project", "a researcher who can see a substantial project through and account for its choices"]
  L8: ["designs original studies, secures ethical approval and funding, publishes through peer review, manages data and engagement and supervises others' research", "research method as how knowledge is defined: designing enquiries that generate new knowledge at the forefront and justifying why their findings count as knowledge", "an independent researcher accountable for the knowledge they make and the people they train"]

reflective-practice:
  F:  ["writes a short reflection on a set task using the prompts a tutor gives", "what happened in the task and what the reflection prompts ask for", "a learner who reflects when told to, without yet seeing how they learn"]
  i1: ["writes a reflection in three steps, describing an event, reflecting on its meaning and naming an action to take", "what reflective practice is and how the describe, reflect, take action cycle works", "a newcomer who sees reflection as a practice with its own method"]
  i2: ["records what went well alongside what went badly in a reflective entry and gives each its due weight", "why a balanced account of strengths and weaknesses makes reflection useful", "a student trying reflection as a fair account rather than praise or blame"]
  i3: ["looks back over own essay, presentation or task and notes what went well and what did not", "own strengths and weak points in a piece of work, named in own words", "a student beginning to see themself as a reflective practitioner"]
  d1: ["asks why things happened and what they mean, drawing on theory and others' views rather than retelling events", "the difference between description and critical reflection and why analysis gives reflection its value", "a participant learning how reflective practitioners in the discipline think"]
  d2: ["turns each reflection into an action plan with specific steps and dates and checks them off as they are done", "how an action plan links reflection to change and what makes a step specific and timed", "a reflective practitioner taking responsibility for acting on what they learn"]
  d3: ["examines what drives own motivation, spots study strategies that are not working and changes them", "own motives, habits and their effects on learning and how to adjust them", "a self-regulating practitioner whose values begin to steer how they study"]
  e1: ["chooses Gibbs, Kolb or Johns for the situation at hand, applies the model in full and explains the choice", "what each model offers and the criteria for matching a model to a situation", "a reflective practitioner with a voice of their own, choosing tools to suit the task"]
  e2: ["keeps a reflective record for continuing professional development and uses it to plan learning across placements, roles and career", "how reflection sustains lifelong learning and professional growth beyond a single course", "a practitioner whose practice expresses a commitment to continuing growth"]
  e3: ["writes reflexive accounts of placements, projects or research that examine how own identity, values and position filtered what was noticed and done", "reflexivity as distinct from reflection and how a knower's position shapes the knowledge they produce", "a practitioner who looks at their own looking"]
  L8: ["builds reflexivity into research method through a positionality statement, a reflexive log and analysis that shows the researcher's part, then teaches reflective practice to others", "reflexivity as part of how knowledge is defined: showing how the knower's position shapes the new knowledge proposed, so that the claim and its making are judged together", "a researcher who makes their own part in the knowledge visible and teaches others to do the same"]

work-based-experiential-learning:
  F:  ["completes the tasks set on placement under close supervision and does what the supervisor asks", "what the tasks in a setting involve and the rules to follow there", "a learner who sees a placement as tasks to get through"]
  i1: ["sorts examples of placements, internships, work experience and practice learning into their types and names each one", "the types of practice-based and work-based learning and how they differ", "a newcomer who sees that learning happens at work as well as in class"]
  i2: ["explains how a placement or practice task puts classroom theory to use and what that authentic learning adds to study", "how practice-based learning works as authentic learning in which theory meets practice", "a student who sees practice as a place to learn"]
  i3: ["writes own learning goals before a placement, naming the competencies the experience can develop", "own starting point and the competencies a practice experience can build", "a student beginning to see themself as a learner at work with goals of their own"]
  d1: ["arrives on time, speaks and dresses to the setting's norms, keeps confidentiality and works to its codes and procedures", "the conduct, codes and expectations of a practice setting and why they matter there", "a participant learning the ways and standards of a professional community"]
  d2: ["agrees regular meetings with a mentor, brings questions and drafts, asks for feedback and acts on it", "what a mentor can offer and how to prepare for and use mentoring", "a practitioner taking responsibility for own learning on placement"]
  d3: ["tries a classroom theory on a real task, records what happened and adjusts what they do next", "how theory and practice inform each other and own habits in applying theory", "a self-regulating practitioner whose values and evidence begin to steer choices at work"]
  e1: ["works through Kolb's cycle on a work episode, from concrete experience and reflection to a new concept and a planned test", "the four stages of Kolb's experiential learning cycle and how each turns experience into learning", "a practitioner with a voice of their own who makes sense of experience in own terms"]
  e2: ["makes a call at work when no rule settles it, explains the reasons to colleagues and reviews the outcome", "the criteria professionals use to judge situations and how judgement and its effects fit together", "a practitioner whose professional judgement expresses own values"]
  e3: ["compiles a reflective portfolio from placement or work tracing who they are becoming as a professional, linking episodes of practice to theory and professional standards", "a community of practice, its standards and values and how taking part shapes professional identity", "an emerging professional who can say what kind of practitioner they are becoming and why"]
  L8: ["carries out practitioner research or a professional doctorate in own workplace, changes practice from the findings and shares them with professional bodies and journals", "practice as a source of new knowledge: defining knowledge from and for professional practice so that what practice finds enters both the profession's and the academy's discourse", "a researcher-practitioner trusted in both the profession and the academy"]

ai-technology:
  F:  ["uses or avoids AI tools as the rules say, following the tutor's instructions", "the stated rules on AI use for a task", "a learner who treats AI use as a matter of following rules"]
  i1: ["explains in plain terms how a generative AI tool predicts text and what it does not do, such as know or understand", "what generative AI is, how it works at a high level and what it is not", "a newcomer who sees AI as a tool with limits"]
  i2: ["reads the module's assessment guidance on AI before using a tool and asks the tutor when the rule is unclear", "the AI rules in assessment guidance and where to find them", "a student trying to use AI within the rules"]
  i3: ["thinks a task through first, then spots fabricated references, bias and privacy risks in AI output", "what AI output cannot be trusted for and own urge to turn to it too soon", "a student beginning to see themself as a careful AI user"]
  d1: ["asks AI to question a draft or argument, weighs its challenges and decides what to keep in own work", "a critical-use workflow and why AI works best as a critical friend rather than an author", "a participant learning the community's ways of using AI critically"]
  d2: ["checks AI claims and references against reliable sources and writes a disclosure that acknowledges, describes and evidences the AI use", "criteria for fact-checking AI output and the Acknowledge, Describe, Evidence model of disclosure", "a practitioner taking responsibility for AI use in own work"]
  d3: ["decides for each task whether to use AI, records the reasons and leaves it aside when it would cut the learning", "own habits with AI and the conditions under which it helps or harms learning", "a self-regulating AI user whose values begin to steer when to hold back"]
  e1: ["checks own use of AI against the misconduct risks, traces claims to original sources and never cites a GenAI tool as a source", "the forms GenAI misconduct takes and why a GenAI tool is not a citable source", "an AI user with a voice of their own who stands behind every word submitted"]
  e2: ["judges in hard cases whether a use of AI is permitted support or unfair advantage and explains the line to peers", "criteria for telling permitted support from unfair advantage and how each bears on fairness", "a practitioner whose use of AI expresses own values of fairness"]
  e3: ["evaluates an AI tool before using it in a dissertation or at work, weighing accuracy, bias, data protection, environmental cost and fairness to others before recording the decision", "the wider costs and benefits of AI and how a professional role shapes responsible use", "a professional who decides on AI use as a matter of conscience as well as convenience"]
  L8: ["uses and discloses AI in research to the field's standards, writes it into data management and ethics plans and helps set a research group's or department's AI policy", "AI as a new medium in knowledge-making: how it changes the way knowledge is produced, checked and attributed, with own part in defining responsible norms for it", "a researcher who helps a field decide how AI should and should not be used"]

creativity:
  F:  ["jots down a few ideas when a task asks and settles fast on the answer that feels safe", "the ideas and facts a task calls for", "a learner who prefers a right answer to a new one"]
  i1: ["names creative moves in others' work and shows how creativity links to critical thinking", "what creativity is, that it can be developed and how it relates to critical thinking", "a newcomer who sees creativity as something to learn, not a gift"]
  i2: ["brainstorms widely before judging, then narrows the options against the task's criteria and picks one to develop", "the difference between divergent and convergent thinking and where each fits in a task", "a student trying out creative thinking on set tasks"]
  i3: ["shares rough ideas and early drafts despite fear of failure and lets go of perfectionism to keep going", "the fears that hold back own ideas, such as of failure or imperfection, and the beliefs behind them", "a student beginning to see themself as someone who can create"]
  d1: ["cites a creativity theory to explain and defend the creative approach taken in a project", "creativity theories and why they explain how ideas form in a discipline", "a participant learning the community's ways of thinking about creativity"]
  d2: ["works a problem through a structured creative method, from defining it and generating options to choosing and planning, adapting the steps to the task", "several structured problem-solving methods and when each fits", "a creative problem solver taking responsibility for own work"]
  d3: ["notices when a strategy stalls, drops it and tries another angle, then reviews which change worked", "own thinking habits and how cognitive flexibility frees a stuck task", "a self-regulating creative thinker whose values begin to steer choices"]
  e1: ["develops ideas into innovative proposals, products or services for a workplace or client, using enterprise thinking to show their value", "how creativity, innovation and enterprise thinking take form in professional settings and the criteria for a good idea there", "a creative practitioner with a voice of their own who brings innovation into professional settings"]
  e2: ["innovates by acting on an idea before the outcome is clear, testing it, absorbing setbacks and adjusting as it unfolds", "own tolerance of ambiguity and how resilience and self-awareness carry ideas into action", "an innovative practitioner whose action under uncertainty expresses own values"]
  e3: ["leads an innovative project for a client, a community or own venture, testing ideas with users and changing own creative process in the light of what fails", "own creative process, the conditions that support innovation and how own position shapes what one makes", "a reflexive innovator who owns and remakes their creative practice"]
  L8: ["opens new lines of enquiry in a thesis, turns findings into new methods, products or ventures and leads innovation with partners beyond the university", "creativity as the origin of new knowledge: ideas generated at a field's boundaries that, once tested and argued, redefine what the field knows and can do", "an innovator who shapes the field's creative practice and others' identity as creators"]
