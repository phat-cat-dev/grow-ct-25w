vicSummary: "What this shows: none of the eighteen extracts is skill. The benchmarks name AI as a topic, a tool, a career sector and a threat to the integrity of assessment, and describe providers' duties; they do not yet describe the AI-literate learner. That fits the tier map's note that this is the fastest-moving pathway."

across:
  - "**The guide's vocabulary against the benchmarks':** the guide is silent on AI; the tier map, from sector sources, says AI literacy, golden rule, never cite, critical friend, critical-use workflow, fact-checking, Acknowledge, Describe, Evidence, informed restraint, misconduct risks, permitted support and unfair advantage; the benchmarks say generative AI, GenAI outputs, academic integrity, ethical use of AI, digital skills, independent thinking."
  - "**Skill against theme:** none of the eighteen extracts is skill."
  - "**Book coverage:** none; every card's topics come from the tier map's text and its sources (Sheffield, the Russell Group, UNESCO), which need the subject expert's sign-off and local policy."
  - "**Ethics as cross-cutting:** the tier map threads integrity through all three tiers (i2, e1, e2), as UNESCO treats ethics; the former 04 said so as a card and is folded into e3."
  - "**Other authors:** META holds none for this pathway; UNESCO, Ng and others, Sheffield and the Russell Group are wanted (W-0087, W-0088, W-0090, W-0091)."

qfIntro: "Neither framework names AI or technology as such (the FHEQ's 2024 text and the CQFW of 2009 predate their present use); they speak of evaluating information, personal responsibility and decision-making in complex and unpredictable contexts, which is where AI literacy sits."
