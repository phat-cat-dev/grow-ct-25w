mastery: "Across the tiers the weight moves along Anderson and Krathwohl's continuum: Introductory is declarative, what AI is and is not, with one rule and the habit of thinking first; Intermediate is procedural, the workflow, fact-checking and disclosure, ending in conditional knowledge of when not to use AI; Advanced is evaluative and metacognitive, integrity, the wider costs and the user one becomes. The tier map's own backbone is UNESCO's Understand, Apply, Create, which runs alongside. Mastery is the map's \"how well you decide\", AI literacy as judgement rather than fluency, which is the core's A11 ladder from compliance to flow."

differ: "the map threads the never-cite rule through Introductory; here it is carried by e1 with the misconduct risks, and by i3 and i1 as limitations. The map places the five-stage workflow and informed restraint at Intermediate (d1, d3) and environmental impact and graduate identity at Advanced (e3), as the cards do."

qfAdd: "neither framework names AI; its literacy sits in evaluating information (L4, L5), personal responsibility (L5, L6) and decision-making in complex and unpredictable contexts (L6, L7). The descriptors' date shows: the guidance for this pathway lives outside them."

