slug: education-studies-2025
name: "Education Studies (2025)"
run: "std:doc:qaa-education-studies-2025-benchmarks"
subject: "Studies education in its broadest sense, from formal schooling to lifelong and informal learning, examining its theories, values, ethics and social purposes such as justice and sustainability."
subjectIds: ["qaa/education-studies-2025/1.6", "qaa/education-studies-2025/1.30", "qaa/education-studies-2025/1.11"]
rows:
  d3:
    practice: "applies major theories of education to real problems, identifies critical questions from evidence and uses systematic research methods to study learning in formal and informal settings"
    knowledge: "the leading theories and concepts of education taken broadly, the points where educational knowledge stays uncertain or contested and the ethical dilemmas running through practice"
    identity: "an emerging educationalist who reflects on their own learning, respects views opposed to their own and takes a reasoned stance on equity and social justice"
    ids: ["qaa/education-studies-2025/4.5.b4", "qaa/education-studies-2025/4.5.b3", "qaa/education-studies-2025/4.5.b7", "qaa/education-studies-2025/4.5.b1", "qaa/education-studies-2025/4.5.b2", "qaa/education-studies-2025/4.5.b5", "qaa/education-studies-2025/1.13", "qaa/education-studies-2025/1.11"]
  e2:
    practice: "builds sustained critical arguments from several bodies of evidence, applies theory to complex educational problems and proposes and leads ways of resolving challenges in practice"
    knowledge: "a deep grasp of educational theory at the field's leading edge, of the limits of knowledge in education and of its ethical dilemmas and tensions"
    identity: "a self-directed educationalist who steers their own learning with sophistication, weighs personal strengths and weaknesses and leads effective collaborations with peers, staff and wider stakeholders"
    ids: ["qaa/education-studies-2025/4.5.b3.excellent", "qaa/education-studies-2025/4.5.b4.excellent", "qaa/education-studies-2025/4.5.b10.excellent", "qaa/education-studies-2025/4.5.b1.excellent", "qaa/education-studies-2025/4.5.b2.excellent", "qaa/education-studies-2025/4.5.b5.excellent", "qaa/education-studies-2025/4.5.b6.excellent", "qaa/education-studies-2025/4.5.b9.excellent"]
  e3:
    practice: "synthesises complex evidence into fresh insight, applies educational theory with originality to complex real problems and judges reflexively the research methods it chooses"
    knowledge: "a systematic grasp of educational theory, much of it drawn from the frontier of the field, held with critical judgement of that frontier knowledge"
    identity: "a reflexive education professional who resolves ethical dilemmas with originality, leads their own learning reflexively and works across organisations through respectful, trust-building collaboration"
    ids: ["qaa/education-studies-2025/4.5.b3.masters", "qaa/education-studies-2025/4.5.b4.masters", "qaa/education-studies-2025/4.5.b7.masters", "qaa/education-studies-2025/4.5.b1.masters", "qaa/education-studies-2025/4.5.b2.masters", "qaa/education-studies-2025/4.5.b5.masters", "qaa/education-studies-2025/4.5.b6.masters", "qaa/education-studies-2025/4.5.b9.masters"]
note: "e3 draws on the master's variants of the level 6 standards."
