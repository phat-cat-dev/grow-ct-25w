  e2:
    practice: "resolves complex governance problems creatively on incomplete data, judges the best way to gather and present policy evidence and leads group work to shared aims"
    knowledge: "systematic and critical awareness of current policy problems and new insights from leading research and practice in public management"
    identity: "an emerging public administrator who analyses the link between academic work and conduct in public office and reflects critically on own learning"
    ids: ["qaa/public-policy-and-public-administration-2025/4.6.b7", "qaa/public-policy-and-public-administration-2025/4.6.b8", "qaa/public-policy-and-public-administration-2025/4.6.b9", "qaa/public-policy-and-public-administration-2025/4.6.b3", "qaa/public-policy-and-public-administration-2025/4.6.b2", "qaa/public-policy-and-public-administration-2025/4.6.b14", "qaa/public-policy-and-public-administration-2025/4.6.b6", "qaa/public-policy-and-public-administration-2025/4.6.b13"]
  e3:
    practice: "applies specialist knowledge with originality across public, private and non-profit settings, negotiates and leads in diverse teams and runs independent policy research and evaluation"
    knowledge: "an in-depth systematic account of public sector organisations and their management and the social and environmental effects of policy and administration"
    identity: "a reflective public servant committed to the public service ethos who acts with integrity and encourages it in others"
