slug: public-policy-and-public-administration-2025
name: "Public Policy and Public Administration (2025)"
run: "std:doc:qaa-public-policy-and-public-administration-2025-benchmarks"
subject: "Public policy and public administration studies how governments and public, private and voluntary bodies make policy and deliver services, so that institutions can be run well and held to account."
subjectIds: ["qaa/public-policy-and-public-administration-2025/3.3", "qaa/public-policy-and-public-administration-2025/2.4", "qaa/public-policy-and-public-administration-2025/1.10", "qaa/public-policy-and-public-administration-2025/1.11"]
rows:
  d3:
    practice: "gathers primary and secondary evidence on a policy problem, analyses it with suitable methods and builds a judged argument about how government or services should respond"
    knowledge: "the main concepts and theories of policy making and public administration, the current evidence base and live problems raised by research and practice"
    identity: "a student of public service who values personal integrity, follows ethical research principles and notices the ethical effects of public decisions"
