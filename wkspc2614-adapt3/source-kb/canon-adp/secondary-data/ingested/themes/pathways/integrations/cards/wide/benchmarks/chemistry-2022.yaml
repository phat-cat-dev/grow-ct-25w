slug: chemistry-2022
name: "Chemistry (2022)"
run: "std:doc:qaa-chemistry-2022-benchmarks"
subject: "Studies the composition, structure, bonding and reactions of substances through theory and laboratory practice, applying that knowledge to innovation and to global challenges such as sustainability."
subjectIds: ["qaa/chemistry-2022/1.7", "qaa/chemistry-2022/1.12", "qaa/chemistry-2022/2.1"]
rows:
  d3:
    practice: "writes and follows risk assessments to make, purify and characterise compounds and to measure and analyse samples accurately, with some independence in the laboratory"
    knowledge: "the core concepts of thermodynamics, kinetics, quantum mechanics, spectroscopy and periodic trends, with the mathematics and analytical techniques needed for familiar chemical problems"
    identity: "a chemist in training who works safely, minimises waste, respects intellectual property and academic integrity and behaves professionally with legal, ethical and social duties in mind"
    ids: ["qaa/chemistry-2022/4.6.b3", "qaa/chemistry-2022/4.6.b4", "qaa/chemistry-2022/4.6.b5", "qaa/chemistry-2022/4.6.b1", "qaa/chemistry-2022/3.3.b4", "qaa/chemistry-2022/4.6.b11", "qaa/chemistry-2022/3.8.b9", "qaa/chemistry-2022/3.3.b3"]
  e2:
    practice: "designs, evaluates and carries through synthesis and analysis largely unaided, devising solutions to unfamiliar problems and completing an open-ended investigation independently"
    knowledge: "deep command of chemical concepts and theory across most core areas, used to predict outcomes and to judge what chemistry contributes to cross-disciplinary issues"
    identity: "a self-directed chemist who proposes how the discipline can tackle present and future global problems and takes a lead within research and laboratory teams"
    ids: ["qaa/chemistry-2022/4.6.b4.excellent", "qaa/chemistry-2022/4.6.b5.excellent", "qaa/chemistry-2022/4.6.b2.excellent", "qaa/chemistry-2022/4.6.b8.excellent", "qaa/chemistry-2022/4.6.b1.excellent", "qaa/chemistry-2022/4.6.b10.excellent", "qaa/chemistry-2022/4.6.b9.excellent", "qaa/chemistry-2022/4.6.b13.excellent"]
  e3:
    practice: "plans projects weighing ethics, hazards, environmental impact and cost, designs investigation methods from critically combined literature and develops advanced experimental skills with growing autonomy"
    knowledge: "systematic, wide-ranging understanding of present-day chemical concepts within a specialism, applied to complex problems and informed by research literature at the forefront"
    identity: "an emerging research chemist ready for doctoral study or equivalent work, who argues persuasively for their own position and devises new approaches when information is incomplete"
    ids: ["qaa/chemistry-2022/4.7.b3", "qaa/chemistry-2022/4.7.b2", "qaa/chemistry-2022/4.7.b4", "qaa/chemistry-2022/4.7.b1", "qaa/chemistry-2022/4.7.b1.excellent", "qaa/chemistry-2022/3.9.b6", "qaa/chemistry-2022/3.9.b2", "qaa/chemistry-2022/3.9.b1"]
