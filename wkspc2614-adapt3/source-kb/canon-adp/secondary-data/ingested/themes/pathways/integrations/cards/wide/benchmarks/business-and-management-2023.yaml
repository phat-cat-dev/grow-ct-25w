    practice: "applies knowledge of marketing, finance, operations and people management to a current organisational setting, analysing data to trace a problem to its causes and choose sustainable solutions"
    knowledge: "the main business functions, from markets and finance to operations and strategy, how they relate within organisations and their governance, held with some critical perspective"
    identity: "a manager in training who puts global social responsibility into practice, values inclusive and ethical leadership and reflects on differences between people and cultures"
