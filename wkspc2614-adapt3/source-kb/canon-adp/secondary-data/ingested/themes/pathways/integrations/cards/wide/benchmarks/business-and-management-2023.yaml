name: "Business and Management (2023)"
run: "std:doc:qaa-business-and-management-2023-benchmarks"
subject: "Studies how organisations of every kind are led, financed, governed and managed within markets and society, preparing graduates to work responsibly as managers, employees and global citizens."
subjectIds: ["qaa/business-and-management-2023/1.10", "qaa/business-and-management-2023/1.26", "qaa/business-and-management-2023/1.15"]
