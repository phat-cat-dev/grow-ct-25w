slug: geography-2022
name: "Geography (2022)"
run: "std:doc:qaa-geography-2022-benchmarks"
subject: "Geography studies people, places and environments and the links between them across space and time, using field, laboratory and spatial methods to inform sustainable decisions."
subjectIds: [qaa/geography-2022/3.15, qaa/geography-2022/1.7]
rows:
  d3:
    practice: "carries out fieldwork and gathers primary and secondary data with surveys, GIS, remote sensing and lab methods, then maps and interprets the results accurately"
    knowledge: "how societies and environments change and interact across scales, why places vary yet rely on each other and how geography's own knowledge was made"
    identity: "a geographer in training who is aware of own positionality, attends to ethics and safety in enquiry and works with others with empathy"
    ids: [qaa/geography-2022/3.30.b3, qaa/geography-2022/3.30.b7, qaa/geography-2022/3.30.b10, qaa/geography-2022/4.8.b5, qaa/geography-2022/4.8.b6, qaa/geography-2022/4.8.b21, qaa/geography-2022/3.30.b2, qaa/geography-2022/4.8.b1]
  e2:
    practice: "designs field research with considered alternatives, applies quantitative and qualitative analysis with sophistication and argues reasoned positions for specialist and lay audiences"
    knowledge: "critical insight into why societies and environments change, how sustainability practice works and how knowledge is produced across the sciences and humanities"
    identity: "a reflective geographer who critically evaluates what own positionality may lead to and leads groups so that every member takes part"
    ids: [qaa/geography-2022/4.8.b13.excellent, qaa/geography-2022/4.8.b15.excellent, qaa/geography-2022/4.8.b22.excellent, qaa/geography-2022/4.8.b5.excellent, qaa/geography-2022/4.8.b7.excellent, qaa/geography-2022/4.8.b10.excellent, qaa/geography-2022/4.8.b21.excellent, qaa/geography-2022/4.8.b25.excellent]
