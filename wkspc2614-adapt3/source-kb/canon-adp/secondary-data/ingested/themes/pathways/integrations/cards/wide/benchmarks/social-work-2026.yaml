slug: social-work-2026
name: "Social Work (2026)"
run: "std:doc:qaa-social-work-2026-benchmarks"
subject: "Social work studies how to support people, families and communities facing need and risk, joining knowledge of law, policy and theory with values of social justice, human rights and respect for dignity."
subjectIds: [qaa/social-work-2026/2.4, qaa/social-work-2026/1.8, qaa/social-work-2026/3.4]
rows:
  d3:
    practice: "assesses need and risk alongside people with lived experience, forms partnerships with them and other agencies and applies theory, law and policy to help improve their outcomes"
    knowledge: "the theory, legal framework, policy and methods of social work and how the profession operates in statutory, independent and voluntary settings across the four UK nations"
    identity: "a social worker in training who puts values and ethics into action with cultural humility, respects each person's dignity, works from strengths and holds professional boundaries"
    ids: [qaa/social-work-2026/4.11.h, qaa/social-work-2026/4.11.y, qaa/social-work-2026/4.11.p, qaa/social-work-2026/4.11.d, qaa/social-work-2026/4.11.b, qaa/social-work-2026/4.11.u, qaa/social-work-2026/4.11.z, qaa/social-work-2026/4.11.dd]
  e2:
    practice: "takes and carries out hard decisions, including restricting someone's liberty, defends them with a broad range of evidence and advocates for people as a professional leader"
    knowledge: "how intersecting identities and disadvantage shape need and risk and how climate harm, conflict and contested politics fall hardest on people already facing poverty or racism"
    identity: "a social worker committed to anti-racist and anti-oppressive practice who challenges discrimination, uses independent judgement within organisations and carries responsibility to the wider world"
    ids: [qaa/social-work-2026/4.11.aa, qaa/social-work-2026/4.11.bb, qaa/social-work-2026/4.11.cc, qaa/social-work-2026/4.11.i, qaa/social-work-2026/4.11.g, qaa/social-work-2026/4.11.k, qaa/social-work-2026/4.11.x, qaa/social-work-2026/4.11.ve]
  e3:
    practice: "exercises professional judgement in ethically difficult cases, interrogates complex concepts with rigour and reflexivity and completes a self-directed inquiry that reaches original insight into practice"
    knowledge: "a sophisticated command of the social work knowledge base and a critically informed view of the forces and varied practice settings that shape the profession"
    identity: "a reflexive social worker who critically examines and applies the profession's core values and ethics through a critical sense of their global social responsibility"
    ids: [qaa/social-work-2026/4.17.judgement, qaa/social-work-2026/4.17.concepts, qaa/social-work-2026/4.17.inquiry, qaa/social-work-2026/4.17.ku, qaa/social-work-2026/4.17.practice, qaa/social-work-2026/4.14.methods, qaa/social-work-2026/4.17.ve, qaa/social-work-2026/4.14.ve]
note: "No typical or excellent standard: above-threshold criteria follow provider marking schemes, so e2 draws on the more demanding level 6 minimum standards. e3 draws on both the integrated master's and postgraduate master's statements."
