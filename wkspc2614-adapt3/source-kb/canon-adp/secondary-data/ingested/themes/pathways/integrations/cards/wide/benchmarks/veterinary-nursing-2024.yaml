slug: veterinary-nursing-2024
name: "Veterinary Nursing (2024)"
run: "std:doc:qaa-veterinary-nursing-2024-benchmarks"
subject: "Veterinary nursing is a science-based vocational subject that prepares students to nurse animals safely and ethically in practice and to join the RCVS register as veterinary nurses."
subjectIds: ["qaa/veterinary-nursing-2024/1.6", "qaa/veterinary-nursing-2024/1.7", "qaa/veterinary-nursing-2024/2.1.b2", "qaa/veterinary-nursing-2024/2.1.b4"]
rows:
  d2:
    practice: "carries out and records a systematic nursing assessment of each patient and plans care with the veterinary team, gaining the owner's consent"
    knowledge: "sound working knowledge of veterinary nursing's core subjects, from animal physiology and anaesthesia to infection control, applied in daily clinical work"
    identity: "a student veterinary nurse who works within the professional code, speaks up for patients while keeping client confidences and owns the care given"
    ids: ["qaa/veterinary-nursing-2024/4.2.b18.foundation", "qaa/veterinary-nursing-2024/4.2.b20.foundation", "qaa/veterinary-nursing-2024/4.2.b25.foundation", "qaa/veterinary-nursing-2024/4.2.b38.foundation", "qaa/veterinary-nursing-2024/4.2.b32.foundation", "qaa/veterinary-nursing-2024/4.2.b21.foundation", "qaa/veterinary-nursing-2024/3.10.b3"]
  d3:
    practice: "uses nursing theory and research to assess patients fully, applies risk-reducing protocols to keep the clinic safe and adapts skills to unforeseen clinical situations"
    knowledge: "robust knowledge of the core veterinary nursing subjects and of the complex professional, ethical and legal framework that governs clinical decisions"
    identity: "a veterinary nurse in training who manages own practice by the RCVS code and weighs up own strengths and limits honestly"
    ids: ["qaa/veterinary-nursing-2024/4.2.b18", "qaa/veterinary-nursing-2024/4.2.b15", "qaa/veterinary-nursing-2024/4.2.b38", "qaa/veterinary-nursing-2024/4.2.b33", "qaa/veterinary-nursing-2024/4.2.b25", "qaa/veterinary-nursing-2024/4.2.b36", "qaa/veterinary-nursing-2024/4.2.b32"]
  e2:
    practice: "critically evaluates research and intervention outcomes to change planned care and runs research that builds the evidence base for clinical practice"
    knowledge: "current issues in animal health and welfare and how social, cultural, legal and economic factors shape the care a patient receives"
    identity: "an accountable veterinary nurse who challenges the care delivered, argues for animal welfare and mentors and supervises others in the practice team"
    ids: ["qaa/veterinary-nursing-2024/4.2.b20", "qaa/veterinary-nursing-2024/4.2.b22", "qaa/veterinary-nursing-2024/4.2.b42", "qaa/veterinary-nursing-2024/4.2.b16", "qaa/veterinary-nursing-2024/4.2.b21", "qaa/veterinary-nursing-2024/4.2.b24", "qaa/veterinary-nursing-2024/4.2.b39"]
  e3:
    practice: "produces research that adds to the veterinary nursing evidence base, improves a practice's risk protocols and sets clinical guidelines autonomously in complex, unpredictable cases"
    knowledge: "advanced specialist and interdisciplinary theory for holistic care in complex cases and how ethical codes apply to strategic decisions with a one health view"
    identity: "a leader and ambassador for veterinary nursing who resolves ethical dilemmas with others and develops the team to give the care patients need"
    ids: ["qaa/veterinary-nursing-2024/4.2.b20.masters", "qaa/veterinary-nursing-2024/4.2.b15.masters", "qaa/veterinary-nursing-2024/4.2.b21.masters", "qaa/veterinary-nursing-2024/4.2.b14.masters", "qaa/veterinary-nursing-2024/4.2.b38.masters", "qaa/veterinary-nursing-2024/4.2.b24.masters", "qaa/veterinary-nursing-2024/4.2.b39.masters", "qaa/veterinary-nursing-2024/4.2.b19.masters"]
note: "Level 6 has honours minimum standards only, with no typical or excellent split: e2 is drawn from the more demanding honours statements on research, critical challenge of care and mentoring. d2 uses the foundation degree statements."
