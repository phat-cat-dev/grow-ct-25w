slug: housing-studies-2022
name: "Housing Studies (2022)"
run: "std:doc:qaa-housing-studies-2022-benchmarks"
subject: "Housing studies examines how homes are produced, allocated, governed and lived in and why housing matters for well-being and social justice, so that graduates can shape fairer and more sustainable housing policy and practice."
subjectIds: [qaa/housing-studies-2022/1.13, qaa/housing-studies-2022/1.23, qaa/housing-studies-2022/1.10]
rows:
  d3:
    practice: "applies suitable research methods to housing questions, builds evidence-based answers to housing problems and involves residents, seldom-heard groups included, in decisions about their homes"
    knowledge: "how housing problems arise and how law and policy have answered them, with the core principles of housing economics, finance and the governance of housing organisations"
    identity: "a housing professional in training who sees the home as central to residents' well-being and takes professional responsibility for equality, diversity and inclusion in housing services"
    ids: [qaa/housing-studies-2022/4.3.b12, qaa/housing-studies-2022/4.3.b13, qaa/housing-studies-2022/4.3.b9, qaa/housing-studies-2022/4.3.b3, qaa/housing-studies-2022/4.3.b10, qaa/housing-studies-2022/4.3.b5, qaa/housing-studies-2022/4.3.b1, qaa/housing-studies-2022/4.8.b4]
  e2:
    practice: "compares housing systems across the UK and abroad, transfers good practice where it fits and devises alternative solutions, environmental ones included, that act on structural inequality"
    knowledge: "a critical and self-aware grasp of housing policy, development, finance and management (above all quickly shifting fields like digital technology) and of lessons from health and criminal justice"
    identity: "a confident, reflective practitioner who challenges the decisions of any housing stakeholder, knows the limits of their own competence and works ethically and resiliently as conditions change"
    ids: [qaa/housing-studies-2022/4.3.b8, qaa/housing-studies-2022/4.8.b6, qaa/housing-studies-2022/4.3.b7, qaa/housing-studies-2022/1.35, qaa/housing-studies-2022/1.15, qaa/housing-studies-2022/1.34, qaa/housing-studies-2022/4.8.b7]
  e3:
    practice: "evaluates current housing research and advanced scholarship, locates where evidence on housing problems runs out and produces new insight for housing policy and professional practice"
    knowledge: "housing knowledge across policy, finance, governance and sustainability held at the leading edge of research and professional practice, with an understanding of how research moves it on"
    identity: "a self-directing housing scholar-practitioner who leads their own academic and professional development and answers for the new insight they bring to the sector (ing's reading)"
    ids: [qaa/housing-studies-2022/4.6.b1.masters, qaa/housing-studies-2022/4.6.b2.masters, qaa/housing-studies-2022/4.6.b3.masters, qaa/housing-studies-2022/4.6.b4.masters, qaa/housing-studies-2022/4.6.masters, qaa/housing-studies-2022/4.7]
note: "No typical or excellent standard: the benchmark leaves 2:2 to first-class criteria to provider marking schemes, so e2 draws on the more demanding level 6 statements. e3 identity is ing's reading."
