slug: counselling-and-psychotherapy-2022
name: "Counselling and Psychotherapy (2022)"
run: "std:doc:qaa-counselling-and-psychotherapy-2022-benchmarks"
subject: "Counselling and psychotherapy studies how people experience distress and how a safe, contracted therapeutic relationship can help and trains reflective, ethical and evidence-informed practitioners for client work."
subjectIds: [qaa/counselling-and-psychotherapy-2022/1.8, qaa/counselling-and-psychotherapy-2022/3.4, qaa/counselling-and-psychotherapy-2022/3.11, qaa/counselling-and-psychotherapy-2022/1.4]
rows:
  d3:
    practice: "assesses client needs and risk, agrees a contract with review points and conducts an episode of therapy within a named ethical code, taking the work to supervision"
    knowledge: "the ethical and legal frame of therapy, from confidentiality limits and data law to safe boundaries, together with several models of mental distress and of the relationship"
    identity: "a counsellor in training who knows their own strengths, limits and biases, looks after their own well-being and holds professional responsibility to clients, employers and society"
    ids: [qaa/counselling-and-psychotherapy-2022/4.11.b22, qaa/counselling-and-psychotherapy-2022/4.11.b26, qaa/counselling-and-psychotherapy-2022/4.9.b6, qaa/counselling-and-psychotherapy-2022/4.10.b1, qaa/counselling-and-psychotherapy-2022/4.7.b1, qaa/counselling-and-psychotherapy-2022/4.8.b1, qaa/counselling-and-psychotherapy-2022/4.8.b2, qaa/counselling-and-psychotherapy-2022/4.6.b7]
  e2:
    practice: "repairs ruptures in the alliance without defensiveness, works openly with differences of power and identity between counsellor and client and finds creative, principled routes through ethical dilemmas"
    knowledge: "critical views of assessment tools and outcome measures, the research base behind practice and how social, political and economic forces shape mental health services"
    identity: "a self-directing practitioner who confronts discrimination at professional and systemic levels and turns a commitment to equality into anti-discriminatory therapeutic work"
    ids: [qaa/counselling-and-psychotherapy-2022/4.12.b6, qaa/counselling-and-psychotherapy-2022/4.12.b8, qaa/counselling-and-psychotherapy-2022/4.9.b23, qaa/counselling-and-psychotherapy-2022/4.11.b3, qaa/counselling-and-psychotherapy-2022/4.6.b11, qaa/counselling-and-psychotherapy-2022/4.7.b4, qaa/counselling-and-psychotherapy-2022/4.6.b12, qaa/counselling-and-psychotherapy-2022/4.6.b13]
  e3:
    practice: "designs and evaluates a sizeable empirical study or systematic review, uses audit to improve therapy and works in depth with chronic distress and intense emotion through reflexive use of self"
    knowledge: "the discourses of diagnosis and psychopathology, the history and philosophy behind both the field and their own approach, plus research at the edge of current knowledge in therapy"
    identity: "a reflexive therapist who speaks out about discriminatory harm and power in services, training and supervision and steers their own continuing academic and professional growth"
    ids: [qaa/counselling-and-psychotherapy-2022/4.17.b9, qaa/counselling-and-psychotherapy-2022/4.17.b8, qaa/counselling-and-psychotherapy-2022/4.17.b3, qaa/counselling-and-psychotherapy-2022/4.17.b11, qaa/counselling-and-psychotherapy-2022/4.17.b10, qaa/counselling-and-psychotherapy-2022/4.17.b4, qaa/counselling-and-psychotherapy-2022/4.17.b2, qaa/counselling-and-psychotherapy-2022/4.17.b5]
note: "No typical or excellent standard: the benchmark leaves 2:2 to first-class criteria to institutional marking schemes, so e2 draws on the more demanding level 6 threshold statements."
