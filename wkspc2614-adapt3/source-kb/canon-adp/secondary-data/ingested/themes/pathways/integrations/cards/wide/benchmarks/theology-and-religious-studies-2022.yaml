slug: theology-and-religious-studies-2022
name: "Theology and Religious Studies (2022)"
run: "std:doc:qaa-theology-and-religious-studies-2022-benchmarks"
subject: "Theology and religious studies examines religions, worldviews and non-religion, their sources, beliefs and lived practice and how they shape identity, ethics and public life in a diverse society."
subjectIds: [qaa/theology-and-religious-studies-2022/3.5, qaa/theology-and-religious-studies-2022/2.20, qaa/theology-and-religious-studies-2022/1.22]
rows:
  d3:
    practice: "analyses the central texts of religious traditions and secondary scholarship with historical, textual, anthropological and theological methods and gathers primary material from texts or fieldwork"
    knowledge: "the key sources of the traditions studied and how they have been read over time, lived religious practice and material culture together with non-religion, atheism and secular culture"
    identity: "a student of religion who is critically aware of their own commitments and prejudices and meets the convictions of others with empathy and integrity"
    ids: [qaa/theology-and-religious-studies-2022/4.7.b2, qaa/theology-and-religious-studies-2022/4.7.b1, qaa/theology-and-religious-studies-2022/4.8.b7, qaa/theology-and-religious-studies-2022/4.6.b5, qaa/theology-and-religious-studies-2022/4.6.b3, qaa/theology-and-religious-studies-2022/4.6.b2, qaa/theology-and-religious-studies-2022/4.8.b2, qaa/theology-and-religious-studies-2022/4.8.b4]
  e2:
    practice: "brings religious ideas into debate with law, the sciences and public life, argues a position while representing rival views fairly and practises with critical insight in unpredictable ministerial settings"
    knowledge: "how religion forms personal and shared identity for good and harm, how religious identities are renegotiated and hybrid and what religions add to public debate on justice and truth"
    identity: "a scholar of religion who listens for marginalised voices in communities and in the field itself and weighs the effects of strong conviction in religious and secular groups alike"
    ids: [qaa/theology-and-religious-studies-2022/4.6.b8, qaa/theology-and-religious-studies-2022/4.8.b3, qaa/theology-and-religious-studies-2022/4.7.b6, qaa/theology-and-religious-studies-2022/4.7.b3, qaa/theology-and-religious-studies-2022/4.6.b4, qaa/theology-and-religious-studies-2022/4.6.b9, qaa/theology-and-religious-studies-2022/4.7.b5, qaa/theology-and-religious-studies-2022/4.7.b4]
  e3:
    practice: "conducts original research on religion with suitable methods, analyses primary sources and scholarship with sophistication and reaches independent conclusions from material it has located itself"
    knowledge: "the complexity of religious subject matter, which sources suit a given inquiry and the ethical questions and codes of practice that research on religion raises"
    identity: "a self-directing researcher who examines the paradigms they use so as to reduce the marginalisation and exclusion those paradigms carry and keeps research ethics in view"
    ids: [qaa/theology-and-religious-studies-2022/A6.b4.masters, qaa/theology-and-religious-studies-2022/A6.b3.masters, qaa/theology-and-religious-studies-2022/A6.b2.masters, qaa/theology-and-religious-studies-2022/A6.b5.masters, qaa/theology-and-religious-studies-2022/A6.b6.masters, qaa/theology-and-religious-studies-2022/A6.b7.masters, qaa/theology-and-religious-studies-2022/A4.s1, qaa/theology-and-religious-studies-2022/A6.b1.masters]
note: "No typical or excellent standard, so e2 draws on the more demanding level 6 threshold statements. e3 draws on the taught master's appendix."
