slug: music-2025
name: "Music (2025)"
run: "std:doc:qaa-music-2025-benchmarks"
subject: "Music studies a body of music with its materials, contexts and technologies, and develops musicians and scholars who make, analyse and present music and help shape its future."
subjectIds: ["qaa/music-2025/4.7.b1", "qaa/music-2025/4.7.b2", "qaa/music-2025/4.8.b1"]
rows:
  d3:
    practice: "makes music with personal expression through fitting technique and interpretation, collaborates in ensembles or improvisation and analyses musical materials and artefacts, reporting findings coherently"
    knowledge: "a body of music with its texts and concepts set within its historical, philosophical, cultural and social contexts"
    identity: "a developing musician who works with self-motivation and self-awareness, respects varied professional and cultural contexts and knows the legal and ethical rules that govern music practice"
    ids: ["qaa/music-2025/4.8.b1", "qaa/music-2025/4.8.b4", "qaa/music-2025/4.7.b4", "qaa/music-2025/4.7.b1", "qaa/music-2025/4.7.b2", "qaa/music-2025/4.9.b2", "qaa/music-2025/4.9.b5", "qaa/music-2025/4.9.b8"]
  e2:
    practice: "performs or creates with an individual musical voice through advanced technique, uses music technology with nuance and flair and leads within a creative team"
    knowledge: "in-depth command of scholarship on musical materials and of the critical debates that arise once music is placed in broader contexts"
    identity: "an ethically alert musician who confronts ethical and political challenges in music, explains the value of musical skills in varied settings and helps shape the future of music"
    ids: ["qaa/music-2025/4.8.b1.typical", "qaa/music-2025/4.8.b5.typical", "qaa/music-2025/4.8.b4.typical", "qaa/music-2025/4.7.b1.typical", "qaa/music-2025/4.7.b2.typical", "qaa/music-2025/4.9.b5.typical", "qaa/music-2025/4.9.b8.typical", "qaa/music-2025/4.9.b11.typical"]
  e3:
    practice: "completes a major practice project or substantial research project in music, weighing methodologies and handling complex creative or scholarly problems with self-direction and originality"
    knowledge: "a systematic, critical understanding of where music research and practice are heading now and of advanced scholarship in a chosen field"
    identity: "an original musician or scholar who generates new insight in a field of music and shares it clearly with specialists and the public (ing's reading)"
    ids: ["qaa/music-2025/4.10.b1.masters", "qaa/music-2025/4.10.b2.masters", "qaa/music-2025/4.10.b3.masters", "qaa/music-2025/4.10.b4.masters", "qaa/music-2025/4.10.b5.masters"]
note: "Level 6 has threshold and typical standards but no excellent standard, so e2 draws on the typical forms. subjectIds are level 6 because the level none statements are procedural. Level 7 gives nothing on ethics or values, so the e3 identity is ing's reading."
