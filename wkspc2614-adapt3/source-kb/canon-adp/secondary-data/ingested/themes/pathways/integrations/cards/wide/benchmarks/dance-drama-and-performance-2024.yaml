slug: dance-drama-and-performance-2024
name: "Dance, Drama and Performance (2024)"
run: "std:doc:qaa-dance-drama-and-performance-2024-benchmarks"
subject: "Dance, drama and performance studies how performance is made, staged and received, joining practical creation in studio and rehearsal with critical study of its histories, settings and industries."
subjectIds: [qaa/dance-drama-and-performance-2024/2.6, qaa/dance-drama-and-performance-2024/3.9, qaa/dance-drama-and-performance-2024/3.12]
rows:
  d3:
    practice: "makes and produces performance through devising and rehearsal, realises scripts, notation or scores through design and staging and documents performance events for later analysis"
    knowledge: "the forms, techniques and local and global histories of performance, its key elements from bodies and space to sound and text and how work is made and received"
    identity: "a performance maker who works safely, ethically and sustainably, manages risk in the studio and respects performance traditions and opinions unlike their own"
    ids: [qaa/dance-drama-and-performance-2024/4.9.b1, qaa/dance-drama-and-performance-2024/4.9.b2, qaa/dance-drama-and-performance-2024/4.9.b3, qaa/dance-drama-and-performance-2024/4.8.b1, qaa/dance-drama-and-performance-2024/4.8.b9, qaa/dance-drama-and-performance-2024/4.8.b12, qaa/dance-drama-and-performance-2024/4.10.b3, qaa/dance-drama-and-performance-2024/3.3.b11]
  e2:
    practice: "selects and refines performance and production choices with critical depth, realises a text or score with sensitivity as new or original work and researches through the making itself"
    knowledge: "a critical command of practitioners, theorists and their cultural settings and of how discourse shapes the way performance and wider culture are represented and received"
    identity: "a performance artist who steers a company constructively through creative and interpersonal tensions and takes full ownership of safe, ethical and sustainable practice"
    ids: [qaa/dance-drama-and-performance-2024/4.12.b1, qaa/dance-drama-and-performance-2024/4.15.b1, qaa/dance-drama-and-performance-2024/4.15.b2, qaa/dance-drama-and-performance-2024/4.15.b4, qaa/dance-drama-and-performance-2024/4.14.b4, qaa/dance-drama-and-performance-2024/4.16.b2, qaa/dance-drama-and-performance-2024/4.16.b5, qaa/dance-drama-and-performance-2024/4.14.b11]
  e3:
    practice: "completes a major practice work or a sizeable research project, choosing methods for complex artistic problems with self-direction and sharing conclusions with specialist and public audiences"
    knowledge: "a systematic and critical grasp of where performance practice and research now stand and where they are moving, informed by advanced scholarship"
    identity: "an original artist-researcher who generates new insight in performance and takes responsibility for directing their own creative enquiry (ing's reading)"
    ids: [qaa/dance-drama-and-performance-2024/4.17.b1, qaa/dance-drama-and-performance-2024/4.17.b2, qaa/dance-drama-and-performance-2024/4.17.b3, qaa/dance-drama-and-performance-2024/4.17.b4, qaa/dance-drama-and-performance-2024/4.17.b5]
note: "e2 draws on both the typical and excellent level statements. e3 identity is ing's reading: the level 7 statements say nothing on values or ethics."
