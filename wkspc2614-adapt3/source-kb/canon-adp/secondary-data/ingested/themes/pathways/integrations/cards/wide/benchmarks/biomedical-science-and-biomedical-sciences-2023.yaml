slug: biomedical-science-and-biomedical-sciences-2023
name: "Biomedical Science and Biomedical Sciences (2023)"
run: "std:doc:qaa-biomedical-science-and-biomedical-sciences-2023-benchmarks"
subject: "Biomedical science studies human health and disease from molecules to whole body systems and uses laboratory investigation to support diagnosis, treatment and multidisciplinary healthcare."
subjectIds: ["qaa/biomedical-science-and-biomedical-sciences-2023/1.2", "qaa/biomedical-science-and-biomedical-sciences-2023/1.12", "qaa/biomedical-science-and-biomedical-sciences-2023/3.3"]
rows:
  d3:
    practice: "runs laboratory tests on clinical samples safely under written risk assessments, interprets the results and plans controlled experiments with attention to bias, ethics and sustainability"
    knowledge: "the clinical laboratory specialisms from cellular pathology, clinical biochemistry and immunology to haematology, transfusion, genetics and microbiology, linked body system by body system to disease and diagnosis"
    identity: "a biomedical scientist in training who works towards registration, takes charge of their own professional development and acts within the legal and ethical duties of healthcare science"
    ids: ["qaa/biomedical-science-and-biomedical-sciences-2023/1.12", "qaa/biomedical-science-and-biomedical-sciences-2023/4.5.b3.threshold", "qaa/biomedical-science-and-biomedical-sciences-2023/4.5.b2.threshold", "qaa/biomedical-science-and-biomedical-sciences-2023/3.4", "qaa/biomedical-science-and-biomedical-sciences-2023/3.3", "qaa/biomedical-science-and-biomedical-sciences-2023/1.2", "qaa/biomedical-science-and-biomedical-sciences-2023/1.30", "qaa/biomedical-science-and-biomedical-sciences-2023/4.5.b16"]
  e2:
    practice: "designs and refines laboratory techniques with marked autonomy, writes risk assessments independently and critically evaluates data and primary literature to solve unfamiliar biomedical problems"
    knowledge: "a wide-ranging grasp of biomedical concepts from molecules to disease, extended by enquiry beyond the course and revised as new findings change the science"
    identity: "a biomedical scientist who evaluates the ethical and social effects of advances such as genetic testing and proposes how the field can meet health challenges"
    ids: ["qaa/biomedical-science-and-biomedical-sciences-2023/4.5.b4.excellent", "qaa/biomedical-science-and-biomedical-sciences-2023/4.5.b3.excellent", "qaa/biomedical-science-and-biomedical-sciences-2023/4.5.b6.excellent", "qaa/biomedical-science-and-biomedical-sciences-2023/4.5.b2.excellent", "qaa/biomedical-science-and-biomedical-sciences-2023/4.5.b1.excellent", "qaa/biomedical-science-and-biomedical-sciences-2023/4.5.b15.excellent", "qaa/biomedical-science-and-biomedical-sciences-2023/4.5.b14.excellent", "qaa/biomedical-science-and-biomedical-sciences-2023/4.5.b8.excellent"]
  e3:
    practice: "interrogates varied scientific literature to design new methods of investigation and runs a substantial research project, weighing its ethics, hazards, sustainability and cost"
    knowledge: "a systematic and wide command of leading-edge biomedical science, drawn together to tackle complex problems at the forefront of the field and outside one's own specialism"
    identity: "an increasingly autonomous biomedical researcher who discusses the likely impact of their work and answers for its ethical and environmental costs (ing's reading)"
    ids: ["qaa/biomedical-science-and-biomedical-sciences-2023/4.5.b18", "qaa/biomedical-science-and-biomedical-sciences-2023/4.5.b17", "qaa/biomedical-science-and-biomedical-sciences-2023/4.5.b17.excellent", "qaa/biomedical-science-and-biomedical-sciences-2023/4.5.b17.threshold"]
note: "No level 5 statements. Covers Biomedical Science (clinical laboratory specialisms) and the wider Biomedical Sciences (pharmacology, nutrition, physiology). d3 knowledge leans on the clinical content. e2 draws on the excellent standards in Table 1. There is no separate typical standard beyond the honours outcomes."
