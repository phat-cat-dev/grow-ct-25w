slug: criminology-2022
name: "Criminology (2022)"
run: "std:doc:qaa-criminology-2022-benchmarks"
subject: "Criminology studies crime, harm, deviance and victimisation and how societies and justice agencies respond, testing theory against evidence to inform fairer responses."
subjectIds: ["qaa/criminology-2022/3.6.b1", "qaa/criminology-2022/3.6.b3", "qaa/criminology-2022/1.20"]
rows:
  d3:
    practice: "chooses suitable qualitative or quantitative methods for a research question, summarises crime and victimisation data and uses it to weigh competing criminological theories"
    knowledge: "the core criminological theories, how victimisation and criminalisation come about and how police, courts, prisons and probation agencies operate and change"
    identity: "a criminology student who reflects on the moral and ethical risks of own research and uses human rights to judge efforts to keep people safe"
    ids: ["qaa/criminology-2022/4.5.b1", "qaa/criminology-2022/4.5.b4", "qaa/criminology-2022/4.5.b10", "qaa/criminology-2022/4.5.b16", "qaa/criminology-2022/4.5.b19", "qaa/criminology-2022/4.5.b25", "qaa/criminology-2022/2.25"]
  e2:
    practice: "critiques the explanatory philosophy of published crime studies and applies criminological concepts to design own research, choosing methods accurately for each problem"
    knowledge: "a critical grasp of how inequality, governance, risk and rights shape responses to lawbreakers and of the political weight carried by competing readings of crime data"
    identity: "a critical criminologist who sees the ethical stakes of every method and holds justice agencies to human rights standards with exceptional rigour"
    ids: ["qaa/criminology-2022/2.3", "qaa/criminology-2022/4.5.b9", "qaa/criminology-2022/4.5.b15", "qaa/criminology-2022/4.5.b18", "qaa/criminology-2022/4.5.b21", "qaa/criminology-2022/4.5.b27", "qaa/criminology-2022/4.5.b12"]
  e3:
    practice: "selects methodologies for complex crime problems and designs and completes an original empirical study, systematic review or case study in a real-world justice setting"
    knowledge: "a systematic understanding of criminological topics, the history and cultural setting of its ideas and how overlapping forms of power shape the work of justice agencies"
    identity: "an independent researcher of crime and justice who carries critical debate forward with some originality and stays alert to power in own work (ing's reading)"
    ids: ["qaa/criminology-2022/4.6.b1", "qaa/criminology-2022/4.6.b2", "qaa/criminology-2022/4.6.b3", "qaa/criminology-2022/4.6.b4", "qaa/criminology-2022/4.6.b5", "qaa/criminology-2022/4.6.b6", "qaa/criminology-2022/2.4"]
note: "Level 6 has explicit threshold, typical and excellent standards: d3 uses threshold, e2 uses typical and excellent."
