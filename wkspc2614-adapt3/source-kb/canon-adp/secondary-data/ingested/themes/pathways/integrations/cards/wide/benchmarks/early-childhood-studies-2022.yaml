slug: early-childhood-studies-2022
name: "Early Childhood Studies (2022)"
run: "std:doc:qaa-early-childhood-studies-2022-benchmarks"
subject: "Early childhood studies examines babies and young children from conception to eight through many disciplines, so that practitioners can support every child's development, well-being, rights and learning with social justice in view."
subjectIds: ["qaa/early-childhood-studies-2022/2.1", "qaa/early-childhood-studies-2022/1.23", "qaa/early-childhood-studies-2022/2.14"]
rows:
  d3:
    practice: "observes and analyses babies' and young children's lives, plans for their safety, health and all-round development and carries out an ethical, supervised empirical study of early childhood"
    knowledge: "diverse childhoods at home and worldwide seen through psychology, sociology, law and other lenses, along with the local, national and global policy that shapes provision for families"
    identity: "an early years graduate practitioner who attunes to children's views and speaks up for them, challenges inequality through anti-bias practice and reflects on the ethics of studying children"
    ids: ["qaa/early-childhood-studies-2022/4.4.b18", "qaa/early-childhood-studies-2022/4.4.b21", "qaa/early-childhood-studies-2022/4.4.b27", "qaa/early-childhood-studies-2022/4.4.b2", "qaa/early-childhood-studies-2022/4.4.b4", "qaa/early-childhood-studies-2022/4.4.b20", "qaa/early-childhood-studies-2022/4.4.b24", "qaa/early-childhood-studies-2022/4.4.b28"]
  e2:
    practice: "designs and reports an empirical study of early childhood with high competence, judges its limits and leads, mentors and collaborates with families and professionals to bring about transformational change"
    knowledge: "a deep, systematic and critical knowledge of diverse childhoods, of the field's origins and limits and of how ethics, economics, politics and culture interweave in children's lives"
    identity: "a reflexive early years advocate who takes charge of own learning, weighs own strengths and weaknesses and challenges injustice with anti-oppressive practice at a highly developed level"
    ids: ["qaa/early-childhood-studies-2022/4.4.b27.excellent", "qaa/early-childhood-studies-2022/4.4.b25.excellent", "qaa/early-childhood-studies-2022/4.4.b2.excellent", "qaa/early-childhood-studies-2022/4.4.b1.excellent", "qaa/early-childhood-studies-2022/4.4.b8.excellent", "qaa/early-childhood-studies-2022/4.4.b33.excellent", "qaa/early-childhood-studies-2022/4.4.b24.excellent", "qaa/early-childhood-studies-2022/4.4.b20.excellent"]
  e3:
    practice: "carries out an independent supervised research project on early childhood, poses and critiques research questions with excellent ability and evaluates research methods critically and reflexively"
    knowledge: "precise, critically engaged knowledge of where the field came from and of rights, equity, justice and sustainability, brought together in ways that yield original thinking"
    identity: "a professionally confident early childhood leader who engages carefully and reflexively with research ethics and evaluates own strengths and weaknesses to steer later learning"
    ids: ["qaa/early-childhood-studies-2022/4.4.b27.masters", "qaa/early-childhood-studies-2022/4.4.b26.masters", "qaa/early-childhood-studies-2022/4.4.b9.masters", "qaa/early-childhood-studies-2022/4.4.b1.masters", "qaa/early-childhood-studies-2022/4.4.b6.masters", "qaa/early-childhood-studies-2022/4.4.b25.masters", "qaa/early-childhood-studies-2022/4.4.b29.masters", "qaa/early-childhood-studies-2022/4.4.b33.masters"]
note: "Each standard has threshold, typical, excellent and master's forms. e2 draws on the excellent forms and e3 on the master's forms."
