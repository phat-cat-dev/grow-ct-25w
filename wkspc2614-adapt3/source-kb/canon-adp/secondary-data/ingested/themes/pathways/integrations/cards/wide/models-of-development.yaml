  - key: kuhn
    group: metacognition
    name: "Kuhn: meta-knowing and epistemological understanding (2000)"
    ref: "Kuhn, D. (2000) Metacognitive development, Current Directions in Psychological Science, 9(5), pp. 178-181; Kuhn, D., Cheney, R. and Weinstock, M. (2000) The development of epistemological understanding, Cognitive Development, 15(3), pp. 309-328; unverified (W-0110)"
    note: "meta-knowing as metacognitive (knowing about knowledge), metastrategic (knowing about strategies) and epistemological (knowing about knowing), with epistemological understanding moving from absolutist to multiplist to evaluativist; sits beside Baxter Magolda; placed by ing"
    subs: ["Meta-knowing", "Epistemological level", Reading]
    rows:
      F:  ["metacognitive", "absolutist", "treats knowledge as certain facts that are right or wrong"]
      i1: ["metacognitive", "absolutist", "knows what the practice is, taking its rules as settled"]
      i2: ["metastrategic", "absolutist", "knows a strategy, taken as the right way to do it"]
      i3: ["metastrategic", "absolutist to multiplist", "begins to see that knowing involves judgement and that strategies differ"]
      d1: ["metacognitive", "multiplist", "sees that the field holds many views, each possibly as good as another"]
      d2: ["metastrategic", "multiplist", "chooses among strategies, with little yet to weigh them by"]
      d3: ["metastrategic", "multiplist to evaluativist", "judges strategies by how well they work and why"]
      e1: ["epistemological", "evaluativist", "weighs claims by evidence and argument rather than taste"]
      e2: ["epistemological", "evaluativist", "holds views that can be defended, and judges between them"]
      e3: ["epistemological", "evaluativist", "examines how own position shapes what one takes as known"]
      L8: ["epistemological", "evaluativist, reflexive", "questions the field's own ways of knowing and argues for changing them"]

