# Wide table: models of development, placed against the rows (ing N-0159)
# version 0.6.0, 4 October 2026, 16:02 (N-0173: Benner and the NHS career framework); 0.5.1, 4 October 2026, 15:58 (N-0171: the policing, Vitae and PSF frameworks removed at Abbott's word); 0.5.0, 4 October 2026, 15:52 (N-0170: Meyer and Land, self-determination theory, Mezirow, the life cycle's theorists and four professional frameworks); 0.4.0, 4 October 2026, 15:40 (N-0168: Shulman, Kuhlthau, Lea and Street, Finlay); 0.3.0, 4 October 2026, 15:27 (N-0164: Lave and Wenger and the student life cycle moved here from the row readings); 0.2.0, 15:20 (N-0161: seven models of knowledge and metacognition); 0.1.0, 15:06 (N-0159)
# A working compilation for ing, never a record. Each model's stages and the placing of each row are ing's reading,
# written in ing's own words. Barnett, SOLO, Anderson and Krathwohl, Marzano and Kendall, Lave and Wenger, Shulman,
# Kuhlthau, Lea and Street and Finlay are checked against META's runs of them (ing:doc:critical-being-barnett-1997,
# ing:doc:solo-biggs-collis-1982, ing:doc:bloom-anderson-krathwohl-2001, ing:doc:new-taxonomy-marzano-kendall-2007, ing:doc:situated-learning-lave-wenger-1991,
# ing:doc:signature-pedagogies-shulman-2005, ing:doc:information-search-process-kuhlthau-1991, ing:doc:academic-literacies-lea-street-1998,
# ing:doc:variants-of-reflexivity-finlay-2002); the life cycle is ing's own; the others are from ing's knowledge, unverified until their texts are held
# (wanted sources W-0063 and W-0105 to W-0110).

models:
  - key: barnett
    name: "Barnett: critical being (1997)"
    ref: "Barnett, R. (1997) Higher Education: A Critical Business. Buckingham: SRHE and Open University Press; the grid of levels and domains, p. 103; checked against META run ing:doc:critical-being-barnett-1997"
    note: "four levels of criticality across three domains: knowledge (critical reason), the self (critical self-reflection) and the world (critical action); placed by ing, level 1 at the Introductory rows, 2 at Intermediate, 3 at the first Advanced rows, 4 at e3 and level 8"
    subs: [Level, "Knowledge: critical reason", "Self: critical self-reflection", "World: critical action"]
    rows:
      F:  ["before level 1", "accepts what is taught as given", "measures self against others' standards without question", "follows instructions to complete tasks"]
      i1: ["1. Critical skills", "discipline-specific critical thinking skills: the field's permitted critical moves, within given standards", "self-monitoring to given standards and norms", "problem-solving: finding the means to a given end"]
      i2: ["1. Critical skills", "discipline-specific critical thinking skills: the field's permitted critical moves, within given standards", "self-monitoring to given standards and norms", "problem-solving: finding the means to a given end"]
      i3: ["1. Critical skills", "discipline-specific critical thinking skills: the field's permitted critical moves, within given standards", "self-monitoring to given standards and norms", "problem-solving: finding the means to a given end"]
      d1: ["2. Reflexivity", "critical thinking: reflecting on own understanding, treating every knowledge claim, own included, as open to challenge", "self-reflection: reflecting on own projects", "reflective practice: adaptable, flexible action that reflects on itself"]
      d2: ["2. Reflexivity", "critical thinking: reflecting on own understanding, treating every knowledge claim, own included, as open to challenge", "self-reflection: reflecting on own projects", "reflective practice: adaptable, flexible action that reflects on itself"]
      d3: ["2. Reflexivity", "critical thinking: reflecting on own understanding, treating every knowledge claim, own included, as open to challenge", "self-reflection: reflecting on own projects", "reflective practice: adaptable, flexible action that reflects on itself"]
      e1: ["3. Refashioning of traditions", "critical thought: working within a body of thought seen as open, so that practices could be otherwise", "developing a self within the traditions one has joined", "mutual understanding and development of traditions with others"]
      e2: ["3. Refashioning of traditions", "critical thought: working within a body of thought seen as open, so that practices could be otherwise", "developing a self within the traditions one has joined", "mutual understanding and development of traditions with others"]
      e3: ["4. Transformatory critique", "knowledge critique: reframing knowledge, questioning a field's categories and its role in society", "reconstruction of self", "critique-in-action: collective reconstruction of the world"]
      L8: ["4. Transformatory critique", "knowledge critique: reframing knowledge, questioning a field's categories and its role in society", "reconstruction of self", "critique-in-action: collective reconstruction of the world"]
  - key: solo
    name: "Biggs and Collis: SOLO taxonomy (1982)"
    ref: "Biggs, J.B. and Collis, K.F. (1982) Evaluating the Quality of Learning: The SOLO Taxonomy. New York: Academic Press, pp. 26-28; checked against META run ing:doc:solo-biggs-collis-1982"
    note: "the structure of the observed learning outcome: the shape of the work, from one relevant point to an integrated whole and beyond it; placed by ing"
    subs: [Level, "Shape of the work"]
    rows:
      F:  ["prestructural to unistructural", "misses the point or picks up one relevant aspect, with guidance"]
      i1: ["unistructural", "picks up one relevant aspect: names, identifies, follows a single procedure"]
      i2: ["multistructural", "handles several relevant aspects separately: describes, lists, carries out a method step by step"]
      i3: ["multistructural", "several aspects held side by side, beginning to check them against each other"]
      d1: ["multistructural to relational", "starts to connect the aspects: compares, contrasts, explains why"]
      d2: ["relational", "integrates the aspects into a whole: analyses, applies, relates theory to a case"]
      d3: ["relational", "an integrated whole that is monitored and adjusted"]
      e1: ["relational", "a coherent whole, justified by explicit criteria"]
      e2: ["extended abstract", "takes the whole beyond the case: generalises, hypothesises, applies to new settings"]
      e3: ["extended abstract", "theorises and reflects on the whole and its assumptions"]
      L8: ["extended abstract", "creates new structures of knowledge others work within"]
  - key: dreyfus
    name: "Dreyfus and Dreyfus: skill acquisition (1980, 1986)"
    ref: "Dreyfus, S.E. and Dreyfus, H.L. (1980) A Five-Stage Model of the Mental Activities Involved in Directed Skill Acquisition. Berkeley: University of California; Dreyfus, H.L. and Dreyfus, S.E. (1986) Mind over Machine. New York: Free Press; applied to nursing in Benner, P. (1984) From Novice to Expert. Menlo Park: Addison-Wesley; unverified (W-0105)"
    note: "five stages from rule-following to intuitive expertise; placed by ing, with the expert stage kept for level 8"
    subs: [Stage, Reading]
    rows:
      F:  ["novice", "follows rules free of context, as given"]
      i1: ["novice", "learns the practice's basic rules and terms and applies them as given"]
      i2: ["novice", "follows a set method step by step, needing the rule to act"]
      i3: ["advanced beginner", "starts to recognise from experience what matters in a situation"]
      d1: ["advanced beginner", "sees the aspects of situations that experience points to, but treats them as equally important"]
      d2: ["competent", "chooses a plan, decides what matters and feels responsible for the outcome"]
      d3: ["competent", "plans deliberately and adjusts when a plan fails"]
      e1: ["competent", "chooses and justifies an approach in an unfamiliar situation"]
      e2: ["proficient", "sees the situation as a whole and what it calls for, then decides how to act"]
      e3: ["proficient", "reads situations holistically and reflects on own judgements"]
      L8: ["expert", "acts fluently from deep experience, without rules, and steps back to analyse when something is new"]
  - key: magolda
    name: "Baxter Magolda: self-authorship (1992, 2001)"
    ref: "Baxter Magolda, M.B. (1992) Knowing and Reasoning in College. San Francisco: Jossey-Bass; Baxter Magolda, M.B. (2001) Making Their Own Way. Sterling, VA: Stylus; unverified (W-0063)"
    note: "the journey to self-authorship (external formulas, the crossroads, becoming the author of one's life, internal foundations) with the earlier ways of knowing (absolute, transitional, independent, contextual) beside it; placed by ing"
    subs: [Phase, "Way of knowing", Reading]
    rows:
      F:  ["following external formulas", "absolute", "takes knowledge as certain and held by authorities, and follows their plans"]
      i1: ["following external formulas", "absolute", "learns what authorities say the practice is and does what they ask"]
      i2: ["following external formulas", "absolute to transitional", "follows set methods while noticing that some answers are uncertain"]
      i3: ["following external formulas", "transitional", "begins to see that knowing involves judgement, though still looks to others for direction"]
      d1: ["the crossroads", "transitional", "feels the strain between others' expectations and an emerging own view"]
      d2: ["the crossroads", "independent", "treats own view as valid and starts to act on it"]
      d3: ["the crossroads", "independent", "notices how own beliefs shape choices and begins to set own direction"]
      e1: ["becoming the author of one's life", "independent to contextual", "chooses beliefs and approaches and can say why"]
      e2: ["becoming the author of one's life", "contextual", "judges knowledge claims by evidence in context and acts from own values"]
      e3: ["self-authorship", "contextual", "defines own beliefs, identity and relationships from within"]
      L8: ["internal foundations", "contextual", "lives from a settled internal foundation, open to question, and supports others' self-authorship"]

  - key: lave-wenger
    name: "Lave and Wenger: legitimate peripheral participation (1991)"
    ref: "Lave, J. and Wenger, E. (1991) Situated Learning: Legitimate Peripheral Participation. Cambridge: Cambridge University Press; checked against META run ing:doc:situated-learning-lave-wenger-1991"
    note: "learning as a newcomer's movement from legitimate peripheral participation towards full participation in a community of practice, and a change of identity; moved from the row readings at N-0164; placed by ing"
    subs: ["Participation"]
    rows:
      F:  ["outside the community, preparing to join"]
      i1: ["legitimate peripheral participation: a newcomer at the edge"]
      i2: ["legitimate peripheral participation: a newcomer at the edge"]
      i3: ["legitimate peripheral participation: a newcomer at the edge"]
      d1: ["increasing participation"]
      d2: ["increasing participation"]
      d3: ["increasing participation"]
      e1: ["towards full participation"]
      e2: ["towards full participation"]
      e3: ["towards full participation"]
      L8: ["full participation that changes the community"]
  - key: life-cycle
    name: "Student life cycle: Gale and Parker (2014), Lizzio (2006)"
    ref: "Gale, T. and Parker, S. (2014) Navigating change: a typology of student transition in higher education, Studies in Higher Education, 39(5), pp. 734-753; Lizzio, A. (2006) Designing an orientation and transition strategy for commencing students. Brisbane: Griffith University (with Lizzio and Wilson's five senses of success: capability, purpose, resourcefulness, connectedness, culture); unverified (W-0114, W-0115)"
    note: "ing's stage of the life cycle (moved from the row readings at N-0164) beside Gale and Parker's three conceptions of transition (induction, development, becoming) and Lizzio's student lifecycle; placed by ing"
    subs: ["Stage (ing)", "Gale and Parker", "Lizzio"]
    rows:
      F:  ["pre-entry: A level, access, foundation year", "before transition", "transition towards"]
      i1: ["transition in: first year", "induction", "transition in"]
      i2: ["transition in: first year", "induction", "transition in"]
      i3: ["transition in: first year", "induction", "transition in"]
      d1: ["progression: second year", "development", "transition through"]
      d2: ["progression: second year", "development", "transition through"]
      d3: ["progression: second year", "development", "transition through"]
      e1: ["transition out: final year, graduate", "becoming", "transition out"]
      e2: ["transition out: final year, graduate", "becoming", "transition out"]
      e3: ["transition out: final year, graduate", "becoming", "transition out"]
      L8: ["postgraduate and professional practice", "becoming", "transition up"]

  - key: shulman
    name: "Shulman: signature pedagogies (2005)"
    ref: "Shulman, L.S. (2005) Signature pedagogies in the professions, Daedalus, 134(3), pp. 52-59; checked against META run ing:doc:signature-pedagogies-shulman-2005"
    note: "a profession forms its members to think, to perform and to act with integrity (head, hand and heart, close to knowledge, practice and self-identity), through a surface, a deep and an implicit structure of teaching; placed by ing, the three dimensions by card position and the structures by tier"
    subs: ["Dimension", "Structure", Reading]
    rows:
      F:  ["before the profession", "generic study", "taught general study habits, not yet any profession's ways"]
      i1: ["to think", "surface", "meets the practice's way of reasoning through its everyday teaching routines"]
      i2: ["to perform", "surface", "practises the practice's routine acts as they are shown and demonstrated"]
      i3: ["to act with integrity", "surface", "picks up the practice's expectations of honesty and care as they are modelled"]
      d1: ["to think", "deep", "learns the assumptions about knowledge that shape how the practice reasons"]
      d2: ["to perform", "deep", "performs the practice knowing why it is taught and done that way"]
      d3: ["to act with integrity", "deep", "begins to hold the practice's values as reasons for own choices"]
      e1: ["to think", "implicit", "reasons as a member, aware of the beliefs built into the community's ways"]
      e2: ["to perform", "implicit", "performs as a practitioner whose conduct carries the profession's attitudes and dispositions"]
      e3: ["to act with integrity", "implicit", "acts with integrity and care and examines the values the practice's teaching passes on"]
      L8: ["all three as one", "what it is not", "thinks, performs and acts with integrity as one, and sees what the practice's teaching leaves out"]
  - key: kuhlthau
    name: "Kuhlthau: the information search process (1991)"
    ref: "Kuhlthau, C.C. (1991) Inside the search process: information seeking from the user's perspective, Journal of the American Society for Information Science, 42(5), pp. 361-371; checked against META run ing:doc:information-search-process-kuhlthau-1991"
    note: "six stages of one search, each in three realms: feelings (affective), thoughts (cognitive) and actions (physical), close to self-identity, knowledge and practice; read by ing as an arc of growing hold on the process across the rows, which the model itself does not claim"
    subs: ["Stage", "Feelings", "Thoughts", "Actions"]
    rows:
      F:  ["initiation", "uncertainty and apprehension", "vague thoughts about the task and what one already knows", "talks over possible topics"]
      i1: ["initiation", "uncertainty, recognised as normal", "recognises a need for information", "discusses possible topics and seeks background"]
      i2: ["selection", "optimism once a topic is chosen", "weighs topics against interest, requirements, information and time", "confers with others and skims a first search"]
      i3: ["exploration", "confusion and doubt as sources disagree", "information will not fit what one holds", "reads to become informed and tolerates inconsistency"]
      d1: ["exploration", "doubt, held rather than fled", "compares sources and constructs", "lists descriptors and reads around the topic"]
      d2: ["formulation", "confidence and clarity begin to grow", "forms a focus from what has been found", "narrows the search to the focus"]
      d3: ["formulation", "the turning point: uncertainty falls", "the focus emerges gradually, like a hypothesis", "reflects on and tests the focus"]
      e1: ["collection", "confidence and interest", "defines, extends and supports the focus", "specifies the need to systems and people and takes detailed notes"]
      e2: ["collection", "sustained engagement", "builds the case around the focus", "seeks relevant, focused information"]
      e3: ["presentation", "relief, with satisfaction or disappointment", "a personal synthesis", "a summary search finds rising redundancy, then organises to present"]
      L8: ["the whole process, tacit", "uncertainty welcomed as the start of enquiry", "syntheses that extend a field", "guides others through the process (ing's reading)"]
  - key: lea-street
    name: "Lea and Street: academic literacies (1998)"
    ref: "Lea, M.R. and Street, B.V. (1998) Student writing in higher education: an academic literacies approach, Studies in Higher Education, 23(2), pp. 157-172; checked against META run ing:doc:academic-literacies-lea-street-1998"
    note: "three models of student writing (study skills, academic socialisation, academic literacies), which the authors present as nested and hierarchical, each taking in the one before (1998), and later as overlapping (2006); placed by ing one to a tier"
    subs: ["Model", Reading]
    rows:
      F:  ["study skills", "writing as surface correctness: grammar, spelling and format, fixed when wrong"]
      i1: ["study skills", "learns the practice's rules as skills to carry from task to task"]
      i2: ["study skills", "applies those skills to set tasks and corrects the errors found"]
      i3: ["study skills, towards socialisation", "begins to notice that the rules shift with the task and the tutor"]
      d1: ["academic socialisation", "is inducted into the discipline's culture and its ways of reading a task"]
      d2: ["academic socialisation", "takes on the community's approaches to learning and its genres"]
      d3: ["academic socialisation", "orients own learning to the community's expectations"]
      e1: ["academic literacies", "moves between disciplines, modules and tutors with different assumptions about writing and knowledge (course switching)"]
      e2: ["academic literacies", "treats writing and learning as questions of knowledge and identity, not only of skill"]
      e3: ["academic literacies", "sees the institution's demands as discourse and power and places own identity among them"]
      L8: ["academic literacies", "makes and contests the community's literacies, shaping what counts as knowledge"]
  - key: finlay
    name: "Finlay: variants of reflexivity (2002)"
    ref: "Finlay, L. (2002) Negotiating the swamp: the opportunity and challenge of reflexivity in research practice, Qualitative Research, 2(2), pp. 209-230; and 'Outing' the researcher, Qualitative Health Research, 12(4), pp. 531-545; checked against META run ing:doc:variants-of-reflexivity-finlay-2002"
    note: "five variants of reflexivity (introspection, intersubjective reflection, mutual collaboration, social critique, discursive deconstruction), which Finlay presents as alternatives, not levels; ordered by ing by widening scope, from the self to the relationship, the participants, power and language; reflexivity begins at i3"
    subs: ["Variant", Reading]
    rows:
      F:  ["before reflexivity", "reflects on what happened, not yet on oneself"]
      i1: ["before reflexivity", "describes events and what was learned from them"]
      i2: ["before reflexivity", "follows a reflective method on events"]
      i3: ["introspection, beginning", "starts to look at own responses as part of what happened"]
      d1: ["introspection", "examines own experience and responses as evidence"]
      d2: ["intersubjective reflection", "examines how relationships with others shape what emerges"]
      d3: ["intersubjective reflection", "adjusts own part in those relationships"]
      e1: ["mutual collaboration", "reflects together with others as co-enquirers"]
      e2: ["social critique", "analyses power and social position (class, gender, race) at play in own work"]
      e3: ["social critique", "places own position within those relations of power"]
      L8: ["discursive deconstruction", "attends to how meanings, own account included, are constructed in language"]

  - key: meyer-land
    name: "Meyer and Land: threshold concepts (2003, 2005)"
    ref: "Meyer, J.H.F. and Land, R. (2003) Threshold concepts and troublesome knowledge: linkages to ways of thinking and practising within the disciplines, in Rust, C. (ed.) Improving Student Learning: Ten Years On. Oxford: OCSLD; Meyer, J.H.F. and Land, R. (2005) Higher Education, 49(3), pp. 373-388; unverified (W-0111)"
    note: "threshold concepts are transformative, irreversible, integrative, bounded and often troublesome; learners pass from a pre-liminal state through a liminal one (oscillation, mimicry) to a post-liminal one; placed by ing so d3 and e3 are crossings"
    subs: ["State", "Reading"]
    rows:
      F:  ["pre-liminal", "meets the practice as a set of tasks, unaware of what lies beyond them"]
      i1: ["pre-liminal", "learns the practice's terms without yet seeing how they change one's view"]
      i2: ["pre-liminal", "follows the method as given"]
      i3: ["entering the liminal", "meets troublesome knowledge: the method stops being enough"]
      d1: ["liminal: oscillation", "moves back and forth between old and new understandings"]
      d2: ["liminal: mimicry", "performs the practice before fully understanding it"]
      d3: ["crossing: post-liminal", "the threshold is crossed: a transformed, integrated view that cannot be unlearned"]
      e1: ["post-liminal, a new threshold ahead", "works from the new view and meets the next troublesome ground"]
      e2: ["liminal again", "holds uncertainty about own values and position"]
      e3: ["crossing: post-liminal", "a second crossing: a transformed sense of oneself as a practitioner"]
      L8: ["liminality as a way of working", "seeks out thresholds and helps others cross them"]

  - key: sdt
    name: "Ryan and Deci: self-determination theory (2000)"
    ref: "Ryan, R.M. and Deci, E.L. (2000) Self-determination theory and the facilitation of intrinsic motivation, social development, and well-being, American Psychologist, 55(1), pp. 68-78; unverified (W-0112)"
    note: "a continuum of regulation from external through introjected, identified and integrated to intrinsic motivation, fed by three basic needs (autonomy, competence, relatedness); placed by ing by indicative level, beside the stance ladder (compliance, purpose, investment, ownership, adaptation, flow)"
    subs: ["Regulation", "Need stressed", "Reading"]
    rows:
      F:  ["external", "competence", "does the work for marks or to avoid trouble"]
      i1: ["external", "competence", "takes up the practice because it is required"]
      i2: ["introjected", "competence", "does it properly to avoid guilt or to look capable"]
      i3: ["identified", "autonomy", "sees the practice's value for own goals"]
      d1: ["introjected to identified", "relatedness", "values the practice as the community does"]
      d2: ["identified", "autonomy", "chooses to do it well because it matters to own work"]
      d3: ["integrated", "autonomy", "the practice fits own values and sense of self"]
      e1: ["identified to integrated", "competence", "applies it confidently because own purpose calls for it"]
      e2: ["integrated", "relatedness", "practises it as part of who one is among others"]
      e3: ["integrated", "autonomy", "owns and adapts the practice as an expression of self"]
      L8: ["intrinsic", "all three", "does the practice for its own sake, in flow, and supports others' motivation"]

  - key: mezirow
    name: "Mezirow: transformative learning (1991, 2000)"
    ref: "Mezirow, J. (1991) Transformative Dimensions of Adult Learning. San Francisco: Jossey-Bass; Mezirow, J. and Associates (2000) Learning as Transformation. San Francisco: Jossey-Bass; unverified (W-0113)"
    note: "learning that transforms frames of reference through critical reflection on content, process and premises, often through phases from a disorienting dilemma to reintegration; placed by ing, the reflection by tier and the phases in the Advanced rows"
    subs: ["Reflection", "Phase", "Reading"]
    rows:
      F:  ["none yet", "before", "takes assumptions as given"]
      i1: ["content", "before", "reflects on what the problem is"]
      i2: ["content", "before", "reflects on what was done"]
      i3: ["content", "before", "notices what went well or badly"]
      d1: ["process", "before", "reflects on how the problem was approached"]
      d2: ["process", "before", "questions the method and its effects"]
      d3: ["process, towards premise", "disorienting dilemma, self-examination", "meets something own frame cannot explain and examines oneself"]
      e1: ["premise", "critical assessment of assumptions", "questions why the problem matters and the assumptions behind it"]
      e2: ["premise", "exploring new roles, planning action", "tries out new ways of seeing and plans to act on them"]
      e3: ["premise", "building competence, reintegration", "takes the new perspective into own life and practice"]
      L8: ["premise, habitual", "beyond", "holds own frames open to question and fosters others' transformation"]

  # Models of knowledge and metacognition (N-0161): their own strip on the page (group: metacognition)
  - key: anderson-krathwohl
    group: metacognition
    name: "Anderson and Krathwohl: knowledge and cognitive processes (2001)"
    ref: "Anderson, L.W. and Krathwohl, D.R. (eds) (2001) A Taxonomy for Learning, Teaching, and Assessing. New York: Longman, p. 29; checked against META run ing:doc:bloom-anderson-krathwohl-2001"
    note: "the knowledge dimension (A factual, B conceptual, C procedural, D metacognitive, with their subtypes) and the cognitive process dimension; formalises the row reading that was 'dominant kind of knowledge'; placed by ing"
    subs: ["Knowledge type", "Cognitive process", Reading]
    rows:
      F:  ["A factual, B conceptual", "remember, understand", "the terms, details and simple ideas a set task needs (Aa, Ab), with a guided procedure"]
      i1: ["A factual, B conceptual", "understand", "the practice's terminology (Aa) and its principles (Bb): what it is and why it matters"]
      i2: ["C procedural", "apply: executing", "the practice's skills and one set method (Ca, Cb), carried out on a familiar task"]
      i3: ["D metacognitive, beginning", "evaluate: checking", "strategic knowledge (Da) of how to check own work, and first self-knowledge (Dc) of own strengths and gaps"]
      d1: ["B conceptual", "understand, analyse", "the practice's theories, models and structures (Bc) and how they work in a discipline"]
      d2: ["C procedural", "apply: implementing", "several methods (Cb) and the criteria for choosing between them (Cc), used on an unfamiliar task"]
      d3: ["D metacognitive, strategic", "evaluate: checking", "strategic knowledge (Da) and knowledge of tasks, contextual and conditional (Db): what works, when and why"]
      e1: ["C procedural with B conceptual", "evaluate: critiquing", "criteria for when to use which procedure (Cc), justified from theory (Bc)"]
      e2: ["C procedural with D metacognitive", "analyse: attributing, evaluate", "procedure joined to knowledge of the task and its context (Db), judging values and intent in own and others' work"]
      e3: ["D metacognitive: self-knowledge", "evaluate, create", "accurate self-knowledge (Dc): own position, strengths and limits as a knower"]
      L8: ["D metacognitive, all three", "create: generating, planning, producing", "knowledge of cognition in general and of own cognition, used to make new knowledge and to teach others"]
  - key: marzano-kendall
    group: metacognition
    name: "Marzano and Kendall: the New Taxonomy (2007)"
    ref: "Marzano, R.J. and Kendall, J.S. (2007) The New Taxonomy of Educational Objectives. 2nd edn. Thousand Oaks: Corwin, p. 62; checked against META run ing:doc:new-taxonomy-marzano-kendall-2007"
    note: "three systems (self, metacognitive, cognitive) and six levels of processing; each tier's third card reaches the metacognitive system and, at Advanced, the self-system; placed by ing"
    subs: [System, "Level of processing", Reading]
    rows:
      F:  ["cognitive", "1. Retrieval", "recognises, recalls and executes what a task needs, without yet grasping its structure"]
      i1: ["cognitive", "2. Comprehension: integrating", "picks out the basic structure of the practice and what matters in it"]
      i2: ["cognitive", "1. Retrieval: executing", "carries out a procedure without significant error, not yet knowing how or why it works"]
      i3: ["metacognitive", "5. Metacognition: monitoring clarity and accuracy", "notices what is still unclear and checks whether own work is right"]
      d1: ["cognitive", "3. Analysis: matching, classifying", "compares and sorts the practice's approaches and finds their likenesses and differences"]
      d2: ["cognitive", "4. Knowledge utilisation: problem solving", "uses the practice to get round obstacles in an unfamiliar task"]
      d3: ["metacognitive", "5. Metacognition: specifying goals, process monitoring", "sets own goals and plans and checks how they are going"]
      e1: ["cognitive", "4. Knowledge utilisation: decision making", "chooses among approaches by weighing them against criteria"]
      e2: ["metacognitive with self", "5. Metacognition, 6. self-system", "monitors own conduct and asks whether the work matters and whether one can do it"]
      e3: ["self", "6. Self-system thinking", "examines the importance of the practice to oneself, own efficacy, emotional response and motivation"]
      L8: ["self", "6. Self-system thinking, with 4. investigating", "engages from settled motivation and investigates the field's knowledge to extend it"]
  - key: zimmerman
    group: metacognition
    name: "Zimmerman: levels of self-regulatory skill (2000)"
    ref: "Zimmerman, B.J. (2000) Attaining self-regulation: a social cognitive perspective, in Boekaerts, M., Pintrich, P.R. and Zeidner, M. (eds) Handbook of Self-Regulation. San Diego: Academic Press, pp. 13-39; unverified (W-0106)"
    note: "four levels by which self-regulatory skill develops (observation, emulation, self-control, self-regulation), each running the cycle of forethought, performance and self-reflection; placed by ing"
