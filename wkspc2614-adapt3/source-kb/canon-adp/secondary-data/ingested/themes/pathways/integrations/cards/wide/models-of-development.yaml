  - key: efklides
    group: metacognition
    name: "Efklides: facets and levels of metacognition (2008)"
    ref: "Efklides, A. (2008) Metacognition: defining its facets and levels of functioning in relation to self-regulation and co-regulation, European Psychologist, 13(4), pp. 277-287; unverified (W-0109)"
    note: "three facets (metacognitive knowledge, experiences and skills) working at the task level, the person level and the social level of co-regulation and shared regulation; placed by ing"
