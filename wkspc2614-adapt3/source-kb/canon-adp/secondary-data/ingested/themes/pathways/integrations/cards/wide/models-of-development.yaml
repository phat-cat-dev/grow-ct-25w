      i3: ["knowledge of self, monitoring", "notices how own work is going and where own difficulties lie"]
      d1: ["knowledge of strategies", "knows several strategies and how they compare"]
      d2: ["planning", "plans which strategy to use and how before starting"]
      d3: ["monitoring", "checks progress while working and changes course when needed"]
      e1: ["evaluating", "judges whether the strategy worked and what to do next time"]
