      i2: ["emulation", "performance", "imitates the model's method with guidance and feedback"]
      i3: ["emulation", "self-reflection", "compares own attempt with the model and notices the gap"]
      d1: ["self-control", "forethought", "uses the practice independently in structured settings, to standards taken from models"]
      d2: ["self-control", "performance", "carries the method out alone, watching own performance against those standards"]
      d3: ["self-regulation", "self-reflection", "adapts the practice to changing conditions, judging results and adjusting strategy"]
      e1: ["self-regulation", "forethought", "sets own goals and chooses strategies for new settings"]
      e2: ["self-regulation", "performance", "regulates effort, attention and emotion while acting under uncertainty"]
      e3: ["self-regulation", "self-reflection", "judges own performance against own standards and reacts constructively"]
      L8: ["self-regulation, modelling for others", "the whole cycle", "self-motivated and adaptive, and models the practice for newcomers to observe"]
  - key: schraw-dennison
    group: metacognition
    name: "Schraw and Dennison: knowledge and regulation of cognition (1994)"
    ref: "Schraw, G. and Dennison, R.S. (1994) Assessing metacognitive awareness, Contemporary Educational Psychology, 19(4), pp. 460-475; unverified (W-0107)"
    note: "knowledge of cognition (declarative, procedural, conditional) and regulation of cognition (planning, information management, monitoring, debugging, evaluation), as in the Metacognitive Awareness Inventory; placed by ing, echoing the cards' shape of knowing what, knowing how and knowing when and why"
    subs: [Component, Reading]
    rows:
      F:  ["knowledge: declarative, little", "knows little yet about own learning, and relies on the task's instructions"]
      i1: ["knowledge: declarative", "knows what the practice is and what kind of learner one is in it"]
      i2: ["knowledge: procedural", "knows how to use a strategy step by step"]
      i3: ["regulation: monitoring", "checks own understanding and work while doing it"]
      d1: ["regulation: information management", "uses strategies to organise, elaborate and summarise what is learned"]
      d2: ["regulation: planning", "plans, sets goals and allocates time and effort before starting"]
      d3: ["regulation: debugging", "spots what is going wrong and changes strategy to fix it"]
      e1: ["knowledge: conditional", "knows when and why to use each strategy"]
      e2: ["regulation: evaluation", "judges own performance and strategy after the work is done"]
      e3: ["knowledge and regulation integrated", "knows and regulates own cognition as a whole, accurately"]
      L8: ["knowledge and regulation, for others", "makes own regulation explicit so others can learn it"]
  - key: eef
    group: metacognition
    name: "Education Endowment Foundation: metacognition and self-regulated learning (2018; 2nd edn 2025)"
