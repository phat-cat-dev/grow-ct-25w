slug: politics-and-international-relations-2023
name: "Politics and International Relations (2023)"
run: "std:doc:qaa-politics-and-international-relations-2023-benchmarks"
subject: "Politics and international relations study power, political ideas and the institutions and behaviour through which people govern themselves and states deal with one another."
subjectIds: ["qaa/politics-and-international-relations-2023/3.2", "qaa/politics-and-international-relations-2023/4.3.b1", "qaa/politics-and-international-relations-2023/4.3.b9"]
rows:
  d3:
    practice: "analyses political ideas, actors, institutions and behaviour with a range of concepts, theories and methods, gathering and interpreting qualitative or quantitative political data"
    knowledge: "power as a contested concept, the main approaches to studying politics and international relations and how national and international political systems are structured and operate"
    identity: "a student of politics who conducts research ethically, reflects critically on their own learning and takes part in multicultural settings at home and abroad"
    ids: ["qaa/politics-and-international-relations-2023/4.3.b12", "qaa/politics-and-international-relations-2023/4.4.b4", "qaa/politics-and-international-relations-2023/3.3.b7", "qaa/politics-and-international-relations-2023/4.3.b1", "qaa/politics-and-international-relations-2023/4.3.b3", "qaa/politics-and-international-relations-2023/3.3.b11", "qaa/politics-and-international-relations-2023/3.3.b4", "qaa/politics-and-international-relations-2023/3.3.b14"]
  e2:
    practice: "frames research questions and hypotheses, reviews the literature critically and plans and runs a self-directed project that interprets evidence soundly and joins the field's debates"
    knowledge: "the normative and explanatory roots of political ideas, the historical, social, economic and cultural contexts of political action and rival accounts of political change"
    identity: "a critical analyst of politics who weighs the ethical consequences of research, judges competing readings of events and questions the vocabulary of political debate"
    ids: ["qaa/politics-and-international-relations-2023/4.4.b2", "qaa/politics-and-international-relations-2023/4.4.b6", "qaa/politics-and-international-relations-2023/4.4.b7", "qaa/politics-and-international-relations-2023/4.3.b7", "qaa/politics-and-international-relations-2023/4.3.b10", "qaa/politics-and-international-relations-2023/4.3.b11", "qaa/politics-and-international-relations-2023/4.4.b3", "qaa/politics-and-international-relations-2023/4.3.b13"]
note: "No level 5 statements. No typical or excellent standard (the statement points to Annex D), so e2 draws on the more demanding level 6 research and critical engagement standards. No e3: the only level 7 statement (1.4) says taught master's degrees demand a higher level of learning but sets no level 7 standards."
