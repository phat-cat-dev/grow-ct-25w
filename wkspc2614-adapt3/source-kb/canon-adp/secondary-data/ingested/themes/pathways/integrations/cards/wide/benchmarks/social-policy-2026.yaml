slug: social-policy-2026
name: "Social Policy (2026)"
run: "std:doc:qaa-social-policy-2026-benchmarks"
subject: "Social Policy studies how welfare is provided, by whom and to whom, analysing how policies on security, health, education and housing meet need, reduce inequality and shape wellbeing."
subjectIds: [qaa/social-policy-2026/2.2.b1, qaa/social-policy-2026/2.2.b2, qaa/social-policy-2026/2.2.b4, qaa/social-policy-2026/1.14]
rows:
  d3:
    practice: "asks what, how, why and for whom of any social problem, compares welfare policies across countries and conducts a supervised research project"
    knowledge: "the origins and work of welfare institutions, core concepts such as need, poverty and citizenship and the ideologies and values that shape provision"
    identity: "a student of welfare who sets own values beside others' values and research evidence and reflects on how own identity shapes views of inclusion"
    ids: [qaa/social-policy-2026/2.1, qaa/social-policy-2026/4.7.b2, qaa/social-policy-2026/4.9.b4, qaa/social-policy-2026/3.3.b1, qaa/social-policy-2026/3.3.b22, qaa/social-policy-2026/4.8.b3, qaa/social-policy-2026/1.20, qaa/social-policy-2026/1.39]
  e2:
    practice: "designs and completes an independent welfare research project to ethical standards, sorts welfare states into types and devises and tests evidenced policy responses"
    knowledge: "a critical synthesis of the subject's theories and methods, with sustainable development and the UN goals placed at the core of policy analysis"
    identity: "an analyst sensitive to diverse needs who separates values from evidence and judges how far lived experience should steer policy"
    ids: [qaa/social-policy-2026/4.9.b4.excellent, qaa/social-policy-2026/4.8.b5.excellent, qaa/social-policy-2026/4.7.b2.excellent, qaa/social-policy-2026/4.9.b3.excellent, qaa/social-policy-2026/4.7.b3.excellent, qaa/social-policy-2026/4.7.b4.excellent, qaa/social-policy-2026/4.8.b4.typical, qaa/social-policy-2026/4.8.b4.excellent]
  e3:
    practice: "compares welfare regimes and policy-making styles across jurisdictions, maps stakeholders from claimants to ministers and runs an independent dissertation with ethical research"
    knowledge: "deep expertise in one policy area such as housing or pensions and in one form of social injustice, with how norms and worldviews define it"
    identity: "a reflexive public servant committed to social value, attentive to decolonisation and sustainability and aware of own continuing learning needs"
