    knowledge:
    - id: fheq-2024/4.12.b4
      here: knows where own critical habits are thin and how those gaps limit the judgements made about sources and arguments in the discipline
      evidence: a self-audit of reading habits in psychology, a limitations section in a geography project and a reflective note on bias in law
    identity:
    - id: fheq-2024/4.12.b7
      here: builds on early critical skills and adds new ones, becoming someone who questions as a matter of habit and who could carry that responsibility into a workplace or profession
      evidence: a personal development plan in business, a professional practice portfolio in teacher education and a skills reflection in computing
  d1:
    practice:
    - id: fheq-2024/4.10.b2
      here: picks out where a model text breaks an argument into its parts and where it judges the worth of evidence, comparing how qualitative and quantitative material is weighed
      evidence: an annotated model essay in sociology, a marked-up results section in biology and a comparison of two case analyses in business
    knowledge:
    - id: fheq-2024/4.10.b1
      here: understands analysis and evaluation as distinct critical concepts, knows how each works in own subject and why the discipline asks for both
      evidence: a short answer defining analysis and evaluation in psychology, a concept map in education and a glossary task in history
    identity:
    - id: fheq-2024/4.10.b5
      here: takes on the community's ways of reading and judging through structured tasks, becoming a newcomer who starts to see how scholars in the discipline weigh work
      evidence: a guided reading group record in English, a structured peer review sheet in nursing and a tutor-led analysis exercise in economics
  d2:
    practice:
    - id: fheq-2024/4.12.b5
      here: breaks a scholarly interpretation into claim, evidence and reasoning with set techniques, then judges where it holds and proposes what a stronger reading would need
      evidence: a critical review of an article in criminology, an evaluation of a historical interpretation in history and a critique of a model in economics
