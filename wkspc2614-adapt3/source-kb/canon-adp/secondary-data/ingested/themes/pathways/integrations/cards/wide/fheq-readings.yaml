criticality:
  i2:
    practice:
    - id: fheq-2024/4.10.b3
      here: asks whether a chosen search term, database or essay plan suits the question in hand, notes why one route fits better than another and adjusts the choice before going further
      evidence: a search log annotated with reasons in nursing, a reading list justified in history and an essay plan with rationale notes in sport science
    knowledge: []
    identity:
    - id: fheq-2024/4.10.b5
      here: tries out critical questioning as a new skill inside a guided first-year module, growing personally from a student who accepts choices to one who asks why they were made
      evidence: a reflective learning journal in education, a guided critical questions worksheet in biology and a tutor-marked planning task in business
  i3:
    practice:
    - id: fheq-2024/4.12.b5
      here: uses familiar techniques such as claim and evidence checks to question everyday study choices such as which source to trust and suggests a better choice when one falls short
      evidence: a source credibility check in public health, an annotated reading of a policy text in social work and a problem analysis in engineering
    - id: fheq-2024/4.12.b2
