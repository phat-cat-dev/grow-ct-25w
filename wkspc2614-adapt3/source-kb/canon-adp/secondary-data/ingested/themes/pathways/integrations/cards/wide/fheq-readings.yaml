# Wide table: FHEQ descriptors read into each academic practice's practice, knowledge and self-identity (ing N-0176)
# version 0.2.1, 4 October 2026, 16:39 (N-0179: two level 8 entries refined); 0.2.0, 4 October 2026, 16:36 (N-0178: level 8 knowledge entries for 4.18.b1 and b6, written by ing); 0.1.0, 4 October 2026, 16:27
# The formula (Abbott): FHEQ descriptor + the pathway's practice and knowledge = the practitioner's practice, knowledge and
# self-identity. For each descriptor matched to a reading in `fheq-equivalences.yaml`: what it looks like in this practice in the
# student's disciplinary, professional and personal academic development (`here`), and how it is evidenced across the
# disciplines (`evidence`). Drafted by four agents to `fheq-readings-brief.md`; checked by script (the ids and their order match
# the equivalences, length, house style, no seven words of the descriptor's paraphrase). ing's reading, unruled.
academic-writing:
  i2:
    practice:
    - id: fheq-2024/4.10.b4
      here: works through the writing cycle from task analysis to a complete first draft, setting out what the study found in a structured and accurate way
      evidence: a first draft lab report in chemistry, a structured reflective essay in nursing and a planned short essay in history
    knowledge: []
    identity:
    - id: fheq-2024/4.10.b5
      here: tries out writing as a staged process within a supported module, growing from someone who writes in one sitting into a student who plans and drafts
      evidence: a writing process journal in education, a staged draft submission in psychology and a guided planning template in business
  i3:
    practice: []
    knowledge: []
    identity:
    - id: fheq-2024/4.12.b8
      here: becomes a writer who takes personal responsibility for checking and correcting own work before it goes out, a habit any workplace values
      evidence: a proofreading checklist with a final essay in sociology, an edited care record in nursing and a corrected technical report in engineering
  d1:
    practice:
    - id: fheq-2024/4.10.b4
      here: structures own writing with an introduction, argued body and conclusion, reporting what the work found clearly and in the shape the genre expects
      evidence: an introductory essay in English, a short project report in engineering and a practical report in sport science
    - id: fheq-2024/4.10.b2
      here: compares how essays and reports build arguments and uses evidence, both qualitative and numerical, to reach a sound judgement grounded in core theory
      evidence: a short argued essay in psychology, a data-led report in geography and a case discussion in business
    knowledge: []
    identity:
    - id: fheq-2024/4.10.b5
      here: learns the writing conventions of the academic community through structured tasks, becoming a newcomer who starts to write as the discipline does
      evidence: a genre comparison task in education, a structured essay plan in history and a guided report template in biology
  d2:
    practice:
    - id: fheq-2024/4.12.b6
      here: writes and rewrites sentences so the actor leads and the verb is active, cutting padding so analysis reads clearly to specialist and general readers
      evidence: a revised discussion section in psychology, a plain-language summary in public health and an edited case report in law
    knowledge: []
    identity:
    - id: fheq-2024/4.12.b8
      here: takes personal responsibility for the clarity of own sentences, becoming a writer who decides how to phrase a point instead of waiting to be corrected
      evidence: a self-edited essay with tracked changes in sociology, a revised client letter in social work and a concise briefing in business
  d3:
    practice:
    - id: fheq-2024/4.15.b8
      here: reviews own paragraphs against the four pillars and redrafts weak ones so ideas, problems and solutions come across to both expert and general readers
      evidence: a redrafted report in environmental science, a revised essay with pillar annotations in history and a restructured project write-up in computing
    knowledge: []
    identity:
    - id: fheq-2024/4.15.b5
      here: becomes a self-regulating writer who manages own revision, letting personal standards and the four pillars steer redrafting without a tutor setting each step
      evidence: a reflective revision log in English, a self-assessed draft in nursing and a personal writing development plan in psychology
  e1:
    practice:
    - id: fheq-2024/4.12.b2
      here: applies writing principles learned in own discipline to a neighbouring one or a workplace task, justifying which conventions carry over and which change
      evidence: a cross-disciplinary report in environmental studies, a placement report in social work and a technical brief for a client in engineering
    - id: fheq-2024/4.12.b6
      here: chooses the style, structure and evidence an unfamiliar task demands and writes for its specialist or general readers with the discipline's techniques
      evidence: a policy brief in politics, a lab report in biology and a reflective account in nursing
    knowledge: []
    identity:
    - id: fheq-2024/4.12.b8
      here: becomes a writer with a voice of their own who decides on conventions and can give reasons, the judgement a professional writer must exercise
      evidence: a commentary on stylistic choices in English, a justified report format in business and a reflective statement in teacher education
  e2:
    practice:
    - id: fheq-2024/4.15.b3.1
      here: makes own point first in each paragraph, then draws on current sources to support, extend or challenge it so the argument holds across the work
      evidence: an argued essay in sociology, a literature review in nursing and a discussion section in sport science
    - id: fheq-2024/4.15.b5
      here: chooses and integrates refereed articles and primary sources independently, deciding which to use and where, rather than listing what others have said
      evidence: a source-integrated essay in history, an evidence-based practice paper in nursing and a referenced project report in engineering
    knowledge: []
    identity:
    - id: fheq-2024/4.15.b9.1
      here: becomes a writer whose own argument leads and whose values show, taking the initiative a responsible professional needs when arguing a case
      evidence: a position paper in law, a reflective argued essay in philosophy and a professional proposal in business
  e3:
    practice:
    - id: fheq-2024/4.17.b5
      here: drafts and redrafts a dissertation, then recasts the same complex work as an abstract and a professional report with clear conclusions for each reader
      evidence: a master's dissertation and abstract in psychology, an executive summary in management and a practice report in nursing
    knowledge: []
    identity: []
  L8:
    practice:
    - id: fheq-2024/4.18.b1
      here: writes a thesis and journal articles from original research and revises them in answer to reviewers until the work is fit to publish and extends the field
      evidence: a doctoral thesis in history, a peer-reviewed article in biomedical science and a monograph chapter in philosophy
    - id: fheq-2024/4.18.b5
      here: writes a grant proposal and a plain-language summary from the same research, judging what each specialist or lay reader needs and stating conclusions clearly
      evidence: a funding bid in engineering, a lay summary in health research and a policy briefing in social science
    knowledge:
    - id: fheq-2024/4.18.b1
      here: 'defines new knowledge in language: the written argument is where the claim is made, bounded, qualified and offered to the discipline''s debate'
      evidence: a doctoral thesis in English, a journal article in physics and a book chapter in anthropology
    identity:
    - id: fheq-2024/4.18.b6
      here: becomes a scholarly author whose continuing writing adds new ideas and approaches that others read, cite and build on
      evidence: a publication record in sociology, a cited methods paper in psychology and an edited collection in history
    - id: fheq-2024/4.18.b7
      here: becomes an author who takes responsibility for own published work and handles review, editing and public reaction with largely autonomous judgement
      evidence: a response to reviewers in medicine, an editorial role record in education and a commissioned report in public policy
ai-technology:
  i2:
    practice:
    - id: fheq-2024/4.10.b5
      here: the student learns a new study habit inside a set structure, reading the module's guidance on AI before opening a tool and asking the tutor when a rule is unclear
      evidence: a note on AI rules kept with a chemistry lab brief, a query to a nursing module leader and a checked essay brief in history
    knowledge: []
    identity:
    - id: fheq-2024/4.10.b6
      here: the student starts to own small decisions about AI, keeping to the rules without being told and building the dependable habits that early placements and part-time work expect
      evidence: a signed AI declaration on a biology assignment, a placement log in social work and a design brief annotated with module AI rules
  i3:
    practice:
    - id: fheq-2024/4.12.b5
      here: the student thinks a task through first, then tests AI output with familiar checks, catching invented references, biased framing and privacy risks and saying what to do instead
      evidence: a corrected reference list in psychology, an annotated AI summary in law and a lab report that flags a fabricated method in physics
    knowledge:
    - id: fheq-2024/4.12.b4
      here: the student understands the limits of what AI can supply and of their own grasp of a topic and sees how reaching for AI too soon weakens later analysis
      evidence: a reflective note in education, a limitations section in a sociology essay and a revised engineering calculation after an AI error
    identity:
    - id: fheq-2024/4.12.b8
      here: the student begins to see themself as a careful user who decides when AI output can be trusted, a stance that carries into placements and graduate work
      evidence: a placement reflection in nursing, a project log in computing and a portfolio statement on AI choices in graphic design
  d1:
    practice:
    - id: fheq-2024/4.10.b2
      here: the student asks AI to challenge a draft, weighs each objection against the subject's core theories and evidence and decides which points earn a place in the argument
      evidence: a revised essay with tracked changes in history, a discussion section in a sport science lab report and a business case argument
    knowledge:
    - id: fheq-2024/4.10.b3
      here: the student understands a critical-use workflow and why AI suits the role of questioning friend better than author for the problems their discipline sets
      evidence: a workflow diagram in computing, a short reflective commentary in English literature and a method note in a geography field report
    identity:
    - id: fheq-2024/4.10.b5
      here: the student joins the community's ways of using AI critically through guided practice, taking on new skills in seminars and workshops their tutors structure
      evidence: a workshop worksheet in law, a peer feedback record in nursing and a studio critique log in fine art
  d2:
    practice:
    - id: fheq-2024/4.12.b5
      here: the student checks each AI claim and reference against reliable sources, analyses where the output fails and writes a disclosure that acknowledges, describes and evidences the use
      evidence: a verified reference list in psychology, an AI disclosure appended to a marketing report and a checked data table in environmental science
    knowledge:
    - id: fheq-2024/4.12.b3
      here: the student knows the criteria for fact-checking AI output alongside the discipline's own methods of verification and judges which checks a given claim needs
      evidence: a source evaluation grid in history, a methods appendix in a biomedical lab report and a case study audit in social work
    identity:
    - id: fheq-2024/4.12.b8
      here: the student takes personal responsibility for every use of AI in their work, making and standing by decisions an employer would expect them to explain
      evidence: a disclosure statement in an accounting report, a supervision record in nursing and a design rationale in architecture
  d3:
    practice:
    - id: fheq-2024/4.15.b5
      here: the student manages their own learning by deciding task by task whether AI helps, recording reasons and returning to refereed articles and primary sources when AI would cut the learning
      evidence: a learning journal in education, a literature review built from primary sources in history and a decision log in a computing project
    - id: fheq-2024/4.15.b7
      here: the student weighs the case for and against AI on each task, tests the assumptions behind easy shortcuts and frames the question that settles the choice
      evidence: a reasoned methods choice in a psychology dissertation, a reflective essay in philosophy and a project plan in product design
    knowledge: []
    identity:
    - id: fheq-2024/4.15.b9.1
      here: the student acts on their own initiative to hold back from AI when learning matters, taking personal responsibility for habits no one else monitors
      evidence: a personal development plan in business, a placement reflection in occupational therapy and a studio journal in fashion
    - id: fheq-2024/4.15.b9.2
      here: the student lets their values steer AI decisions in unfamiliar tasks where rules give no clear answer, a capacity graduate roles in changing settings demand
      evidence: a reflective case study in social work, a group project log in engineering and an ethics commentary in media studies
  e1:
    practice:
    - id: fheq-2024/4.12.b5
      here: the student audits their own AI use against misconduct risks, traces every claim back to its original source and analyses gaps where no source can be found
      evidence: a source trail behind a law essay, an audited reference list in nursing and a checked results section in a chemistry lab report
    knowledge: []
    identity:
    - id: fheq-2024/4.12.b8
      here: the student becomes an author with a voice of their own who answers for every submitted word, a responsibility that carries into professional writing
      evidence: a signed authorship statement on a history dissertation proposal, a clinical report in physiotherapy and a client brief in marketing
  e2:
    practice:
    - id: fheq-2024/4.15.b7
      here: the student judges hard cases of AI use, testing the assumptions on each side and reasoning to where permitted support ends and unfair advantage begins
      evidence: a case analysis in law, a seminar paper on assessment ethics in education and a reflective essay in computing
    - id: fheq-2024/4.15.b8
      here: the student explains the line between support and unfair advantage to peers and tutors, adjusting the explanation for newcomers and for subject specialists
      evidence: a peer guidance leaflet in nursing, a seminar presentation in philosophy and a short explainer video in media production
    knowledge: []
    identity:
    - id: fheq-2024/4.15.b9.1
      here: the student takes the initiative to act fairly with AI, treating fairness to others as a personal value rather than a rule imposed from outside
      evidence: a values statement in a business portfolio, a professional reflection in teacher education and a group charter in engineering
    - id: fheq-2024/4.15.b9.2
      here: the student makes fair AI decisions in unclear and shifting situations, a judgement graduate employers rely on as tools change faster than policy
      evidence: a reflective case study in social work, a project retrospective in software engineering and an ethics commentary in journalism
  e3:
    practice:
    - id: fheq-2024/4.17.b5
      here: the student evaluates an AI tool systematically for a dissertation or job, weighing accuracy, bias, data protection and environmental cost with incomplete evidence and reporting the decision clearly
      evidence: a tool appraisal in a public health dissertation, a risk assessment for a business client and a methods justification in archaeology
    - id: fheq-2024/4.17.b6
      here: the student plans and carries out a tool evaluation independently at a professional standard, devising their own criteria where none are given
      evidence: a data management plan in biology, a consultancy report in management and a practice proposal in architecture
    knowledge:
    - id: fheq-2024/4.17.b1
      here: the student understands the wider costs and benefits of AI systematically and stays alert to current debates on bias, privacy and sustainability in their field
      evidence: a critical review in computing, a policy analysis in environmental science and a literature review on AI in nursing practice
    identity:
    - id: fheq-2024/4.17.b8.1
      here: the student becomes a professional who chooses on their own initiative whether AI belongs in the work, answering to conscience as well as convenience
      evidence: a professional statement in a law portfolio, a capstone reflection in engineering and a practice journal in counselling
    - id: fheq-2024/4.17.b8.2
      here: the student decides on AI use in complex and unpredictable work settings, weighing harms to others where no policy yet applies
      evidence: a placement case study in social work, a client project report in data science and an ethics reflection in journalism
  L8:
    practice:
    - id: fheq-2024/4.18.b5
      here: the researcher judges complex questions of AI in research, writes them into data management and ethics plans and explains the case to colleagues and policy makers
      evidence: a research ethics application in psychology, a departmental AI policy in engineering and a methods paper in digital humanities
    knowledge:
    - id: fheq-2024/4.18.b1
      here: makes and reports new knowledge with AI in the method while showing how its use shapes what counts as reliable and attributable
      evidence: an AI-assisted analysis in linguistics, a computational study in bioinformatics and a disclosure of AI use in a law thesis
    - id: fheq-2024/4.18.b2
      here: the researcher holds a systematic grasp of AI's methodological, ethical and legal implications for research and publishing at the forefront of their own field
      evidence: a thesis chapter on research ethics in sociology, a journal article in bioinformatics and a doctoral review in law
    - id: fheq-2024/4.18.b4
      here: the researcher understands in detail how AI changes the techniques of enquiry their field relies on, from data handling to analysis and peer review
      evidence: a methods chapter in computational linguistics, a data management plan in genomics and a viva defence in education
    identity:
    - id: fheq-2024/4.18.b7
      here: the researcher becomes a voice who helps the field decide how AI should and should not be used, acting autonomously in fast-changing professional settings
      evidence: a research group AI policy in chemistry, a conference panel contribution in media studies and editorial guidance for a journal in history
creativity:
