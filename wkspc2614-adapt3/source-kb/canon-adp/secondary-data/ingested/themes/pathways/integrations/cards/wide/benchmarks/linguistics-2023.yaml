slug: linguistics-2023
name: "Linguistics (2023)"
run: "std:doc:qaa-linguistics-2023-benchmarks"
subject: "Linguistics studies how human language is structured, acquired, varied and used, analysing language data from sound to discourse to explain its place in mind and society."
subjectIds: ["qaa/linguistics-2023/1.19.b4"]
rows:
  d3:
    practice: "collects or elicits language data through corpora, interviews or fieldwork, transcribes it and analyses it level by level using tree diagrams, tables and transcription conventions"
    knowledge: "the core areas of linguistic analysis, phonetics through to discourse, the technical terms for describing language phenomena and the domains of acquisition, variation, change and cognition"
    identity: "a linguistics student who handles speakers' data ethically and respects the linguistic, social and cultural diversity of the people studied"
    ids: ["qaa/linguistics-2023/4.5.b1", "qaa/linguistics-2023/4.5.b4", "qaa/linguistics-2023/4.5.b5", "qaa/linguistics-2023/4.5.b9", "qaa/linguistics-2023/4.3", "qaa/linguistics-2023/4.4", "qaa/linguistics-2023/4.6.b5", "qaa/linguistics-2023/1.13"]
  e2:
    practice: "builds and tests hypotheses about language structure, weighs rival analyses of one data set and applies linguistic research to problems such as institutional language policy"
    knowledge: "how theory decides what counts as linguistic evidence and how language encodes ideology, power and the representation of minority groups"
    identity: "a linguist who questions language ideologies and conveys knowledge about language with authority and care to those who set policy"
    ids: ["qaa/linguistics-2023/4.5.b6", "qaa/linguistics-2023/4.5.b7", "qaa/linguistics-2023/4.5.b8", "qaa/linguistics-2023/4.5.b10", "qaa/linguistics-2023/4.5.b11", "qaa/linguistics-2023/4.5.b12", "qaa/linguistics-2023/4.6.b15", "qaa/linguistics-2023/1.26"]
note: "Level 6 only, with threshold standards and no typical or excellent split: e2 is drawn from the more demanding threshold statements on theory, ideology and policy."
