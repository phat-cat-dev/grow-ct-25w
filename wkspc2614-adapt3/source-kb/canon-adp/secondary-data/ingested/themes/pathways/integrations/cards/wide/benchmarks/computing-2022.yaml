slug: computing-2022
name: "Computing (2022)"
run: "std:doc:qaa-computing-2022-benchmarks"
subject: "Computing studies the lasting theory and the practice of designing, building and deploying computational systems, and applies them to real problems while weighing their effects on users and society."
subjectIds: ["qaa/computing-2022/2.6.b3", "qaa/computing-2022/2.6.b4", "qaa/computing-2022/2.7"]
rows:
  d3:
    practice: "analyses a clearly specified problem, then designs, builds, tests and deploys a computing system and its artefacts, planning and organising the work in a team under guidance"
    knowledge: "the core body of computing knowledge, how the stages of the system lifecycle connect and how to use that grounding to learn new technologies as they emerge"
    identity: "a computing professional in training who works within a legal and ethical framework covering data use, security, inclusion and sustainability and who acts with integrity and respect towards others"
    ids: ["qaa/computing-2022/4.6.b1", "qaa/computing-2022/4.6.b2", "qaa/computing-2022/4.6.b3", "qaa/computing-2022/4.6.b4", "qaa/computing-2022/4.6.b5", "qaa/computing-2022/4.6.b6", "qaa/computing-2022/3.15", "qaa/computing-2022/1.19.b1"]
  e2:
    practice: "builds highly effective computational artefacts for complex, unpredictable problems with considerable autonomy, using research design and evidence-informed evaluation and leading a project team with little guidance"
    knowledge: "an exceptional grasp of core computing knowledge applied creatively beyond what was taught, with a critical command of concepts and practices in open-ended scenarios"
    identity: "a principled computing professional who reaches highly reasoned solutions that weigh data use, security, inclusion and sustainability consistently across own work"
    ids: ["qaa/computing-2022/4.6.b1.excellent", "qaa/computing-2022/4.6.b2.excellent", "qaa/computing-2022/4.6.b3.excellent", "qaa/computing-2022/4.6.b4.excellent", "qaa/computing-2022/4.6.b5.excellent", "qaa/computing-2022/4.6.b6.excellent"]
  e3:
    practice: "applies state-of-the-art computing techniques systematically in highly complex scenarios, decides soundly when data are incomplete and builds comprehensive computational artefacts through original research design"
    knowledge: "systematic understanding of a computing specialism shaped by its research forefront, with critical awareness of current problems and of how research techniques create and interpret knowledge"
    identity: "a self-directed computing professional who understands professional ethics, integrity and responsibility, reflects on own progress as a learner and acts on principle in complex professional settings"
    ids: ["qaa/computing-2022/4.8", "qaa/computing-2022/4.9", "qaa/computing-2022/4.14.b1.typical", "qaa/computing-2022/4.14.b1.excellent", "qaa/computing-2022/4.14.b3.excellent", "qaa/computing-2022/4.14.b4.excellent", "qaa/computing-2022/4.14.b5.excellent", "qaa/computing-2022/4.14.b6.excellent"]
note: "e2 draws on the excellent rung of the level 6 descriptors. The level 7 descriptors also have typical and excellent rungs, and e3 leans on the excellent ones."
