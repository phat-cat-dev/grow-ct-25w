vicSummary: "What this shows: ten of the twenty-one extracts are skill, more than any other pathway: risk-taking and failure as method, lateral thinking, a problem-solving approach, agility, generating ideas and making them happen. The benchmarks describe creativity as a learner's capability across subjects, which supports the tier map's framing of it as a foundational academic skill, not an arts topic."

across:
  - "**The guide's vocabulary against the benchmarks':** the guide is silent; the tier map says developable skill, divergent and convergent thinking, barriers, framing and reframing, combinatorial creativity, the adjacent possible, cognitive flexibility, enterprise awareness, entrepreneurial mindset, value creation; the benchmarks say creativity, originality, idea generation, lateral thinking, risk-taking, experimentation, failure, agility, innovation, entrepreneurship. Both belong in the practice searcher's vocabulary for this pathway."
  - "**Skill against theme:** ten of the twenty-one extracts are skill."
  - "**Book coverage:** none; the cards' topics come from the tier map and its institutional and QAA sources, which need subject expert sign-off."
  - "**Other authors:** META holds Anderson and Krathwohl (create as the highest process) and Advance HE's enterprise model as a standards run; Guilford, Kaufman and Beghetto, QAA (2018) and the institutional guide are wanted (W-0097, W-0096, W-0095, W-0094)."

qfIntro: "Neither framework names creativity until L7, where the FHEQ names originality; below that they speak of addressing problems, proposing solutions, adapting methods, and finding and then creating ways forward in complex contexts."
