mastery: "Across the tiers the weight moves along Anderson and Krathwohl's continuum, with create, their highest process, present from the start: Introductory is declarative and procedural, what creativity is and how to generate and choose, with the self-system entering as the learner meets their own fear of failure; Intermediate is conceptual and procedural, theory and methods, with flexibility as the metacognitive turn; Advanced is applied and self-directed, ideas turned into action and value under uncertainty. In the QAA's terms the movement is learning about enterprise, for it and through it. Mastery is creativity as innovation and professional value creation, the map's Advanced goal, which is the core's A11 ladder from compliance to flow."

differ: "the map puts divergent against convergent thinking at Introductory, and i2 sits there (moved from developed). Otherwise the two agree: the reframe and barriers at Introductory; methods, reframing, synthesis and flexibility at Intermediate; enterprise, mindset and the professional attribute at Advanced."

qfAdd: "neither framework names creativity below L7, where the FHEQ names originality in applying knowledge and self-direction; below that, creativity is implied in addressing problems, proposing solutions and creating ways forward (CQFW L6). The benchmarks name it far more often than the level descriptors do."

