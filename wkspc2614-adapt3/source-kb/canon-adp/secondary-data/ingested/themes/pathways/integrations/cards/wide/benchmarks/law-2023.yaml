slug: law-2023
name: "Law (2023)"
run: "std:doc:qaa-law-2023-benchmarks"
subject: "Law studies the rules, principles and institutions that order relations between individuals, organisations and the state and how law bears on justice, fairness and the society around it."
subjectIds: [qaa/law-2023/1.4, qaa/law-2023/1.8]
rows:
  d3:
    practice: "finds and interprets statutes, law reports and treaties, applies them to problem scenarios and reaches reasoned conclusions supported by authority and accurate legal citation"
    knowledge: "the main principles of public and private law in the jurisdictions studied and the institutional, political, social, ethical and economic settings of law at personal to global level"
    identity: "a law student building personal integrity, alert to the values and ethics beneath law, society and their own judgements and to how legal decisions affect others"
    ids: [qaa/law-2023/4.3.b1, qaa/law-2023/4.3.b3, qaa/law-2023/4.3.b6, qaa/law-2023/4.3.b7, qaa/law-2023/1.4, qaa/law-2023/4.3.b11, qaa/law-2023/4.4.b13, qaa/law-2023/3.4.b11]
  e2:
    practice: "constructs several possible outcomes to a legal problem from authority and current scholarship, weighs competing arguments to select a reasoned solution and works into unfamiliar branches of law unaided"
    knowledge: "the ambiguities and limits built into law, how doctrine, policy and context combine in legal reasoning and the limits of legal understanding as a tool against systemic injustice"
    identity: "a reflective legal professional in the making who settles ethical conflicts through balanced judgement, keeps pace with a changing profession and joins debates on inequality and sustainability"
    ids: [qaa/law-2023/4.3.b4, qaa/law-2023/4.3.b5, qaa/law-2023/4.3.b12, qaa/law-2023/4.3.b10, qaa/law-2023/3.2, qaa/law-2023/3.4.b10, qaa/law-2023/3.4.b12, qaa/law-2023/4.3.b16]
note: "Level 6 only and no typical or excellent standard, so e2 draws on the more demanding level 6 statements and there is no e3."
