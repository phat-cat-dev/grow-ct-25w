mastery: "Across the tiers the weight moves along Anderson and Krathwohl's continuum: Introductory is mostly declarative, what a discourse is and what being critical means, with one procedure (questioning one's own choices) and a first noticing of one's own critical thinking; Intermediate is mostly procedural, analysis and evaluation used on real sources, with strategic knowledge of how to read beginning; Advanced is mostly metacognitive and creative, the learner judging, synthesising and writing from a position they know to be theirs. In Biggs's terms the movement is from knowing about criticality to using it; in Barnett's, from critical skills towards reflexivity; in Marzano and Kendall's, from the cognitive system to metacognition and the self-system. Mastery is criticality as the guide frames it, a mindset rather than a set of skills, which is the core's A11 ladder from compliance to flow."

differ: "the map places active against passive engagement at Intermediate; here the active approach (leading with one's own point) is part of e3 at Advanced, and d3 carries only the strategic reading. Otherwise the two agree: the mindset, the research stage and mapping the discourse at Introductory; analysis, evaluation, evaluative steers and the journal article at Intermediate; judgement, synthesis, the language of criticality and the critical edge at Advanced."

qfAdd: "the frameworks name critical analysis and evaluation at every level; what rises is the object (information and ideas at L4, approaches at L5, arguments and abstract concepts at L6, current research at L7) and the outcome (judgements, then modified conceptions at L7). Neither names criticality as a mindset (i3) or the writer's own stance (e3)."

