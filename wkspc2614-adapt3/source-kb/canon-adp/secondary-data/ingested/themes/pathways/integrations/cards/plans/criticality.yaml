vicSummary: "What this shows: seven of the fifteen extracts are skill (adp-0212 gives architectural technology 2022, 4.6 twice). Where the extract is a skill, the subjects' verbs (engage with literature, critically analyse, critique, demonstrate analysis and evaluation) say what the cards say in the subject's frame; where it is a theme, critical words appear in lists of methods, skills and assessment types and say nothing of the learner's judgement."

across:
  - "**The guide's vocabulary against the benchmarks':** the guide says being critical, mindset, mapping the discourse, analysis, evaluation, evaluative steers, judgement, synthesis, the language of criticality, critical edge, active and passive engagement; the benchmarks say engage with literature, critically analyse evidence, critique, critical awareness, analysis and synthesis, article critiques. Both belong in the practice searcher's vocabulary for this pathway."
  - "**Skill against theme:** seven of the fifteen extracts are skill and eight theme. Criticality's words (critical, analysis, evaluation) are so common in the benchmarks that the term list holds them as provisional (the core's A10)."
  - "**Book coverage:** Chapter 8 carries all nine cards: the mindset (i3), John's search (i2), mapping the discourse (i1), the critical skills (d1), Higgins and analysis (d2), the savvy reading of an article (d3), judgement (e1), synthesis and the language of criticality (e2) and the active approach (e3)."
  - "**Other authors:** META holds Barnett, the Delphi report, Anderson and Krathwohl and Brookfield; Barnett's four levels give the ladder the cards climb."

qfIntro: "Both frameworks name critical analysis and evaluation at every level from L3; what rises is the object and the outcome."
