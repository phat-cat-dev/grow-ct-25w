mastery: "Across the tiers the weight moves along Anderson and Krathwohl's continuum: Introductory is mostly declarative and procedural, the recipe for a presentation, with a first check of one's own performance in practice; Intermediate is procedural, design and delivery across formats, with the self-system entering as the learner manages their own nerves; Advanced is metacognitive, the learner presenting in professional forms, working in a team and defending an argument as someone with standing in their field. In Marzano and Kendall's terms the self-system, beliefs about oneself and one's emotional response, is unusually present in this pathway from the start. Mastery is presenting and collaborating as a professional, the map's Advanced goal, which is the core's A11 ladder from compliance to flow."

differ: "the two agree on the order (the map's 3 September remap): the five steps and structure at Introductory, the types, visual aids and nerves at Intermediate, professional formats, academic voice and group work at Advanced. i1 and i3 add the map's own Introductory items (assessment and transferable skill; reading the brief) and the guide's fifth step (practising) as cards."

qfAdd: "neither framework names presenting or speaking; they name communication to audiences of widening range (L4 to L7) and, from L6, leading tasks and responsibility for others. Nothing names managing one's own anxiety (d3) or academic voice (e3); they sit in Marzano and Kendall's self-system, which the frameworks do not describe."

