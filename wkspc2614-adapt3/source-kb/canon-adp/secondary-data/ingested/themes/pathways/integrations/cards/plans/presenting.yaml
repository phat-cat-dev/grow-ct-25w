vicSummary: "What this shows: one of the nine extracts is skill (classics: using audio-visual aids and relating to the audience). The rest name presentations, accessibility and collaboration as provision or assessment types. The benchmarks list presenting and group work far more than they describe them."

across:
  - "**The guide's vocabulary against the benchmarks':** the guide says the five steps, hook, main body, conclusion, less is more, accessibility, nerves, poster, pitch, interview-based, leadership, conflict; the benchmarks say oral presentations, audio-visual aids, audience, debates, critiques, posters, collaboration and group work. Both belong in the practice searcher's vocabulary for this pathway."
  - "**Skill against theme:** one of the nine extracts is skill; adp-0212 found nothing for the hook and nerves card (d3)."
  - "**Book coverage:** Chapter 11 carries all nine cards, and the five steps, the types of presentation, visual aids, structure, Nasser's nerves and Ross's group are all there; the guide does not develop academic voice as such (e3 draws on its \"articulate an argument\")."
  - "**Other authors:** META holds Gibbs (1994) and Healey (2024) for group work; the strand leads for the rest (Aristotle, Mayer, Tufte, McCroskey, Ivanič) are wanted (W-0076, W-0066, W-0078, W-0067, W-0064)."

qfIntro: "Neither framework names presenting; they speak of communicating results and arguments to audiences of widening range, and at L6 and above of leading tasks and taking responsibility for the work of others, which is where group work sits."
