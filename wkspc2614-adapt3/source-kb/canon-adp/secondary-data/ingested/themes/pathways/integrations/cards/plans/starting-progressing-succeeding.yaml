mastery: "This pathway lives in Marzano and Kendall's self-system more than any other: beliefs about one's own ability, motivation and emotional response. Across the tiers the weight moves from declarative knowledge of mindset and motivation, with a first recognition of one's own (Introductory), through procedures for sustaining goals and managing oneself under pressure (Intermediate), to self-direction and identity (Advanced). In Anderson and Krathwohl's terms it is metacognitive almost from the start, and the movement is from knowledge about oneself to acting on it unprompted. Mastery is becoming a graduate, the map's Advanced goal, which is the core's A11 ladder from compliance to flow."

differ: "the two agree on the order: finding one's feet (excelling, mindset, motivation, goals) at Introductory, keeping going (setbacks, anxiety, support) at Intermediate, becoming a graduate (independence, identity, transition, lifelong learning) at Advanced. The map places building self-efficacy at Introductory; d2 places it at Intermediate with managing anxiety, as the core's former 02 had it. Seeking support early, in the map's Intermediate text, has no card of its own."

qfAdd: "neither framework names mindset, motivation, anxiety or identity. They name autonomy and responsibility rising level by level, and the learning ability for further training at L6; the self-system, where this pathway mostly lives, is assumed by the descriptors rather than described."

