vicSummary: "What this shows: two of the twelve extracts are skill (accounting on self-efficacy and self-managed learning; business on self-management as an independent learner). The rest name the dispositions (resilience, self-efficacy, open-mindedness) in lists of attributes, or employability in a course's remit. The benchmarks value this pathway's dispositions but almost never describe how a learner acquires them."

across:
  - "**The guide's vocabulary against the benchmarks':** the guide says excelling, growth and fixed mindset, mastery and performance, self-efficacy, stress and anxiety, graduate identity, graduate capital, lifelong learner; the benchmarks say resilience, self-efficacy, self-management, independent learner, self-directed learning, employability. Both belong in the practice searcher's vocabulary for this pathway."
  - "**Skill against theme:** two of the twelve extracts are skill. Dispositions appear in the benchmarks as attributes to list, not practices to describe."
  - "**Book coverage:** Chapters 1, 2 and 14 carry all nine cards; academic voice (d3) is the least developed in the guide."
  - "**Other authors:** META holds Pintrich (goal orientation) and Tinto (integration); the strand leads for mindset, self-efficacy, self-authorship and graduate capital are wanted (W-0050, W-0054, W-0063, W-0057)."

qfIntro: "Neither framework names motivation, mindset or identity; they speak of autonomy and responsibility rising from limited parameters (L3) to broad autonomy (L6, L7), and of developing skills and learning ability for further training."
