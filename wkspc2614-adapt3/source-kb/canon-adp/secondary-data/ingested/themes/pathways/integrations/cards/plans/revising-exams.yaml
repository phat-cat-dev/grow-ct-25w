vicSummary: "What this shows: none of the ten extracts is skill (adp-0212 gives law 2023, 3.11 twice). The benchmarks name exams, revision and role play as provision and assessment design, and anxiety as a wellbeing concern; they do not describe how a learner revises."

across:
  - "**The guide's vocabulary against the benchmarks':** the guide says revision strategy, active and passive revision, targeted revision, gaps, time management, cognitive resilience, mind maps, flashcards, mnemonics, role play, exam strategy, exam anxiety; the benchmarks say revision for formal examinations, multiple-choice, time management, role play, stress and anxiety. The practice searcher needs the guide's words."
  - "**Skill against theme:** none of the ten extracts is skill; this is the pathway the benchmarks describe least."
  - "**Book coverage:** Chapter 13 carries all nine cards: the forms of exam, anxiety, the five-stage strategy, Natalie's and Jess's revision, the active techniques and exam day."
  - "**Learning styles:** the guide sorts its techniques as visual, auditory and kinaesthetic and the tier map says \"matched to how you learn\"; the research does not support matching techniques to learning styles (the core's Part E). The cards keep the techniques and judge them by recall (e3)."
  - "**Other authors:** META holds Pintrich only; the research on revision (Dunlosky and others; Cepeda and others) and on test anxiety (Zeidner) is wanted (W-0081, W-0083, W-0084)."

qfIntro: "Neither framework names revision or exams; they speak of responsibility and autonomy in one's own work, of the limits of one's knowledge (L5), of managing one's own learning (L6) and of decision-making in complex conditions."
