mastery: "Across the tiers the weight moves along Anderson and Krathwohl's continuum: Introductory is declarative, the forms of exam and why passive revision fails, with a first plan and a first noticing of one's own anxiety; Intermediate is procedural and strategic, the five-stage strategy run and monitored; Advanced is procedural at its widest, the techniques and exam-day strategy, and metacognitive in choosing techniques by evidence of one's own recall. In Marzano and Kendall's terms anxiety brings the self-system in from the start, as in Presenting. Mastery is optimised, self-monitored performance under exam conditions, the map's Advanced goal, which is the core's A11 ladder from compliance to flow."

differ: "the map puts active against passive learning at Intermediate, and d1 sits there; it puts the technique toolkit \"matched to how you learn\" at Advanced, which e1 and e3 keep without the learning-styles matching. It places understanding exam anxiety at Introductory, as i3 does."

qfAdd: "neither framework names revision or exams; the nearest statements are the limits of one's knowledge (L5), managing one's own learning (L6) and decision-making in complex contexts (L6, L7). The pathway's self-monitoring has a home in the descriptors; its anxiety does not."

