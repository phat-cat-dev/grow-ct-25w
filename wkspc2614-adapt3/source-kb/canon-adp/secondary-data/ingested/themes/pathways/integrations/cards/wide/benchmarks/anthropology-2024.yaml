slug: anthropology-2024
name: "Anthropology (2024)"
run: "std:doc:qaa-anthropology-2024-benchmarks"
subject: "Anthropology studies the social, cultural and biological variety of people and their relations with environments, past and present, to understand how others live and to put that understanding to ethical use."
subjectIds: [qaa/anthropology-2024/3.2, qaa/anthropology-2024/3.5, qaa/anthropology-2024/3.11, qaa/anthropology-2024/3.4]
rows:
  d3:
    practice: "plans and evaluates ethically reviewed fieldwork, reads oral, film and print sources against their cultural setting and questions ethnocentric assumptions in what the evidence seems to show"
    knowledge: "the social, cultural and biological range of human populations, how the discipline grew from colonial roots and the strengths and limits of its central theories and methods"
    identity: "an anthropologist in training who treats knowledge as situated and open to dispute, keeps to strict research ethics and values ways of living unlike their own"
    ids: [qaa/anthropology-2024/ss.1.t, qaa/anthropology-2024/ss.7.t, qaa/anthropology-2024/gs.9.t, qaa/anthropology-2024/ku.1.t, qaa/anthropology-2024/ku.2.t, qaa/anthropology-2024/3.3, qaa/anthropology-2024/ku.4.t, qaa/anthropology-2024/ss.12.t]
  e2:
    practice: "designs and carries through a whole research programme from question to dissemination, combines varied sources into fresh interpretations and devises new uses of anthropology from everyday life to policy"
    knowledge: "the politics of language and claims to authority, the value and limits of cultural relativism and how fossil, genetic, ethnographic and other evidence can be joined into one account"
    identity: "an anthropologist who sets and applies rigorous ethical standards at each research stage, engages other cultures while keeping their own judgement and handles disagreement with care for lives affected"
    ids: [qaa/anthropology-2024/ss.1.e, qaa/anthropology-2024/ss.7.e, qaa/anthropology-2024/ss.8.e, qaa/anthropology-2024/ss.9.e, qaa/anthropology-2024/ku.4.e, qaa/anthropology-2024/ku.24.e, qaa/anthropology-2024/ss.12.e, qaa/anthropology-2024/ss.10.e]
  e3:
    practice: "manages a significant anthropological research project alone, from framing a culturally sensitive question through fieldwork or laboratory analysis, solving method problems without close direction"
    knowledge: "specialised command of anthropological theory and method at the strong or excellent standard, including how field and laboratory evidence supports or limits claims about human variety"
    identity: "an independent anthropological researcher who carries full responsibility for the ethics and rigour of their own project and its effects on the communities studied (ing's reading)"
    ids: [qaa/anthropology-2024/4.7, qaa/anthropology-2024/4.8]
note: "e3 rests on the only two level 7 statements (4.7 and 4.8), so it lists two ids; e3 identity is ing's reading as level 7 says nothing on values or ethics."
