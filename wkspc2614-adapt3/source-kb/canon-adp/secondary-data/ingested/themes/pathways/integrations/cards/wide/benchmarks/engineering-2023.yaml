slug: engineering-2023
name: "Engineering (2023)"
run: "std:doc:qaa-engineering-2023-benchmarks"
subject: "Engineering applies mathematics, science and practical making to design safe, secure and sustainable solutions to technical and sociotechnical problems for the society it serves."
subjectIds: ["qaa/engineering-2023/2.3.b2", "qaa/engineering-2023/2.11", "qaa/engineering-2023/2.3.b3"]
rows:
  d3:
    practice: "analyses an engineering problem with suitable quantitative and computational methods, then builds and tests a working solution in the laboratory, workshop or code"
    knowledge: "a joined-up grasp of own branch of engineering, how its methods are applied and where analytical models stop being reliable"
    identity: "a trainee engineer who works to the profession's ethical principles of honesty, rigour and respect for life and takes daily responsibility for health and safety"
    ids: ["qaa/engineering-2023/4.8.b1", "qaa/engineering-2023/4.8.b2", "qaa/engineering-2023/4.8.b3", "qaa/engineering-2023/2.3.b1", "qaa/engineering-2023/3.3", "qaa/engineering-2023/1.21", "qaa/engineering-2023/1.22"]
  e2:
    practice: "tackles complex sociotechnical problems with no obvious answer, using systems thinking to design out safety and security risks and assess whole-life environmental impact"
    knowledge: "how engineering decisions ripple into legal, economic, social and environmental systems, including hostile threats to designs and the resource costs of low-carbon technology"
    identity: "an engineer who judges and defends ethical choices, designs with affected communities and argues for social and environmental justice"
    ids: ["qaa/engineering-2023/1.10", "qaa/engineering-2023/2.2", "qaa/engineering-2023/1.26", "qaa/engineering-2023/2.3.b9", "qaa/engineering-2023/2.14", "qaa/engineering-2023/1.21", "qaa/engineering-2023/4.8.b5"]
  e3:
    practice: "reasons to justified decisions on complex engineering problems where data are incomplete or conflicting and leads research and teams with growing self-direction"
    knowledge: "broad and deep knowledge of own engineering specialism together with a critical account of where computational analysis falls short on partial data"
    identity: "a self-directing engineer and team leader who upholds professional and commercial ethics and answers for the global social effects of engineering work"
    ids: ["qaa/engineering-2023/2.3.b7", "qaa/engineering-2023/4.11.b3", "qaa/engineering-2023/4.11.b1", "qaa/engineering-2023/4.15.b4", "qaa/engineering-2023/2.3.b4", "qaa/engineering-2023/3.10", "qaa/engineering-2023/4.11.b5"]
note: "Typical and excellent level 6 standards are left to each provider's marking scheme: e2 is drawn from the more demanding level 6 statements on complex problems, systems, security and sustainability."
