mastery: "Two ladders run together here. On Anderson and Krathwohl's knowledge dimension the movement is from knowing what an academic practitioner is, through procedures for recording and planning one's development, to metacognitive knowledge of oneself; on Krathwohl, Bloom and Masia's affective domain it is from receiving and responding to one's values, through valuing and organising them, to characterisation, values so internalised that they mark the person. In Lave and Wenger's terms the student moves from the edge of an academic community towards its centre and changes who they are; in Marzano and Kendall's, the self-system, which decides whether one engages at all, becomes the object of thought. Mastery is the reflexive point at which the practitioner can examine and deconstruct themselves (N-0137), the top of every pathway's A11 ladder made the subject of a pathway of its own."

