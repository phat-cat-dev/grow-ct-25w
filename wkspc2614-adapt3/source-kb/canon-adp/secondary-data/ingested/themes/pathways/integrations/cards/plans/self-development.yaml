across:
  - "**The guide's vocabulary:** graduate identity, literacies, discourse community, novice and expert, values, integrity, courage, character, identity capital, personal development; outside the guide: practitioner identity, reflexivity, positionality, self-authorship, affective domain."
  - "**Skill against theme:** not yet searched."
  - "**Book coverage:** the guide carries the Introductory and Intermediate cards and e1 and e2 through its thread of graduate identity (Chapters 1, 3, 10 and 14); e3, reflexivity, is not in the guide."
  - "**Two ladders:** the cards climb Anderson and Krathwohl's knowledge dimension towards the metacognitive and, beside it, Krathwohl, Bloom and Masia's affective domain from receiving and responding (i3) through valuing (d3) and organisation (e2) to characterisation by a value system (e3). This is the one pathway where the affective ladder is the spine."
  - "**Overlaps by design:** Starting, Progressing and Succeeding (graduate identity, e3), Reflective Practice (reflexivity, e3) and Referencing (integrity as values, e1 to e3). Self-Development holds the identity and values themselves; the others hold the disposition, the method and the rules."
  - "**Other authors:** META holds Lave and Wenger, Pintrich, Marzano and Kendall, the affective domain, Finlay, and D'Cruz, Gillingham and Melendez; Baxter Magolda, Dweck, Tomlinson and the ICAI framework are wanted (W-0063, W-0050, W-0057, W-0026)."

