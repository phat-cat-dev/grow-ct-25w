slug: town-and-country-planning-2024
name: "Town and Country Planning (2024)"
run: "std:doc:qaa-town-and-country-planning-2024-benchmarks"
subject: "Town and Country Planning studies how places are shaped through policy, law and design, so that planners can make sustainable, inclusive and ethical decisions about land and communities."
subjectIds: [qaa/town-and-country-planning-2024/1.10, qaa/town-and-country-planning-2024/1.12]
rows:
  d3:
    practice: "surveys real places, weighs evidence from varied sources and uses planning tools, technology and graphic, numerical and digital media to resolve spatial problems"
    knowledge: "planning theory, how policy is made at different scales, the legal and political contexts of planning and its role in the climate and biodiversity crises"
    identity: "a planner in training who upholds the profession's values and ethics and recognises how decisions affect communities and diverse groups"
    ids: [qaa/town-and-country-planning-2024/4.7.b2, qaa/town-and-country-planning-2024/4.7.b12, qaa/town-and-country-planning-2024/4.7.b13, qaa/town-and-country-planning-2024/4.7.b3, qaa/town-and-country-planning-2024/4.7.b5, qaa/town-and-country-planning-2024/4.7.b8, qaa/town-and-country-planning-2024/4.7.b10, qaa/town-and-country-planning-2024/4.7.b7]
  e2:
    practice: "applies every planning criterion fluently, bringing critical judgement, creativity and independence to fieldwork, projects and situated decisions on spatial questions"
    knowledge: "a deeper grasp of planning knowledge, thinking skills and competence than the minimum, with theory and practice understood as one cycle of inquiry"
    identity: "an increasingly autonomous practitioner who weighs stakeholders' interests in each judgement and reflects on practice in order to improve it"
    ids: [qaa/town-and-country-planning-2024/4.9.b2, qaa/town-and-country-planning-2024/4.8.b2, qaa/town-and-country-planning-2024/2.10, qaa/town-and-country-planning-2024/4.8.b1, qaa/town-and-country-planning-2024/4.9.b1]
  e3:
    practice: "collects and analyses planning data, carries out independent research and works to a high professional standard in assignments and group projects"
    knowledge: "in-depth expertise in a specialist area of planning practice and a clear grasp of the roles, duties, ethics and values professionals carry"
    identity: "a professional planner who holds professional responsibilities and ethics as own and models professionalism in shared work"
    ids: [qaa/town-and-country-planning-2024/4.10.b4, qaa/town-and-country-planning-2024/4.10.b3, qaa/town-and-country-planning-2024/4.10.b1, qaa/town-and-country-planning-2024/4.10.b2]
