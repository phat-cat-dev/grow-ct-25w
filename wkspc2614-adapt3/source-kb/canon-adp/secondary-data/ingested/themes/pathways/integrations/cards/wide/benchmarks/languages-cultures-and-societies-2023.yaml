name: "Languages, Cultures and Societies (2023)"
run: "std:doc:qaa-languages-cultures-and-societies-2023-benchmarks"
subject: "Languages, Cultures and Societies studies languages together with the cultures and societies that use them, so that graduates communicate, mediate and interpret across linguistic and cultural borders."
subjectIds: [qaa/languages-cultures-and-societies-2023/1.10.b1, qaa/languages-cultures-and-societies-2023/1.10.b5, qaa/languages-cultures-and-societies-2023/1.10.b6]
rows:
  d3:
    practice: "reads, speaks, writes and translates the target language near CEFR C1, adapting register and pragmatic conventions when mediating between speakers and cultures"
    knowledge: "the structures, registers and varieties of the studied language and the history, politics and culture of at least one target society"
    identity: "an intercultural mediator who meets difference with respect, notices the hidden values behind own and others' judgements and acts with research integrity"
    ids: [qaa/languages-cultures-and-societies-2023/4.10.b2, qaa/languages-cultures-and-societies-2023/4.10.b5, qaa/languages-cultures-and-societies-2023/4.14.b6, qaa/languages-cultures-and-societies-2023/4.12.b1, qaa/languages-cultures-and-societies-2023/4.15.b1, qaa/languages-cultures-and-societies-2023/4.14.b1, qaa/languages-cultures-and-societies-2023/4.14.b2, qaa/languages-cultures-and-societies-2023/4.16.b9]
  e2:
    practice: "communicates with confidence and subtlety in the studied languages, compares cultures across national and minoritised settings and revises machine translation output with care"
    knowledge: "how cultural and contextual factors shape usage in real and virtual settings and how language technologies such as corpora and translation tools support analysis"
    identity: "a curious, open communicator who manages own bias, negotiates sensitively in professional settings and works with confidence across international borders"
