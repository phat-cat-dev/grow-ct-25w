mastery: "Across the tiers the weight moves along Anderson and Krathwohl's continuum, though not evenly: Introductory is declarative and procedural, what referencing is and how to do it, with keeping one's own records as the first metacognitive habit; Intermediate is procedural and strategic, quotation and paraphrase and citation used to show what one has done; Advanced returns to the conceptual, the values, and ends in the self-system, integrity as identity. The map builds from the concrete skill to the culminating \"why\", reversing the guide's order; in Marzano and Kendall's terms the learner moves from the cognitive system to the self-system, where values and identity direct conduct. Mastery is integrity as scholarly and professional practice, the map's Advanced goal, which is the core's A11 ladder from compliance to flow."

differ: "the two agree: referencing at Introductory, citation with quotation, paraphrase and trickier sources at Intermediate, the values, plagiarism and graduate identity at Advanced. The map threads basic plagiarism awareness through Introductory; here it is in i1's explanation and i3's records, with d1 carrying quotation and paraphrase."

qfAdd: "neither framework names referencing, plagiarism or integrity; they name accuracy and reliability (L4), scholarly sources (L6) and personal responsibility rising to professional autonomy (L5 to L7). Integrity's values have no level descriptor of their own; they sit in the responsibility the descriptors assume."

review:
  - "d2 and e3 are new and proposed (D-ing-0060)."
  - "e1 and e2 split the six ICAI values four ways between them (honesty and trust; fairness, respect, responsibility and courage); the model's author may prefer them as one card, which would free a place for e3 without a new card elsewhere."
  - "The referencing style is set by the context a course runs in; i2 and d2 are written for any style."
