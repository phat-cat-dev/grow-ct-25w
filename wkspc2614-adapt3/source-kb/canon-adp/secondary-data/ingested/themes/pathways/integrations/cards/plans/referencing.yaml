vicSummary: "What this shows: five of the ten extracts are skill, more than in any pathway so far: applying a referencing system, recognising plagiarism as unethical, the accountant's position of trust, respect for others in professional conduct and in discussion. The benchmarks name integrity's values in professional terms, which is where e3 takes the learner."

across:
  - "**The guide's vocabulary against the benchmarks':** the guide says referencing, in-text reference, references list, author-date or Harvard, quotation, paraphrase, plagiarism, intentional and unintentional, and the six ICAI values; the benchmarks say accurate referencing, standard systems, unethical behaviour, intellectual property, position of trust, professional attitude, respect for others' views. Both belong in the practice searcher's vocabulary for this pathway."
  - "**Skill against theme:** five of the ten extracts are skill. Where integrity's words appear as themes they are word matches (trust in accounting topics) or concerns about generative AI."
  - "**Book coverage:** Chapter 10 carries all nine cards, though the guide teaches integrity first and referencing after; the tier map reverses that order on purpose (its note on ordering)."
  - "**Other authors:** META holds Lave and Wenger only; Hyland, Howard and the ICAI framework are wanted (W-0029, W-0028, W-0026)."

qfIntro: "Neither framework names referencing or plagiarism; they speak of communicating accurately and reliably, of using scholarly sources, and of personal responsibility rising to professional autonomy, which is the frame for integrity."
