slug: art-and-design-2026
name: "Art and Design (2026)"
run: "std:doc:qaa-art-and-design-2026-benchmarks"
subject: "Art and design studies how visual and material creative work is researched, made and read in context, and prepares practitioners to make and present such work responsibly for varied audiences."
subjectIds: ["qaa/art-and-design-2026/4.4.b3", "qaa/art-and-design-2026/4.4.b6", "qaa/art-and-design-2026/4.4.b8"]
rows:
  d3:
    practice: "gathers contextual sources and materials to generate ideas, chooses materials and processes to suit the work and carries a creative project through to completion on time"
    knowledge: "the main historical, theoretical and cultural contexts of art and design, the debates now shaping creative production and how a single work invites several readings"
    identity: "an emerging artist or designer aware of the creative sector's ethical, social and environmental duties, who reflects on own strengths and weaknesses and shows empathy for others"
    ids: ["qaa/art-and-design-2026/4.4.b1", "qaa/art-and-design-2026/4.4.b2", "qaa/art-and-design-2026/4.4.b3", "qaa/art-and-design-2026/4.4.b4", "qaa/art-and-design-2026/4.4.b6", "qaa/art-and-design-2026/4.4.b7", "qaa/art-and-design-2026/4.4.b8", "qaa/art-and-design-2026/4.4.b11"]
  e2:
    practice: "researches critically across varied sources and handles materials with imagination so that insight drives the work, then evaluates process and outcome to make the next piece stronger"
    knowledge: "a critical command of contemporary art and design discourse and of context, used to shape ambitious work and to reach diverse audiences amid complexity and ambiguity"
    identity: "an independent and resilient maker who treats sustainability as a core value, challenges unequal representation in the making and consuming of art and design and creates own openings to exhibit or sell work"
    ids: ["qaa/art-and-design-2026/4.4.b1.excellent", "qaa/art-and-design-2026/4.4.b2.excellent", "qaa/art-and-design-2026/4.4.b4.excellent", "qaa/art-and-design-2026/4.4.b7.excellent", "qaa/art-and-design-2026/4.4.b8.excellent", "qaa/art-and-design-2026/4.4.b9.excellent", "qaa/art-and-design-2026/4.4.b11.excellent", "qaa/art-and-design-2026/4.4.b12.excellent"]
  e3:
    practice: "builds rigorous methodologies for advanced inquiry, extends material processes inventively and realises practice to a professional standard across complex, unpredictable settings"
    knowledge: "a deeper technical, conceptual, critical and contextual grasp of art and design, read within a bounded context attentive to cultural, environmental, social and political issues"
    identity: "a reflexive practitioner who places own art or design practice in a critically defined ethical context and uses creative intervention to answer structural injustice with equity and inclusion at its centre"
    ids: ["qaa/art-and-design-2026/4.5", "qaa/art-and-design-2026/4.7.b2", "qaa/art-and-design-2026/4.7.b3", "qaa/art-and-design-2026/4.7.b5", "qaa/art-and-design-2026/4.7.b6", "qaa/art-and-design-2026/4.7.b9", "qaa/art-and-design-2026/4.7.b10", "qaa/art-and-design-2026/4.7.b11"]
note: "subjectIds are level 6 statements because the level none statements cover only accessibility and review. e2 draws on the excellent descriptors, which step beyond the typical ones."
