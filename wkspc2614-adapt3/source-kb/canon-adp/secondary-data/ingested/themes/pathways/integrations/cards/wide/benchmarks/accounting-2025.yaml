slug: accounting-2025
name: "Accounting (2025)"
run: "std:doc:qaa-accounting-2025-benchmarks"
subject: "Accounting studies how organisations record and report their activity and answer for it, in support of governance, assurance and accountability for sustainability and social welfare."
subjectIds: ["qaa/accounting-2025/1.4", "qaa/accounting-2025/1.6", "qaa/accounting-2025/3.4"]
rows:
  d3:
    practice: "records transactions and prepares financial statements, budgets and costings, then applies them with some critique to plain, clearly bounded problems in public, charitable and commercial organisations"
    knowledge: "a basic grasp of nearly all broad areas of accounting, from corporate reporting and audit to tax and financial markets, with a sense of why accounting matters ethically and socially"
    identity: "an accountant in training who acts ethically, owns their own development and sees accounting as serving stakeholders and sustainability rather than profit alone"
    ids: ["qaa/accounting-2025/4.5.b1", "qaa/accounting-2025/4.5.b9", "qaa/accounting-2025/4.5.b25", "qaa/accounting-2025/3.13", "qaa/accounting-2025/3.15.b3", "qaa/accounting-2025/3.15.b9", "qaa/accounting-2025/1.38"]
  e2:
    practice: "applies wide accounting knowledge critically to messy, open-ended problems with no set structure, combining data analysis, risk techniques and judgement into creative arguments for varied organisations"
    knowledge: "a critical and advanced command of nearly every broad area of accounting, joined up across areas and tied to theory on accountability, sustainability and the public interest"
    identity: "a sceptical professional who exercises judgement under uncertainty, takes an ethical and activist stance and helps lead organisations towards sustainable and fair outcomes"
    ids: ["qaa/accounting-2025/4.5.b27", "qaa/accounting-2025/4.5.b28", "qaa/accounting-2025/4.5.b24", "qaa/accounting-2025/4.5.b15", "qaa/accounting-2025/4.5.b16", "qaa/accounting-2025/4.5.b8", "qaa/accounting-2025/3.15.b4", "qaa/accounting-2025/1.38"]
  e3:
    practice: "carries out a substantial self-directed research inquiry into accounting theory or its use on a real issue and applies specialised knowledge with insight to open-ended organisational problems"
    knowledge: "specialist and sophisticated knowledge of the critical, ethical and contextual weight of accounting, deep in chosen areas and integrated with insight across the rest"
    identity: "an independent inquirer and professional who brings ethical judgement and scepticism to applied settings and pursues accounting questions out of curiosity"
    ids: ["qaa/accounting-2025/4.7.b24", "qaa/accounting-2025/4.7.b25", "qaa/accounting-2025/4.7.b21", "qaa/accounting-2025/1.17", "qaa/accounting-2025/4.7.b1", "qaa/accounting-2025/4.7.b8", "qaa/accounting-2025/4.7.b9", "qaa/accounting-2025/1.16.b3"]
note: "No level 5 statements. e2 draws on the very good and excellent honours standards in 4.5."
