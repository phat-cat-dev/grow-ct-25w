slug: philosophy-2025
name: "Philosophy (2025)"
run: "std:doc:qaa-philosophy-2025-benchmarks"
subject: "Philosophy studies the arguments, concepts and traditions through which people reason about knowledge, reality, mind and value, and trains graduates to do philosophy with rigour rather than only to study it."
subjectIds: ["qaa/philosophy-2025/3.4", "qaa/philosophy-2025/3.8", "qaa/philosophy-2025/3.15.b2"]
rows:
  d3:
    practice: "reads major philosophers in their own texts, puts forward an argument with a sense of what makes it sound and weighs the strong and weak points on each side of a question"
    knowledge: "some core theories and arguments across epistemology, logic, metaphysics or mind and across ethics, political or social philosophy"
    identity: "a philosopher in training who examines the values and ethics beneath society and own life, reflects on own progress and academic integrity and compares views across cultures and traditions"
    ids: ["qaa/philosophy-2025/4.6.b1", "qaa/philosophy-2025/4.8.b4", "qaa/philosophy-2025/4.8.b7", "qaa/philosophy-2025/4.6.b2", "qaa/philosophy-2025/4.6.b3", "qaa/philosophy-2025/4.10.b12", "qaa/philosophy-2025/4.10.b11", "qaa/philosophy-2025/1.11"]
  e2:
    practice: "builds subtle, rigorous arguments along original lines, interprets texts across periods and traditions and uses philosophy to clarify real ethical dilemmas"
    knowledge: "a systematic, comparative command of theoretical and practical philosophy and of the debates over philosophical method, at times reaching beyond what was taught"
    identity: "an intellectually honest philosopher who suspends judgement, meets new perspectives with curiosity and revises even firm convictions when the argument demands it"
    ids: ["qaa/philosophy-2025/4.8.b4.excellent", "qaa/philosophy-2025/4.8.b6.excellent", "qaa/philosophy-2025/4.8.b2.excellent", "qaa/philosophy-2025/4.8.b9.excellent", "qaa/philosophy-2025/4.6.b2.excellent", "qaa/philosophy-2025/4.6.b3.excellent", "qaa/philosophy-2025/4.6.b4.excellent", "qaa/philosophy-2025/4.8.b7.excellent"]
  e3:
    practice: "conceives and completes an extended philosophical research project that contributes to the field, building and testing demanding arguments and texts with rigorous method"
    knowledge: "specialist expertise in at least one area or tradition, a thorough grasp of the discipline's debates shaped by current research and a reflective sense of philosophy's own methods and assumptions"
    identity: "a philosopher who reasons ethically, sees how philosophy can help address moral, social and political problems and keeps growing as a philosopher through independent study"
    ids: ["qaa/philosophy-2025/4.11.b5.masters", "qaa/philosophy-2025/4.11.b3.masters", "qaa/philosophy-2025/4.11.b4.masters", "qaa/philosophy-2025/4.11.b1.masters", "qaa/philosophy-2025/4.11.b10.masters", "qaa/philosophy-2025/4.11.b11.masters", "qaa/philosophy-2025/4.11.b12.masters"]
note: "e2 draws on the excellent forms of the level 6 standards."
