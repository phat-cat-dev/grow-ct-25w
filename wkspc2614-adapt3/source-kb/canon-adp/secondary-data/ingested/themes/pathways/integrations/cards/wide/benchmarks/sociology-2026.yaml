slug: sociology-2026
name: "Sociology (2026)"
run: "std:doc:qaa-sociology-2026-benchmarks"
subject: "Sociology studies how social structures, institutions and human agency shape one another, explaining inequality, power and change so that society can be understood and improved."
subjectIds: [qaa/sociology-2026/1.6, qaa/sociology-2026/3.11.b4]
rows:
  d3:
    practice: "designs small qualitative and quantitative studies, analyses data on social inequality with software and builds sociological arguments from theory and evidence"
    knowledge: "central sociological concepts and theories, processes of social change and conflict and how power, colonial legacies and inequity intertwine"
    identity: "a sociologist in training who examines the values beneath society and own life and weighs the ethics of research in each setting"
    ids: [qaa/sociology-2026/4.4.b14, qaa/sociology-2026/4.4.b10, qaa/sociology-2026/4.4.b3, qaa/sociology-2026/4.4.b1, qaa/sociology-2026/4.4.b6, qaa/sociology-2026/4.5.b14, qaa/sociology-2026/4.4.b16]
  e2:
    practice: "plans and completes an independent sociological project, critiques the frameworks and methods of published research and links global and local social problems across disciplines"
    knowledge: "what makes sociological explanation distinct from other disciplines and how its knowledge bears on social, civic and environmental policy"
    identity: "an intellectually independent social analyst who exercises critical judgement and evaluates generative AI and other technologies for what they mean for society"
    ids: [qaa/sociology-2026/4.4.b17, qaa/sociology-2026/4.4.b12, qaa/sociology-2026/4.4.b11, qaa/sociology-2026/2.3, qaa/sociology-2026/4.4.b18, qaa/sociology-2026/4.5.b11, qaa/sociology-2026/4.5.b9]
  e3:
    practice: "designs and completes sociological research that generates or reworks data, then evaluates social policies and interventions through social theory and evidence"
    knowledge: "the theories and the historical, political and environmental contexts that shape sociology, synthesised with empirical research on present social problems"
    identity: "a reflexive sociological researcher who handles sensitive and ethical questions with care and traces how power, colonial legacies and injustice overlap"
    ids: [qaa/sociology-2026/4.6.b4.masters, qaa/sociology-2026/4.6.b9.masters, qaa/sociology-2026/4.6.b10.masters, qaa/sociology-2026/4.6.b2.masters, qaa/sociology-2026/4.6.b1.masters, qaa/sociology-2026/4.6.b6.masters, qaa/sociology-2026/4.6.b3.masters]
note: "No typical or excellent standards. e2 is drawn from the more demanding level 6 threshold statements."
