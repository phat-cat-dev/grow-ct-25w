slug: communication-media-film-and-cultural-studies-2024
name: "Communication, Media, Film and Cultural Studies (2024)"
run: "std:doc:qaa-communication-media-film-and-cultural-studies-2024-benchmarks"
subject: "This field studies how media, film and cultural forms are made, circulated and given meaning in society, and equips graduates to analyse and produce them as critical and informed citizens."
subjectIds: ["qaa/communication-media-film-and-cultural-studies-2024/1.9.b1", "qaa/communication-media-film-and-cultural-studies-2024/1.10.b2", "qaa/communication-media-film-and-cultural-studies-2024/1.11.b4"]
rows:
  d3:
    practice: "analyses media texts through theory, picks methods such as close textual reading, archives, audience research or ethnography and researches and presents an extended written or practical project"
    knowledge: "the field's main debates and theories, non-Western ones included, how media, film and cultural forms arose over time and why communication technologies are never neutral"
    identity: "a culturally responsible media practitioner who uses media forms and technologies ethically in professional and everyday life and respects diverse people inside and outside the field"
    ids: ["qaa/communication-media-film-and-cultural-studies-2024/4.4.b1", "qaa/communication-media-film-and-cultural-studies-2024/4.4.b2", "qaa/communication-media-film-and-cultural-studies-2024/4.4.b7", "qaa/communication-media-film-and-cultural-studies-2024/4.4.b10", "qaa/communication-media-film-and-cultural-studies-2024/4.4.b13", "qaa/communication-media-film-and-cultural-studies-2024/4.4.b18", "qaa/communication-media-film-and-cultural-studies-2024/4.4.b20", "qaa/communication-media-film-and-cultural-studies-2024/1.10.b2"]
  e2:
    practice: "designs an extended media project to a high standard, judges the limits of quantitative and qualitative methods and applies them independently, combining sources with evident skill"
    knowledge: "a wide and secure grasp of the field's debates and traditions and a critical sense of how media forms feed struggles over power, cultural value and representation"
    identity: "a self-directed media scholar or maker who works autonomously with initiative and takes an active part in debate that tests own views"
    ids: ["qaa/communication-media-film-and-cultural-studies-2024/4.7.b14", "qaa/communication-media-film-and-cultural-studies-2024/4.7.b13", "qaa/communication-media-film-and-cultural-studies-2024/4.8.b1", "qaa/communication-media-film-and-cultural-studies-2024/4.7.b1", "qaa/communication-media-film-and-cultural-studies-2024/4.7.b18", "qaa/communication-media-film-and-cultural-studies-2024/4.9.b4", "qaa/communication-media-film-and-cultural-studies-2024/4.10.b11", "qaa/communication-media-film-and-cultural-studies-2024/4.7.b20"]
  e3:
    practice: "applies media and cultural knowledge with originality and critically evaluates current research, its methods and advanced scholarship so that the field's understanding moves forward"
    knowledge: "systematic knowledge of communication, media, film and cultural studies reaching the forefront of current research or professional practice, together with newly built advanced skills"
    identity: "an original contributor to the field who grasps how research advances its knowledge and holds own work to the standard of current scholarship (ing's reading)"
    ids: ["qaa/communication-media-film-and-cultural-studies-2024/1.7", "qaa/communication-media-film-and-cultural-studies-2024/4.13", "qaa/communication-media-film-and-cultural-studies-2024/4.13.b1", "qaa/communication-media-film-and-cultural-studies-2024/4.13.b2", "qaa/communication-media-film-and-cultural-studies-2024/4.13.b3", "qaa/communication-media-film-and-cultural-studies-2024/4.13.b4"]
note: "subjectIds are level 6 statements because the level none statements cover inclusion, sustainability and assessment rather than the subject. Level 7 gives nothing on ethics or values, so the e3 identity is ing's reading."
