slug: architecture-2026
name: "Architecture (2026)"
run: "std:doc:qaa-architecture-2026-benchmarks"
subject: "Architecture studies how buildings and places are conceived, made and inhabited, preparing students to design responsibly for others within the profession and beyond it."
subjectIds: ["qaa/architecture-2026/1.5", "qaa/architecture-2026/3.3", "qaa/architecture-2026/2.1"]
rows:
  d3:
    practice: "develops design proposals of moderate complexity through iterative drawing and modelling, answering a brief with attention to site, materials and technical coherence"
    knowledge: "construction systems, building physics, fire and life safety, climate and regenerative design principles and the cultural and historical precedents that shape buildings"
    identity: "an architecture student who follows professional codes of conduct and weighs the ethical effects of design on society, the environment and wellbeing"
    ids: ["qaa/architecture-2026/4.6.b1", "qaa/architecture-2026/4.6.b2", "qaa/architecture-2026/4.6.b3", "qaa/architecture-2026/4.6.b4", "qaa/architecture-2026/4.6.b5", "qaa/architecture-2026/4.6.b8"]
  e2:
    practice: "uses architectural research methods and digital tools to test design decisions, then presents and defends the proposal to clients, reviewers and lay audiences"
    knowledge: "the legal and commercial framework of building projects, from procurement and contracts to planning systems, cost control and the economic forces that shape a scheme"
    identity: "a designer who listens to and works with the people a building serves and treats equity, inclusion and accessibility as design obligations"
    ids: ["qaa/architecture-2026/4.6.b6", "qaa/architecture-2026/4.6.b7", "qaa/architecture-2026/4.6.b9", "qaa/architecture-2026/4.6.b10", "qaa/architecture-2026/4.6.b11", "qaa/architecture-2026/4.6.b12", "qaa/architecture-2026/4.6.b8"]
  e3:
    practice: "resolves complex proposals with originality and systems thinking, applying chosen research methods and BIM, computational design and fabrication to evolve a considered architectural language"
    knowledge: "global architectural history and theory read through narratives and values, alongside social and climate justice and how to apply regenerative principles to real projects"
    identity: "an architect in formation who advocates for communities, accepts civic duty and climate justice and regulates own conduct when building collaborative design teams"
    ids: ["qaa/architecture-2026/4.7.b1", "qaa/architecture-2026/4.7.b2", "qaa/architecture-2026/4.7.b3", "qaa/architecture-2026/4.7.b4", "qaa/architecture-2026/4.7.b6", "qaa/architecture-2026/4.7.b7", "qaa/architecture-2026/4.7.b8", "qaa/architecture-2026/4.7.b11"]
note: "No typical or excellent split at level 6: e2 is drawn from the more demanding bachelor's minimum standards (research methods, professional context, working with others)."
