mastery: "Across the tiers the weight moves along Anderson and Krathwohl's continuum: Introductory is declarative, the kinds and value of learning in practice, with one's own goals set; Intermediate is procedural, conduct and the mentor, with theory tested against practice; Advanced is procedural at its highest, a model and a judgement, and metacognitive in the practitioner's reflection on their own practice and identity. In Lave and Wenger's terms the learner moves from legitimate peripheral participation towards full membership, and changes who they are as they do. Mastery is learning from experience to a professional standard, the map's Advanced goal, which is the core's A11 ladder from compliance to flow."

differ: "the two agree: the types and value at Introductory; conduct, the mentor and testing theory at Intermediate; Kolb, reflective assessment and professional judgement at Advanced."

qfAdd: "the frameworks describe this practice better than most: applying understanding (L4), taking responsibility (L4, L5) and decision-making in complex and unpredictable contexts (L6, L7). None names identity; e3's practitioner identity sits beyond what the descriptors say."

