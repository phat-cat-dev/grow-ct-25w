vicSummary: "What this shows: three of the twelve extracts are skill (early childhood studies on mentoring others; accounting and engineering on professional judgement). The rest list placements, field work and experiential learning as settings or methods. The benchmarks name the modes of this practice often and describe the learner's part in them rarely, except at the professional end."

across:
  - "**The guide's vocabulary against the benchmarks':** the guide says practice- and work-based learning, placement, internship, simulation, mentor, experiential learning cycle, experiencing, reflecting, thinking, acting, professional judgement; the benchmarks say work placements, field work, mentorship schemes, experiential learning, reflection on practice, professional judgement. Both belong in the practice searcher's vocabulary for this pathway."
  - "**Skill against theme:** three of the twelve extracts are skill, all about judgement or mentoring at the professional end."
  - "**Book coverage:** Chapter 12 carries all nine cards: the types, the benefits, the five tips (immerse, approach as a professional, exploit the mentor, test theory, adopt a reflective mindset), Kolb's cycle and John on placement."
  - "**Other authors:** META holds Lave and Wenger, Kolb and Schön; this pathway is where Lave and Wenger's movement from the edge of a community to its centre is most literal."

qfIntro: "Both frameworks speak of applying understanding and taking responsibility in work, rising from limited parameters to decision-making in complex and unpredictable contexts (FHEQ L6, L7)."
