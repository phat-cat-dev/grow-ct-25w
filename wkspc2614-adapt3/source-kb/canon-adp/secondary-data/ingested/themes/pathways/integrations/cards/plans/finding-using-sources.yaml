  - {tier: Introductory, statement: "Names the tools and stages of a search: the discovery service, the reading list, plan, keywords, evaluate, extend.", type: factual, process: remember}
  - {tier: Introductory, statement: "Explains why academic searching is exploratory and effortful, unlike looking up trivia.", type: conceptual, process: understand}
  - {tier: Introductory, statement: "Finds sources on the discovery service for one task.", type: procedural (one method), process: apply, change: "declarative knowledge first put to work"}
  - {tier: Introductory, statement: "Starts from what they already know and what the reading list gives them.", type: metacognitive (beginning), process: understand, change: "knowledge of one's own knowledge appears"}
  - {tier: Intermediate, statement: "Explains how keywords, synonyms, operators and limiters widen or narrow a search.", type: conceptual, process: analyse}
  - {tier: Intermediate, statement: "Builds a search string with Boolean operators and applies limiters.", type: procedural, process: apply}
  - {tier: Intermediate, statement: "Reads each set of results and changes the search in response.", type: metacognitive (strategic), process: evaluate, change: "monitoring one's own search and changing it"}
  - {tier: Advanced, statement: "Extends a search through databases, citation searching and Google Scholar.", type: procedural, process: apply}
  - {tier: Advanced, statement: "Judges sources by type, currency, authority and relevance to their own knowledge-building.", type: procedural with metacognitive (criteria for choosing), process: evaluate, change: "the criteria become the learner's own"}
  - {tier: Advanced, statement: "Searches comprehensively for a dissertation and decides when the discourse is covered.", type: metacognitive (self-regulation), process: evaluate, create, change: "functioning knowledge: the search directed by the learner"}

mastery: "Across the tiers the weight moves along Anderson and Krathwohl's continuum: Introductory is mostly declarative, what academic searching is and where to start, with one procedure (the discovery service) and a first look at what one already knows; Intermediate is procedural, the craft of keywords, operators and limiters, with monitoring of one's own search beginning; Advanced is procedural and metacognitive, extending and judging, and deciding for oneself what a comprehensive search needs. In Kuhlthau's terms the learner moves from the uncertainty of initiation to the confidence of a formed focus; in Willison and O'Regan's, from prescribed to open research. Mastery is the guide's \"science\" of searching become the learner's own, which is the core's A11 ladder from compliance to flow."

differ: "the map puts planning from what one already knows at Intermediate; i3 places it at Introductory (the former c1, ruled there). Otherwise the two agree: the reframe and the discovery service at Introductory; keywords, synonyms, Boolean operators, limiters and iterative narrowing at Intermediate; evaluation with discernment and extending the search at Advanced."

qfAdd: "neither framework names searching or sources; they name investigation and research that inform action, and the FHEQ names using scholarly reviews and refereed articles at L6. The tiers' move from finding to judging to covering a field has no single statement; it is spread across application, knowledge and the FHEQ's sources."

