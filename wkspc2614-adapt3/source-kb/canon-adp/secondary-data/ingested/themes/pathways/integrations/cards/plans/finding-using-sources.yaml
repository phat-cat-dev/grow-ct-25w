vicSummary: "What this shows: one of the twelve extracts is skill (chemistry: examining and critiquing the literature to stay current). The rest are word matches: strategy as research design, peer review of teaching, libraries as partners or a profession, systematic review as a project type. Searching is so assumed in the benchmarks that they almost never describe it."

across:
  - "**The guide's vocabulary against the benchmarks':** the guide says discovery service, reading list, search strategy, keywords, synonyms, Boolean operators, limiters, currency, authority, relevance, citation searching, databases, Google Scholar; the benchmarks say research literature, sources of information, currency of knowledge, peer-reviewed, systematic review. The practice searcher would need the guide's words, not the benchmarks', to find this practice."
  - "**Skill against theme:** one of the twelve extracts is skill. adp-0212's matches for \"strategy\", \"peer\" and \"library\" mostly belong to other senses of the words."
  - "**Book coverage:** Chapter 7 carries all nine cards: the reframe (i1), the discovery service (i2), planning from what you know (i3), keywords and synonyms (d1), Boolean operators and limiters (d2), the iterative strategy (d3), extending the search (e1), the evaluative criteria (e2) and the dissertation search (e3)."
  - "**Other authors:** META holds Kuhlthau and Willison and O'Regan; Kuhlthau describes the searcher's experience, Willison and O'Regan the growing autonomy the tiers climb."

qfIntro: "Neither framework names searching: they speak of investigation that informs action, rising from appropriate investigation (L3, L4) to relevant research (L5) and designed research (L6, L7), and of using scholarly reviews and primary sources (FHEQ L6)."
