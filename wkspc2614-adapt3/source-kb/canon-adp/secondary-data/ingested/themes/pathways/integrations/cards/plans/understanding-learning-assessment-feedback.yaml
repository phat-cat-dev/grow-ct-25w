vicSummary: "What this shows: three of the sixteen extracts are skill (anthropology, art and design, health studies) and say what the learner does: engage with the community, assess their own and others' work, act on feedback. The rest describe provision: the subjects say what they offer (student-centred learning, varied assessment, independent study, learning outcomes), and the verbs belong to the curriculum, not the learner."

across:
  - "**The guide's vocabulary against the benchmarks':** the guide says discourse community, active and passive learning, formative and summative, intended learning outcomes, constructive alignment, the feedback cycle and self-regulated learning; the benchmarks say disciplinary conventions, student-centred and self-directed learning, independent study, act on feedback, and self-assessment that encourages ownership of learning. Both belong in the practice searcher's vocabulary for this pathway."
  - "**Skill against theme:** of the sixteen extracts adp-0212 chose, three are skill and thirteen theme. The benchmarks speak of this practice mostly as provision, which is why a search on its words finds so much and shows so little of the learner."
  - "**Book coverage:** the guide carries all nine cards, across Chapters 3, 4, 5 and 6: e1 as assessment agility and e2 as self and peer assessment (p. 66), e3 as diagnostic feedback and dialogue (p. 80). adp-0212's draft book map has no entries for e1 to e3; their quotes are ing's, checked by script."
  - "**Other authors:** META holds runs for Lave and Wenger, Marton and Säljö, Biggs, Schön, and Carless and Boud; Zimmerman, Sadler, Tai and others, and Sambell, McDowell and Montgomery are wanted (W-0037, W-0041, W-0047, W-0044)."

qfIntro: "Neither framework names learning, assessment or feedback as such: they speak of knowing the nature of one's area of study, reviewing and evaluating one's own methods and results, the limits of one's knowledge and managing one's own learning."
