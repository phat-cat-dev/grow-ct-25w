tierStatements:
  - {tier: Introductory, statement: "Names the parts of the learning framework: module handbook, lectures and tutorials, synchronous and asynchronous learning, formative and summative assessment, feedback as comments and a mark.", type: factual, process: remember}
  - {tier: Introductory, statement: "Explains the discourse community and the move from its edge to its centre, and deep against surface learning.", type: conceptual, process: understand}
  - {tier: Introductory, statement: "Makes notes actively and takes part in a formative task rather than transcribing.", type: procedural (one method), process: apply, change: "declarative knowledge first put to work"}
  - {tier: Introductory, statement: "Recognises whether their own approach is active or passive, deep or surface.", type: metacognitive (beginning), process: understand, change: "knowledge of oneself as a learner appears, prompted"}
  - {tier: Intermediate, statement: "Explains how outcomes, activities and assessment are aligned, and what the mark bands in marking criteria ask for.", type: conceptual, process: analyse, change: "the design behind the system comes into view"}
  - {tier: Intermediate, statement: "Works through the feedback cycle (review, interpret, articulate, apply) to an action plan.", type: procedural, process: apply, change: "from one task to a cycle"}
  - {tier: Intermediate, statement: "Plans, monitors and adapts strategy through the forethought, behaviour and evaluation phases.", type: metacognitive (strategic), process: evaluate, change: "knowledge of one's own strategies, used to change them"}
  - {tier: Advanced, statement: "Chooses an approach suited to an assessment genre and its differences from others.", type: procedural (criteria for choosing), process: evaluate, change: "knowing when to use which approach"}
  - {tier: Advanced, statement: "Judges own and peers' work against criteria before submission.", type: metacognitive (evaluative judgement), process: evaluate, change: "the learner holds the standard, not only the tutor"}
  - {tier: Advanced, statement: "Uses feedback in dialogue with tutors and across modules to direct their own development over a degree.", type: metacognitive with procedural, process: create, change: "functioning knowledge: development owned"}

mastery: "Across the tiers the weight moves along Anderson and Krathwohl's continuum: Introductory is mostly declarative, the names and ideas of the system, with one procedure (active note-making, a formative task) and a first look at one's own approach; Intermediate is mostly procedural, the feedback cycle and the phases of self-regulation, with knowledge of one's own strategies beginning; Advanced is mostly metacognitive, the learner judging their own work against the standard and steering their development across a degree. In Biggs's terms the movement is from knowing how the system works to using it; in Marzano and Kendall's, from the cognitive system to metacognition and then the self-system, where the learner's own goals direct how they use assessment and feedback. Mastery is the learner no longer waiting for the system to tell them how they are doing, which is the core's A11 ladder from compliance to flow."

differ: "the map places the formative-to-summative strategy at Intermediate and assessment agility at Advanced; i2 asks the learner to engage with varied assessment forms at Introductory, close to e1. Otherwise the two agree: deep and surface learning and the learning framework at Introductory, alignment, marking criteria, the feedback cycle and self-regulation at Intermediate, self- and peer assessment and feedback dialogue at Advanced."

qfAdd: "neither framework names assessment literacy, feedback or evaluative judgement. The CQFW speaks of reviewing and then evaluating one's own methods and results at every level, which is the feedback cycle's ground; the FHEQ's understanding of the limits of one's knowledge (L5) is the nearest statement to i3, and managing one's own learning (L6) to d3."

review:
  - "i2's \"engage with varied assessment forms\" overlaps e1's \"adapt to the demands of different types of assessment\"; the model's author may want i2 narrowed to formative and summative."
  - "Pedagogy for d3, e1 and e2 waits for Zimmerman (W-0037), Sambell, McDowell and Montgomery (W-0044), Sadler (W-0041) and Tai and others (W-0047)."
  - "d2's theory in the core is Schön; Carless and Boud (2018), whose work the guide says inspired its feedback cycle, fits it as well and is held by META."
