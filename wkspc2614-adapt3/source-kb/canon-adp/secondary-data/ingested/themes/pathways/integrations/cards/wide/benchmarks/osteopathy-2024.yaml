slug: osteopathy-2024
name: "Osteopathy (2024)"
run: "std:doc:qaa-osteopathy-2024-benchmarks"
subject: "Osteopathy studies how the body is built and works, chiefly the neuromusculoskeletal system and prepares regulated primary healthcare practitioners to assess and treat the whole person through touch and shared decisions."
subjectIds: [qaa/osteopathy-2024/1.5, qaa/osteopathy-2024/1.12.b1]
rows:
  d3:
    practice: "takes a detailed case history, palpates and examines to reach a working diagnosis, then selects, applies and monitors osteopathic techniques in a treatment plan agreed with the patient"
    knowledge: "the anatomy, physiology and pathology of the neuromusculoskeletal system, pain neurophysiology and the psychosocial factors that shape how a patient's complaint presents"
    identity: "a caring and trustworthy osteopath in training who works as the patient's partner, protects their dignity, consent and confidentiality and keeps to the Osteopathic Practice Standards"
    ids: [qaa/osteopathy-2024/3.6.e.i, qaa/osteopathy-2024/6.10.b4, qaa/osteopathy-2024/6.10.b6, qaa/osteopathy-2024/3.6.a.i, qaa/osteopathy-2024/3.6.a.iv, qaa/osteopathy-2024/3.4.b3, qaa/osteopathy-2024/3.6.l.v, qaa/osteopathy-2024/3.6.l.ii]
  e2:
    practice: "reasons clinically where knowledge is incomplete or the case unpredictable, tests osteopathy's therapeutic claims against research and runs audits or service evaluations to improve patient care"
    knowledge: "the research, clinical experience and patient expectation that make up evidence-informed practice and where osteopathy sits beside other health professions in UK and international healthcare"
    identity: "an accountable, autonomous practitioner who judges their own integrity and candour critically, knows where their competence ends and leads with resilience in unfamiliar clinical settings"
    ids: [qaa/osteopathy-2024/6.10.b5, qaa/osteopathy-2024/6.10.b13, qaa/osteopathy-2024/6.6, qaa/osteopathy-2024/3.6.m.iii, qaa/osteopathy-2024/6.10.b11, qaa/osteopathy-2024/3.6.m.i, qaa/osteopathy-2024/6.10.b12, qaa/osteopathy-2024/6.10.b9]
note: "Level 6 only and no typical or excellent standard, so e2 draws on the more demanding level 6 statements and there is no e3."
