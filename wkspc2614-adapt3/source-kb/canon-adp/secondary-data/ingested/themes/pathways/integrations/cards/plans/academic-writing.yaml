mastery: "Across the tiers the weight moves along Anderson and Krathwohl's continuum: Introductory is mostly declarative and procedural, the cycle, the parts of an essay and the common errors, with a first noticing of one's own errors; Intermediate is mostly procedural, editing and structuring and integrating sources, with the four pillars turned on one's own draft; Advanced is conceptual and metacognitive, the conventions of a discipline read and then written from within. In Biggs's terms the movement is from knowing how to write to writing that does its work in a discipline; in Lea and Street's, from study skills through academic socialisation to academic literacies. Mastery is disciplinary self-awareness in writing, the map's Advanced goal, which is the core's A11 ladder from compliance to flow."

differ: "the map puts the voices technique, and the four pillars as a self-review lens, at Intermediate; e2 (integrating sources actively) sits at Advanced here with the critical edge, and the four pillars are at the top of Intermediate (d3), as in the map. The map places discipline conventions at Advanced deliberately, against the book's order (its own note); the cards follow the map."

qfAdd: "the frameworks speak of communication rising in range of audience and form, and of evaluating one's own work; neither names genre, convention or the discipline as the frame of one's writing, which is where e1 and e3 take the learner."

