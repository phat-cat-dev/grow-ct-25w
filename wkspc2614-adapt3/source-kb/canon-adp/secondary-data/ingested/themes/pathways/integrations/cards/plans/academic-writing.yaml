vicSummary: "What this shows: three of the fourteen extracts are skill: leaving time to proofread (English) and the structure, coherence and clarity of expression (languages, history), which say what i3 and d2 say. The rest list genres and assessment forms; their verbs belong to the curriculum. Benchmarks name the genres a writer meets far more than the writing they ask for."

across:
  - "**The guide's vocabulary against the benchmarks':** the guide says writing cycle, steer and keywords, first draft, editing and proofreading, comma splice, SVO, active voice, topic sentence, the four pillars, voices, writing conventions; the benchmarks say essays, extended essays, dissertations, reflective writing, policy briefs, critical reviews, and structure, coherence and clarity of expression. Both belong in the practice searcher's vocabulary for this pathway."
  - "**Skill against theme:** three of the fourteen extracts are skill. Writing is everywhere in the benchmarks as a list of genres and nearly nowhere as a described skill."
  - "**Book coverage:** Chapter 9 carries all nine cards; the writing cycle and Emma's blank page (i2), the steer and keywords (i1), proofreading and editing (i3), genres and structure (d1), sentences (d2), the four pillars (d3), discipline conventions (e1, e3) and the voices technique (e2)."
  - "**Other authors:** META holds Lea and Street and Wingate; both read writing as practice within a discipline, which is where the cards end."

qfIntro: "Both frameworks speak of communicating results and arguments, rising from accurate and reliable communication with structured arguments (L4) to communicating in a variety of forms (L5), to specialist and non-specialist audiences (L6) and clearly, with sound judgement (L7); the CQFW adds evaluating one's own methods and results, the ground of editing."
