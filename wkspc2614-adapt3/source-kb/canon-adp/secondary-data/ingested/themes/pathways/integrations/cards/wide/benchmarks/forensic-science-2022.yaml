slug: forensic-science-2022
name: "Forensic Science (2022)"
run: "std:doc:qaa-forensic-science-2022-benchmarks"
subject: "Forensic Science applies chemistry, biology, physics, digital and statistical methods to evidence, so that findings from crime scenes and laboratories can be tested impartially and presented to courts."
subjectIds: [qaa/forensic-science-2022/1.4, qaa/forensic-science-2022/3.18]
rows:
  d3:
    practice: "examines scenes, recovers and analyses physical, biological and digital traces without contamination and reports impartial findings for police and courts"
    knowledge: "the underpinning sciences, Bayesian reasoning and likelihood ratios, kinds of cognitive bias, quality assurance and the legal settings in which evidence is used"
    identity: "a forensic scientist in training who stays objective and honest, admits the limits of own knowledge and accepts a duty to the court"
    ids: [qaa/forensic-science-2022/4.5.b1, qaa/forensic-science-2022/4.5.b4, qaa/forensic-science-2022/4.4.b23, qaa/forensic-science-2022/4.4.b20, qaa/forensic-science-2022/4.4.b1, qaa/forensic-science-2022/4.4.b5, qaa/forensic-science-2022/3.28.b2, qaa/forensic-science-2022/1.6.b18]
  e2:
    practice: "builds and runs case strategies with the Case Assessment and Interpretation framework, develops laboratory methods and defends expert opinion with quantified uncertainty"
    knowledge: "detailed command of forensic techniques and statistics, a critical sense of how the discipline advances and of how intelligence value differs from evidential value"
    identity: "an autonomous examiner consistently committed to the ethical and legal duties of forensic work and respectful in handling human tissue, DNA and personal data"
    ids: [qaa/forensic-science-2022/4.8.b23, qaa/forensic-science-2022/4.9.b4, qaa/forensic-science-2022/4.8.b18, qaa/forensic-science-2022/4.8.b19, qaa/forensic-science-2022/4.8.b11, qaa/forensic-science-2022/4.8.b9, qaa/forensic-science-2022/4.8.b12, qaa/forensic-science-2022/4.8.b13]
  e3:
    practice: "conceives and conducts original forensic research, designs new experimental procedures and solves unfamiliar, open-ended casework problems with little supervision"
    knowledge: "deep specialist knowledge of techniques in one forensic area or a wide critical overview of the whole discipline, informed by current research and its methods"
    identity: "a self-critical forensic professional who weighs the moral questions of practice, sees the profession's limits and openings and keeps learning throughout a career"
