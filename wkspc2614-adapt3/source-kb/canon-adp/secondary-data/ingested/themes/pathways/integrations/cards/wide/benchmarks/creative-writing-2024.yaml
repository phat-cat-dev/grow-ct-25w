slug: creative-writing-2024
name: "Creative Writing (2024)"
run: "std:doc:qaa-creative-writing-2024-benchmarks"
subject: "Creative Writing teaches the craft of making poems, fiction, drama and life writing through drafting, workshop critique and revision, so that writers can reach readers in many forms and media."
subjectIds: [qaa/creative-writing-2024/1.20, qaa/creative-writing-2024/1.31]
rows:
  d3:
    practice: "drafts poems, stories and scripts across several genres, then improves them through repeated rounds of workshop feedback, editing and redrafting"
    knowledge: "the forms of prose, poetry, story and drama, basic craft and narrative techniques and how written and spoken language behaves across genres and media"
    identity: "a developing writer who reflects on own process and influences, owns each piece from first idea to final draft and values inclusive workshop critique"
    ids: [qaa/creative-writing-2024/4.3.b1, qaa/creative-writing-2024/4.3.b13, qaa/creative-writing-2024/2.2.b6, qaa/creative-writing-2024/4.3.b12, qaa/creative-writing-2024/4.3.b4, qaa/creative-writing-2024/4.3.b2, qaa/creative-writing-2024/2.2.b5, qaa/creative-writing-2024/4.3.b9]
  e2:
    practice: "conceives ambitious original work that can reshape a genre, researches it independently and places it within historical, cultural or genre traditions"
    knowledge: "how reading feeds own writing, the social and historical life of story from older texts to digital media and the presentation standards of the publishing industry"
    identity: "an independent, disciplined writer whose work answers questions of inclusion, ecology and diversity and who co-produces with communities of writers beyond the classroom"
    ids: [qaa/creative-writing-2024/4.4.b1, qaa/creative-writing-2024/4.5.b1, qaa/creative-writing-2024/4.4.b11, qaa/creative-writing-2024/4.4.b8, qaa/creative-writing-2024/4.4.b10, qaa/creative-writing-2024/4.4.b7, qaa/creative-writing-2024/4.5.b4, qaa/creative-writing-2024/4.5.b9]
  e3:
    practice: "conceives, researches and completes a substantial original writing project, with a critical commentary that sets it in a scholarly or creative tradition"
    knowledge: "own working methods and influences as a writer, how style shifts across media and narrative forms and the creative risks and gains of AI and other technologies"
    identity: "a self-directed professional writer who weighs the ethics of AI-assisted making, gives feedback alert to varied backgrounds and uses writing to support well-being"
