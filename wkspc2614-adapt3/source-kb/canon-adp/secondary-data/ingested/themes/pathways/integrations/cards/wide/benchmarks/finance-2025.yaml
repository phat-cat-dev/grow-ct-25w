slug: finance-2025
name: "Finance (2025)"
run: "std:doc:qaa-finance-2025-benchmarks"
subject: "Finance studies how markets, banks and firms raise, price and manage money and risk, so that graduates can make sound, ethical and sustainable financial decisions."
subjectIds: [qaa/finance-2025/1.6, qaa/finance-2025/1.7, qaa/finance-2025/1.8]
rows:
  d3:
    practice: "gathers market, accounting and household data, runs simple statistical tests in software and applies valuation and portfolio tools to real financial problems"
    knowledge: "core finance theory such as arbitrage, asset pricing and cost of capital, how markets are regulated and how fintech and climate risk reshape financial services"
    identity: "a finance student who weighs governance and ethics in every financial decision and sees finance as a lever for sustainable outcomes for people and planet"
    ids: [qaa/finance-2025/4.4.b7, qaa/finance-2025/4.4.b8, qaa/finance-2025/3.2.b4, qaa/finance-2025/3.2.b2, qaa/finance-2025/4.4.b5, qaa/finance-2025/4.4.b12, qaa/finance-2025/4.4.b4, qaa/finance-2025/4.4.b11]
  e2:
    practice: "investigates complex finance problems with largely autonomous judgement, chooses and justifies established methods and defends decisions with well-evidenced, original argument"
    knowledge: "rigorous command of finance paradigms and methods, deep knowledge of several specialist areas and a keen sense of the uncertainty and limits in financial evidence"
    identity: "an independent financial analyst who reads well past taught material, questions every source critically and takes ownership of decisions on complex problems (ing's reading)"
    ids: [qaa/finance-2025/4.5.s4, qaa/finance-2025/4.6.s5, qaa/finance-2025/4.6.s7, qaa/finance-2025/4.5.s2, qaa/finance-2025/4.6.s2, qaa/finance-2025/4.6.s4, qaa/finance-2025/4.6.s3, qaa/finance-2025/4.6.s1]
  e3:
    practice: "conducts a self-directed dissertation or applied project, ideally testing a financial question empirically against data, after deeper taught study of core specialisms"
    knowledge: "advanced specialist knowledge in one or more core areas of finance and the research methods that underpin empirical testing of financial theory"
    identity: "an emerging finance researcher or specialist who treats research as central to practice and may go on to doctoral study (ing's reading)"
    ids: [qaa/finance-2025/2.14, qaa/finance-2025/1.15.b1, qaa/finance-2025/2.17]
note: "Level 7 statements are few and describe course design rather than graduate standards, so e3 is thin."
