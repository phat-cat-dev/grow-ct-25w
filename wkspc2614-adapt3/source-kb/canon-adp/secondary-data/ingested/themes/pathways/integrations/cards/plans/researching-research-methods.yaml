mastery: "Across the tiers the weight moves along Anderson and Krathwohl's continuum: Introductory is mostly declarative, what a research project is and what a question needs, with a first judgement of what one can research; Intermediate is procedural, the genres of the proposal, the review and the report, with one's own work placed in the field; Advanced is procedural at its highest form, choosing a methodology and applying ethics, and metacognitive in running a whole project. In Willison and O'Regan's terms the learner moves from prescribed towards open research, setting their own scope. The tier map notes that this pathway skews later than most, so its Introductory learner is already capable; mastery is independent research to a scholarly standard, which is the core's A11 ladder from compliance to flow."

differ: "the two agree: question, rationale and aims at Introductory; the proposal, the literature review as critique and the report at Intermediate; methodology, ethics and the dissertation at Advanced. The map notes that the whole pathway skews later; the indicative levels here are the cards' positions, not a claim that its Introductory learner is at L3."

qfAdd: "the frameworks name research at every level, and this is the pathway they describe best: investigation (L3, L4), methods of enquiry (L5), established techniques and current research (L6), designing research and acting autonomously (L7). They name ethics only as personal responsibility."

