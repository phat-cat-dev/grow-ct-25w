vicSummary: "What this shows: four of the twelve extracts are skill (architectural technology, history, health studies, public policy), all at the Advanced end: methodology, ethics, the independent project. The benchmarks speak of research mostly as the dissertation and its assessment forms, and rarely of framing a question, which is where the Introductory tier starts."

across:
  - "**The guide's vocabulary against the benchmarks':** the guide says research question, rationale, aims and objectives, research proposal, indicative bibliography, literature review, report structure, methodology, ESRC principles, consent, anonymisation, dissertation; the benchmarks say research questions, research methodology, independent research project, research ethics, codes and policies, dissertations, research reports. The vocabularies are close: this is the pathway where the guide and the benchmarks speak most alike."
  - "**Skill against theme:** four of the twelve extracts are skill, all for the Advanced cards."
  - "**Book coverage:** the research genres in Chapter 9 and research ethics in Chapter 10 carry all nine cards; the dissertation is introduced in Chapter 5 (p. 66)."
  - "**Other authors:** META holds Willison and O'Regan, whose facets and degrees of autonomy fit the tiers closely; no other research methods text is held."

qfIntro: "Both frameworks speak of research and enquiry at every level, rising from appropriate investigation (L3, L4) through methods of enquiry (L5) and established techniques of analysis (L6) to designing and undertaking research (L7)."
