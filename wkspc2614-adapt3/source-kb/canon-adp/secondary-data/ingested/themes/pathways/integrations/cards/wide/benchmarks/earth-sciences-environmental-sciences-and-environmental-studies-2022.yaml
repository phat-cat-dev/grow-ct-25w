slug: earth-sciences-environmental-sciences-and-environmental-studies-2022
name: "Earth Sciences, Environmental Sciences and Environmental Studies (2022)"
run: "std:doc:qaa-earth-sciences-environmental-sciences-and-environmental-studies-2022-benchmarks"
subject: "These subjects investigate the Earth's systems, history and processes and how people and other living things affect and depend on them, so that action on climate, nature and resources rests on sound and fair science."
subjectIds: ["qaa/earth-sciences-environmental-sciences-and-environmental-studies-2022/1.2", "qaa/earth-sciences-environmental-sciences-and-environmental-studies-2022/1.5", "qaa/earth-sciences-environmental-sciences-and-environmental-studies-2022/3.16"]
rows:
  d3:
    practice: "carries out field and laboratory investigations safely and ethically, identifies rocks, minerals and fossils, records observations and processes data with fitting numerical and qualitative methods"
    knowledge: "the core paradigms of geological time, plate tectonics and evolution and how matter and energy move between rock, water, air, ice and life"
    identity: "an environmental scientist in training who works to fieldwork codes of conduct, completes risk assessments with confidence and acts ethically, sustainably and within the law"
    ids: ["qaa/earth-sciences-environmental-sciences-and-environmental-studies-2022/4.4.b1", "qaa/earth-sciences-environmental-sciences-and-environmental-studies-2022/4.4.b4", "qaa/earth-sciences-environmental-sciences-and-environmental-studies-2022/3.1.b9", "qaa/earth-sciences-environmental-sciences-and-environmental-studies-2022/4.4.b6", "qaa/earth-sciences-environmental-sciences-and-environmental-studies-2022/3.1.b3", "qaa/earth-sciences-environmental-sciences-and-environmental-studies-2022/3.1.b5", "qaa/earth-sciences-environmental-sciences-and-environmental-studies-2022/3.1.b18", "qaa/earth-sciences-environmental-sciences-and-environmental-studies-2022/4.6.b13"]
  e2:
    practice: "plans and runs an independent project on an environmental question, framing hypotheses to design investigations and modelling incomplete field or subsurface data across space and time"
    knowledge: "how uncertainty in data and in system responses bears on decisions about resources, hazards and climate change, weighed across disciplines and within social, economic and environmental settings"
    identity: "an environmental practitioner who questions the ethics and colonial legacy of the discipline and makes a persuasive, evidence-led case that can sway environmental decisions"
    ids: ["qaa/earth-sciences-environmental-sciences-and-environmental-studies-2022/4.3.b7", "qaa/earth-sciences-environmental-sciences-and-environmental-studies-2022/4.3.b6", "qaa/earth-sciences-environmental-sciences-and-environmental-studies-2022/3.1.b10", "qaa/earth-sciences-environmental-sciences-and-environmental-studies-2022/4.3.b9", "qaa/earth-sciences-environmental-sciences-and-environmental-studies-2022/3.4.b11", "qaa/earth-sciences-environmental-sciences-and-environmental-studies-2022/3.4.b13", "qaa/earth-sciences-environmental-sciences-and-environmental-studies-2022/3.1.b16", "qaa/earth-sciences-environmental-sciences-and-environmental-studies-2022/4.5.b5"]
  e3:
    practice: "develops and leads an independent research project on a significant practical environmental question, probing the literature alone and applying techniques and data to varied problems"
    knowledge: "a substantial specialism in one aspect of earth or environmental science, built on first-degree competencies and on the research literature of that area"
    identity: "a specialist earth or environmental scientist who leads own research and grows into a more employable professional in a chosen field (ing's reading)"
