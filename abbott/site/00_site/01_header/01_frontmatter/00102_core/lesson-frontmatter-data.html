<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson record panel</title>
<link rel="stylesheet" href="lesson-frontmatter-data.css">
<style>
  /* A slice of the grow-ct runtime tokens so the panel renders themed, and flips
     for dark mode. Copied from preview.html. Inside grow-ct, drop this block. */
  :root {
    --h: 205; --s: 42%;
    --page-bg:   hsl(var(--h) 30% 96%);
    --surface-1: hsl(var(--h) 24% 99%);
    --ink:       hsl(var(--h) 25% 16%);
    --ink-soft:  hsl(var(--h) 14% 38%);
    --line:      hsl(var(--h) 18% 86%);
    --accent:    hsl(var(--h) var(--s) 42%);
    --accent-ink:hsl(var(--h) var(--s) 34%);
    --shadow:    hsl(var(--h) 40% 20% / .16);
    --font-ui:      "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-heading: var(--font-ui);
    --font-mono:    ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --fs-2xs: clamp(0.75rem, 0.71rem + 0.20vw, 0.85rem);
    --fs-xs:  clamp(0.80rem, 0.75rem + 0.25vw, 0.92rem);
    --fs-base: clamp(1.00rem, 0.93rem + 0.35vw, 1.15rem);
    --fs-md:  clamp(1.15rem, 1.03rem + 0.55vw, 1.35rem);
    --fs-lg:  clamp(1.30rem, 1.12rem + 0.80vw, 1.60rem);
    --fs-2xl: clamp(1.85rem, 1.45rem + 1.80vw, 2.60rem);
    --space-xs:  clamp(0.75rem, 0.65rem + 0.40vw, 1.05rem);
    --space-sm:  clamp(1.00rem, 0.85rem + 0.60vw, 1.50rem);
    --space-md:  clamp(1.50rem, 1.20rem + 1.20vw, 2.50rem);
    color-scheme: light;
  }
  :root[data-theme="dark"], :root:not([data-theme]) { }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page-bg: hsl(var(--h) 32% 8%); --surface-1: hsl(var(--h) 26% 12%);
      --ink: hsl(var(--h) 20% 92%); --ink-soft: hsl(var(--h) 14% 66%);
      --line: hsl(var(--h) 22% 22%);
      --accent: hsl(var(--h) var(--s) 64%); --accent-ink: hsl(var(--h) var(--s) 78%);
      --shadow: hsl(var(--h) 60% 2% / .5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page-bg: hsl(var(--h) 32% 8%); --surface-1: hsl(var(--h) 26% 12%);
    --ink: hsl(var(--h) 20% 92%); --ink-soft: hsl(var(--h) 14% 66%);
    --line: hsl(var(--h) 22% 22%);
    --accent: hsl(var(--h) var(--s) 64%); --accent-ink: hsl(var(--h) var(--s) 78%);
    --shadow: hsl(var(--h) 60% 2% / .5);
    color-scheme: dark;
  }
  body { margin: 0; padding: clamp(1rem, 4vw, 3rem); background: var(--page-bg); font-family: var(--font-ui); }
  .demo-theme { display: block; margin: 0 auto 1rem; max-width: 62rem; text-align: end; }
  .demo-theme button { font: 600 .8rem var(--font-ui); padding: .35rem .8rem; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-1); color: var(--ink); cursor: pointer; }
</style>
</head>
<body>

<div class="demo-theme"><button type="button" id="theme">Flip light / dark</button></div>
<div id="root"></div>

<script src="lesson-frontmatter-data.js"></script>
<script>
  /* Sample data in the shape of frontmatter_spec.md section 3. In production this
     comes from the parsed YAML of the lesson file plus its course record. */
  var course = {
    id: 'course-design-tokens',
    language: 'en-GB',
    learner_pitch: 'intermediate',
    voice_specification: 'reference/excelling-voice-specification.md',
    referencing_style: 'Harvard (Cite Them Right)',
    rights: { holder: null, licence: null },
    lesson_count: 6,
    outcomes: [
      { id: 'CO1', statement: 'Explain how a token system keeps a course visually consistent.' },
      { id: 'CO2', statement: 'Build course blocks that carry their own metadata.' }
    ]
  };

  var record = {
    schema_version: '1.0',
    id: 'lesson-design-tokens-03',
    document_type: 'lesson',
    course_id: 'course-design-tokens',
    parent_id: 'course-design-tokens',
    hierarchy_level: 1,
    sequence: 3,
    title: 'Designing for depth',
    summary: 'How colour, type and space come from a token system, and how a block carries its own metadata.',
    version: '0.3.0',
    status: 'in-review',
    owner: 'Learning design team',
    authors: ['Author A'],
    reviewers: ['Reviewer B'],
    created: '2026-10-19',
    updated: '2026-10-20',
    review_due: '2027-04-01',
    language: 'en-GB',
    tags: ['tokens', 'design systems', 'metadata'],
    sources: [],
    scope: {
      focus: 'Where colour, type and space come from, and how a block declares its own metadata.',
      in_scope: ['Reading a token', 'Building a two-column block', 'Toggling a frontmatter section'],
      out_of_scope: ['Authoring new tokens', 'Theming for dark mode']
    },
    alignment: { course_outcome_ids: ['CO1', 'CO2'] },
    prerequisites: {
      knowledge: ['You can read a CSS custom property, for example var(--accent).'],
      required_lesson_ids: ['lesson-design-tokens-02']
    },
    learning_outcomes: [
      { id: 'LO1', statement: 'Explain where colour, type and space come from in a token system.', course_outcome_ids: ['CO1'], evidence: 'Short written explanation using the lesson example.' },
      { id: 'LO2', statement: 'Build a two-column block with per-column metadata.', course_outcome_ids: ['CO2'], evidence: 'A working block that passes the checkpoint.' },
      { id: 'LO3', statement: 'Toggle a frontmatter section between visible and metadata-only.', course_outcome_ids: ['CO1', 'CO2'], evidence: 'Checkpoint question 2.' }
    ],
    estimated_duration_minutes: 12,
    materials_required: ['A recent piece of your own written feedback', 'Ten quiet minutes'],
    activities: [
      { id: 'ACT1', purpose: 'Trace a colour back to its token.', lesson_outcome_ids: ['LO1'] },
      { id: 'ACT2', purpose: 'Build a two-column block with a worked example.', lesson_outcome_ids: ['LO2'] },
      { id: 'ACT3', purpose: 'Switch a section to metadata-only and compare.', lesson_outcome_ids: ['LO3', 'LO2'] }
    ],
    assessment: { purpose: 'formative', lesson_outcome_ids: ['LO1', 'LO2', 'LO3'] },
    review: { academic_status: 'pending', academic_approved_by: null, academic_approved_on: null },
    frontmatter: {
      eyebrow: 'Before you begin',
      body: "You'll explore where colour, type and space come from in a token system, build a block that carries its own metadata, and see how that keeps a course coherent as it grows.",
      meta: { duration: '12 min', level: 'Intermediate' },
      objectivesTitle: 'By the end of this lesson, you will be able to:',
      objectives: [
        'Explain where colour, type and space come from in a token system.',
        'Build a two-column block with per-column metadata.',
        'Toggle a frontmatter section between visible and metadata-only.'
      ]
    }
  };

  window.panel = LessonFmData.mount(document.getElementById('root'), { record: record, course: course });

  document.getElementById('theme').addEventListener('click', function () {
    var r = document.documentElement;
    var dark = r.getAttribute('data-theme') === 'dark' ||
      (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    r.setAttribute('data-theme', dark ? 'light' : 'dark');
  });
</script>
</body>
</html>
