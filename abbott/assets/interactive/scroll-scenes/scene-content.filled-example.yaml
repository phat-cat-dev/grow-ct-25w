    B:
      model: custom
      model_name: Gather Weigh Choose Check
      derivation:
        shows_that_a_hides: Choosing is a separate step from weighing, and the test shows it.
        why_not_oqea: Observe and Explore overlap when the work is mostly choosing between known options.
