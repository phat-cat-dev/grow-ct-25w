<section class="scroll-scenes" aria-label="Learning journey">
  <nav class="scene-nav" aria-label="Choose a scene">
    <button type="button" data-scroll-to="0">01 Notice</button>
    <button type="button" data-scroll-to="1">02 Try</button>
    <progress data-scroll-progress max="1" value="0" aria-label="Scroll progress"></progress>
    <span class="scene-status" data-scroll-status aria-live="polite"></span>
  </nav>
  <div data-scroll-viewport tabindex="0" role="region" aria-label="Scrollable learning journey">
    <section data-scroll-scene aria-label="Notice"><div data-scene-content>
      <p class="scene-number">01 / NOTICE</p>
      <h2>Your first heading</h2>
      <p class="scene-copy">Replace this with your own context or prompt.</p>
    </div></section>
    <section data-scroll-scene aria-label="Try"><div data-scene-content>
      <p class="scene-number">02 / TRY</p>
      <h2>Your next heading</h2>
      <p class="scene-copy">Replace this with a useful next step.</p>
    </div></section>
  </div>
</section>
