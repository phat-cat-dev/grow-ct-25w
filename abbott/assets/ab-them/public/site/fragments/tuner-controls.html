<div class="seed">
  <div class="field">
    <label for="seed-in">Start colour - hex, rgb, or hsl</label>
    <input type="text" id="seed-in" value="#0A2A3D" spellcheck="false" autocomplete="off" placeholder="#0A2A3D or hsl(202 72% 14%)">
  </div>
  <button type="button" id="seed-apply">Apply</button>
  <span class="chip" id="seed-chip"><i></i><span id="seed-read">hsl(202 72% 14%)</span></span>
</div>
<div class="ctrl">
  <label for="h">Brand hue <b id="h-val">202°</b></label>
  <input type="range" id="h" min="0" max="360" value="202" step="1">
</div>
<div class="ctrl">
  <label for="s">Brand saturation <b id="s-val">72%</b></label>
  <input type="range" id="s" min="0" max="100" value="72" step="1">
</div>
<div class="ctrl">
  <label for="gs">Color-grey saturation <b id="gs-val">12%</b></label>
  <input type="range" id="gs" min="0" max="40" value="12" step="1">
</div>
