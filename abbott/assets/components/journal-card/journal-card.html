<article class="journal-card" data-journal-card="develop-your-thought">
  <header class="journal-card__header">
    <p class="journal-card__kicker">Work in progress / no perfect answers</p>
    <h3 class="journal-card__title">Develop your thought</h3>
  </header>
  <label class="journal-card__field">
    Practice notes
    <textarea rows="5" maxlength="20000" placeholder="Capture a thought, question or next step..." data-journal-text></textarea>
  </label>
  <p class="journal-card__help">What if the opposite were true? What would you remove? What would you keep?</p>
  <footer class="journal-card__footer">
    <button type="button" data-journal-save>Sketch ready / save your ideas</button>
    <button type="button" data-journal-export>Export notes JSON</button>
    <p class="journal-card__status" data-journal-status role="status"></p>
  </footer>
  <p class="journal-card__privacy">Saved only in this browser when you press Save. Nothing is sent to a server. Export a backup before clearing browser data.</p>
</article>
