<section class="learning-sequence" aria-label="Your learning sequence">
  <nav class="expanding-links" data-learning-nav aria-label="Learning steps"></nav>
  <p data-learning-status role="status"></p>
  <section data-learning-step data-label="Explore">
    <h2>Explore the situation</h2>
    <p>Replace this with your first activity or explanation.</p>
  </section>
  <section data-learning-step data-label="Try">
    <h2>Try it yourself</h2>
    <p>Replace this with a meaningful practice task.</p>
  </section>
  <section data-learning-step data-label="Reflect">
    <h2>Reflect and transfer</h2>
    <p>Replace this with a question connecting the activity to future practice.</p>
  </section>
  <div class="learning-actions">
    <button type="button" data-learning-back>Back</button>
    <button type="button" data-learning-complete>Mark step complete</button>
    <button type="button" data-learning-next>Next step</button>
  </div>
</section>
