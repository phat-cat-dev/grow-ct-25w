<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Horizontal flow diagram</title><link rel="stylesheet" href="./diagrams.css"></head>
<body><article class="flow-card" data-flow-card data-flow-shape="horizontal"><h2>Horizontal</h2><svg class="flow-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 90" role="img" aria-label="Four-step horizontal sequence">
        <path class="edge" pathLength="1" style="--d:0s"   d="M38 45 L118 45"/>
        <path class="edge" pathLength="1" style="--d:.15s" d="M118 45 L198 45"/>
        <path class="edge" pathLength="1" style="--d:.3s"  d="M198 45 L278 45"/>
        <circle class="node key" cx="38" cy="45" r="18"/><text class="nlabel" x="38" y="45">1</text>
        <circle class="node" cx="118" cy="45" r="18"/><text class="nlabel" x="118" y="45">2</text>
        <circle class="node" cx="198" cy="45" r="18"/><text class="nlabel" x="198" y="45">3</text>
        <circle class="node" cx="278" cy="45" r="18"/><text class="nlabel" x="278" y="45">4</text>
        <circle class="runner" r="5" style="offset-path:path('M38 45 L278 45')"/>
      </svg><div class="flow-card__controls">
    <label>Nodes<select data-flow-nodes><option value="2">2</option><option value="3">3</option><option value="4" selected>4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option></select></label>
    <button type="button" data-flow-play>Play / replay</button>
    <button type="button" data-flow-pause aria-pressed="false">Pause</button>
    <label>Speed<select data-flow-rate><option value=".5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option><option value="3">3x</option></select></label>
    <label>Runner layer<select data-flow-layer><option value="over">Over nodes</option><option value="behind">Behind nodes</option></select></label>
  </div><p role="status" data-flow-status></p><p><a href="./horizontal.svg" data-flow-download download="horizontal.svg">Download current Horizontal SVG</a></p></article><script src="./diagrams.js"></script></body></html>
