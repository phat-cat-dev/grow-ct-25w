<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vertical flow diagram</title><link rel="stylesheet" href="./diagrams.css"></head>
<body><article class="flow-card" data-flow-card data-flow-shape="vertical"><h2>Vertical</h2><svg class="flow-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 260" role="img" aria-label="Four-step vertical sequence">
        <path class="edge" pathLength="1" style="--d:0s"   d="M60 34 L60 100"/>
        <path class="edge" pathLength="1" style="--d:.15s" d="M60 100 L60 166"/>
        <path class="edge" pathLength="1" style="--d:.3s"  d="M60 166 L60 232"/>
        <circle class="node key" cx="60" cy="34" r="18"/><text class="nlabel" x="60" y="34">1</text>
        <circle class="node" cx="60" cy="100" r="18"/><text class="nlabel" x="60" y="100">2</text>
        <circle class="node" cx="60" cy="166" r="18"/><text class="nlabel" x="60" y="166">3</text>
        <circle class="node" cx="60" cy="232" r="18"/><text class="nlabel" x="60" y="232">4</text>
        <circle class="runner" r="5" style="offset-path:path('M60 34 L60 232')"/>
      </svg><div class="flow-card__controls">
    <label>Nodes<select data-flow-nodes><option value="2">2</option><option value="3">3</option><option value="4" selected>4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option></select></label>
    <button type="button" data-flow-play>Play / replay</button>
    <button type="button" data-flow-pause aria-pressed="false">Pause</button>
    <label>Speed<select data-flow-rate><option value=".5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option><option value="3">3x</option></select></label>
    <label>Runner layer<select data-flow-layer><option value="over">Over nodes</option><option value="behind">Behind nodes</option></select></label>
  </div><p role="status" data-flow-status></p><p><a href="./vertical.svg" data-flow-download download="vertical.svg">Download current Vertical SVG</a></p></article><script src="./diagrams.js"></script></body></html>
