<svg data-motion-asset="reveal" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 130" role="img" aria-labelledby="svg-motion-reveal-title svg-motion-reveal-desc" style="color:var(--motion-accent,#287baa)">
<title id="svg-motion-reveal-title">Curtain reveal</title><desc id="svg-motion-reveal-desc">Letters emerge from a soft vertical curtain. Animation respects reduced motion.</desc>
<style>
svg[data-motion-asset="reveal"] .art{transform-box:view-box;transform-origin:160px 65px;animation:motion-reveal calc(3.6s / var(--motion-speed,1)) ease-in-out infinite}
@keyframes motion-reveal { 0%, 100% { clip-path: inset(0); transform: translateY(0); } 35% { clip-path: inset(100% 0 0); transform: translateY(8px); } 65%, 85% { clip-path: inset(0); transform: translateY(0); } }

svg[data-paused] *{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){svg[data-motion-asset="reveal"] .art,svg[data-motion-asset="reveal"] .echo{animation:none!important;transform:none!important;opacity:1!important;clip-path:none!important}}
</style><g class="art" fill="currentColor"><text x="160" y="76" text-anchor="middle" font-size="38" font-family="system-ui,sans-serif" font-weight="700">Discover</text></g></svg>
