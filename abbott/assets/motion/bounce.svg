<svg data-motion-asset="bounce" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 130" role="img" aria-labelledby="svg-motion-bounce-title svg-motion-bounce-desc" style="color:var(--motion-accent,#287baa)">
<title id="svg-motion-bounce-title">Hop</title><desc id="svg-motion-bounce-desc">A contained bounce, only in this demo. Animation respects reduced motion.</desc>
<style>
svg[data-motion-asset="bounce"] .art{transform-box:view-box;transform-origin:160px 65px;animation:motion-hop calc(2s / var(--motion-speed,1)) ease-in-out infinite}
@keyframes motion-hop { 25% { transform: translateY(-10px); } 45% { transform: translateY(0); } 60% { transform: translateY(-4px); } 75%, 100% { transform: translateY(0); } }

svg[data-paused] *{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){svg[data-motion-asset="bounce"] .art,svg[data-motion-asset="bounce"] .echo{animation:none!important;transform:none!important;opacity:1!important;clip-path:none!important}}
</style><g class="art"><g transform="translate(160 65)" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 27v-53m-18 18L0-26 18-8"/></g></g></svg>
