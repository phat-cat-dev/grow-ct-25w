<svg data-motion-asset="elastic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 130" role="img" aria-labelledby="svg-motion-elastic-title svg-motion-elastic-desc" style="color:var(--motion-accent,#287baa)">
<title id="svg-motion-elastic-title">Elastic type</title><desc id="svg-motion-elastic-desc">A rubbery stretch that settles back into shape. Animation respects reduced motion.</desc>
<style>
svg[data-motion-asset="elastic"] .art{transform-box:view-box;transform-origin:160px 65px;animation:motion-elastic calc(3s / var(--motion-speed,1)) ease-in-out infinite}
@keyframes motion-elastic { 20% { transform: scale(1.12, .85); } 35% { transform: scale(.92, 1.12); } 50% { transform: scale(1.04, .96); } 65%, 100% { transform: scale(1); } }

svg[data-paused] *{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){svg[data-motion-asset="elastic"] .art,svg[data-motion-asset="elastic"] .echo{animation:none!important;transform:none!important;opacity:1!important;clip-path:none!important}}
</style><g class="art" fill="currentColor"><text x="160" y="76" text-anchor="middle" font-size="38" font-family="system-ui,sans-serif" font-weight="700">Stretch</text></g></svg>
