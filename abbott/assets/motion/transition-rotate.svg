<svg data-motion-asset="transition-rotate" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 130" role="img" aria-labelledby="svg-transition-rotate-title">
<title id="svg-transition-rotate-title">Quarter turn transition</title>
<style>svg[data-motion-asset="transition-rotate"] .art{fill:var(--motion-accent,#287baa);transform-box:view-box;transform-origin:160px 65px;animation:transition-transition-rotate calc(2.4s / var(--motion-speed,1)) ease-in-out infinite}
@keyframes transition-transition-rotate{0%,15%,100%{transform:rotate(0)}45%,65%{transform:rotate(90deg)}}
svg[data-paused] *{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){svg[data-motion-asset="transition-rotate"] .art{animation:none!important}}
</style><rect class="art" x="132" y="37" width="56" height="56" rx="4"/></svg>
