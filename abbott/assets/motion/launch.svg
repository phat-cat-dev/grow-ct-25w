<svg data-motion-asset="launch" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 130" role="img" aria-labelledby="svg-motion-launch-title svg-motion-launch-desc" style="color:var(--motion-accent,#287baa)">
<title id="svg-motion-launch-title">Liftoff</title><desc id="svg-motion-launch-desc">A diagonal launch and return. Animation respects reduced motion.</desc>
<style>
svg[data-motion-asset="launch"] .art{transform-box:view-box;transform-origin:160px 65px;animation:motion-launch calc(2.8s / var(--motion-speed,1)) ease-in-out infinite}
@keyframes motion-launch { 45% { transform: translate(18px, -18px); } 70%, 100% { transform: translate(0, 0); } }

svg[data-paused] *{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){svg[data-motion-asset="launch"] .art,svg[data-motion-asset="launch"] .echo{animation:none!important;transform:none!important;opacity:1!important;clip-path:none!important}}
</style><g class="art"><g transform="translate(160 65)" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-8 9C-4-12 10-24 28-27 26-8 13 7-7 11Zm-1-3-13-1 9-12 15-1M-2 12l1 14 13-10V1M-13 15l-10 10"/><circle cx="14" cy="-12" r="4"/></g></g></svg>
