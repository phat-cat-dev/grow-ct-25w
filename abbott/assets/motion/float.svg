<svg data-motion-asset="float" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 130" role="img" aria-labelledby="svg-motion-float-title svg-motion-float-desc" style="color:var(--motion-accent,#287baa)">
<title id="svg-motion-float-title">Drift</title><desc id="svg-motion-float-desc">A cloud tracing a gentle oval. Animation respects reduced motion.</desc>
<style>
svg[data-motion-asset="float"] .art{transform-box:view-box;transform-origin:160px 65px;animation:motion-float calc(4s / var(--motion-speed,1)) ease-in-out infinite}
@keyframes motion-float { 25% { transform: translate(9px, -6px); } 50% { transform: translate(0, -10px); } 75% { transform: translate(-9px, -6px); } }

svg[data-paused] *{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){svg[data-motion-asset="float"] .art,svg[data-motion-asset="float"] .echo{animation:none!important;transform:none!important;opacity:1!important;clip-path:none!important}}
</style><g class="art"><g transform="translate(160 65)" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-19 16C-41 14-33-12-17-10-13-32 17-30 23-10 44-9 37 17 22 16Z"/></g></g></svg>
