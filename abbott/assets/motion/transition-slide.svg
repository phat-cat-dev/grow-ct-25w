<svg data-motion-asset="transition-slide" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 130" role="img" aria-labelledby="svg-transition-slide-title">
<title id="svg-transition-slide-title">Slide transition</title>
<style>svg[data-motion-asset="transition-slide"] .art{fill:var(--motion-accent,#287baa);transform-box:view-box;transform-origin:160px 65px;animation:transition-transition-slide calc(2.4s / var(--motion-speed,1)) ease-in-out infinite}
@keyframes transition-transition-slide{0%,15%,100%{transform:translateX(0)}45%,65%{transform:translateX(65px)}}
svg[data-paused] *{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){svg[data-motion-asset="transition-slide"] .art{animation:none!important}}
</style><rect class="art" x="132" y="37" width="56" height="56" rx="4"/></svg>
