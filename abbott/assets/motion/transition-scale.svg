<svg data-motion-asset="transition-scale" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 130" role="img" aria-labelledby="svg-transition-scale-title">
<title id="svg-transition-scale-title">Scale transition</title>
<style>svg[data-motion-asset="transition-scale"] .art{fill:var(--motion-accent,#287baa);transform-box:view-box;transform-origin:160px 65px;animation:transition-transition-scale calc(2.4s / var(--motion-speed,1)) ease-in-out infinite}
@keyframes transition-transition-scale{0%,15%,100%{transform:scale(.65)}45%,65%{transform:scale(1.15)}}
svg[data-paused] *{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){svg[data-motion-asset="transition-scale"] .art{animation:none!important}}
</style><rect class="art" x="132" y="37" width="56" height="56" rx="4"/></svg>
