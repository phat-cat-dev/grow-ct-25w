<svg data-motion-asset="shimmer" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 130" role="img" aria-labelledby="svg-motion-shimmer-title svg-motion-shimmer-desc" style="color:var(--motion-accent,#287baa)">
<title id="svg-motion-shimmer-title">Colour ribbon</title><desc id="svg-motion-shimmer-desc">A theme-coloured gradient through the letters. Animation respects reduced motion.</desc>
<style>
svg[data-motion-asset="shimmer"] .art{transform-box:view-box;transform-origin:160px 65px;animation:motion-shimmer calc(3s / var(--motion-speed,1)) ease-in-out infinite}
@keyframes motion-shimmer {50% {transform:translateX(-320px)}}

svg[data-paused] *{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){svg[data-motion-asset="shimmer"] .art,svg[data-motion-asset="shimmer"] .echo{animation:none!important;transform:none!important;opacity:1!important;clip-path:none!important}}
</style><defs><clipPath id="svg-motion-shimmer-clip"><text x="160" y="76" text-anchor="middle" font-size="38" font-family="system-ui,sans-serif" font-weight="700">Spectrum</text></clipPath><linearGradient id="svg-motion-shimmer-gradient"><stop stop-color="var(--motion-accent,#287baa)"/><stop offset=".5" stop-color="var(--motion-ink,#202c36)"/><stop offset="1" stop-color="var(--motion-accent,#287baa)"/></linearGradient></defs><g clip-path="url(#svg-motion-shimmer-clip)"><rect class="art" x="0" y="20" width="640" height="90" fill="url(#svg-motion-shimmer-gradient)"/></g></svg>
