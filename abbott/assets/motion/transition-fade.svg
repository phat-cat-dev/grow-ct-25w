<svg data-motion-asset="transition-fade" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 130" role="img" aria-labelledby="svg-transition-fade-title">
<title id="svg-transition-fade-title">Fade transition</title>
<style>svg[data-motion-asset="transition-fade"] .art{fill:var(--motion-accent,#287baa);transform-box:view-box;transform-origin:160px 65px;animation:transition-transition-fade calc(2.4s / var(--motion-speed,1)) ease-in-out infinite}
@keyframes transition-transition-fade{0%,15%,100%{opacity:.25}45%,65%{opacity:1}}
svg[data-paused] *{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){svg[data-motion-asset="transition-fade"] .art{animation:none!important}}
</style><rect class="art" x="132" y="37" width="56" height="56" rx="4"/></svg>
