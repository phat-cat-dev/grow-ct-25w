<svg data-motion-asset="transition-round" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 130" role="img" aria-labelledby="svg-transition-round-title">
<title id="svg-transition-round-title">Square to circle transition</title>
<style>svg[data-motion-asset="transition-round"] .art{fill:var(--motion-accent,#287baa);transform-box:view-box;transform-origin:160px 65px;animation:transition-transition-round calc(2.4s / var(--motion-speed,1)) ease-in-out infinite}
@keyframes transition-transition-round{0%,15%,100%{rx:4px}45%,65%{rx:28px}}
svg[data-paused] *{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){svg[data-motion-asset="transition-round"] .art{animation:none!important}}
</style><rect class="art" x="132" y="37" width="56" height="56" rx="4"/></svg>
