<?xml version="1.0" encoding="UTF-8"?>
<!--
  ulaf-cycle.svg - learning / assessment / feedback cycle.

  Merged from the three authored wedges in inbox/ulfa-cycle-svg/third-*.svg
  (shared centre 320,320, radius 250 - all path/line/text coordinates below
  are copied unchanged; only the viewBox grew to fit all three). Authored for
  src/components/adapt-ab-hotgraphic - see
  docs/authoring/component-specs/ab-hotgraphic.md.

  Authoring contract this file follows:
  - root carries NO role/aria-label/focusable - HotgraphicView.decorateRoot()
    sets role="group", focusable="false" and aria-labelledby/describedby
    (from the title/desc ids below) at runtime. role="img" here would prune
    the hotspot controls from the accessibility tree.
  - each hotspot is one <g data-ab-hotspot="<id>">, resolved by
    hotgraphicLogic.resolveHotspotSelector - the data-ab-hotspot fallback,
    since no _selector is authored for these three in components.json.
  - "wedge" and "label"/"label-sub" classes are paint hooks: fill comes from
    the component's neutral ab hotgraphic wedge fill/ink custom properties,
    with this diagram's own values set in
    src/extensions/adapt-ab-theme/less/ab-hotgraphic.less, scoped to this
    diagram's root modifier class and each hotspot's is-hotspot-id class. No
    fill attribute is authored on wedge/label elements here.
  - "rule" (boundary/radii) and "flow" (the inner directional arrow, with its
    own per-hotspot <marker>) keep their original hardcoded stroke/fill - they
    are this diagram's own decorative choice, not a generalisable token, and
    <marker> content cannot reliably inherit colour from its referencing
    element without poor-support context-stroke.
  - no per-hotspot <title>/aria-label - the view composes the accessible name
    from the authored item title (composeHotspotLabel).
  - document order is learning, assessment, feedback, matching _items order.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="55 55 530 530">

  <title id="title">Learning, assessment and feedback cycle</title>
  <desc id="desc">A circular diagram of the learning, assessment and feedback cycle: three parts - learning, assessment and feedback - joined by arrows, so learning leads to assessment, assessment to feedback, and feedback back to learning.</desc>

  <defs>
    <marker id="arrowhead-learning" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ADB5BD"/>
    </marker>
    <marker id="arrowhead-assessment" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#495057"/>
    </marker>
    <marker id="arrowhead-feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#E9ECEF"/>
    </marker>
  </defs>

  <!-- 1. learning -->
  <g data-ab-hotspot="learning">
    <path class="wedge" d="M 320.0 320.0 L 103.49 195.00 A 250.0 250.0 0 0 1 536.51 195.00 Z"/>
    <path class="rule" d="M 103.49 195.00 A 250.0 250.0 0 0 1 536.51 195.00" fill="none" stroke="#212529" stroke-width="3"/>
    <line class="rule" x1="320.0" y1="320.0" x2="103.49" y2="195.00" stroke="#212529" stroke-width="2"/>
    <line class="rule" x1="320.0" y1="320.0" x2="536.51" y2="195.00" stroke="#212529" stroke-width="2"/>
    <path class="flow" d="M 172.79 156.51 A 220.0 220.0 0 0 1 467.21 156.51" fill="none" stroke="#ADB5BD" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead-learning)"/>
    <g text-anchor="middle" font-family="Montserrat, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">
      <text class="label" x="320.0" y="190.0" font-size="24" font-weight="700">Learning</text>
      <text class="label-sub" x="320.0" y="221.0" font-size="15">knowledge &amp; practice</text>
      <text class="label-sub" x="320.0" y="241.0" font-size="15">outcomes</text>
    </g>
  </g>

  <!-- 2. assessment -->
  <g data-ab-hotspot="assessment">
    <path class="wedge" d="M 320.0 320.0 L 536.51 195.00 A 250.0 250.0 0 0 1 320.00 570.00 Z"/>
    <path class="rule" d="M 536.51 195.00 A 250.0 250.0 0 0 1 320.00 570.00" fill="none" stroke="#212529" stroke-width="3"/>
    <line class="rule" x1="320.0" y1="320.0" x2="536.51" y2="195.00" stroke="#212529" stroke-width="2"/>
    <line class="rule" x1="320.0" y1="320.0" x2="320.00" y2="570.00" stroke="#212529" stroke-width="2"/>
    <path class="flow" d="M 535.19 274.26 A 220.0 220.0 0 0 1 387.98 529.23" fill="none" stroke="#495057" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead-assessment)"/>
    <g text-anchor="middle" font-family="Montserrat, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">
      <text class="label" x="415.3" y="355.0" font-size="24" font-weight="700">Assessment</text>
      <text class="label-sub" x="415.3" y="386.0" font-size="15">criteria</text>
      <text class="label-sub" x="415.3" y="406.0" font-size="15">measure progress</text>
    </g>
  </g>

  <!-- 3. feedback -->
  <g data-ab-hotspot="feedback">
    <path class="wedge" d="M 320.0 320.0 L 320.00 570.00 A 250.0 250.0 0 0 1 103.49 195.00 Z"/>
    <path class="rule" d="M 320.00 570.00 A 250.0 250.0 0 0 1 103.49 195.00" fill="none" stroke="#212529" stroke-width="3"/>
    <line class="rule" x1="320.0" y1="320.0" x2="320.00" y2="570.00" stroke="#212529" stroke-width="2"/>
    <line class="rule" x1="320.0" y1="320.0" x2="103.49" y2="195.00" stroke="#212529" stroke-width="2"/>
    <path class="flow" d="M 252.02 529.23 A 220.0 220.0 0 0 1 104.81 274.26" fill="none" stroke="#E9ECEF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead-feedback)"/>
    <g text-anchor="middle" font-family="Montserrat, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">
      <text class="label" x="224.7" y="355.0" font-size="24" font-weight="700">Feedback</text>
      <text class="label-sub" x="224.7" y="386.0" font-size="15">guidance becomes</text>
      <text class="label-sub" x="224.7" y="406.0" font-size="15">strategy</text>
    </g>
  </g>

</svg>
