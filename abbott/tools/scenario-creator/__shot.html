<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assessing Sam</title>
<style>
  :root{--bg:#eef2f6;--surface:#fff;--raised:#f3f6f9;--ink:#1d2730;--soft:#5b6670;--line:#cdd6de;--accent:#2f6d8f;--positive:#2e8b57;--mixed:#b8860b;--negative:#b23b3b;}
  @media(prefers-color-scheme:dark){:root{--bg:#11181d;--surface:#182229;--raised:#1f2b33;--ink:#e8eef2;--soft:#9fb0bb;--line:#2c3a44;--accent:#6fb3d2;--positive:#5bbe86;--mixed:#e0b64e;--negative:#e07a7a;}}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:1.05rem/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}
  .bar{position:sticky;top:0;display:flex;gap:.5rem;align-items:center;padding:.6rem 1rem;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .bar strong{margin-right:auto;font-size:1rem}
  button{font:inherit;cursor:pointer;padding:.5rem .85rem;border:1px solid var(--line);border-radius:.5rem;background:var(--surface);color:var(--ink)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button:hover:not(:disabled){border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  main{max-width:42rem;margin:auto;padding:clamp(2rem,6vh,4rem) 1.2rem 6rem}
  /* a scene, not a boxy card: borderless, airy, soft depth, animated in */
  .card{background:color-mix(in srgb,var(--surface) 66%,var(--bg));border-radius:1.4rem;padding:clamp(1.4rem,4vw,2.6rem);box-shadow:0 26px 80px -52px #000a;animation:scene-in .5s cubic-bezier(.22,.9,.3,1) both}
  @keyframes scene-in{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
  .layer-tag{font:600 .7rem/1 ui-monospace,monospace;letter-spacing:.11em;text-transform:uppercase;color:var(--accent);opacity:.8}
  h1.title{font-size:clamp(1.5rem,4.5vw,2.1rem);line-height:1.2;margin:.45rem 0 .9rem;letter-spacing:-.01em}
  .body{white-space:pre-wrap;font-size:1.08rem;animation:rise .55s ease both;animation-delay:.06s}
  .prompt{margin-top:1.1rem;padding:.9rem 1.1rem;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:.5rem;font-style:italic;animation:rise .55s ease both;animation-delay:.14s}
  .choices{display:flex;flex-direction:column;gap:.65rem;margin-top:1.5rem}
  .choices button{text-align:left;padding:.95rem 1.1rem;line-height:1.45;border-radius:.8rem;transition:transform .14s ease,border-color .14s ease,background .14s ease;animation:rise .45s ease both;animation-delay:calc(var(--i,0)*75ms + .18s)}
  .choices button:hover:not(:disabled){transform:translateX(4px);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
  .advance{margin-top:1.6rem;animation:rise .5s ease both;animation-delay:.2s}
  .advance button,.card>.choices+*{} .advance .primary{border-radius:.9rem;padding:.7rem 1.3rem}
  .badge{display:inline-block;font:600 .72rem/1 system-ui;letter-spacing:.04em;text-transform:uppercase;padding:.4rem .7rem;border-radius:999px;color:#fff;animation:pop .55s cubic-bezier(.2,1.35,.4,1) both}
  .badge.positive{background:var(--positive)}.badge.mixed{background:var(--mixed)}.badge.negative{background:var(--negative)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
  .debrief{margin-top:1.1rem;padding:1rem 1.1rem;background:color-mix(in srgb,var(--raised) 70%,var(--bg));border-radius:.7rem;animation:rise .55s ease both;animation-delay:.12s}.debrief h3{margin:0 0 .3rem;font-size:.95rem}
  .feedback-note{margin:0 0 1.1rem;padding:.8rem 1rem;border-radius:.6rem;background:color-mix(in srgb,var(--accent) 11%,var(--surface));border-left:3px solid var(--accent);font-size:1rem;animation:rise .5s ease both}
  .review{margin-top:1.1rem;padding:1rem 1.1rem;background:color-mix(in srgb,var(--raised) 70%,var(--bg));border-radius:.7rem;animation:rise .55s ease both;animation-delay:.18s}.review h3{margin:0 0 .5rem;font-size:.95rem}
  .rev-row{display:flex;gap:.7rem;align-items:flex-start;padding:.5rem 0;border-top:1px solid var(--line)}.rev-row:first-of-type{border-top:0}
  .rev-q{flex:none;font:600 .65rem/1.6 system-ui;text-transform:uppercase;letter-spacing:.04em;padding:.15rem .5rem;border-radius:999px;color:#fff;min-width:3.6em;text-align:center}
  .rev-q.strong{background:var(--positive)}.rev-q.workable{background:var(--mixed)}.rev-q.weak{background:var(--negative)}.rev-q.none{background:var(--soft)}
  .rev-choice{color:var(--soft);font-size:.92rem}.rev-note{font-size:.9rem;margin-top:.15rem}
  .lead{color:var(--soft)}.meta-list{margin:.4rem 0 0;padding-left:1.1rem;color:var(--soft);font-size:.98rem}
  .panel{max-width:42rem;margin:1rem auto 0;padding:.7rem 1.1rem;background:color-mix(in srgb,var(--surface) 66%,var(--bg));border-radius:.8rem;font-size:.9rem}
  .panel[hidden]{display:none}.state-row{display:flex;justify-content:space-between;font-family:ui-monospace,monospace}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style>
<style>*{animation:none!important}</style></head>
<body>
<div class="bar"><strong>Assessing Sam</strong><button id="btn-state" aria-pressed="false">Show state</button><button id="btn-restart" class="primary">Restart</button></div>
<main id="stage"></main>
<div class="panel" id="state" hidden></div>
<script>window.__SCENARIO__ = {"version":2,"id":"assessment-and-feedback","title":"Assessing Sam","intro":"For trainees on a Level 3 Award / Level 4 Certificate in Education and Training. You assess a learner and give feedback. How you choose your methods, make your judgement and word your feedback decides both the grade and whether the learner keeps believing they can do this.","audience":"Trainee tutors and assessors (Level 3 / 4 Education and Training)","learningOutcomes":["Selects assessment methods that fit the outcome and develop the learner, not only measure them","Judges evidence against the criteria (valid, authentic, sufficient) before deciding, without lowering the standard to be kind","Gives feedback that is specific, balanced and action-focused, and keeps it two-way"],"branchStyle":"mixed","variables":[{"id":"learner_confidence","label":"Learner confidence","type":"number","default":0,"description":"Rises when you assess for learning and give usable feedback; falls when you measure without developing, or lower the standard. Carried forward to shape the ending."}],"start":"opening","nodes":[{"id":"opening","type":"continue","layer":"opening","title":"\"Am I doing it right?\"","purpose":"Orient and invest: hand the trainee the assessor's role and a learner they care about.","body":"You are a trainee tutor on a Level 3 programme, working toward your own teaching qualification. Sam, one of your learners, is completing a unit on handling customer complaints. Sam is capable but anxious about being assessed, and has asked you more than once, \"Am I doing it right?\" Today you will assess Sam's work and give feedback — and how you do it will shape both the grade and whether Sam keeps believing they can do this. Confidence so far: {{learner_confidence}}.","button":"Meet Sam","next":"decision-1"},{"id":"decision-1","type":"choice","layer":"decision","title":"How will you assess Sam?","purpose":"A genuine fork on assessment method. Each option is a believable view of what assessment is for; none is flagged correct.","body":"Sam needs to show they can handle a customer complaint. A standardised written knowledge test is ready to use — but it is not your only option.","choices":[{"label":"Watch Sam handle a role-played complaint, asking questions as they go.","mentalModel":"Assessment for learning: observe performance in context and question to check understanding.","quality":"strong","next":"consequence-1-a","effects":[{"var":"learner_confidence","op":"add","value":1}],"rationale":"Watching plus questioning gives valid evidence of the skill and reassures Sam."},{"label":"Set the written test now — it's standardised and quick to mark.","mentalModel":"Assessment of learning: a single summative test is the fair, objective measure.","quality":"weak","next":"consequence-1-b","effects":[{"var":"learner_confidence","op":"subtract","value":1}],"rationale":"A summative test alone measures knowledge, not the skill, and develops nothing."},{"label":"Ask Sam to write a reflective account of a complaint they once handled.","mentalModel":"Self-assessment: let the learner surface their own understanding.","quality":"workable","next":"consequence-1-c","rationale":"Reflection shows insight but is not direct, current evidence of competence."}]},{"id":"consequence-1-a","type":"auto","layer":"consequence","title":"You see the thinking","purpose":"Show, don't grade: observation plus questioning reveals real understanding and reassures Sam.","body":"Sam relaxes into the role-play. Watching, you see exactly where their judgement is sound and where it wobbles — and your questions (\"what made you say that?\") show Sam you're interested in their thinking, not just catching them out.","delayMs":1600,"button":"Consider your judgement","next":"reflection-1"},{"id":"consequence-1-b","type":"auto","layer":"consequence","title":"A pass that tells you little","purpose":"Show, don't grade: a summative-only choice measures knowledge but not competence, and develops nothing.","body":"Sam sits the test and scrapes a pass on the knowledge. But you've learned nothing about whether they can actually handle a real complaint — and Sam leaves the room no more confident than they came in.","delayMs":1600,"button":"Consider your judgement","next":"reflection-1"},{"id":"consequence-1-c","type":"auto","layer":"consequence","title":"Their account, not your evidence","purpose":"Show, don't grade: reflection has value but is not direct evidence of current competence.","body":"Sam's written reflection is honest and shows some insight. But it's about a past event you didn't see — you have Sam's account of their competence, not direct evidence of it.","delayMs":1600,"button":"Consider your judgement","next":"reflection-1"},{"id":"reflection-1","type":"continue","layer":"reflection","title":"Measure, or develop?","purpose":"Pull out the principle: assessment can be formative (for learning) or summative (of learning) — the best choices do both.","body":"Assessment can measure learning or develop it. The strongest choices often do a little of both.","prompt":"Which purpose was your assessment serving — measuring Sam, or helping Sam learn? Could one method have done both?","button":"Make your judgement","next":"decision-2"},{"id":"decision-2","type":"choice","layer":"decision","title":"Is the evidence good enough?","purpose":"A fork on the assessment judgement itself: hold the standard (VACSR) or lower it to be kind.","body":"However you gathered it, Sam's evidence is partial: they handled the complaint well but never checked the customer was satisfied before closing — a criterion the unit requires. Sam is watching your face, hopeful.","choices":[{"label":"Tell Sam it doesn't yet meet one criterion, show which, and agree how they'll close the gap.","mentalModel":"Hold validity and sufficiency; make the gap a clear next step.","quality":"strong","next":"consequence-2-a","effects":[{"var":"learner_confidence","op":"add","value":1}],"rationale":"Keeping the judgement valid while naming the next step is both rigorous and fair."},{"label":"Pass it — Sam tried hard and you don't want to knock their confidence.","mentalModel":"Kindness means not failing a willing learner.","quality":"weak","next":"consequence-2-b","effects":[{"var":"learner_confidence","op":"subtract","value":1}],"rationale":"A lenient pass is invalid and teaches the learner that \"good enough\" passes."},{"label":"Ask Sam to talk you through the part that's missing, to see if they actually know it.","mentalModel":"Probe for sufficient, authentic evidence before deciding.","quality":"strong","next":"consequence-2-c","effects":[{"var":"learner_confidence","op":"add","value":1}],"rationale":"Probing for authentic evidence protects validity and pinpoints what to develop."}]},{"id":"consequence-2-a","type":"auto","layer":"consequence","title":"A fail turned into a next step","purpose":"Show, don't grade: holding the standard, explained well, is respected and actionable.","body":"Sam's face falls for a second, then settles. \"OK — so if I confirm the customer's happy before I close, that covers it?\" You've kept the standard intact and turned a not-yet into a clear, doable next step.","delayMs":1600,"button":"Now the feedback","next":"reflection-2"},{"id":"consequence-2-b","type":"auto","layer":"consequence","title":"A pass that won't stand up","purpose":"Show, don't grade: a lenient judgement is invalid and teaches the learner the wrong lesson — recoverable, not terminal.","body":"You mark it a pass. Sam smiles, relieved. But the evidence doesn't show the required competence — if this were sampled by the internal quality assurer or the awarding body, it wouldn't stand up. And Sam has just learned that \"good enough\" is good enough.","delayMs":1600,"button":"Now the feedback","next":"reflection-2"},{"id":"consequence-2-c","type":"auto","layer":"consequence","title":"The evidence appears","purpose":"Show, don't grade: probing surfaces authentic evidence and a precise development point.","body":"You ask Sam to talk through the end of the call. It becomes clear they do know to check satisfaction — they just forgot under pressure. Now you have authentic evidence and one precise thing to work on.","delayMs":1600,"button":"Now the feedback","next":"reflection-2"},{"id":"reflection-2","type":"continue","layer":"reflection","title":"Kind and rigorous","purpose":"Pull out the principle: a valid judgement (valid, authentic, current, sufficient, reliable) and kindness are not opposites.","body":"A judgement has to be valid, authentic, current, sufficient and reliable. Being rigorous and being kind are not opposites — a sound judgement, explained well, respects the learner.","prompt":"Of valid, authentic, current, sufficient, reliable — which was really at stake in the decision you just made?","button":"Give your feedback","next":"decision-3"},{"id":"decision-3","type":"choice","layer":"decision","title":"How do you give the feedback?","purpose":"The feedback fork: specific/balanced/two-way, vague praise, or a wall of corrections.","body":"Now you talk to Sam. The words you choose will either help Sam improve — or just leave them with a feeling.","choices":[{"label":"Name one specific strength, one specific thing to improve, and the exact next step — then ask Sam what they'll try.","mentalModel":"Feedback that is specific, balanced, action-focused and two-way.","quality":"strong","next":"consequence-3-a","effects":[{"var":"learner_confidence","op":"add","value":1}],"rationale":"Specific, balanced, two-way feedback is what actually changes behaviour."},{"label":"Tell Sam it was \"really good, just tighten it up a bit.\"","mentalModel":"Keep it positive and brief to protect confidence.","quality":"weak","next":"consequence-3-b","effects":[{"var":"learner_confidence","op":"subtract","value":1}],"rationale":"Vague praise feels kind but gives the learner nothing to act on."},{"label":"List everything that went wrong so Sam knows exactly what to fix.","mentalModel":"Thorough correction is the most useful feedback.","quality":"weak","next":"consequence-3-c","effects":[{"var":"learner_confidence","op":"subtract","value":1}],"rationale":"Unrelieved correction overwhelms and buries the one thing that matters."}]},{"id":"consequence-3-a","type":"auto","layer":"consequence","title":"It lands","purpose":"Show, don't grade: specific, balanced, forward-looking feedback changes behaviour.","body":"You say: \"Your tone with an upset customer was genuinely calming — that's a real strength. The one thing to add is checking they're satisfied before you close. Next time, end with 'is there anything else I can help with?' What will you try?\" Sam repeats it back, and you can see it has landed.","delayMs":1600,"button":"A week later…","next":"resolve"},{"id":"consequence-3-b","type":"auto","layer":"consequence","title":"A nice feeling, no change","purpose":"Show, don't grade: vague praise is comfortable and useless.","body":"\"Really good, just tighten it up.\" Sam nods, smiles, and leaves — with no idea what \"tighten up\" means. The praise felt nice and changed nothing.","delayMs":1600,"button":"A week later…","next":"resolve"},{"id":"consequence-3-c","type":"auto","layer":"consequence","title":"Buried in the list","purpose":"Show, don't grade: unrelieved correction overwhelms and hides what matters.","body":"You run through every slip. Sam writes it all down, shoulders dropping. By the fifth point they've stopped hearing you — and the one thing that mattered most is buried in the list.","delayMs":1600,"button":"A week later…","next":"resolve"},{"id":"resolve","type":"continue","layer":"consequence","title":"A week later","purpose":"Carry the variable forward: the ending reflects the whole arc of choices, not just the last one.","body":"Sam comes back to redo the part they missed. How that goes depends on everything you've built or spent along the way. Confidence now: {{learner_confidence}}.","button":"See how it lands","branches":[{"if":{"var":"learner_confidence","op":"gte","value":2},"next":"ending-confident"},{"if":{"var":"learner_confidence","op":"lte","value":-1},"next":"ending-deflated"}],"next":"ending-adequate"},{"id":"ending-confident","type":"ending","layer":"ending","title":"A learner who believes they can","outcome":"positive","body":"Sam returns having checked customer satisfaction without being told twice — and then asks you to watch again, because your feedback made getting better feel possible. You held the standard and grew the learner at the same time.","prompt":"Which single moment did the most to get you here?","debrief":"You assessed for learning as well as of it, kept your judgement valid, and gave feedback Sam could act on — the whole arc of the three outcomes."},{"id":"ending-adequate","type":"ending","layer":"ending","title":"Fine, but flat","outcome":"mixed","body":"Sam passes the unit. The work is sound; the relationship is polite but a little flat. The grade is secure — and Sam still isn't sure they're any good at this.","prompt":"What would have turned \"fine\" into \"confident\"?","debrief":"You met the standard but left development on the table. Compare a run where your feedback is specific and two-way, and watch confidence climb."},{"id":"ending-deflated","type":"ending","layer":"ending","title":"The paperwork's done; the learner's lost","outcome":"negative","body":"Sam completes the unit but stops volunteering, and mentions they might not carry on to the next level. Somewhere between a lenient judgement and feedback that didn't help, Sam decided this wasn't for them.","prompt":"Where was the earliest point you could have changed this ending?","debrief":"Measuring without developing, lowering the standard to be kind, and feedback that only praised or only corrected protected your comfort, not Sam's learning. Replay and keep the standard while making the next step clear."}]};</script>
<script>
  function initState(s){var st={};(s.variables||[]).forEach(function(v){st[v.id]=v.default!=null?v.default:v.type==='number'?0:v.type==='boolean'?false:'';});return st;}
  function applyEffects(st,fx){(fx||[]).forEach(function(e){if(!e||!e.var)return;var c=st[e.var];if(e.op==='set')st[e.var]=e.value;else if(e.op==='add')st[e.var]=(Number(c)||0)+Number(e.value||0);else if(e.op==='subtract')st[e.var]=(Number(c)||0)-Number(e.value||0);else if(e.op==='toggle')st[e.var]=!c;});return st;}
  function evalCond(st,c){if(!c||!c.var)return false;var a=st[c.var],v=c.value;switch(c.op){case'eq':return a===v;case'ne':return a!==v;case'gt':return Number(a)>Number(v);case'gte':return Number(a)>=Number(v);case'lt':return Number(a)<Number(v);case'lte':return Number(a)<=Number(v);case'truthy':return !!a;case'falsy':return !a;}return false;}
  function resolveNext(n,st){var b=(n.branches||[]);for(var i=0;i<b.length;i++){if(evalCond(st,b[i].if))return b[i].next;}return n.next||null;}
  function interp(t,st){if(typeof t!=='string')return t;return t.replace(/\{\{\s*([a-z0-9_]+)\s*\}\}/gi,function(w,n){return Object.prototype.hasOwnProperty.call(st,n)?String(st[n]):w;});}
  (function(){
    var S=window.__SCENARIO__, R={initState:initState,applyEffects:applyEffects,resolveNext:resolveNext,interp:interp};
    var byId={}; (S.nodes||[]).forEach(function(n){byId[n.id]=n;});
    var stage=document.getElementById('stage'), state={}, path=[], timer=null, lastFeedback='';
    var Q={strong:'Strong',workable:'OK',weak:'Weak'};
    var motion=matchMedia('(prefers-reduced-motion: reduce)');
    function esc(t){return String(t==null?'':t).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
    function tx(t){return esc(R.interp(t||'',state));}
    function rev(){var d=path.filter(function(p){return p.choice;});if(!d.length)return '';return '<div class="review"><h3>Your decisions</h3>'+d.map(function(p){return '<div class="rev-row"><span class="rev-q '+(p.quality||'none')+'">'+(Q[p.quality]||'—')+'</span><div><b>'+esc(p.title)+'</b><div class="rev-choice">'+esc(p.choice)+'</div>'+(p.note?'<div class="rev-note">'+esc(p.note)+'</div>':'')+'</div></div>';}).join('')+'</div>';}
    function restart(){clearTimeout(timer);state=R.initState(S);path=[];lastFeedback='';intro();renderState();}
    function intro(){
      var o=(S.learningOutcomes||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('');
      stage.innerHTML='<div class="card"><span class="layer-tag">Scenario</span><h1 class="title">'+esc(S.title||'')+'</h1>'+
        (S.intro?'<p class="lead">'+esc(S.intro)+'</p>':'')+
        (S.audience?'<p class="lead"><b>For:</b> '+esc(S.audience)+'</p>':'')+
        (o?'<p class="lead" style="margin-bottom:.2rem"><b>You\'ll practise:</b></p><ul class="meta-list">'+o+'</ul>':'')+
        '<div class="advance"><button class="primary" id="go">Begin</button></div></div>';
      document.getElementById('go').onclick=function(){go(S.start);};
    }
    function go(id){var n=byId[id];if(!n){stage.innerHTML='<div class="card">Missing node: '+esc(id)+'</div>';return;}
      R.applyEffects(state,n.effects);path.push({title:n.title});renderNode(n);renderState();}
    function renderNode(n){clearTimeout(timer);
      var fb=lastFeedback?'<div class="feedback-note">'+tx(lastFeedback)+'</div>':'';lastFeedback='';
      var h='<div class="card">'+(n.layer?'<span class="layer-tag">'+esc(n.layer)+'</span>':'')+fb+'<h1 class="title">'+tx(n.title)+'</h1><div class="body">'+tx(n.body)+'</div>'+(n.prompt?'<div class="prompt">'+tx(n.prompt)+'</div>':'');
      if(n.type==='choice'){h+='<div class="choices">'+n.choices.map(function(c,i){return '<button data-c="'+i+'" style="--i:'+i+'">'+esc(c.label)+'</button>';}).join('')+'</div></div>';stage.innerHTML=h;
        [].forEach.call(stage.querySelectorAll('[data-c]'),function(b){b.onclick=function(){var c=n.choices[+b.dataset.c];R.applyEffects(state,c.effects);var e=path[path.length-1];e.choice=c.label;e.quality=c.quality;e.note=c.rationale||c.mentalModel||'';lastFeedback=c.feedback||'';go(c.next);};});
      }else if(n.type==='ending'){
        if(n.outcome)h=h.replace('<h1','<span class="badge '+n.outcome+'">'+n.outcome+'</span><h1');
        if(n.debrief)h+='<div class="debrief"><h3>Debrief</h3>'+tx(n.debrief)+'</div>';
        h+=rev();
        h+='<div class="advance"><button class="primary" id="again">Play again</button></div></div>';stage.innerHTML=h;
        document.getElementById('again').onclick=restart;
      }else{
        var lab=n.button||'Continue', wait=(n.type==='auto'&&!motion.matches)?Math.min(60000,n.delayMs==null?1500:n.delayMs):0;
        h+='<div class="advance"><button class="primary" id="adv"'+(wait?' disabled':'')+'>'+esc(lab)+'</button></div></div>';stage.innerHTML=h;
        var adv=document.getElementById('adv');if(wait)timer=setTimeout(function(){adv.disabled=false;adv.focus();},wait);
        adv.onclick=function(){go(R.resolveNext(n,state));};
      }
    }
    function renderState(){var vs=S.variables||[],p=document.getElementById('state');if(!vs.length){p.hidden=true;return;}
      p.hidden=document.getElementById('btn-state').getAttribute('aria-pressed')!=='true';
      p.innerHTML='<b>State</b>'+vs.map(function(v){return '<div class="state-row"><span>'+esc(v.label||v.id)+'</span><b>'+esc(String(state[v.id]))+'</b></div>';}).join('');}
    document.getElementById('btn-restart').onclick=restart;
    document.getElementById('btn-state').onclick=function(){var on=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',String(on));this.textContent=on?'Hide state':'Show state';renderState();};
    restart();
  })();</script>
<!-- Built with GROW scenario-creator -->
<script>var t=setInterval(function(){if(document.getElementById("again")){clearInterval(t);return;}var g=document.getElementById("go");if(g){g.click();return;}var a=document.getElementById("adv");if(a&&!a.disabled){a.click();return;}var c=document.querySelector("[data-c]");if(c){c.click();return;}},100);</script></body>
</html>
